<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Cerita menara: awal, tengah, akhir</title>
  <desc id="d">Tiga kartu berurutan dengan panah. Kartu awal: balok berserakan. Kartu tengah: kelinci menyusun balok. Kartu akhir: menara balok berdiri. Tulisan awal, tengah, akhir di bawah tiap kartu.</desc>
