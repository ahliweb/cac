    <rect x="235" y="20" width="170" height="210" rx="14"/>
    <rect x="450" y="20" width="170" height="210" rx="14"/>
  </g>
  <polyline points="192,125 232,125" fill="none" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <polyline points="407,125 447,125" fill="none" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <g stroke="#444444" stroke-width="2">
