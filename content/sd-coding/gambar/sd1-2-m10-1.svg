  </g>
  <g stroke="#444444" stroke-width="2">
    <rect x="270" y="190" width="40" height="30" fill="#e57373"/>
    <rect x="310" y="190" width="40" height="30" fill="#64a0e0"/>
    <rect x="285" y="160" width="40" height="30" fill="#f2d24b"/>
    <rect x="360" y="190" width="34" height="30" fill="#8fcf7a" transform="rotate(14 377 205)"/>
  </g>
  <ellipse cx="270" cy="115" rx="14" ry="30" fill="#ffffff" stroke="#444444" stroke-width="2"/>
