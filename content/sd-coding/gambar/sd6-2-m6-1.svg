<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-labelledby="t d">
  <title id="t">Contoh seragam dan contoh beragam</title>
  <desc id="d">Dua kolom. Kolom kiri, mesin T: kartu Satu semuanya merah, kartu Dua semuanya biru, tebakan untuk segitiga merah besar adalah Satu dan keliru. Kolom kanan, mesin S: kartu berwarna beragam, tebakan Dua dan benar.</desc>
  <rect width="520" height="250" fill="#ffffff"/>
  <rect x="10" y="10" width="240" height="230" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="130" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Mesin T: contoh seragam</text>
  <text x="70" y="62" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">Satu</text>
  <circle cx="50" cy="90" r="14" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <circle cx="95" cy="90" r="18" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <text x="190" y="62" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">Dua</text>
  <rect x="152" y="76" width="28" height="28" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <rect x="192" y="72" width="36" height="36" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <text x="130" y="140" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">kartu uji: segitiga merah besar</text>
  <polygon points="145,190 105,190 125,150" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <text x="130" y="215" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">tebakan Satu: keliru</text>
  <rect x="270" y="10" width="240" height="230" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="390" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Mesin S: contoh beragam</text>
  <text x="330" y="62" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">Satu</text>
  <circle cx="305" cy="90" r="14" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <circle cx="345" cy="90" r="14" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <circle cx="385" cy="90" r="14" fill="#fbc02d" stroke="#222222" stroke-width="2"/>
  <text x="460" y="62" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">Dua</text>
  <rect x="425" y="78" width="24" height="24" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <polygon points="480,104 456,104 468,80" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <text x="390" y="140" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">kartu uji: segitiga merah besar</text>
  <polygon points="405,190 365,190 385,150" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <text x="390" y="215" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">tebakan Dua: benar</text>
</svg>
