<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-labelledby="t d">
  <title id="t">Aturan KA dengan tiga bagian: tindakan, alasan, yang dijaga</title>
  <desc id="d">Satu kartu aturan dibagi tiga kotak bersambung panah dari kiri ke kanan: TINDAKAN, ALASAN, dan YANG DIJAGA. Di bawahnya tiga pertanyaan pemeriksa: apa tindakannya, siapa yang dijaga, dan bagaimana kita tahu aturan itu dijalankan.</desc>
  <rect width="540" height="250" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="520" height="130" rx="10" fill="#f7f7f7" stroke="#555555" stroke-width="2"/>
  <text x="270" y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Kartu aturan KA</text>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">
    <rect x="25" y="55" width="140" height="70" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="95" y="96">TINDAKAN</text>
    <rect x="200" y="55" width="140" height="70" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="270" y="96">ALASAN</text>
    <rect x="375" y="55" width="140" height="70" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="445" y="96">YANG DIJAGA</text>
  </g>
  <g stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M167,90 L196,90"/>
    <path d="M342,90 L371,90"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="20" y="175">1. Apa tindakannya?</text>
    <text x="20" y="200">2. Siapa yang dijaga?</text>
    <text x="20" y="225">3. Bagaimana kita tahu aturan itu dijalankan?</text>
  </g>
</svg>
