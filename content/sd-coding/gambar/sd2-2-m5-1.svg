<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
  <title id="t">Sandi hanya untuk diri sendiri dan orang tua</title>
  <desc id="d">Di tengah ada gembok bertanda sandi rahasia. Di kiri seorang teman dengan panah merah putus-putus dan tanda silang: sandi tidak diberikan. Di kanan seorang orang tua dengan panah hijau dan tanda centang: orang tua boleh tahu sandi.</desc>
