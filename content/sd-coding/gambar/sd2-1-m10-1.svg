  <text x="394.0" y="76.0" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
  <path d="M450,81 L450,59 M443,66 L450,58 L457,66" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="480" y="76" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">merah</text>
