    <text x="165" y="320">b</text>
    <text x="235" y="320">c</text>
    <text x="305" y="320">d</text>
    <text x="45" y="270">1</text>
    <text x="45" y="200">2</text>
    <text x="45" y="130">3</text>
    <text x="45" y="60">4</text>
  </g>
  <rect x="65" y="273" width="18" height="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="87" y="287" font-family="sans-serif" font-size="11" fill="#222222">mulai</text>
  <polyline points="95,265 95,125 235,125" stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <polygon points="235,103 240,115 252,115 243,123 246,136 235,128 224,136 227,123 218,115 230,115" fill="#ffd54f" stroke="#b86a00" stroke-width="1.5"/>
