<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kunci warna untuk arah dan jalur merah merah biru biru</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4. Jalur dari a1 naik ke a3, lalu ke kanan sampai c3, tempat bintang. Di kanan ada kunci kelas: kotak M merah berarti atas, B biru berarti kanan, K kuning berarti bawah, H hijau berarti kiri. Di bawahnya program warna M M B B, sama dengan panah atas, atas, kanan, kanan.</desc>
