<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Dua masalah dengan bagian yang berulang</title>
  <desc id="d">Dua baris kelompok lingkaran berwarna. Baris atas: tiga ruangan, tiap ruangan tiga lingkaran biru, oranye, hijau. Baris bawah: empat meja, tiap meja tiga lingkaran biru, oranye, hijau. Urutan warna sama di setiap kelompok.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="20" y="46" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#222222">Masalah A: Bu Bebek menyapu</text>
  <rect x="20" y="56" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="42" cy="80" r="11" fill="#2a5d9f"/>
  <circle cx="72" cy="80" r="11" fill="#b86a00"/>
  <circle cx="102" cy="80" r="11" fill="#2e7d32"/>
  <text x="72" y="122" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">ruangan 1</text>
  <rect x="135" y="56" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="157" cy="80" r="11" fill="#2a5d9f"/>
  <circle cx="187" cy="80" r="11" fill="#b86a00"/>
  <circle cx="217" cy="80" r="11" fill="#2e7d32"/>
  <text x="187" y="122" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">ruangan 2</text>
  <rect x="250" y="56" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="272" cy="80" r="11" fill="#2a5d9f"/>
  <circle cx="302" cy="80" r="11" fill="#b86a00"/>
  <circle cx="332" cy="80" r="11" fill="#2e7d32"/>
  <text x="302" y="122" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">ruangan 3</text>
  <text x="380" y="85" font-family="sans-serif" font-size="12" text-anchor="start" fill="#222222">biru: ambil sapu, oranye: sapu lantai,</text>
  <text x="380" y="102" font-family="sans-serif" font-size="12" text-anchor="start" fill="#222222">hijau: buang debu</text>
  <text x="20" y="156" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#222222">Masalah B: Pak Gagak menata</text>
  <rect x="20" y="166" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="42" cy="190" r="11" fill="#2a5d9f"/>
  <circle cx="72" cy="190" r="11" fill="#b86a00"/>
  <circle cx="102" cy="190" r="11" fill="#2e7d32"/>
  <text x="72" y="232" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">meja 1</text>
  <rect x="135" y="166" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="157" cy="190" r="11" fill="#2a5d9f"/>
  <circle cx="187" cy="190" r="11" fill="#b86a00"/>
  <circle cx="217" cy="190" r="11" fill="#2e7d32"/>
  <text x="187" y="232" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">meja 2</text>
  <rect x="250" y="166" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="272" cy="190" r="11" fill="#2a5d9f"/>
  <circle cx="302" cy="190" r="11" fill="#b86a00"/>
  <circle cx="332" cy="190" r="11" fill="#2e7d32"/>
  <text x="302" y="232" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">meja 3</text>
  <rect x="365" y="166" width="105" height="48" rx="8" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="387" cy="190" r="11" fill="#2a5d9f"/>
  <circle cx="417" cy="190" r="11" fill="#b86a00"/>
  <circle cx="447" cy="190" r="11" fill="#2e7d32"/>
  <text x="417" y="232" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">meja 4</text>
  <text x="20" y="275" font-family="sans-serif" font-size="12" text-anchor="start" fill="#222222">B: biru letak piring, oranye letak gelas, hijau letak sendok.</text>
  <text x="20" y="293" font-family="sans-serif" font-size="12" text-anchor="start" fill="#222222">Urutan warna yang berulang itulah pola.</text>
</svg>
