<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-labelledby="t d">
  <title id="t">Kertas rancangan dengan enam kotak</title>
  <desc id="d">Satu kertas rancangan dengan enam kotak dalam dua baris: KELOMPOK, KARTU LATIHAN, dan KARTU UJI di baris atas; LANGKAH, BATAS, dan ATURAN di baris bawah. Kotak KELOMPOK berisi dua kartu contoh, satu bulat merah dan satu kotak biru.</desc>
  <rect width="540" height="280" fill="#ffffff"/>
  <rect x="10" y="10" width="520" height="260" rx="10" fill="#f7f7f7" stroke="#555555" stroke-width="2"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">
    <rect x="25" y="28" width="155" height="105" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="102" y="58">KELOMPOK</text>
    <rect x="192" y="28" width="155" height="105" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="270" y="58">KARTU LATIHAN</text>
    <rect x="360" y="28" width="155" height="105" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="437" y="58">KARTU UJI</text>
    <rect x="25" y="147" width="155" height="105" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="102" y="177">LANGKAH</text>
    <rect x="192" y="147" width="155" height="105" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="270" y="177">BATAS</text>
    <rect x="360" y="147" width="155" height="105" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="437" y="177">ATURAN</text>
  </g>
  <g fill="#e53935" stroke="#222222" stroke-width="2">
    <circle cx="60" cy="100" r="14"/>
    <rect x="130" y="88" width="24" height="24" fill="#1e63c5"/>
  </g>
</svg>
