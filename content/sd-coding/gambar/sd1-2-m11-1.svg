<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Lagu Tik Tok: baris yang berulang bertanda bintang</title>
  <desc id="d">Empat baris lagu berurutan. Baris 1: tik tok, jam berbunyi, dengan bintang. Baris 2: tik tok, jam berbunyi, dengan bintang. Baris 3: ayo kita bangun pagi, tanpa bintang. Baris 4: tik tok, jam berbunyi, dengan bintang.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g fill="#fffdf5" stroke="#888888" stroke-width="3">
    <rect x="20" y="15" width="600" height="60" rx="12"/>
    <rect x="20" y="85" width="600" height="60" rx="12"/>
    <rect x="20" y="155" width="600" height="60" rx="12"/>
    <rect x="20" y="225" width="600" height="60" rx="12"/>
  </g>
  <g font-family="sans-serif" font-size="26" font-weight="bold" fill="#222222">
    <text x="45" y="55">1</text>
    <text x="45" y="125">2</text>
    <text x="45" y="195">3</text>
    <text x="45" y="265">4</text>
  </g>
  <g font-family="sans-serif" font-size="26" fill="#222222">
    <text x="110" y="55">Tik tok, jam berbunyi.</text>
    <text x="110" y="125">Tik tok, jam berbunyi.</text>
    <text x="110" y="195">Ayo kita bangun pagi.</text>
    <text x="110" y="265">Tik tok, jam berbunyi.</text>
  </g>
  <g fill="#f2d24b" stroke="#b8960a" stroke-width="3">
    <polygon points="570,22 578,43 600,43 582,56 589,68 570,60 551,68 558,56 540,43 562,43"/>
    <polygon points="570,92 578,113 600,113 582,126 589,138 570,130 551,138 558,126 540,113 562,113"/>
    <polygon points="570,232 578,253 600,253 582,266 589,278 570,270 551,278 558,266 540,253 562,253"/>
  </g>
</svg>
