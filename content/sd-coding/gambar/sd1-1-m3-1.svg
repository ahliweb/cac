    <rect x="320" y="165" width="115" height="110" rx="10"/>
    <rect x="455" y="165" width="115" height="110" rx="10"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="107" y="115">kaus kaki</text>
    <text x="242" y="115">sepatu</text>
    <text x="377" y="115">tali</text>
    <text x="512" y="115">jalan</text>
    <text x="107" y="265">sepatu</text>
    <text x="242" y="265">kaus kaki</text>
    <text x="377" y="265">tali</text>
    <text x="512" y="265">jalan</text>
  </g>
