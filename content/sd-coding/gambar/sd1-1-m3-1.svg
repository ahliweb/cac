<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Dua baris kartu memakai sepatu, benar dan tertukar</title>
  <desc id="d">Dua baris, tiap baris empat kartu. Baris atas dengan tanda centang hijau: kaus kaki, sepatu, tali, jalan. Baris bawah dengan tanda silang merah: sepatu, kaus kaki, tali, jalan; dua kartu pertama diberi panah bolak-balik.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g fill="#fffdf5" stroke="#888888" stroke-width="2">
    <rect x="50" y="15" width="115" height="110" rx="10"/>
