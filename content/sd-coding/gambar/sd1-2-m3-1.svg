<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Kelompok kuning dan satu kartu di luar</title>
  <desc id="d">Satu lingkaran berisi bintang, pisang, dan bunga kuning. Kartu nama bertulis kuning di atas lingkaran. Kartu apel merah di luar lingkaran.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <circle cx="230" cy="175" r="125" fill="#fffdf5" stroke="#888888" stroke-width="4"/>
  <rect x="165" y="10" width="130" height="44" rx="8" fill="#fff3a8" stroke="#b8960a" stroke-width="3"/>
  <text x="230" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">kuning</text>
  <!-- bintang -->
  <polygon points="160,120 167,141 189,141 171,154 178,175 160,162 142,175 149,154 131,141 153,141" fill="#f2d24b" stroke="#b8960a" stroke-width="3"/>
  <!-- pisang -->
  <path transform="translate(-35,35)" d="M215,205 q40,50 100,-20 q-50,25 -90,-25 z" fill="#f2d24b" stroke="#b8960a" stroke-width="3"/>
  <!-- bunga -->
  <g fill="#f2d24b" stroke="#b8960a" stroke-width="2">
    <circle cx="260" cy="110" r="12"/>
    <circle cx="283" cy="127" r="12"/>
    <circle cx="274" cy="153" r="12"/>
    <circle cx="246" cy="153" r="12"/>
    <circle cx="237" cy="127" r="12"/>
  </g>
  <circle cx="260" cy="132" r="10" fill="#b86a00" stroke="#7a4600" stroke-width="2"/>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="160" y="198">bintang</text>
    <text x="230" y="272">pisang</text>
    <text x="260" y="182">bunga</text>
  </g>
  <!-- apel di luar -->
  <circle cx="500" cy="175" r="38" fill="#d94f4f" stroke="#8f2a2a" stroke-width="3"/>
  <path d="M500,137 q4,-18 16,-22" fill="none" stroke="#5a3a1a" stroke-width="4"/>
  <path d="M506,127 q14,-14 24,-2 q-12,10 -24,2 z" fill="#7bbf5a" stroke="#3b7d1f" stroke-width="2"/>
  <text x="500" y="245" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">apel, merah</text>
  <text x="500" y="270" font-family="sans-serif" font-size="16" font-weight="bold" fill="#8f2a2a" text-anchor="middle">di luar</text>
</svg>
