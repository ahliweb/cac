<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tantangan memindahkan tutup botol dari d1 ke d3</title>
  <desc id="d">Kisi 4 kali 4 dengan kolom a sampai d dan baris 1 sampai 4. Tutup botol berada di d1. Jalur mesin dari a1 ke kanan sampai d1, lalu naik sampai d3, tempat tutup botol ditaruh. Di kanan, daftar delapan kartu jawaban.</desc>
  <rect width="540" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b86a00"/>
    </marker>
  </defs>
  <g stroke="#888888" stroke-width="2" fill="#ffffff">
    <rect x="40" y="40" width="64" height="64"/>
    <rect x="104" y="40" width="64" height="64"/>
    <rect x="168" y="40" width="64" height="64"/>
    <rect x="232" y="40" width="64" height="64"/>
    <rect x="40" y="104" width="64" height="64"/>
    <rect x="104" y="104" width="64" height="64"/>
    <rect x="168" y="104" width="64" height="64"/>
    <rect x="232" y="104" width="64" height="64"/>
    <rect x="40" y="168" width="64" height="64"/>
    <rect x="104" y="168" width="64" height="64"/>
    <rect x="168" y="168" width="64" height="64"/>
    <rect x="232" y="168" width="64" height="64"/>
    <rect x="40" y="232" width="64" height="64"/>
    <rect x="104" y="232" width="64" height="64"/>
    <rect x="168" y="232" width="64" height="64"/>
    <rect x="232" y="232" width="64" height="64"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">
    <text x="72" y="314">a</text>
    <text x="136" y="314">b</text>
    <text x="200" y="314">c</text>
    <text x="264" y="314">d</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#222222" text-anchor="end">
    <text x="30" y="268">1</text>
    <text x="30" y="204">2</text>
    <text x="30" y="140">3</text>
    <text x="30" y="76">4</text>
  </g>
  <circle cx="72" cy="264" r="7" fill="#2a5d9f"/>
  <circle cx="264" cy="264" r="12" fill="#fdf1e0" stroke="#b86a00" stroke-width="3"/>
  <circle cx="264" cy="136" r="12" fill="none" stroke="#b86a00" stroke-width="3" stroke-dasharray="4 3"/>
  <path d="M80,250 L250,250 L250,150" stroke="#b86a00" stroke-width="4" fill="none" stroke-linejoin="round" marker-end="url(#a)"/>
  <text x="318" y="268" font-family="sans-serif" font-size="12" fill="#222222">tutup botol di d1</text>
  <text x="318" y="140" font-family="sans-serif" font-size="12" fill="#222222">ditaruh di d3</text>
  <rect x="360" y="40" width="160" height="44" rx="6" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="440" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Paling banyak 8 kartu</text>
  <text x="440" y="75" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">bingkai ULANGI dihitung satu</text>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <text x="360" y="110">1. KANAN</text>
    <text x="360" y="128">2. ULANGI 3 kali</text>
    <text x="376" y="146">3. MAJU (di dalam)</text>
    <text x="360" y="164">4. AMBIL</text>
    <text x="360" y="182">5. KIRI</text>
    <text x="360" y="200">6. ULANGI 2 kali</text>
    <text x="376" y="218">7. MAJU (di dalam)</text>
    <text x="360" y="236">8. TARUH</text>
  </g>
</svg>
