<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-labelledby="t d">
  <title id="t">Diagram langkah menyiapkan pameran</title>
  <desc id="d">Lima kotak. A pilih tempat menuju D atur meja. B daftar karya menuju C tulis label. C dan D sama-sama menuju E pasang karya.</desc>
  <rect width="560" height="220" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <g stroke="#2a5d9f" stroke-width="2" fill="#f4f8fd">
    <rect x="10" y="20" width="120" height="56" rx="8"/>
    <rect x="10" y="144" width="120" height="56" rx="8"/>
    <rect x="200" y="20" width="120" height="56" rx="8"/>
    <rect x="200" y="144" width="120" height="56" rx="8"/>
    <rect x="410" y="82" width="140" height="56" rx="8" fill="#fdf1e0" stroke="#b86a00"/>
  </g>
  <g stroke="#444444" stroke-width="2" marker-end="url(#a)">
    <line x1="132" y1="48" x2="196" y2="48"/>
    <line x1="132" y1="172" x2="196" y2="172"/>
    <line x1="322" y1="58" x2="406" y2="100"/>
    <line x1="322" y1="162" x2="406" y2="120"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="70" y="44" font-weight="bold">A</text>
    <text x="70" y="62">pilih tempat</text>
    <text x="70" y="168" font-weight="bold">B</text>
    <text x="70" y="186">daftar karya</text>
    <text x="260" y="44" font-weight="bold">D</text>
    <text x="260" y="62">atur meja</text>
    <text x="260" y="168" font-weight="bold">C</text>
    <text x="260" y="186">tulis label</text>
    <text x="480" y="106" font-weight="bold">E</text>
    <text x="480" y="124">pasang karya</text>
  </g>
</svg>
