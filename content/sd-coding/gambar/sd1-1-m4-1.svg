<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Kisi 3x3 bernomor, robot di petak 8, jalur ke petak 6</title>
  <desc id="d">Kisi 3x3 bernomor 1 sampai 9, baris atas 1 2 3. Robot kotak di petak 8 menghadap atas. Panah naik ke petak 5, lalu belok kanan ke petak 6 yang bergambar bintang. Di bawah ada tiga kartu: MAJU, KANAN, MAJU.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g fill="#fffdf5" stroke="#888888" stroke-width="2">
    <rect x="200" y="10" width="80" height="80"/>
    <rect x="280" y="10" width="80" height="80"/>
    <rect x="360" y="10" width="80" height="80"/>
    <rect x="200" y="90" width="80" height="80"/>
    <rect x="280" y="90" width="80" height="80"/>
    <rect x="360" y="90" width="80" height="80"/>
    <rect x="200" y="170" width="80" height="80"/>
    <rect x="280" y="170" width="80" height="80"/>
    <rect x="360" y="170" width="80" height="80"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#777777">
    <text x="206" y="26">1</text>
    <text x="286" y="26">2</text>
    <text x="366" y="26">3</text>
    <text x="206" y="106">4</text>
    <text x="286" y="106">5</text>
    <text x="366" y="106">6</text>
    <text x="206" y="186">7</text>
    <text x="286" y="186">8</text>
    <text x="366" y="186">9</text>
  </g>
  <polygon points="410,103 416,120 434,120 420,130 425,147 410,137 395,147 400,130 386,120 404,120" fill="#f2d24b" stroke="#b8960a" stroke-width="2"/>
  <g stroke="#555555" stroke-width="3" fill="#cfd8e3">
    <rect x="305" y="200" width="30" height="36" rx="4"/>
    <rect x="311" y="186" width="18" height="12" rx="3"/>
  </g>
  <polygon points="320,176 313,185 327,185" fill="#d94f4f"/>
  <polyline points="320,172 320,130 372,130" fill="none" stroke="#2a5d9f" stroke-width="4" marker-end="url(#a)"/>
  <g fill="#e8c27a" stroke="#b86a00" stroke-width="2">
    <rect x="170" y="270" width="90" height="40" rx="8"/>
    <rect x="275" y="270" width="90" height="40" rx="8"/>
    <rect x="380" y="270" width="90" height="40" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="215" y="296">MAJU</text>
    <text x="320" y="296">KANAN</text>
    <text x="425" y="296">MAJU</text>
  </g>
  <g stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="262" y1="290" x2="273" y2="290"/>
    <line x1="367" y1="290" x2="378" y2="290"/>
  </g>
