<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Tiga panah kanan ditulis pendek dengan ULANGI 3 kali</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4. Tiga panah kanan membawa pion dari a1 ke d1, tempat bintang. Di kanan, tiga panah kanan ditulis pendek menjadi kotak bertuliskan ULANGI 3 kali dan satu panah kanan.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
