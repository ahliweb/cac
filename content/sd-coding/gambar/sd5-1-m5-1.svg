<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-labelledby="t d">
  <title id="t">Bagan uraian masalah sepatu berserakan</title>
  <desc id="d">Satu kotak masalah di atas, tiga kotak di bawahnya: sebab, langkah solusi, dan cara memeriksa, dihubungkan garis.</desc>
  <rect width="560" height="250" fill="#ffffff"/>
  <g stroke="#444444" stroke-width="2">
    <line x1="280" y1="70" x2="280" y2="100"/>
    <line x1="90" y1="100" x2="470" y2="100"/>
    <line x1="90" y1="100" x2="90" y2="130"/>
    <line x1="280" y1="100" x2="280" y2="130"/>
    <line x1="470" y1="100" x2="470" y2="130"/>
  </g>
  <g stroke="#b86a00" stroke-width="2" fill="#fdf1e0">
    <rect x="170" y="14" width="220" height="56" rx="8"/>
  </g>
  <g stroke="#2a5d9f" stroke-width="2" fill="#f4f8fd">
    <rect x="10" y="130" width="160" height="104" rx="8"/>
    <rect x="200" y="130" width="160" height="104" rx="8"/>
    <rect x="390" y="130" width="160" height="104" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="280" y="38" font-weight="bold">MASALAH</text>
    <text x="280" y="56">sepatu berserakan di depan kelas</text>
    <text x="90" y="154" font-weight="bold">SEBAB</text>
    <text x="90" y="176">rak terlalu jauh</text>
    <text x="90" y="194">tidak ada tanda tempat</text>
    <text x="280" y="154" font-weight="bold">LANGKAH</text>
    <text x="280" y="176">1 tandai tempat</text>
    <text x="280" y="194">2 pindah rak</text>
    <text x="280" y="212">3 rapikan sebelum bel</text>
    <text x="470" y="154" font-weight="bold">PERIKSA</text>
    <text x="470" y="176">lihat depan kelas</text>
    <text x="470" y="194">tiap pagi, satu minggu</text>
  </g>
</svg>
