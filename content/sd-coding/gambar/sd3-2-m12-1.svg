<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Delapan kartu pola dan mesin kotak dengan dua aturan</title>
  <desc id="d">Di atas delapan kartu pola: tiga bergaris, tiga berbintik, dan dua polos. Di bawahnya kardus bertulis mesin dengan dua kotak, A dan B. Dua kartu polos diberi tanda tanya karena tidak punya tempat pada aturan 2.</desc>
