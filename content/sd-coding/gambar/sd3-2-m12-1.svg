    <circle cx="325" cy="38" r="4"/><circle cx="355" cy="38" r="4"/><circle cx="340" cy="60" r="4"/><circle cx="325" cy="82" r="4"/><circle cx="355" cy="82" r="4"/>
    <circle cx="395" cy="38" r="4"/><circle cx="425" cy="38" r="4"/><circle cx="410" cy="60" r="4"/><circle cx="395" cy="82" r="4"/><circle cx="425" cy="82" r="4"/>
  </g>
