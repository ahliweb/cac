    <line x1="100" y1="38" x2="140" y2="38"/><line x1="100" y1="56" x2="140" y2="56"/><line x1="100" y1="74" x2="140" y2="74"/><line x1="100" y1="92" x2="140" y2="92"/>
    <line x1="170" y1="38" x2="210" y2="38"/><line x1="170" y1="56" x2="210" y2="56"/><line x1="170" y1="74" x2="210" y2="74"/><line x1="170" y1="92" x2="210" y2="92"/>
  </g>
  <g fill="#444444">
