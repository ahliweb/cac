<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Aturan jika-maka dengan dua pintu</title>
  <desc id="d">Kotak aturan di atas bertulis kartu bintang? Dua panah turun. Panah kiri bertulis ya menuju pintu KIRI. Panah kanan bertulis tidak menuju pintu KANAN.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <polygon points="320,20 440,70 320,120 200,70" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="3"/>
  <g font-family="sans-serif" font-size="17" fill="#222222" text-anchor="middle">
    <text x="320" y="75">kartu bintang?</text>
  </g>
  <g stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)">
    <polyline points="230,92 140,140 140,170"/>
    <polyline points="410,92 500,140 500,170"/>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="165" y="125">ya</text>
    <text x="475" y="125">tidak</text>
  </g>
  <g fill="#fffdf5" stroke="#8a5a14" stroke-width="3">
    <rect x="85" y="180" width="110" height="100" rx="6"/>
    <rect x="445" y="180" width="110" height="100" rx="6"/>
  </g>
  <g fill="#8a5a14">
    <circle cx="180" cy="235" r="6"/>
    <circle cx="460" cy="235" r="6"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="140" y="238">KIRI</text>
    <text x="500" y="238">KANAN</text>
  </g>
</svg>
