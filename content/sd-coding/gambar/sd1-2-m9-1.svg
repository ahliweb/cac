  <title id="t">Tiga langkah sebelum memakai alat digital: berhenti, tanya, tunggu jawaban</title>
  <desc id="d">Tiga kartu berurutan dengan panah dan nomor 1 sampai 3. Kartu 1: tangan terangkat bertulisan berhenti. Kartu 2: gelembung dengan tanda tanya bertulisan tanya. Kartu 3: telinga bertulisan tunggu jawaban.</desc>
