<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tiko sedih, Kili membantu, Tiko senang</title>
  <desc id="d">Tiga lingkaran perasaan berderet dengan tanda panah. Pertama lingkaran sedih bertulis Tiko sedih. Tengah dua balok bertumpuk bertulis Kili membantu. Terakhir lingkaran senang bertulis Tiko senang.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <!-- sedih -->
  <circle cx="100" cy="100" r="60" fill="#cfe0f2" stroke="#1b3f70" stroke-width="4"/>
  <circle cx="78" cy="88" r="6" fill="#222222"/>
  <circle cx="122" cy="88" r="6" fill="#222222"/>
  <path d="M74,128 q26,-22 52,0" fill="none" stroke="#222222" stroke-width="4"/>
  <path d="M122,100 q4,14 0,22" fill="none" stroke="#2a5d9f" stroke-width="4"/>
  <!-- balok -->
  <rect x="270" y="130" width="50" height="40" fill="#e8c27a" stroke="#b86a00" stroke-width="3"/>
  <rect x="320" y="130" width="50" height="40" fill="#9bc4e8" stroke="#2a5d9f" stroke-width="3"/>
  <rect x="295" y="90" width="50" height="40" fill="#f2d24b" stroke="#b8960a" stroke-width="3"/>
  <!-- senang -->
  <circle cx="540" cy="100" r="60" fill="#fff3a8" stroke="#b8960a" stroke-width="4"/>
  <circle cx="518" cy="88" r="6" fill="#222222"/>
  <circle cx="562" cy="88" r="6" fill="#222222"/>
  <path d="M512,112 q28,30 56,0" fill="none" stroke="#222222" stroke-width="4"/>
  <g stroke="#2a5d9f" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="175" y1="110" x2="250" y2="110"/>
    <line x1="390" y1="110" x2="460" y2="110"/>
  </g>
  <g font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="100" y="205">Tiko sedih</text>
    <text x="320" y="205">Kili membantu</text>
    <text x="540" y="205">Tiko senang</text>
  </g>
</svg>
