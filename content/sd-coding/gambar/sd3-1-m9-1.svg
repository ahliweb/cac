<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="t d">
  <title id="t">Menguji algoritma teman</title>
  <desc id="d">Kisi 4 kali 4. Mesin mulai di b1 menghadap atas. Algoritma teman: MAJU, MAJU, KANAN, MAJU. Garis biru naik ke b2, b3, lalu ke c3 dan berhenti. Bintang ada di d3. Garis hijau putus-putus menunjukkan perbaikan: satu MAJU lagi menuju d3.</desc>
  <rect width="560" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d1f"/>
    </marker>
  </defs>
  <g stroke="#888888" stroke-width="2" fill="#fffdf5">
    <rect x="50" y="230" width="70" height="70"/>
    <rect x="50" y="160" width="70" height="70"/>
    <rect x="50" y="90" width="70" height="70"/>
    <rect x="50" y="20" width="70" height="70"/>
    <rect x="120" y="230" width="70" height="70"/>
    <rect x="120" y="160" width="70" height="70"/>
    <rect x="120" y="90" width="70" height="70"/>
    <rect x="120" y="20" width="70" height="70"/>
    <rect x="190" y="230" width="70" height="70"/>
    <rect x="190" y="160" width="70" height="70"/>
    <rect x="190" y="90" width="70" height="70"/>
    <rect x="190" y="20" width="70" height="70"/>
    <rect x="260" y="230" width="70" height="70"/>
    <rect x="260" y="160" width="70" height="70"/>
    <rect x="260" y="90" width="70" height="70"/>
    <rect x="260" y="20" width="70" height="70"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="85" y="320">a</text>
    <text x="155" y="320">b</text>
    <text x="225" y="320">c</text>
    <text x="295" y="320">d</text>
    <text x="36" y="270">1</text>
    <text x="36" y="200">2</text>
    <text x="36" y="130">3</text>
    <text x="36" y="60">4</text>
  </g>
  <polygon points="295,101 302,117 319,117 306,128 311,145 295,135 279,145 284,128 271,117 288,117" fill="#f2c200" stroke="#9a7a00" stroke-width="2"/>
  <text x="126" y="294" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2a5d9f">mulai</text>
  <polyline points="155,265 155,195 155,125 225,125" fill="none" stroke="#2a5d9f" stroke-width="4" marker-end="url(#a)"/>
  <polyline points="225,125 267,125" fill="none" stroke="#3b7d1f" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#g)"/>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="start">
    <text x="350" y="60">Algoritma teman:</text>
    <text x="350" y="81">MAJU, MAJU,</text>
    <text x="350" y="102">KANAN, MAJU</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#d94f4f" text-anchor="start" font-weight="bold">
    <text x="350" y="160">Berhenti di c3.</text>
    <text x="350" y="181">Bintang di d3.</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#3b7d1f" text-anchor="start" font-weight="bold">
    <text x="350" y="230">Perbaikan:</text>
    <text x="350" y="251">tambah satu MAJU.</text>
  </g>
</svg>
