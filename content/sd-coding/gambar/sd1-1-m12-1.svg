<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Kisi 3x3 bernomor: robot di petak 8 ke bintang di petak 6, kartu dan panah</title>
  <desc id="d">Kisi 3x3 bernomor 1 sampai 9, baris atas 1 2 3. Robot kotak di petak 8 menghadap atas, bintang di petak 6. Panah biru naik ke petak 5 lalu ke kanan ke petak 6. Di kanan, cara A: tiga kartu MAJU, KANAN, MAJU untuk robot. Cara B: dua panah di kertas, atas lalu kanan.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g fill="#fffdf5" stroke="#888888" stroke-width="2">
    <rect x="20" y="15" width="85" height="85"/>
    <rect x="105" y="15" width="85" height="85"/>
    <rect x="190" y="15" width="85" height="85"/>
    <rect x="20" y="100" width="85" height="85"/>
    <rect x="105" y="100" width="85" height="85"/>
    <rect x="190" y="100" width="85" height="85"/>
    <rect x="20" y="185" width="85" height="85"/>
    <rect x="105" y="185" width="85" height="85"/>
    <rect x="190" y="185" width="85" height="85"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#777777">
    <text x="25" y="31">1</text>
    <text x="110" y="31">2</text>
    <text x="195" y="31">3</text>
    <text x="25" y="116">4</text>
    <text x="110" y="116">5</text>
    <text x="195" y="116">6</text>
    <text x="25" y="201">7</text>
    <text x="110" y="201">8</text>
    <text x="195" y="201">9</text>
  </g>
  <polygon points="232,127 238,140 252,140 241,149 245,162 232,154 220,162 224,149 213,140 227,140" fill="#f2d24b" stroke="#b8960a" stroke-width="2"/>
  <g stroke="#555555" stroke-width="3" fill="#cfd8e3">
    <rect x="132.5" y="225.5" width="30" height="34" rx="4"/>
    <rect x="138.5" y="211.5" width="18" height="12" rx="3"/>
  </g>
  <polygon points="147.5,195.5 140.5,204.5 154.5,204.5" fill="#d94f4f"/>
  <polyline points="148,190 148,142 202,142" fill="none" stroke="#2a5d9f" stroke-width="4" marker-end="url(#a)"/>
  <text x="390" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">A: kartu untuk robot</text>
  <rect x="300" y="55" width="90" height="40" rx="8" fill="#e8c27a" stroke="#b86a00" stroke-width="2"/>
  <text x="345" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">MAJU</text>
  <rect x="405" y="55" width="100" height="40" rx="8" fill="#e8c27a" stroke="#b86a00" stroke-width="2"/>
  <text x="455" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">KANAN</text>
  <rect x="520" y="55" width="90" height="40" rx="8" fill="#e8c27a" stroke="#b86a00" stroke-width="2"/>
  <text x="565" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">MAJU</text>
  <polyline points="392,75 403,75" fill="none" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <polyline points="507,75 518,75" fill="none" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <text x="390" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">B: panah di kertas</text>
  <rect x="300" y="165" width="70" height="60" rx="8" fill="#fffdf5" stroke="#2a5d9f" stroke-width="2"/>
  <line x1="335" y1="213" x2="335" y2="181" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="390" y="165" width="70" height="60" rx="8" fill="#fffdf5" stroke="#2a5d9f" stroke-width="2"/>
  <line x1="405" y1="195" x2="441" y2="195" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <polyline points="372,195 388,195" fill="none" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <text x="450" y="270" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">sama-sama berakhir di petak 6</text>
