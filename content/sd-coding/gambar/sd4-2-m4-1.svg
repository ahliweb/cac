<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" role="img" aria-labelledby="t d">
  <title id="t">Dua kartu kata sandi cerita</title>
  <desc id="d">Dua kartu. Kartu kiri kancil2015 dengan sepuluh karakter: panjang tidak, acak tidak, tentang Kancil ya, hasilnya lemah. Kartu kanan kerbau biru makan lampu dengan dua puluh tiga karakter: panjang ya, acak ya, tentang Kancil tidak, hasilnya lebih kuat.</desc>
  <rect width="520" height="290" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="230" height="50" fill="#fbe9e9" stroke="#a32020" stroke-width="3"/>
  <text x="135.0" y="49.5" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">kancil2015</text>
  <rect x="270" y="20" width="230" height="50" fill="#e9f6ea" stroke="#2b7a33" stroke-width="2"/>
  <text x="385.0" y="49.5" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">kerbau biru makan lampu</text>
  <text x="135" y="95" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">10 karakter</text>
  <text x="385" y="95" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">23 karakter</text>
  <rect x="20" y="115" width="230" height="32" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="135.0" y="135.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">panjang: tidak</text>
  <rect x="270" y="115" width="230" height="32" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="385.0" y="135.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">panjang: ya</text>
  <rect x="20" y="155" width="230" height="32" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="135.0" y="175.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">acak: tidak</text>
  <rect x="270" y="155" width="230" height="32" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="385.0" y="175.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">acak: ya</text>
  <rect x="20" y="195" width="230" height="32" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="135.0" y="215.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">tentang Kancil: ya</text>
  <rect x="270" y="195" width="230" height="32" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="385.0" y="215.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">tentang Kancil: tidak</text>
  <text x="135" y="255" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">lemah</text>
  <text x="385" y="255" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">lebih kuat</text>
  <text x="260" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Contoh cerita, bukan kata sandi sungguhan.</text>
</svg>
