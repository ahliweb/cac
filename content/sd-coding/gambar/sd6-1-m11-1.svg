<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-labelledby="t d">
  <title id="t">Lima tanda hati-hati dan tiga pilihan keputusan</title>
  <desc id="d">Kiri: lima kotak tanda hati-hati, yaitu pengirim tidak dikenal, meminta data pribadi, hadiah dan disuruh cepat, dirahasiakan dari orang tua, dan mengejek atau menakutkan. Kanan: tiga kotak keputusan, LANJUT, CEK DULU, dan TANYA ORANG DEWASA.</desc>
  <rect width="540" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <text x="140" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">TANDA HATI-HATI</text>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <rect x="20" y="36" width="240" height="44" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="64" y="63">Pengirim tidak dikenal</text>
    <rect x="20" y="88" width="240" height="44" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="64" y="115">Meminta data pribadi</text>
    <rect x="20" y="140" width="240" height="44" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="64" y="167">Hadiah dan disuruh cepat</text>
    <rect x="20" y="192" width="240" height="44" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="64" y="219">Dirahasiakan dari orang tua</text>
    <rect x="20" y="244" width="240" height="44" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="64" y="271">Mengejek atau menakutkan</text>
  </g>
  <g font-family="sans-serif" font-size="18" font-weight="bold" fill="#b86a00" text-anchor="middle">
    <text x="40" y="65">!</text>
    <text x="40" y="117">!</text>
    <text x="40" y="169">!</text>
    <text x="40" y="221">!</text>
    <text x="40" y="273">!</text>
  </g>
  <path d="M268,160 L330,160" stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="430" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">KEPUTUSAN</text>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">
    <rect x="340" y="60" width="180" height="48" rx="8" fill="#f7fbf4" stroke="#2e7d32" stroke-width="2"/>
    <text x="430" y="89">LANJUT</text>
    <rect x="340" y="124" width="180" height="48" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="430" y="153">CEK DULU</text>
    <rect x="340" y="188" width="180" height="62" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="430" y="215">TANYA</text>
    <text x="430" y="233">ORANG DEWASA</text>
  </g>
</svg>
