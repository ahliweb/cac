<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Daftar simbol arah dan program empat simbol di kisi 4 kali 4</title>
  <desc id="d">Di kiri ada daftar tiga simbol: panah atas berarti MAJU, panah kiri berarti KIRI, panah kanan berarti KANAN. Di bawahnya program empat simbol: atas, atas, kanan, atas. Di kanan ada kisi empat kolom a sampai d dan empat baris 1 sampai 4. Mesin mulai di b1 menghadap atas, naik ke b3, belok kanan, lalu maju ke c3 tempat bintang.</desc>
