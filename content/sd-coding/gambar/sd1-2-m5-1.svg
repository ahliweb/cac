<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Telepon dengan empat bagian bernomor</title>
  <desc id="d">Telepon tampak dari depan. 1 layar besar, 2 tombol kecil di sisi kanan, 3 speaker di atas layar, 4 lubang pengisi daya di bawah. Di kanan ada daftar nomor dan nama bagian.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <rect x="120" y="15" width="170" height="310" rx="24" fill="#d7dde6" stroke="#444444" stroke-width="4"/>
  <rect x="136" y="60" width="138" height="220" rx="6" fill="#8fb8d9" stroke="#444444" stroke-width="3"/>
  <rect x="170" y="32" width="70" height="10" rx="5" fill="#8a8a8a" stroke="#444444" stroke-width="2"/>
  <rect x="290" y="130" width="8" height="40" rx="4" fill="#444444"/>
  <rect x="180" y="302" width="50" height="10" rx="5" fill="#333333"/>
  <g fill="#ffffff" stroke="#b86a00" stroke-width="3">
    <circle cx="205" cy="170" r="20"/>
    <circle cx="340" cy="150" r="20"/>
    <circle cx="70" cy="37" r="20"/>
    <circle cx="70" cy="307" r="20"/>
  </g>
  <g stroke="#b86a00" stroke-width="3">
    <line x1="298" y1="150" x2="320" y2="150"/>
    <line x1="90" y1="37" x2="165" y2="37"/>
    <line x1="90" y1="307" x2="176" y2="307"/>
  </g>
  <g font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="205" y="178">1</text>
    <text x="340" y="158">2</text>
    <text x="70" y="45">3</text>
    <text x="70" y="315">4</text>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#222222">
    <text x="400" y="110"><tspan font-weight="bold">1</tspan> layar</text>
    <text x="400" y="160"><tspan font-weight="bold">2</tspan> tombol</text>
    <text x="400" y="210"><tspan font-weight="bold">3</tspan> speaker</text>
    <text x="400" y="260"><tspan font-weight="bold">4</tspan> lubang pengisi daya</text>
  </g>
</svg>
