<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 215" width="520" height="215" role="img" aria-labelledby="t d">
  <title id="t">Mesin kotak yang mengikuti aturan</title>
  <desc id="d">Kartu masuk ke mesin kotak. Aturan: ambil satu kartu; bila bulat taruh di kotak A, bila tidak taruh di kotak B. Keluaran dua kotak, A dan B.</desc>
  <rect width="520" height="215" fill="#ffffff"/>
  <rect x="10" y="60" width="100" height="60" rx="4" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="60" y="85" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">kartu</text>
  <text x="60" y="105" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">masuk</text>
  <line x1="115" y1="90" x2="160" y2="90" stroke="#444444" stroke-width="2"/>
  <polygon points="160,90 152,85 152,95" fill="#444444"/>
  <rect x="165" y="20" width="200" height="140" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="265" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">MESIN KOTAK</text>
  <text x="265" y="75" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">AMBIL satu kartu</text>
  <text x="265" y="98" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">bila bulat: TARUH di kotak A</text>
  <text x="265" y="121" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">bila tidak: TARUH di kotak B</text>
  <text x="265" y="146" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">hanya mengikuti aturan</text>
  <line x1="370" y1="70" x2="415" y2="70" stroke="#444444" stroke-width="2"/>
  <polygon points="415,70 407,65 407,75" fill="#444444"/>
  <line x1="370" y1="115" x2="415" y2="115" stroke="#444444" stroke-width="2"/>
  <polygon points="415,115 407,110 407,120" fill="#444444"/>
  <rect x="420" y="40" width="90" height="50" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="465" y="70" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">kotak A</text>
  <rect x="420" y="95" width="90" height="50" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="465" y="125" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">kotak B</text>
  <text x="260" y="195" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">masukan, aturan, keluaran</text>
</svg>
