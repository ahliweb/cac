<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img" aria-labelledby="t d">
  <title id="t">Aturan dua ciri memisahkan kotak A dan kotak B</title>
  <desc id="d">Dua kotak berlabel A dan B. Kotak A berisi dua kartu bulat merah. Kotak B berisi enam kartu lain. Di atasnya tertulis aturan: bila bulat dan merah, TARUH di kotak A, bila tidak, TARUH di kotak B.</desc>
  <rect width="520" height="240" fill="#ffffff"/>
  <rect x="60" y="15" width="400" height="50" rx="6" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260" y="38" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">bila bulat dan merah, TARUH di kotak A</text>
  <text x="260" y="56" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">bila tidak, TARUH di kotak B</text>
  <rect x="20" y="90" width="160" height="130" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="100" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">kotak A</text>
  <circle cx="65" cy="165" r="22" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <circle cx="135" cy="165" r="30" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <rect x="210" y="90" width="290" height="130" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="355" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">kotak B</text>
  <circle cx="245" cy="150" r="14" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <circle cx="285" cy="150" r="20" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <rect x="320" y="136" width="34" height="34" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <rect x="372" y="143" width="22" height="22" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <polygon points="440,170 423,170 431,148" fill="#e53935" stroke="#222222" stroke-width="2"/>
  <polygon points="485,190 455,190 470,160" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
</svg>
