<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel sifat satu kolom</title>
  <desc id="d">Tabel dengan kolom Benda dan Terbuat dari kayu. Pensil kayu ya, balok kayu ya, sedotan plastik tidak, tutup botol plastik tidak. Di bawahnya dua kelompok: kelompok ya berisi pensil kayu dan balok kayu, kelompok tidak berisi sedotan plastik dan tutup botol plastik.</desc>
  <rect width="460" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="50" y="20" width="220" height="40" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="270" y="20" width="140" height="40" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="160.0" y="45" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Benda</text>
  <text x="340.0" y="45" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">Terbuat dari kayu?</text>
  <rect x="50" y="60" width="220" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <rect x="270" y="60" width="140" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="160.0" y="87" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">pensil kayu</text>
  <text x="340.0" y="87" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">ya</text>
  <rect x="50" y="104" width="220" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <rect x="270" y="104" width="140" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="160.0" y="131" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">balok kayu</text>
  <text x="340.0" y="131" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">ya</text>
  <rect x="50" y="148" width="220" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <rect x="270" y="148" width="140" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="160.0" y="175" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">sedotan plastik</text>
  <text x="340.0" y="175" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">tidak</text>
  <rect x="50" y="192" width="220" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <rect x="270" y="192" width="140" height="44" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="160.0" y="219" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">tutup botol plastik</text>
  <text x="340.0" y="219" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">tidak</text>
  <text x="230" y="262" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Kelompok ya: pensil kayu, balok kayu.</text>
  <text x="230" y="284" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Kelompok tidak: sedotan plastik, tutup botol plastik.</text>
  <text x="230" y="312" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Satu kolom sifat membagi benda menjadi dua kelompok.</text>
</svg>
