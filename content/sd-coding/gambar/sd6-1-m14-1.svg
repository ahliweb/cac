<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-labelledby="t d">
  <title id="t">Peta isi semester 1 kelas 6</title>
  <desc id="d">Dua baris. Baris pertama, berpikir komputasional: algoritma, simbol, uji dan perbaiki, blok. Baris kedua, literasi digital: internet aman, dampak teknologi, konten positif, tanda hati-hati.</desc>
  <rect width="560" height="250" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">
    <text x="20" y="28">Berpikir komputasional</text>
    <text x="20" y="138">Literasi digital</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <rect x="20" y="42" width="118" height="60" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="79" y="77">Algoritma</text>
