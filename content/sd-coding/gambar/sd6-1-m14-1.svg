    <rect x="280" y="42" width="118" height="60" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="339" y="72">Uji dan</text>
    <text x="339" y="90">perbaiki</text>
    <rect x="410" y="42" width="118" height="60" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="469" y="77">Blok</text>
