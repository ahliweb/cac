  </g>
  <g font-family="sans-serif" font-size="36" font-weight="bold" fill="#2a5d9f" text-anchor="middle">
    <text x="95" y="152">2</text>
    <text x="320" y="152">3</text>
    <text x="545" y="152">4</text>
