<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Pertanyaan, kata kunci, dan enam kartu informasi</title>
  <desc id="d">Di kiri ada pertanyaan apa makanan kucing, dengan panah ke kotak kata kunci makanan kucing. Di kanan enam kartu bernomor 1 sampai 6 dalam dua baris. Kartu 2 dan kartu 6 diberi bingkai tebal karena memuat kedua kata kunci.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="16" fill="#222222">
    <text x="30" y="50" font-weight="bold">Pertanyaan</text>
    <text x="30" y="80">Apa makanan kucing?</text>
    <text x="30" y="200" font-weight="bold">Kata kunci</text>
  </g>
  <line x1="100" y1="95" x2="100" y2="140" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="30" y="150" width="200" height="40" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="130" y="176" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">makanan kucing</text>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <rect x="270" y="40" width="110" height="100" rx="6" fill="#fff8e1" stroke="#999999" stroke-width="1.5"/>
    <text x="278" y="62" font-weight="bold">1</text>
    <text x="278" y="95">Kucing suka</text>
    <text x="278" y="113">tidur.</text>
    <rect x="395" y="40" width="110" height="100" rx="6" fill="#fff8e1" stroke="#b86a00" stroke-width="4"/>
    <text x="403" y="62" font-weight="bold">2</text>
    <text x="403" y="86">Makanan kucing:</text>
    <text x="403" y="104">ikan dan daging.</text>
    <rect x="520" y="40" width="110" height="100" rx="6" fill="#fff8e1" stroke="#999999" stroke-width="1.5"/>
    <text x="528" y="62" font-weight="bold">3</text>
    <text x="528" y="86">Kucing mandi</text>
    <text x="528" y="104">dengan menjilat</text>
    <text x="528" y="122">bulunya.</text>
    <rect x="270" y="170" width="110" height="100" rx="6" fill="#fff8e1" stroke="#999999" stroke-width="1.5"/>
    <text x="278" y="192" font-weight="bold">4</text>
    <text x="278" y="216">Cara merawat</text>
    <text x="278" y="234">bulu kucing.</text>
    <rect x="395" y="170" width="110" height="100" rx="6" fill="#fff8e1" stroke="#999999" stroke-width="1.5"/>
    <text x="403" y="192" font-weight="bold">5</text>
    <text x="403" y="216">Kucing minum</text>
    <text x="403" y="234">air bersih.</text>
    <rect x="520" y="170" width="110" height="100" rx="6" fill="#fff8e1" stroke="#b86a00" stroke-width="4"/>
    <text x="528" y="192" font-weight="bold">6</text>
    <text x="528" y="216">Makanan kucing</text>
    <text x="528" y="234">disimpan tertutup.</text>
  </g>
</svg>
