<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370" role="img" aria-labelledby="t d">
  <title id="t">Diagram alir antrean kantin</title>
  <desc id="d">Diagram alir: MULAI, belah ketupat Masih ada murid di antrean. Panah ya turun ke kotak Layani murid paling depan, lalu panah kembali ke belah ketupat. Panah tidak ke SELESAI.</desc>
  <rect width="520" height="370" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <ellipse cx="200" cy="30" rx="60" ry="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="200" y="35" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">MULAI</text>
  <polyline points="200,48 200,75" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polygon points="200,75 310,120 200,165 90,120" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="200" y="116.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Masih ada murid</text>
  <text x="200" y="132.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">di antrean?</text>
  <polyline points="200,165 200,203" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="216" y="190" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">ya</text>
  <rect x="100" y="205" width="200" height="40" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="200.0" y="229.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Layani murid paling depan</text>
  <polyline points="100,225 48,225 48,120 88,120" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polyline points="310,120 430,120 430,180" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="370" y="112" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">tidak</text>
  <ellipse cx="430" cy="198" rx="60" ry="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="430" y="203" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">SELESAI</text>
  <text x="260" y="300" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Panah dari kotak kembali ke belah ketupat: layani lagi sampai antrean habis.</text>
  <text x="260" y="320" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Bagian yang berulang (pola): Layani murid paling depan.</text>
</svg>
