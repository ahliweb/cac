<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t d">
  <title id="t">Kartu jalan dan robot melangkah satu langkah</title>
  <desc id="d">Di kiri, kartu bertanda jalan dengan gambar telapak kaki. Panah menunjuk ke robot kotak yang berdiri di garis, lalu satu jejak kaki di depannya. Di kanan, kartu bertanda berhenti dengan segi delapan merah.</desc>
  <rect width="640" height="240" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <rect x="15" y="20" width="130" height="170" rx="10" fill="#fffdf5" stroke="#888888" stroke-width="2"/>
  <g fill="#7bbf5a" stroke="#3b7d1f" stroke-width="2">
    <ellipse cx="62" cy="95" rx="14" ry="24"/>
    <ellipse cx="98" cy="120" rx="14" ry="24"/>
  </g>
  <text x="80" y="170" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">jalan</text>
  <line x1="150" y1="105" x2="205" y2="105" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <line x1="215" y1="200" x2="215" y2="30" stroke="#888888" stroke-width="3" stroke-dasharray="8 6"/>
  <g stroke="#555555" stroke-width="3" fill="#cfd8e3">
    <rect x="235" y="85" width="50" height="60" rx="6"/>
    <rect x="245" y="50" width="30" height="28" rx="5"/>
    <line x1="260" y1="50" x2="260" y2="38"/>
    <line x1="235" y1="150" x2="235" y2="175"/>
    <line x1="285" y1="150" x2="285" y2="175"/>
  </g>
  <circle cx="260" cy="36" r="5" fill="#d94f4f"/>
  <g fill="#7bbf5a" stroke="#3b7d1f" stroke-width="2">
    <ellipse cx="345" cy="150" rx="12" ry="22"/>
  </g>
  <text x="300" y="215" font-family="sans-serif" font-size="16" fill="#222222">satu langkah</text>
  <rect x="440" y="20" width="130" height="170" rx="10" fill="#fffdf5" stroke="#888888" stroke-width="2"/>
  <polygon points="485,50 525,50 553,78 553,118 525,146 485,146 457,118 457,78" fill="#d94f4f" stroke="#8f2a2a" stroke-width="3"/>
  <rect x="478" y="92" width="54" height="10" rx="3" fill="#ffffff"/>
  <text x="505" y="178" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">berhenti</text>
</svg>
