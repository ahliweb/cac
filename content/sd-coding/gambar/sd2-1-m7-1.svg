<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kisi 4 kali 4 dengan jalur salah ke b4 dan jalur benar ke c3</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4. Garis penuh biru dari a1 naik ke a3, lalu ke kanan sampai c3, tempat bintang. Garis putus-putus merah dari a1 naik ke a3, ke kanan ke b3, lalu naik ke b4, jadi salah. Di kanan ada daftar dua jalur dan tempat akhirnya.</desc>
