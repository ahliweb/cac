<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kisi 4 kali 4 dengan jalur mesin dan daftar tiga kata</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4. Mesin mulai di b1 menghadap atas, maju ke b3, belok kanan, lalu maju ke c3 tempat bintang. Di kanan ada daftar tiga kata: MAJU, KIRI, KANAN.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g stroke="#888888" stroke-width="1.5" fill="none">
    <rect x="60" y="20" width="280" height="280"/>
    <line x1="130" y1="20" x2="130" y2="300"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="270" y1="20" x2="270" y2="300"/>
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="60" y1="160" x2="340" y2="160"/>
    <line x1="60" y1="230" x2="340" y2="230"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="95" y="320">a</text>
    <text x="165" y="320">b</text>
    <text x="235" y="320">c</text>
    <text x="305" y="320">d</text>
    <text x="45" y="270">1</text>
    <text x="45" y="200">2</text>
    <text x="45" y="130">3</text>
    <text x="45" y="60">4</text>
  </g>
  <rect x="134" y="274" width="18" height="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="156" y="288" font-family="sans-serif" font-size="11" fill="#222222">mulai</text>
  <polyline points="165,260 165,195 165,125 235,125" stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <polygon points="235,108 240,120 252,120 243,128 246,141 235,133 224,141 227,128 218,120 230,120" fill="#ffd54f" stroke="#b86a00" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="16" fill="#222222">
    <text x="380" y="50" font-weight="bold">Daftar kata</text>
    <text x="440" y="113">MAJU</text>
    <path d="M405,125 L405,95 M397,104 L405,94 L413,104" stroke="#2a5d9f" stroke-width="3" fill="none"/>
    <text x="440" y="173">KIRI</text>
    <path d="M415,168 L391,168 M399,160 L390,168 L399,176" stroke="#2a5d9f" stroke-width="3" fill="none"/>
    <text x="440" y="233">KANAN</text>
    <path d="M391,228 L415,228 M407,220 L416,228 L407,236" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  </g>
</svg>
