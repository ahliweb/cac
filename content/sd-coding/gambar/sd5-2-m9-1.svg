<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" aria-labelledby="t d">
  <title id="t">Tabel survei mesin</title>
  <desc id="d">Tabel tiga kolom: mesin, ciri yang dilihat, dan golongan. Baris pertama: setrika, mengerjakan satu hal yang tetap, non-cerdas. Baris kedua: robot penyapu, menyesuaikan dengan keadaan lewat sensor, cerdas.</desc>
  <rect width="560" height="220" fill="#ffffff"/>
  <g stroke="#2a5d9f" stroke-width="2" fill="#f4f8fd">
    <rect x="10" y="20" width="130" height="40"/>
    <rect x="140" y="20" width="270" height="40"/>
    <rect x="410" y="20" width="140" height="40"/>
  </g>
  <g stroke="#444444" stroke-width="2" fill="#ffffff">
    <rect x="10" y="60" width="130" height="60"/>
    <rect x="140" y="60" width="270" height="60"/>
    <rect x="410" y="60" width="140" height="60"/>
    <rect x="10" y="120" width="130" height="60"/>
    <rect x="140" y="120" width="270" height="60"/>
    <rect x="410" y="120" width="140" height="60"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="75" y="46" font-weight="bold">Mesin</text>
    <text x="275" y="46" font-weight="bold">Ciri yang kulihat</text>
    <text x="480" y="46" font-weight="bold">Golongan</text>
    <text x="75" y="95">setrika</text>
    <text x="275" y="95">mengerjakan satu hal yang tetap</text>
    <text x="480" y="95">non-cerdas</text>
    <text x="75" y="155">robot penyapu</text>
    <text x="275" y="148">menyesuaikan dengan keadaan</text>
    <text x="275" y="166">lewat sensor</text>
    <text x="480" y="155">cerdas</text>
  </g>
</svg>
