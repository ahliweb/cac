<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-labelledby="t d">
  <title id="t">Mesin kartu ragu pada kartu baru</title>
  <desc id="d">Dua baris. Baris atas: kartu segitiga biru kecil masuk mesin L dan keluar sebagai ragu karena tidak mirip contoh. Baris bawah: mesin L2 yang berisi satu kartu berlabel salah menebak Satu dengan yakin, tetapi keliru.</desc>
  <rect width="520" height="250" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="130" height="80" rx="6" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <polygon points="95,75 45,75 70,35" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <text x="75" y="92" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">segitiga biru kecil</text>
  <line x1="142" y1="60" x2="178" y2="60" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="20" width="160" height="80" rx="6" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">MESIN L</text>
  <text x="260" y="76" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">tidak ada petunjuk</text>
  <line x1="342" y1="60" x2="378" y2="60" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="20" width="130" height="80" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="445" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tebakan: ragu</text>
  <rect x="10" y="140" width="130" height="80" rx="6" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="45" y="158" width="40" height="40" fill="#1e63c5" stroke="#222222" stroke-width="2"/>
  <text x="75" y="213" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">kotak biru besar</text>
  <line x1="142" y1="180" x2="178" y2="180" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="140" width="160" height="80" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="260" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">MESIN L2</text>
  <text x="260" y="190" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">satu contoh</text>
  <text x="260" y="206" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">berlabel salah</text>
  <line x1="342" y1="180" x2="378" y2="180" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="140" width="130" height="80" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="445" y="175" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tebakan: Satu</text>
  <text x="445" y="197" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">yakin, tetapi keliru</text>
</svg>
