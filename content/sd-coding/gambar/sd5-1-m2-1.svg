<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-labelledby="t d">
  <title id="t">Empat kartu cara berpikir</title>
  <desc id="d">Empat kartu berjajar: pecah (kotak besar terbagi empat), pola (bentuk berulang), buang yang tak perlu (satu bentuk dicoret), langkah (kotak bernomor dengan panah).</desc>
  <rect width="520" height="200" fill="#ffffff"/>
  <g stroke="#2a5d9f" stroke-width="2" fill="#f4f8fd">
    <rect x="10" y="10" width="115" height="180" rx="8"/>
    <rect x="137" y="10" width="115" height="180" rx="8"/>
    <rect x="264" y="10" width="115" height="180" rx="8"/>
    <rect x="391" y="10" width="115" height="180" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="67" y="34">PECAH</text>
    <text x="194" y="34">POLA</text>
    <text x="321" y="34">BUANG</text>
    <text x="448" y="34">LANGKAH</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">
    <text x="67" y="178">bagi jadi kecil</text>
    <text x="194" y="178">cari yang berulang</text>
    <text x="321" y="178">yang tak perlu</text>
    <text x="448" y="178">urutkan</text>
  </g>
  <g stroke="#444444" stroke-width="2" fill="#ffffff">
    <rect x="32" y="55" width="70" height="70"/>
  </g>
  <g stroke="#444444" stroke-width="2">
    <line x1="67" y1="55" x2="67" y2="125"/>
    <line x1="32" y1="90" x2="102" y2="90"/>
  </g>
  <g stroke="#444444" stroke-width="2" fill="#ffd54f">
    <circle cx="160" cy="90" r="12"/>
    <rect x="182" y="78" width="24" height="24"/>
    <circle cx="228" cy="90" r="12"/>
  </g>
  <g stroke="#444444" stroke-width="2" fill="#81c784">
    <rect x="286" y="78" width="24" height="24"/>
    <circle cx="332" cy="90" r="12" fill="#e57373"/>
  </g>
  <g stroke="#b00020" stroke-width="3">
    <line x1="318" y1="76" x2="346" y2="104"/>
    <line x1="346" y1="76" x2="318" y2="104"/>
  </g>
  <g stroke="#444444" stroke-width="2" fill="#ffffff">
    <rect x="404" y="52" width="26" height="26"/>
    <rect x="404" y="86" width="26" height="26"/>
    <rect x="404" y="120" width="26" height="26"/>
  </g>
  <g stroke="#444444" stroke-width="2">
    <line x1="417" y1="78" x2="417" y2="86"/>
    <line x1="417" y1="112" x2="417" y2="120"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="417" y="71">1</text>
    <text x="417" y="105">2</text>
    <text x="417" y="139">3</text>
  </g>
</svg>
