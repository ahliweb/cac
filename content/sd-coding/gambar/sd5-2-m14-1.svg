<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-labelledby="t d">
  <title id="t">Tiga kotak refleksi</title>
  <desc id="d">Tiga kotak berjajar untuk refleksi: yang kupelajari, yang masih membingungkan, dan yang bisa kujelaskan kepada teman. Kotak kosong untuk diisi murid.</desc>
  <rect width="560" height="200" fill="#ffffff"/>
  <rect x="10" y="20" width="170" height="160" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="195" y="20" width="170" height="160" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <rect x="380" y="20" width="170" height="160" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="95" y="48">Yang kupelajari</text>
    <text x="280" y="48">Yang masih</text>
    <text x="280" y="66">membingungkan</text>
    <text x="465" y="48">Yang bisa kujelaskan</text>
    <text x="465" y="66">kepada teman</text>
  </g>
</svg>
