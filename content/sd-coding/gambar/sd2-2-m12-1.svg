  <circle cx="500" cy="400" r="18" fill="#ffe3cf" stroke="#222222" stroke-width="2"/>
  <line x1="500" y1="366" x2="500" y2="378" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ab)"/>
  <text x="475" y="440" font-family="sans-serif" font-size="14" fill="#2a5d9f" text-anchor="middle">mengindra tangan</text>
</svg>
