<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d">
  <title id="t">Senter dan lampu jalan, keran putar dan keran sensor</title>
  <desc id="d">Atas: dua kotak. Kiri bertanda kita atur sendiri: senter dengan tombol dan tangan yang menekan. Kanan bertanda mengindra lalu memilih: lampu jalan dengan bulan di atas dan cahaya ke bawah. Bawah: dua keran. Keran putar punya pegangan putar. Keran sensor punya tangan di bawahnya dan panah mengindra.</desc>
  <rect width="640" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b7a3d"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="290" height="230" rx="12" fill="#fdf6e8" stroke="#b86a00" stroke-width="3"/>
  <text x="165" y="50" font-family="sans-serif" font-size="16" fill="#b86a00" text-anchor="middle" font-weight="bold">kita atur sendiri</text>
  <rect x="80" y="100" width="130" height="36" rx="6" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <rect x="210" y="92" width="34" height="52" rx="4" fill="#fff1b8" stroke="#222222" stroke-width="3"/>
  <rect x="110" y="108" width="22" height="14" rx="3" fill="#888888" stroke="#222222" stroke-width="1"/>
  <line x1="120" y1="70" x2="120" y2="104" stroke="#b3261e" stroke-width="3" marker-end="url(#ar)"/>
  <text x="165" y="190" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">senter: kita menekan</text>
  <text x="165" y="208" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tombolnya</text>
  <rect x="330" y="20" width="290" height="230" rx="12" fill="#eef3fb" stroke="#2a5d9f" stroke-width="3"/>
  <text x="475" y="50" font-family="sans-serif" font-size="16" fill="#2a5d9f" text-anchor="middle" font-weight="bold">mengindra lalu memilih</text>
  <circle cx="560" cy="78" r="14" fill="#fff1b8" stroke="#b86a00" stroke-width="2"/>
  <line x1="440" y1="215" x2="440" y2="100" stroke="#222222" stroke-width="5"/>
  <line x1="440" y1="100" x2="500" y2="100" stroke="#222222" stroke-width="5"/>
  <rect x="490" y="100" width="36" height="12" rx="3" fill="#fff1b8" stroke="#222222" stroke-width="2"/>
  <line x1="500" y1="116" x2="500" y2="150" stroke="#b86a00" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="516" y1="116" x2="516" y2="150" stroke="#b86a00" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="532" y1="116" x2="532" y2="150" stroke="#b86a00" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="475" y="240" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">lampu jalan: mengindra gelap</text>
  <text x="165" y="290" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">keran putar</text>
  <line x1="90" y1="330" x2="190" y2="330" stroke="#222222" stroke-width="8"/>
  <line x1="190" y1="330" x2="190" y2="355" stroke="#222222" stroke-width="8"/>
  <line x1="140" y1="330" x2="140" y2="310" stroke="#222222" stroke-width="4"/>
  <line x1="120" y1="310" x2="160" y2="310" stroke="#222222" stroke-width="5"/>
  <line x1="190" y1="362" x2="190" y2="410" stroke="#2a5d9f" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="165" y="440" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kita memutar sendiri</text>
  <text x="475" y="290" font-family="sans-serif" font-size="16" fill="#2a5d9f" text-anchor="middle" font-weight="bold">keran sensor</text>
  <line x1="400" y1="330" x2="500" y2="330" stroke="#222222" stroke-width="8"/>
