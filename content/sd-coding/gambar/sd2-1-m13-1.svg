<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Labirin dengan petunjuk sandi warna dari a1 ke d2</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4 dengan sembilan dinding berupa garis tebal. Jalur biru dari a1 naik ke a2, ke kanan sampai c2, turun ke c1, ke kanan ke d1, lalu naik ke d2, tempat bintang. Di kanan ada kunci kelas empat warna dan petunjuk sandi enam kotak: M, B, B, K, B, M.</desc>
