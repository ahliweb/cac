<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Gambar rumah pohon dan dua balasan</title>
  <desc id="d">Di kiri gambar rumah pohon sederhana: batang pohon, rumah kecil beratap segitiga di atasnya. Di kanan dua gelembung balasan. Gelembung merah berbunyi gambarmu jelek. Gelembung hijau berbunyi aku suka warna atapnya, pintunya bisa lebih besar.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <rect x="20" y="20" width="230" height="260" rx="8" fill="#f9fcff" stroke="#999999" stroke-width="2"/>
  <rect x="115" y="150" width="30" height="120" fill="#8b5a2b"/>
  <circle cx="130" cy="130" r="55" fill="#bfe3b4" stroke="#3b7d1f" stroke-width="2"/>
  <rect x="95" y="105" width="70" height="45" fill="#f3d9a4" stroke="#8b5a2b" stroke-width="2"/>
  <polygon points="88,105 130,70 172,105" fill="#c0392b" stroke="#8b5a2b" stroke-width="2"/>
  <rect x="120" y="125" width="20" height="25" fill="#8b5a2b"/>
  <text x="135" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">gambar Kancil</text>
  <g stroke-width="3">
    <rect x="290" y="30" width="330" height="95" rx="16" fill="#fbe0dc" stroke="#c0392b"/>
    <rect x="290" y="160" width="330" height="110" rx="16" fill="#e6f4e0" stroke="#3b7d1f"/>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#222222">
    <text x="305" y="60" font-weight="bold">Siput:</text>
    <text x="305" y="92">"Gambarmu jelek!"</text>
    <text x="305" y="190" font-weight="bold">Siput:</text>
    <text x="305" y="220">"Aku suka warna atapnya.</text>
    <text x="305" y="246">Pintunya bisa lebih besar?"</text>
  </g>
</svg>
