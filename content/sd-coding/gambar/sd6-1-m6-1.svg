<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="t d">
  <title id="t">Tabel dampak positif dan negatif telepon pintar</title>
  <desc id="d">Tabel dua kolom untuk telepon pintar milik keluarga. Kolom kiri dampak positif bertanda centang: menghubungi keluarga yang jauh. Kolom kanan dampak negatif bertanda seru: bila terlalu lama, waktu bermain dan istirahat berkurang. Di bawahnya satu kalimat sikap kelompok.</desc>
  <rect width="520" height="280" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b86a00"/>
    </marker>
  </defs>
  <g font-family="sans-serif" fill="#222222" font-size="15" text-anchor="middle">
    <text x="260" y="34" font-size="17" font-weight="bold">Telepon pintar milik keluarga</text>
    <rect x="30" y="50" width="220" height="40" fill="#e8f1fb" stroke="#888888" stroke-width="1.5"/>
    <rect x="270" y="50" width="220" height="40" fill="#fff3e0" stroke="#888888" stroke-width="1.5"/>
    <path d="M50,70 L58,78 L72,62" stroke="#2e7d32" stroke-width="4" fill="none"/>
    <text x="160" y="76" font-weight="bold">Dampak positif</text>
    <path d="M290,58 L290,74 M290,80 L290,82" stroke="#c62828" stroke-width="4" fill="none"/>
    <text x="395" y="76" font-weight="bold">Dampak negatif</text>
    <rect x="30" y="90" width="220" height="110" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
    <rect x="270" y="90" width="220" height="110" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
    <text x="140" y="125" font-size="13">menghubungi keluarga</text>
    <text x="140" y="143" font-size="13">yang jauh</text>
    <text x="380" y="125" font-size="13">bila terlalu lama, waktu</text>
    <text x="380" y="143" font-size="13">bermain dan istirahat</text>
    <text x="380" y="161" font-size="13">berkurang</text>
    <rect x="30" y="215" width="460" height="46" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
    <text x="260" y="236" font-size="13">Sikap: Kami memakai telepon pintar untuk menghubungi</text>
    <text x="260" y="253" font-size="13">keluarga dan meminta izin orang dewasa dulu.</text>
  </g>
</svg>
