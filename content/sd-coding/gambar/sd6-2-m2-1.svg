<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" aria-labelledby="t d">
  <title id="t">Tabel dampak Lampu Jalan Pintar</title>
  <desc id="d">Tabel dua kolom, Dampak positif dan Dampak negatif, dengan baris Lampu Jalan Pintar. Positif: hemat listrik, jalan terang saat ada orang. Negatif: sensor kotor, lampu tidak menyala. Di bawahnya tertulis: manusia memeriksa.</desc>
  <rect width="520" height="230" fill="#ffffff"/>
  <rect x="20" y="20" width="230" height="36" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="135" y="44" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Dampak positif</text>
  <rect x="270" y="20" width="230" height="36" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="385" y="44" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Dampak negatif</text>
  <rect x="20" y="56" width="230" height="86" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="135" y="86" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">hemat listrik</text>
  <text x="135" y="112" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">jalan terang saat ada orang</text>
  <rect x="270" y="56" width="230" height="86" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="385" y="86" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">sensor kotor</text>
  <text x="385" y="112" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">lampu tidak menyala</text>
  <rect x="20" y="160" width="480" height="44" rx="6" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260" y="187" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Lampu Jalan Pintar: manusia memeriksa sensor</text>
</svg>
