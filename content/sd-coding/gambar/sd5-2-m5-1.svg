<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img" aria-labelledby="t d">
  <title id="t">Mengelompokkan menurut bentuk</title>
  <desc id="d">Enam kartu dibagi dua kelompok menurut bentuk. Kelompok bulat: lingkaran merah, biru, dan kuning. Kelompok tidak bulat: kotak merah, segitiga biru, kotak kuning. Warna bukan penentu kelompok.</desc>
  <rect width="520" height="240" fill="#ffffff"/>
  <rect x="10" y="10" width="245" height="220" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="265" y="10" width="245" height="220" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="132" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">BULAT</text>
  <text x="387" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">TIDAK BULAT</text>
  <circle cx="60" cy="85" r="24" fill="#e57373" stroke="#444444" stroke-width="2"/>
  <text x="60" y="130" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">merah</text>
  <circle cx="135" cy="85" r="24" fill="#64b5f6" stroke="#444444" stroke-width="2"/>
  <text x="135" y="130" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">biru</text>
  <circle cx="210" cy="85" r="24" fill="#ffd54f" stroke="#444444" stroke-width="2"/>
  <text x="210" y="130" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">kuning</text>
  <rect x="290" y="62" width="46" height="46" rx="4" fill="#e57373" stroke="#444444" stroke-width="2"/>
  <text x="313" y="130" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">kotak merah</text>
  <polygon points="380,108 405,62 430,108" fill="#64b5f6" stroke="#444444" stroke-width="2"/>
  <text x="405" y="130" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">segitiga biru</text>
  <rect x="458" y="70" width="34" height="34" rx="4" fill="#ffd54f" stroke="#444444" stroke-width="2"/>
  <text x="475" y="130" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">kotak kuning</text>
  <text x="260" y="178" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">aturan: pilih satu sifat, yaitu bentuk</text>
  <text x="260" y="198" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">warna bukan penentu kelompok</text>
</svg>
