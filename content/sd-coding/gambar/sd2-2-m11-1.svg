<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">Mencuci baju dengan tangan dan dengan mesin cuci</title>
  <desc id="d">Kiri: ember berisi baju dengan dua tangan sederhana yang menggosok. Kanan: mesin cuci persegi dengan lingkaran di tengah dan tombol di atas. Di bawah: kotak putus-putus kosong bertanda gambarku untuk menggambar satu alat.</desc>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b7a3d"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <text x="165" y="30" font-family="sans-serif" font-size="17" fill="#2a5d9f" text-anchor="middle" font-weight="bold">dengan tangan</text>
  <text x="475" y="30" font-family="sans-serif" font-size="17" fill="#2a5d9f" text-anchor="middle" font-weight="bold">dengan mesin cuci</text>
  <polygon points="95,110 235,110 220,200 110,200" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="3"/>
  <path d="M105,125 Q130,112 165,125 Q200,138 225,125" fill="none" stroke="#2a5d9f" stroke-width="3"/>
  <rect x="111" y="60" width="28" height="48" rx="12" fill="#ffe3cf" stroke="#222222" stroke-width="2"/>
  <rect x="191" y="60" width="28" height="48" rx="12" fill="#ffe3cf" stroke="#222222" stroke-width="2"/>
  <text x="165" y="228" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tangan menggosok</text>
  <rect x="390" y="60" width="170" height="170" rx="10" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <circle cx="475" cy="150" r="52" fill="#e8f1fb" stroke="#222222" stroke-width="3"/>
  <circle cx="475" cy="150" r="30" fill="none" stroke="#888888" stroke-width="2"/>
  <circle cx="412" cy="82" r="7" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="436" cy="82" r="7" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="500" y="74" width="45" height="16" rx="3" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="475" y="252" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">mesin memutar</text>
  <text x="320" y="300" font-family="sans-serif" font-size="15" fill="#1b7a3d" text-anchor="middle" font-weight="bold">sama: baju bersih</text>
  <rect x="170" y="318" width="300" height="70" rx="8" fill="#ffffff" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="358" font-family="sans-serif" font-size="16" fill="#888888" text-anchor="middle">gambarku</text>
</svg>
