<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kisi kerja 4 kali 4, kunci warna, dan sandi huruf</title>
  <desc id="d">Kisi kerja kosong empat kolom a sampai d dan empat baris 1 sampai 4, dengan tempat mulai di a1. Di kanan ada kunci warna: M merah atas, B biru kanan, K kuning bawah, H hijau kiri, dan tabel sandi huruf A sampai J menjadi 1 sampai 10.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g stroke="#888888" stroke-width="1.5" fill="none">
    <rect x="60" y="20" width="280" height="280"/>
    <line x1="130" y1="20" x2="130" y2="300"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="270" y1="20" x2="270" y2="300"/>
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="60" y1="160" x2="340" y2="160"/>
    <line x1="60" y1="230" x2="340" y2="230"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="95" y="320">a</text>
    <text x="165" y="320">b</text>
    <text x="235" y="320">c</text>
    <text x="305" y="320">d</text>
    <text x="45" y="270">1</text>
    <text x="45" y="200">2</text>
    <text x="45" y="130">3</text>
    <text x="45" y="60">4</text>
  </g>
  <rect x="65" y="273" width="18" height="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="87" y="287" font-family="sans-serif" font-size="11" fill="#222222">mulai</text>
  <text x="380" y="40" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="start" font-weight="bold">Kunci warna</text>
  <rect x="380" y="52" width="28" height="28" rx="4" fill="#d9534f" stroke="#222222" stroke-width="1.5"/>
  <text x="394.0" y="72.0" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
  <path d="M450,77 L450,55 M443,62 L450,54 L457,62" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="480" y="72" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">merah</text>
  <rect x="380" y="88" width="28" height="28" rx="4" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="394.0" y="108.0" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
  <path d="M439,102 L461,102 M454,95 L462,102 L454,109" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="480" y="108" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">biru</text>
  <rect x="380" y="124" width="28" height="28" rx="4" fill="#ffd54f" stroke="#222222" stroke-width="1.5"/>
  <text x="394.0" y="144.0" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">K</text>
  <path d="M450,127 L450,149 M443,142 L450,150 L457,142" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="480" y="144" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">kuning</text>
  <rect x="380" y="160" width="28" height="28" rx="4" fill="#2e7d32" stroke="#222222" stroke-width="1.5"/>
  <text x="394.0" y="180.0" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">H</text>
  <path d="M461,174 L439,174 M446,167 L438,174 L446,181" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="480" y="180" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">hijau</text>
  <text x="380" y="232" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="start" font-weight="bold">Sandi huruf</text>
  <text x="380" y="256" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="start">A=1 B=2 C=3 D=4 E=5</text>
  <text x="380" y="280" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="start">F=6 G=7 H=8 I=9 J=10</text>
