<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Labirin 4 kali 4 dengan dinding dan jalur dari a1 ke d3</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4 dengan sembilan dinding berupa garis tebal. Jalur biru dari a1 naik ke a2, ke kanan ke b2, naik ke b4, ke kanan ke d4, lalu turun ke d3, tempat bintang. Di kanan, jalur ditulis: atas, kanan, ULANGI 2 kali atas, ULANGI 2 kali kanan, bawah.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g stroke="#cccccc" stroke-width="1" fill="none">
    <line x1="130" y1="20" x2="130" y2="300"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="270" y1="20" x2="270" y2="300"/>
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="60" y1="160" x2="340" y2="160"/>
    <line x1="60" y1="230" x2="340" y2="230"/>
  </g>
  <g stroke="#222222" stroke-width="5" stroke-linecap="round" fill="none">
