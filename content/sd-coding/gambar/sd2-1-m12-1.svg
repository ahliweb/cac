    <line x1="130" y1="90" x2="130" y2="160"/>
    <line x1="130" y1="230" x2="200" y2="230"/>
    <line x1="200" y1="160" x2="200" y2="230"/>
    <line x1="200" y1="90" x2="200" y2="160"/>
    <line x1="270" y1="90" x2="270" y2="160"/>
    <line x1="200" y1="90" x2="270" y2="90"/>
    <line x1="270" y1="230" x2="340" y2="230"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="95" y="320">a</text>
    <text x="165" y="320">b</text>
    <text x="235" y="320">c</text>
    <text x="305" y="320">d</text>
    <text x="45" y="270">1</text>
    <text x="45" y="200">2</text>
    <text x="45" y="130">3</text>
    <text x="45" y="60">4</text>
  </g>
  <rect x="65" y="273" width="18" height="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="87" y="287" font-family="sans-serif" font-size="11" fill="#222222">mulai</text>
  <polyline points="95,265 95,195 165,195 165,125 165,55 235,55 305,55 305,125" stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <polygon points="305,103 310,115 322,115 313,123 316,136 305,128 294,136 297,123 288,115 300,115" fill="#ffd54f" stroke="#b86a00" stroke-width="1.5"/>
  <text x="380" y="45" font-family="sans-serif" font-size="17" fill="#222222" text-anchor="start" font-weight="bold">Jalur dari a1 ke bintang</text>
  <path d="M400,91 L400,69 M393,76 L400,68 L407,76" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <path d="M423,80 L445,80 M438,73 L446,80 L438,87" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="380" y="128" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start" font-weight="bold">ULANGI 2 kali:</text>
  <path d="M520,134 L520,112 M513,119 L520,111 L527,119" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="380" y="168" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start" font-weight="bold">ULANGI 2 kali:</text>
  <path d="M509,163 L531,163 M524,156 L532,163 L524,170" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <path d="M400,194 L400,216 M393,209 L400,217 L407,209" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="380" y="262" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="start">Satu panah = satu petak.</text>
  <text x="380" y="286" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="start">Garis tebal adalah dinding.</text>
