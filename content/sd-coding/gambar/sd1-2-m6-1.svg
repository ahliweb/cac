<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Lima indera dan kegunaannya</title>
  <desc id="d">Lima gambar berderet. Mata dengan tulisan melihat, telinga mendengar, hidung mencium, lidah mengecap, tangan meraba.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <g fill="#fffdf5" stroke="#888888" stroke-width="2">
    <rect x="10" y="20" width="116" height="200" rx="10"/>
    <rect x="138" y="20" width="116" height="200" rx="10"/>
    <rect x="266" y="20" width="116" height="200" rx="10"/>
    <rect x="394" y="20" width="116" height="200" rx="10"/>
    <rect x="522" y="20" width="108" height="200" rx="10"/>
  </g>
  <!-- mata -->
  <path transform="translate(10,0)" d="M28,100 q30,-34 60,0 q-30,34 -60,0 z" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <circle cx="68" cy="100" r="13" fill="#2a5d9f" stroke="#1b3f70" stroke-width="2"/>
  <circle cx="68" cy="100" r="5" fill="#222222"/>
  <!-- telinga -->
  <path d="M190,70 q-34,10 -22,50 q8,24 30,22 q-6,-18 14,-26 q22,-10 8,-34 q-12,-18 -30,-12 z" fill="#f1c9a5" stroke="#8a5a2a" stroke-width="3"/>
  <path d="M192,90 q10,-6 14,6" fill="none" stroke="#8a5a2a" stroke-width="3"/>
  <path d="M232,85 q10,8 0,22 M240,75 q18,16 0,42" fill="none" stroke="#2a5d9f" stroke-width="3"/>
  <!-- hidung -->
  <path d="M324,62 q-4,36 -16,56 q-8,12 6,16 q10,2 20,-2 q14,-4 6,-16 q-12,-20 -16,-54 z" fill="#f1c9a5" stroke="#8a5a2a" stroke-width="3"/>
  <circle cx="318" cy="130" r="3" fill="#8a5a2a"/>
  <circle cx="338" cy="130" r="3" fill="#8a5a2a"/>
  <path d="M290,150 q10,-8 20,0 M346,150 q10,-8 20,0" fill="none" stroke="#7bbf5a" stroke-width="3"/>
  <!-- lidah -->
  <path d="M420,90 q38,34 76,0" fill="none" stroke="#8f2a2a" stroke-width="4"/>
  <path d="M430,100 q8,50 28,50 q20,0 28,-50 z" fill="#e87a8a" stroke="#8f2a2a" stroke-width="3"/>
  <path d="M458,104 v30" stroke="#8f2a2a" stroke-width="2"/>
  <!-- tangan -->
  <path d="M548,150 v-52 q0,-8 8,-8 q8,0 8,8 v-14 q0,-8 8,-8 q8,0 8,8 v10 q0,-8 8,-8 q8,0 8,8 v10 q0,-8 8,-8 q8,0 8,8 v40 q0,24 -24,24 h-24 q-24,0 -24,-24 z" fill="#f1c9a5" stroke="#8a5a2a" stroke-width="3"/>
  <g font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="68" y="190">mata</text>
    <text x="196" y="190">telinga</text>
    <text x="324" y="190">hidung</text>
    <text x="452" y="190">lidah</text>
    <text x="576" y="190">kulit</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#444444" text-anchor="middle">
    <text x="68" y="210">melihat</text>
    <text x="196" y="210">mendengar</text>
    <text x="324" y="210">mencium</text>
    <text x="452" y="210">mengecap</text>
    <text x="576" y="210">meraba</text>
  </g>
</svg>
