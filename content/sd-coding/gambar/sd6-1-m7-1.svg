<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-labelledby="t d">
  <title id="t">Lembar informasi dengan judul, tiga kalimat, dan gambar tanaman</title>
  <desc id="d">Lembar dengan kotak judul Menyiram Tanaman Kelas di atas, tiga kalimat pendek, dan satu gambar tanaman dalam pot yang disiram dari gayung.</desc>
  <rect width="480" height="380" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
