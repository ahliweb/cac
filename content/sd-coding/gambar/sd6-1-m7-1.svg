  <rect x="60" y="14" width="360" height="352" fill="#ffffff" stroke="#888888" stroke-width="2"/>
  <rect x="80" y="30" width="320" height="44" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="240" y="59" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Menyiram Tanaman Kelas</text>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="84" y="104">Siram pagi hari.</text>
    <text x="84" y="128">Tuang air pelan-pelan.</text>
    <text x="84" y="152">Kembalikan gayung ke tempatnya.</text>
