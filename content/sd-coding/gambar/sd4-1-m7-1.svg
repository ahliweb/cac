<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" role="img" aria-labelledby="t d">
  <title id="t">Diagram alir dengan pengulangan</title>
  <desc id="d">Diagram alir: MULAI, kotak MAJU satu langkah, kotak Tambah satu garis di kartu, belah ketupat Garis sudah 3. Panah ya menuju SELESAI. Panah tidak melengkung kembali ke kotak MAJU satu langkah, itulah pengulangan.</desc>
  <rect width="520" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <ellipse cx="200" cy="30" rx="60" ry="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="200" y="35" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">MULAI</text>
  <polyline points="200,48 200,75" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="105" y="75" width="190" height="40" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="200" y="100" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">MAJU satu langkah</text>
  <polyline points="200,115 200,148" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="80" y="150" width="240" height="40" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="200" y="175" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Tambah satu garis di kartu</text>
  <polyline points="200,190 200,228" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polygon points="200,230 295,270 200,310 105,270" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="200" y="275" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Garis sudah 3?</text>
  <polyline points="200,310 200,350" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="215" y="333" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">ya</text>
  <ellipse cx="200" cy="370" rx="60" ry="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="200" y="375" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">SELESAI</text>
  <polyline points="295,270 400,270 400,95 297,95" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="348" y="262" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">tidak</text>
  <text x="260" y="440" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Panah tidak kembali ke atas: langkah diulang sampai syaratnya terpenuhi.</text>
</svg>
