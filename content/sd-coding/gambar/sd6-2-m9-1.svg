<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-labelledby="t d">
  <title id="t">Ujian ciri tiga pertanyaan dan tiga golongan</title>
  <desc id="d">Tiga pertanyaan bersusun dari atas ke bawah: nomor 1 menerima keadaan sebagai masukan, nomor 2 tindakan berubah menurut keadaan, nomor 3 aturan berubah dari contoh. Jawaban tidak pada nomor 1 atau nomor 2 menuju golongan non-cerdas. Jawaban ya pada nomor 1 dan 2 lalu tidak pada nomor 3 menuju golongan campuran. Jawaban ya pada ketiganya menuju golongan cerdas.</desc>
  <rect width="540" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <rect x="20" y="20" width="250" height="60" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="30" y="46" font-weight="bold">1. Menerima keadaan</text>
    <text x="30" y="66">sebagai masukan?</text>
    <rect x="20" y="120" width="250" height="60" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="30" y="146" font-weight="bold">2. Tindakan berubah</text>
    <text x="30" y="166">menurut keadaan?</text>
    <rect x="20" y="220" width="250" height="60" rx="6" fill="#e8f0fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="30" y="246" font-weight="bold">3. Aturan berubah</text>
    <text x="30" y="266">dari contoh?</text>
  </g>
  <g stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M145,82 L145,116"/>
    <path d="M145,182 L145,216"/>
    <path d="M272,50 L338,66"/>
    <path d="M272,150 L338,96"/>
    <path d="M272,236 L338,216"/>
    <path d="M272,266 L338,266"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <text x="152" y="104">ya</text>
    <text x="152" y="204">ya</text>
    <text x="290" y="48">tidak</text>
    <text x="290" y="130">tidak</text>
    <text x="290" y="226">tidak</text>
    <text x="290" y="283">ya</text>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">
    <rect x="342" y="56" width="180" height="50" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
    <text x="432" y="87">NON-CERDAS</text>
    <rect x="342" y="196" width="180" height="40" rx="6" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
    <text x="432" y="222">CAMPURAN</text>
    <rect x="342" y="246" width="180" height="40" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="432" y="272">CERDAS</text>
  </g>
</svg>
