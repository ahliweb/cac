<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Dua kartu jika-maka: hujan ke payung dan panas ke topi</title>
  <desc id="d">Dua baris kartu. Baris pertama: kartu JIKA bergambar awan dengan tetes hujan, panah, kartu MAKA bergambar payung, dan tulisan Jika hujan, maka payung. Baris kedua: kartu JIKA bergambar matahari, panah, kartu MAKA bergambar topi, dan tulisan Jika panas, maka topi.</desc>
