<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Enam kartu pola, mesin kotak, kotak A dan kotak B</title>
  <desc id="d">Di kiri enam kartu pola dalam dua baris. Baris atas tiga kartu bergaris berwarna merah, biru, dan kuning. Baris bawah tiga kartu berbintik berwarna merah, biru, dan kuning. Panah menuju kardus bertulis mesin, lalu dua kotak: kotak A untuk kartu garis dan kotak B untuk kartu bintik.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g stroke="#666666" stroke-width="2">
    <rect x="20" y="60" width="60" height="80" rx="6" fill="#f6c6c6"/>
    <rect x="90" y="60" width="60" height="80" rx="6" fill="#c9dcf5"/>
    <rect x="160" y="60" width="60" height="80" rx="6" fill="#fbeaa0"/>
    <rect x="20" y="170" width="60" height="80" rx="6" fill="#f6c6c6"/>
    <rect x="90" y="170" width="60" height="80" rx="6" fill="#c9dcf5"/>
    <rect x="160" y="170" width="60" height="80" rx="6" fill="#fbeaa0"/>
  </g>
  <g stroke="#444444" stroke-width="3">
