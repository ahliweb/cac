    <line x1="100" y1="78" x2="140" y2="78"/><line x1="100" y1="96" x2="140" y2="96"/><line x1="100" y1="114" x2="140" y2="114"/><line x1="100" y1="132" x2="140" y2="132"/>
    <line x1="170" y1="78" x2="210" y2="78"/><line x1="170" y1="96" x2="210" y2="96"/><line x1="170" y1="114" x2="210" y2="114"/><line x1="170" y1="132" x2="210" y2="132"/>
  </g>
  <g fill="#444444">
    <circle cx="35" cy="188" r="4"/><circle cx="65" cy="188" r="4"/><circle cx="50" cy="210" r="4"/><circle cx="35" cy="232" r="4"/><circle cx="65" cy="232" r="4"/>
    <circle cx="105" cy="188" r="4"/><circle cx="135" cy="188" r="4"/><circle cx="120" cy="210" r="4"/><circle cx="105" cy="232" r="4"/><circle cx="135" cy="232" r="4"/>
    <circle cx="175" cy="188" r="4"/><circle cx="205" cy="188" r="4"/><circle cx="190" cy="210" r="4"/><circle cx="175" cy="232" r="4"/><circle cx="205" cy="232" r="4"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="20" y="48">garis</text>
    <text x="20" y="162">bintik</text>
  </g>
  <line x1="230" y1="155" x2="290" y2="155" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="300" y="105" width="130" height="100" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="3"/>
  <text x="365" y="162" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">MESIN</text>
