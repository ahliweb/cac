<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kisi 4 kali 4 dengan jalur panah dari a1 ke c3</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4. Jalur panah mulai di a1, naik ke a3, lalu ke kanan sampai c3, tempat bintang. Di kanan ada jalur dalam empat panah: atas, atas, kanan, kanan.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <g stroke="#888888" stroke-width="1.5" fill="none">
    <rect x="60" y="20" width="280" height="280"/>
    <line x1="130" y1="20" x2="130" y2="300"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="270" y1="20" x2="270" y2="300"/>
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="60" y1="160" x2="340" y2="160"/>
    <line x1="60" y1="230" x2="340" y2="230"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="95" y="320">a</text>
    <text x="165" y="320">b</text>
    <text x="235" y="320">c</text>
    <text x="305" y="320">d</text>
    <text x="45" y="270">1</text>
    <text x="45" y="200">2</text>
    <text x="45" y="130">3</text>
    <text x="45" y="60">4</text>
  </g>
  <rect x="65" y="273" width="18" height="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="87" y="287" font-family="sans-serif" font-size="11" fill="#222222">mulai</text>
  <polyline points="95,265 95,125 235,125" stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <polygon points="235,103 240,115 252,115 243,123 246,136 235,128 224,136 227,123 218,115 230,115" fill="#ffd54f" stroke="#b86a00" stroke-width="1.5"/>
  <text x="380" y="50" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="start" font-weight="bold">Jalur</text>
  <path d="M400,101 L400,79 M393,86 L400,78 L407,86" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <path d="M434,101 L434,79 M427,86 L434,78 L441,86" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <path d="M457,90 L479,90 M472,83 L480,90 L472,97" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <path d="M491,90 L513,90 M506,83 L514,90 L506,97" stroke="#2a5d9f" stroke-width="3" fill="none"/>
  <text x="380" y="140" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">Satu panah = satu petak</text>
  <text x="380" y="190" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">Mulai: a1</text>
  <text x="380" y="220" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="start">Bintang: c3</text>
