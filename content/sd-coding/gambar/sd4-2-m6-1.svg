<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" role="img" aria-labelledby="t d">
  <title id="t">Tiga pertanyaan cek untuk satu pesan</title>
  <desc id="d">Kartu pesan di tengah bertuliskan BESOK SEKOLAH LIBUR SEMUA, sebarkan ke semua temanmu sekarang. Tiga kotak pertanyaan menunjuk ke kartu. Satu: siapa yang menulis. Dua: ada sumber yang bisa dicek. Tiga: menyuruh cepat-cepat menyebarkan.</desc>
  <rect width="540" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="180" y="110" width="180" height="90" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="270.0" y="144.5" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">BESOK SEKOLAH LIBUR</text>
  <text x="270.0" y="159.5" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">SEMUA! Sebarkan ke</text>
  <text x="270.0" y="174.5" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">semua temanmu sekarang!</text>
  <rect x="15" y="125" width="140" height="60" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="85.0" y="151.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">1. Siapa yang</text>
  <text x="85.0" y="167.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">menulis?</text>
  <rect x="385" y="125" width="140" height="60" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="455.0" y="151.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">2. Ada sumber yang</text>
  <text x="455.0" y="167.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">bisa dicek?</text>
  <rect x="150" y="255" width="240" height="60" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="270.0" y="281.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">3. Menyuruh cepat-cepat</text>
  <text x="270.0" y="297.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">menyebarkan?</text>
  <polyline points="155,155 178,155" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polyline points="385,155 362,155" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polyline points="270,255 270,202" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="270" y="98" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Pesan A</text>
  <text x="270" y="345" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Tiga pertanyaan ini tanda untuk bertanya, bukan bukti.</text>
</svg>
