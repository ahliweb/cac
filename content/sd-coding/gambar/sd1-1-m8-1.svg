<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Kisi 3x3 bernomor, robot di petak 8 maju dua kali ke petak 2, dan dua cara menulisnya</title>
  <desc id="d">Kisi 3x3 bernomor 1 sampai 9, baris atas 1 2 3. Robot kotak di petak 8 menghadap atas. Dua panah naik dari petak 8 ke petak 5 lalu ke petak 2 yang bergambar bintang. Di kanan, cara A: dua kartu MAJU. Cara B: kartu ULANGI 2 KALI dan bingkai putus-putus berisi satu kartu MAJU.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <g fill="#fffdf5" stroke="#888888" stroke-width="2">
    <rect x="30" y="20" width="90" height="90"/>
    <rect x="120" y="20" width="90" height="90"/>
    <rect x="210" y="20" width="90" height="90"/>
    <rect x="30" y="110" width="90" height="90"/>
    <rect x="120" y="110" width="90" height="90"/>
    <rect x="210" y="110" width="90" height="90"/>
    <rect x="30" y="200" width="90" height="90"/>
    <rect x="120" y="200" width="90" height="90"/>
    <rect x="210" y="200" width="90" height="90"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#777777">
    <text x="35" y="36">1</text>
    <text x="125" y="36">2</text>
    <text x="215" y="36">3</text>
    <text x="35" y="126">4</text>
    <text x="125" y="126">5</text>
    <text x="215" y="126">6</text>
    <text x="35" y="216">7</text>
    <text x="125" y="216">8</text>
    <text x="215" y="216">9</text>
  </g>
  <polygon points="165,48 171,61 184,61 174,69 178,83 165,75 152,83 156,69 146,61 159,61" fill="#f2d24b" stroke="#b8960a" stroke-width="2"/>
  <g stroke="#555555" stroke-width="3" fill="#cfd8e3">
    <rect x="150.0" y="249.0" width="30" height="34" rx="4"/>
    <rect x="156.0" y="235.0" width="18" height="12" rx="3"/>
  </g>
  <polygon points="165.0,219.0 158.0,228.0 172.0,228.0" fill="#d94f4f"/>
  <polyline points="165,215 165,99" fill="none" stroke="#2a5d9f" stroke-width="4" marker-end="url(#a)"/>
  <text x="340" y="62" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">A</text>
  <rect x="380" y="40" width="100" height="44" rx="8" fill="#e8c27a" stroke="#b86a00" stroke-width="2"/>
  <text x="430" y="68" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">MAJU</text>
  <rect x="500" y="40" width="100" height="44" rx="8" fill="#e8c27a" stroke="#b86a00" stroke-width="2"/>
  <text x="550" y="68" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">MAJU</text>
  <text x="340" y="182" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">B</text>
  <rect x="380" y="160" width="130" height="44" rx="8" fill="#f4b183" stroke="#b84a00" stroke-width="2"/>
  <text x="445" y="187" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">ULANGI 2 KALI</text>
  <rect x="522" y="150" width="104" height="64" rx="10" fill="none" stroke="#555555" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="532" y="160" width="84" height="44" rx="8" fill="#e8c27a" stroke="#b86a00" stroke-width="2"/>
  <text x="574" y="187" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">MAJU</text>
  <text x="490" y="262" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">sama-sama berakhir di petak 2</text>
</svg>
