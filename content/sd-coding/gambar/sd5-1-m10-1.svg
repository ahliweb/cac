<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-labelledby="t d">
  <title id="t">Pesan tidak dikenal dan tiga pilihan</title>
  <desc id="d">Sebuah gelembung pesan fiktif dari orang yang tidak dikenal meminta alamat dan nomor telepon. Tiga panah menuju pilihan balas, abaikan, dan tanya orang dewasa dulu. Pilihan aman adalah tidak membalas, menyimpan pesan, dan menunjukkannya ke orang dewasa.</desc>
  <rect width="560" height="270" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="330" height="90" rx="14" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <path d="M60,110 L50,132 L90,110 z" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="185" y="50" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">Pesan dari orang yang tidak dikenal:</text>
  <text x="185" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Kirim alamat dan nomor teleponmu ya.</text>
  <text x="185" y="96" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle">(contoh fiktif)</text>
  <rect x="20" y="190" width="110" height="60" rx="8" fill="#fdeeee" stroke="#b03030" stroke-width="2"/>
  <text x="75" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">BALAS</text>
  <rect x="150" y="190" width="110" height="60" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="205" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">ABAIKAN</text>
  <rect x="280" y="190" width="140" height="60" rx="8" fill="#eef8ee" stroke="#3a7d3a" stroke-width="2"/>
  <text x="350" y="215" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">TANYA ORANG</text>
  <text x="350" y="233" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">DEWASA DULU</text>
  <line x1="90" y1="138" x2="75" y2="188" stroke="#2a5d9f" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="190" y1="118" x2="205" y2="188" stroke="#2a5d9f" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="260" y1="118" x2="340" y2="188" stroke="#2a5d9f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="480" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Pilihan aman:</text>
  <text x="480" y="84" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">tidak membalas,</text>
  <text x="480" y="102" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">simpan pesannya,</text>
  <text x="480" y="120" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">tunjukkan ke</text>
  <text x="480" y="138" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">orang dewasa</text>
</svg>
