<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-labelledby="t d">
  <title id="t">Perangkat keras dan perangkat lunak</title>
  <desc id="d">Dua kolom. Kolom kiri perangkat keras, bisa disentuh: layar, papan ketik, kabel pengisi daya. Kolom kanan perangkat lunak, petunjuk yang menyuruh: permainan, aplikasi menggambar, peramban. Dua panah di tengah bertuliskan bekerja bersama.</desc>
  <rect width="520" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="200" height="50" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="120.0" y="41.5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">PERANGKAT KERAS</text>
  <text x="120.0" y="57.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">bisa disentuh</text>
  <rect x="300" y="20" width="200" height="50" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="400.0" y="41.5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">PERANGKAT LUNAK</text>
  <text x="400.0" y="57.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">petunjuk yang menyuruh</text>
  <rect x="20" y="100" width="200" height="45" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="120.0" y="127.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">layar</text>
  <rect x="20" y="165" width="200" height="45" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="120.0" y="192.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">papan ketik</text>
  <rect x="20" y="230" width="200" height="45" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="120.0" y="257.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">kabel pengisi daya</text>
  <rect x="300" y="100" width="200" height="45" fill="#ffffff" stroke="#444444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="400.0" y="127.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">permainan</text>
  <rect x="300" y="165" width="200" height="45" fill="#ffffff" stroke="#444444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="400.0" y="192.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">aplikasi menggambar</text>
  <rect x="300" y="230" width="200" height="45" fill="#ffffff" stroke="#444444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="400.0" y="257.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">peramban</text>
  <polyline points="228,200 292,200" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <polyline points="292,225 228,225" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="260" y="172" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">bekerja</text>
  <text x="260" y="186" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">bersama</text>
  <text x="260" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Keras bisa disentuh. Lunak adalah petunjuk yang menyuruh keras bekerja.</text>
</svg>
