<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t d">
  <title id="t">Empat kartu langkah roti isi dari kiri ke kanan</title>
  <desc id="d">Empat kartu berurutan dengan panah. Kartu 1: dua lembar roti. Kartu 2: selai dioles pada satu lembar. Kartu 3: irisan isi di atas selai. Kartu 4: lembar kedua menutup roti.</desc>
