  </g>
  <rect x="203" y="78" width="74" height="12" rx="6" fill="#d94f4f"/>
  <rect x="363" y="78" width="74" height="12" rx="6" fill="#d94f4f"/>
  <g fill="#7bbf5a" stroke="#3b7d1f" stroke-width="1.5">
    <circle cx="385" cy="96" r="9"/>
    <circle cx="410" cy="96" r="9"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="80" y="150">1. Ambil roti</text>
