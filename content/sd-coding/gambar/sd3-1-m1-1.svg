    <rect x="175" y="20" width="130" height="150" rx="10"/>
    <rect x="335" y="20" width="130" height="150" rx="10"/>
    <rect x="495" y="20" width="130" height="150" rx="10"/>
  </g>
  <g stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="147" y1="95" x2="173" y2="95"/>
    <line x1="307" y1="95" x2="333" y2="95"/>
    <line x1="467" y1="95" x2="493" y2="95"/>
  </g>
  <g fill="#e8c27a" stroke="#b86a00" stroke-width="2">
