<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-labelledby="t d">
  <title id="t">Poster dengan judul, tiga aturan, dan kalimat kalau ragu</title>
  <desc id="d">Poster. Judul besar: kata sandi itu rahasia. Tiga kotak bernomor dengan satu gambar sederhana tiap kotak. Di bawah: kalau ragu, tanya orang dewasa.</desc>
  <rect width="420" height="360" fill="#ffffff"/>
  <rect x="15" y="10" width="390" height="340" fill="#ffffff" stroke="#444444" stroke-width="4"/>
  <text x="210" y="60" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222222">KATA SANDI</text>
  <text x="210" y="92" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#222222">ITU RAHASIA</text>
  <rect x="35" y="115" width="350" height="55" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <circle cx="65" cy="142" r="16" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="65" y="148" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">1</text>
  <text x="95" y="148" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">Jangan beri tahu teman</text>
  <rect x="345" y="139" width="26" height="20" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <path d="M351,139 v-7 a7,7 0 0 1 14,0 v7" fill="none" stroke="#444444" stroke-width="2"/>
  <rect x="35" y="180" width="350" height="55" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <circle cx="65" cy="207" r="16" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="65" y="213" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">2</text>
  <text x="95" y="213" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">Hanya orang tua boleh tahu</text>
  <rect x="345" y="204" width="26" height="20" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <path d="M351,204 v-7 a7,7 0 0 1 14,0 v7" fill="none" stroke="#444444" stroke-width="2"/>
  <rect x="35" y="245" width="350" height="55" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <circle cx="65" cy="272" r="16" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="65" y="278" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">3</text>
  <text x="95" y="278" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">Jangan ditulis di tempat umum</text>
  <rect x="345" y="269" width="26" height="20" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <path d="M351,269 v-7 a7,7 0 0 1 14,0 v7" fill="none" stroke="#444444" stroke-width="2"/>
  <text x="210" y="325" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">Kalau ragu, tanya orang dewasa.</text>
</svg>
