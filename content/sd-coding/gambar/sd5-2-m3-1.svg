<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="t d">
  <title id="t">Mesin non-cerdas dan mesin cerdas</title>
  <desc id="d">Dua alur. Mesin non-cerdas: ditekan lalu kerja tetap, contoh setrika, kipas, dispenser. Mesin cerdas: sensor, pilih, bertindak, contoh asisten suara dan robot penyapu.</desc>
  <rect width="520" height="270" fill="#ffffff"/>
  <rect x="10" y="10" width="500" height="100" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="10" y="130" width="500" height="130" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="260" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">MESIN NON-CERDAS: kerja tetap</text>
  <rect x="30" y="50" width="120" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="90" y="77" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">ditekan</text>
  <line x1="155" y1="72" x2="195" y2="72" stroke="#444444" stroke-width="2"/>
  <polygon points="195,72 187,67 187,77" fill="#444444"/>
  <rect x="200" y="50" width="120" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="260" y="77" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">kerja tetap</text>
  <text x="430" y="66" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">setrika, kipas,</text>
  <text x="430" y="84" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">dispenser</text>
  <text x="260" y="152" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">MESIN CERDAS: melihat keadaan, memilih tindakan</text>
  <rect x="25" y="170" width="100" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="75" y="197" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">sensor</text>
  <line x1="130" y1="192" x2="160" y2="192" stroke="#444444" stroke-width="2"/>
  <polygon points="160,192 152,187 152,197" fill="#444444"/>
  <rect x="165" y="170" width="100" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="215" y="197" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">pilih</text>
  <line x1="270" y1="192" x2="300" y2="192" stroke="#444444" stroke-width="2"/>
  <polygon points="300,192 292,187 292,197" fill="#444444"/>
  <rect x="305" y="170" width="100" height="44" rx="4" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="355" y="197" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">bertindak</text>
  <text x="450" y="190" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">asisten suara,</text>
  <text x="450" y="208" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">robot penyapu</text>
  <text x="260" y="245" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">hasil tindakan memengaruhi pilihan berikutnya</text>
</svg>
