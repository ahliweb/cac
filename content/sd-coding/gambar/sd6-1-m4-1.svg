<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Jalur yang keliru berakhir di d3, jalur yang benar berakhir di c4</title>
  <desc id="d">Kisi empat kolom a sampai d dan empat baris 1 sampai 4. Jalur oranye putus-putus dari a1 naik ke a3, belok kanan, berakhir di d3 dan ditandai salah. Jalur biru dari a1 naik ke a4, belok kanan, berakhir di c4 tempat bintang.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b86a00"/>
    </marker>
  </defs>
  <g stroke="#888888" stroke-width="1.5" fill="none">
    <rect x="60" y="20" width="280" height="280"/>
    <line x1="130" y1="20" x2="130" y2="300"/>
    <line x1="60" y1="90" x2="340" y2="90"/>
    <line x1="200" y1="20" x2="200" y2="300"/>
    <line x1="60" y1="160" x2="340" y2="160"/>
    <line x1="270" y1="20" x2="270" y2="300"/>
    <line x1="60" y1="230" x2="340" y2="230"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="95" y="320">a</text>
    <text x="165" y="320">b</text>
    <text x="235" y="320">c</text>
    <text x="305" y="320">d</text>
    <text x="45" y="270">1</text>
    <text x="45" y="200">2</text>
    <text x="45" y="130">3</text>
    <text x="45" y="60">4</text>
  </g>
  <rect x="64" y="274" width="18" height="18" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="86" y="288" font-family="sans-serif" font-size="11" fill="#222222">mulai</text>
  <polyline points="103,273 103,203 103,133 173,133 243,133 313,133" stroke="#b86a00" stroke-width="3" fill="none" stroke-dasharray="8 5" marker-end="url(#o)"/>
  <polyline points="87,265 87,195 87,125 87,55 157,55 227,55" stroke="#2a5d9f" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <polygon points="235,38 240,50 252,50 243,58 246,71 235,63 224,71 227,58 218,50 230,50" fill="#ffd54f" stroke="#b86a00" stroke-width="1.5"/>
  <text x="305" y="157" font-family="sans-serif" font-size="12" fill="#b86a00" text-anchor="middle">salah</text>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <line x1="380" y1="60" x2="420" y2="60" stroke="#2a5d9f" stroke-width="3"/>
    <text x="430" y="65">perbaikan, berakhir di c4</text>
    <line x1="380" y1="100" x2="420" y2="100" stroke="#b86a00" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="430" y="105">instruksi keliru, berakhir di d3</text>
  </g>
</svg>
