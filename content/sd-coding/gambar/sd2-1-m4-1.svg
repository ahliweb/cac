<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="t d">
  <title id="t">Enam manik merah dan biru dengan satuan pola dilingkari</title>
  <desc id="d">Enam lingkaran berderet berselang merah dan biru, bertanda huruf M dan B. Dua lingkaran pertama, merah lalu biru, dilingkari sebagai satuan pola. Di bawah, tiga kurung bernomor 1, 2, dan 3 menunjukkan satuan pola muncul tiga kali.</desc>
  <rect width="640" height="270" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <circle cx="80" cy="90" r="30" fill="#d9534f" stroke="#222222" stroke-width="2"/>
  <text x="80" y="98" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
  <circle cx="170" cy="90" r="30" fill="#2a5d9f" stroke="#222222" stroke-width="2"/>
  <text x="170" y="98" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
  <circle cx="260" cy="90" r="30" fill="#d9534f" stroke="#222222" stroke-width="2"/>
  <text x="260" y="98" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
  <circle cx="350" cy="90" r="30" fill="#2a5d9f" stroke="#222222" stroke-width="2"/>
  <text x="350" y="98" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
  <circle cx="440" cy="90" r="30" fill="#d9534f" stroke="#222222" stroke-width="2"/>
  <text x="440" y="98" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
  <circle cx="530" cy="90" r="30" fill="#2a5d9f" stroke="#222222" stroke-width="2"/>
  <text x="530" y="98" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
  <rect x="42" y="50" width="166" height="80" rx="40" fill="none" stroke="#b86a00" stroke-width="3"/>
  <text x="125" y="160" font-family="sans-serif" font-size="16" fill="#b86a00" text-anchor="middle" font-weight="bold">satuan pola</text>
  <path d="M50,175 L50,185 L200,185 L200,175" stroke="#888888" stroke-width="2" fill="none"/>
  <text x="125" y="208" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">1</text>
  <path d="M230,175 L230,185 L380,185 L380,175" stroke="#888888" stroke-width="2" fill="none"/>
  <text x="305" y="208" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">2</text>
  <path d="M410,175 L410,185 L560,185 L560,175" stroke="#888888" stroke-width="2" fill="none"/>
  <text x="485" y="208" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">3</text>
  <text x="320" y="245" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">M = merah, B = biru. Satuan pola muncul 3 kali.</text>
</svg>
