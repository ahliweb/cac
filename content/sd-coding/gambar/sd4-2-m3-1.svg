<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" role="img" aria-labelledby="t d">
  <title id="t">Tiga tingkat rahasia informasi tokoh cerita</title>
  <desc id="d">Tiga kolom. Kolom UMUM, boleh dibagikan: warna kesukaan, hobi menggambar. Kolom HATI-HATI, tanya orang dewasa dulu: nama sekolah. Kolom RAHASIA, jangan dibagikan: kata sandi, alamat rumah.</desc>
  <rect width="560" height="310" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="170" height="50" fill="#e9f6ea" stroke="#2b7a33" stroke-width="2"/>
  <text x="95.0" y="41.5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">UMUM</text>
  <text x="95.0" y="57.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">boleh dibagikan</text>
  <rect x="195" y="20" width="170" height="50" fill="#fdf1e0" stroke="#b86a00" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="280.0" y="41.5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">HATI-HATI</text>
  <text x="280.0" y="57.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">tanya orang dewasa dulu</text>
  <rect x="380" y="20" width="170" height="50" fill="#fbe9e9" stroke="#a32020" stroke-width="3"/>
  <text x="465.0" y="41.5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">RAHASIA</text>
  <text x="465.0" y="57.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">jangan dibagikan</text>
  <rect x="10" y="90" width="170" height="45" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="95.0" y="117.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">warna kesukaan</text>
  <rect x="10" y="145" width="170" height="45" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="95.0" y="172.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">hobi menggambar</text>
  <rect x="195" y="90" width="170" height="45" fill="#ffffff" stroke="#444444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="280.0" y="117.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">nama sekolah</text>
  <rect x="380" y="90" width="170" height="45" fill="#ffffff" stroke="#444444" stroke-width="3"/>
  <text x="465.0" y="117.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">kata sandi</text>
  <rect x="380" y="145" width="170" height="45" fill="#ffffff" stroke="#444444" stroke-width="3"/>
  <text x="465.0" y="172.0" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">alamat rumah</text>
  <text x="280" y="235" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Kartu tentang tokoh cerita Rangga.</text>
  <text x="280" y="270" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Makin mudah dipakai untuk menemukan, menghubungi, atau masuk ke akun, makin rahasia.</text>
</svg>
