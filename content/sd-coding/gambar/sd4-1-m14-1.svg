<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-labelledby="t d">
  <title id="t">Peta isi semester 1 kelas 4</title>
  <desc id="d">Empat baris. Cara berpikir minggu satu sampai empat: masalah langkah periksa, bagian kecil, pola, informasi penting. Diagram alir minggu lima sampai sembilan: simbol, keputusan, ulang, uji, perbaiki. Mesin dan tabel minggu sepuluh dan sebelas: enam kata mesin, tabel sifat. Penguatan dan proyek minggu dua belas dan tiga belas.</desc>
  <rect width="540" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="270" y="22" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Peta semester 1</text>
  <rect x="10" y="34" width="520" height="66" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="270" y="53" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">CARA BERPIKIR (M1 sampai M4)</text>
  <text x="75" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">masalah, langkah,</text>
  <text x="75" y="84" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">periksa</text>
  <text x="205" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">bagian</text>
  <text x="205" y="84" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">kecil</text>
  <text x="335" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">pola</text>
  <text x="465" y="72" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">informasi</text>
  <text x="465" y="84" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">penting</text>
  <rect x="10" y="108" width="520" height="66" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="270" y="127" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">DIAGRAM ALIR (M5 sampai M9)</text>
  <text x="62" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">simbol</text>
  <text x="166" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">keputusan</text>
  <text x="270" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">ulang</text>
  <text x="374" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">uji</text>
  <text x="478" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">perbaiki</text>
  <rect x="10" y="182" width="520" height="66" rx="8" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="2"/>
  <text x="270" y="201" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">MESIN DAN TABEL (M10 sampai M11)</text>
  <text x="140" y="220" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">enam kata</text>
  <text x="140" y="232" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">untuk mesin</text>
  <text x="400" y="220" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">tabel sifat</text>
  <rect x="10" y="256" width="520" height="66" rx="8" fill="#fdf1e0" stroke="#b86a00" stroke-width="2"/>
  <text x="270" y="275" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">PENGUATAN DAN PROYEK (M12 sampai M13)</text>
  <text x="140" y="294" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">panduan antrean</text>
  <text x="140" y="306" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">kantin</text>
  <text x="400" y="294" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">panduan satu</text>
  <text x="400" y="306" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">halaman</text>
</svg>
