<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Kartu rahasia pribadi bergembok tertutup dan kartu warna kesukaan bergembok terbuka</title>
  <desc id="d">Tiga kartu berdampingan. Kartu nama lengkap dan kartu alamat rumah bergambar gembok tertutup berwarna merah. Kartu warna kesukaan bergambar gembok terbuka berwarna hijau.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g fill="#fffdf5" stroke="#888888" stroke-width="3">
    <rect x="20" y="20" width="190" height="260" rx="14"/>
    <rect x="225" y="20" width="190" height="260" rx="14"/>
    <rect x="430" y="20" width="190" height="260" rx="14"/>
  </g>
  <g font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="115" y="60">nama lengkap</text>
    <text x="320" y="60">alamat rumah</text>
    <text x="525" y="60">warna kesukaan</text>
  </g>
  <rect x="75" y="150" width="80" height="70" rx="8" fill="#e57373" stroke="#8f2a2a" stroke-width="4"/>
  <path d="M90,150 L90,125 A25,25 0 0 1 140,125 L140,150" fill="none" stroke="#8f2a2a" stroke-width="8"/>
  <circle cx="115" cy="182" r="8" fill="#ffffff"/>
  <rect x="280" y="150" width="80" height="70" rx="8" fill="#e57373" stroke="#8f2a2a" stroke-width="4"/>
  <path d="M295,150 L295,125 A25,25 0 0 1 345,125 L345,150" fill="none" stroke="#8f2a2a" stroke-width="8"/>
  <circle cx="320" cy="182" r="8" fill="#ffffff"/>
  <rect x="485" y="150" width="80" height="70" rx="8" fill="#8fcf7a" stroke="#3b7d1f" stroke-width="4"/>
  <path d="M500,150 L500,125 A25,25 0 0 1 550,125 L550,110" fill="none" stroke="#3b7d1f" stroke-width="8"/>
  <circle cx="525" cy="182" r="8" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="115" y="255" fill="#8f2a2a">rahasia pribadi</text>
    <text x="320" y="255" fill="#8f2a2a">rahasia pribadi</text>
    <text x="525" y="255" fill="#3b7d1f">boleh dibagikan</text>
  </g>
</svg>
