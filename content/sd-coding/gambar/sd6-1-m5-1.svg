<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="540" height="310" role="img" aria-labelledby="t d">
  <title id="t">Pertanyaan menjadi kata kunci dan dua kartu hasil pencarian</title>
  <desc id="d">Kotak pertanyaan Apa manfaat menanam pohon di halaman sekolah dengan tiga panah ke kata kunci manfaat, pohon, dan halaman sekolah. Di bawahnya kartu A dari kantor lingkungan hidup fiktif bertanda centang dan dipakai, serta kartu B yang meminta alamat rumah dan nomor telepon bertanda seru dan tidak dipakai.</desc>
  <rect width="540" height="310" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b86a00"/>
    </marker>
  </defs>
  <g font-family="sans-serif" fill="#222222" font-size="15" text-anchor="middle">
    <rect x="40" y="20" width="460" height="46" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="270" y="49">Apa manfaat menanam pohon di halaman sekolah?</text>
    <line x1="270" y1="66" x2="100" y2="94" stroke="#2a5d9f" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="35" y="96" width="130" height="32" rx="16" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
    <text x="100" y="117">manfaat</text>
    <line x1="270" y1="66" x2="270" y2="94" stroke="#2a5d9f" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="205" y="96" width="130" height="32" rx="16" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
    <text x="270" y="117">pohon</text>
    <line x1="270" y1="66" x2="440" y2="94" stroke="#2a5d9f" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="360" y="96" width="160" height="32" rx="16" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
    <text x="440" y="117">halaman sekolah</text>
    <rect x="40" y="160" width="215" height="130" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="147" y="184" font-weight="bold">Kartu A</text>
    <text x="147" y="208" font-size="13">kantor lingkungan hidup fiktif</text>
    <text x="147" y="228" font-size="13">bertanggal 2025</text>
    <text x="147" y="248" font-size="13">menjawab pertanyaan</text>
    <path d="M122,262 L135,276 L160,252" stroke="#2e7d32" stroke-width="4" fill="none"/>
    <text x="190" y="274" font-size="13" fill="#2e7d32">dipakai</text>
    <rect x="285" y="160" width="215" height="130" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/>
    <text x="392" y="184" font-weight="bold">Kartu B</text>
    <text x="392" y="208" font-size="13">Menangkan hadiah!</text>
    <text x="392" y="228" font-size="13">Isi alamat rumah dan</text>
    <text x="392" y="248" font-size="13">nomor teleponmu.</text>
    <path d="M360,258 L360,274 M360,279 L360,281" stroke="#c62828" stroke-width="4" fill="none"/>
    <text x="425" y="276" font-size="13" fill="#c62828">tidak dipakai</text>
  </g>
</svg>
