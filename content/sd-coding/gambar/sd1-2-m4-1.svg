<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tablet dengan layar, tombol, dan speaker</title>
  <desc id="d">Tablet tampak dari depan. Layar besar di tengah dilingkari merah. Satu tombol bulat di sisi kanan dilingkari biru. Speaker berpola titik di sisi kiri dilingkari hijau. Nama tiap bagian tertulis dekat lingkaran.</desc>
