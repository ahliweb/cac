  <polyline points="530,80 575,120 620,80" fill="none" stroke="#b86a00" stroke-width="3"/>
  <text x="575" y="140" font-family="sans-serif" font-size="26" fill="#222222" text-anchor="middle" font-weight="bold">?</text>
  <text x="575" y="175" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">kartu rahasia</text>
  <text x="20" y="36" font-family="sans-serif" font-size="17" fill="#222222" text-anchor="start" font-weight="bold">Petunjuk 1: bukan biru.   Petunjuk 2: punya sudut.</text>
  <text x="20" y="260" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="start">Sisa satu kartu: tebak, lalu buka amplop untuk memeriksa.</text>
