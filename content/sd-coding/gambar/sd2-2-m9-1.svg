  <text x="75" y="168" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">merah segitiga</text>
  <text x="75" y="204" font-family="sans-serif" font-size="12" fill="#1b7a3d" text-anchor="middle" font-weight="bold">tersisa</text>
  <rect x="145" y="70" width="110" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <circle cx="200" cy="117" r="20" fill="#f6c9c6" stroke="#b3261e" stroke-width="3"/>
  <text x="200" y="168" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">merah lingkaran</text>
  <line x1="161" y1="88" x2="239" y2="146" stroke="#222222" stroke-width="4"/>
