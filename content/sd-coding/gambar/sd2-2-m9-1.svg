<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Menebak kartu rahasia dari dua petunjuk</title>
  <desc id="d">Empat kartu: merah segitiga, merah lingkaran, biru segitiga, biru lingkaran. Dua kartu biru dicoret oleh petunjuk satu, bukan biru. Merah lingkaran dicoret oleh petunjuk dua, punya sudut. Merah segitiga tersisa. Di kanan ada amplop bertanda tanya.</desc>
