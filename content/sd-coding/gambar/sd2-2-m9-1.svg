  <text x="200" y="204" font-family="sans-serif" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">dicoret petunjuk 2</text>
  <rect x="270" y="70" width="110" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <polygon points="325,97 345,133.0 305,133.0" fill="#cfe0f5" stroke="#2a5d9f" stroke-width="3"/>
  <text x="325" y="168" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">biru segitiga</text>
  <line x1="286" y1="88" x2="364" y2="146" stroke="#222222" stroke-width="4"/>
  <line x1="364" y1="88" x2="286" y2="146" stroke="#222222" stroke-width="4"/>
  <text x="325" y="204" font-family="sans-serif" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">dicoret petunjuk 1</text>
  <rect x="395" y="70" width="110" height="110" rx="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <circle cx="450" cy="117" r="20" fill="#cfe0f5" stroke="#2a5d9f" stroke-width="3"/>
  <text x="450" y="168" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">biru lingkaran</text>
  <line x1="411" y1="88" x2="489" y2="146" stroke="#222222" stroke-width="4"/>
  <line x1="489" y1="88" x2="411" y2="146" stroke="#222222" stroke-width="4"/>
  <text x="450" y="204" font-family="sans-serif" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">dicoret petunjuk 1</text>
