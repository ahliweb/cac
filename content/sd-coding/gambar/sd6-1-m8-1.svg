<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tiga pertanyaan pemeriksa konten dan satu lembar yang lolos</title>
  <desc id="d">Tiga kotak berderet bertuliskan Sopan, Benar, dan Tanpa data pribadi, masing-masing dengan tanda centang. Di bawahnya satu lembar kecil berjudul Jaga Kebersihan Kelas dengan dua baris teks dan gambar tempat sampah.</desc>
  <rect width="520" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">
    <rect x="20" y="20" width="150" height="70" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="95" y="52">Sopan?</text>
    <rect x="185" y="20" width="150" height="70" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="260" y="52">Benar?</text>
    <rect x="350" y="20" width="150" height="70" rx="8" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
    <text x="425" y="52" font-size="13">Tanpa data pribadi?</text>
  </g>
  <g fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,70 L91,80 L112,60"/>
    <path d="M245,70 L256,80 L277,60"/>
    <path d="M410,70 L421,80 L442,60"/>
  </g>
  <path d="M95,92 L95,120 M260,92 L260,120 M425,92 L425,120" stroke="#2a5d9f" stroke-width="2" fill="none"/>
  <path d="M95,120 L425,120" stroke="#2a5d9f" stroke-width="2" fill="none"/>
  <path d="M260,120 L260,140" stroke="#2a5d9f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <rect x="130" y="142" width="260" height="170" fill="#ffffff" stroke="#888888" stroke-width="2"/>
  <rect x="146" y="154" width="228" height="34" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260" y="177" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Jaga Kebersihan Kelas</text>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <text x="150" y="212">Buang sampah pada tempatnya.</text>
    <text x="150" y="232">Sapu lantai sebelum pulang.</text>
  </g>
  <rect x="146" y="244" width="228" height="58" fill="#f7fbf4" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M244,258 L276,258 L272,292 L248,292 Z" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
  <path d="M240,258 L280,258" stroke="#1565c0" stroke-width="3"/>
  <path d="M252,252 L268,252" stroke="#1565c0" stroke-width="3"/>
