<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="t d">
  <title id="t">Papan jalur dengan satu batu</title>
  <desc id="d">Kisi 4 kali 4. Mesin mulai di a1 menghadap atas. Ada satu batu di a3 dan bintang di d2. Garis biru naik dari a1 ke a2, belok kanan karena depan ada batu, lalu maju ke b2, c2, dan d2.</desc>
