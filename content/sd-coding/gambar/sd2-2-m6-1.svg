<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
  <title id="t">Dua kotak sortir: boleh dibagikan dan tidak dibagikan</title>
  <desc id="d">Dua kotak. Kotak kiri hijau bertanda boleh dibagikan berisi kartu warna kesukaan Lila dan kartu gambar bunga buatan Lila. Kotak kanan merah bertanda tidak dibagikan berisi kartu alamat rumah Lila dan kartu kata sandi Lila. Di bawah ada pesan: ragu, tanya orang tua dulu.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b7a3d"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="290" height="250" rx="12" fill="#eef8f0" stroke="#1b7a3d" stroke-width="3"/>
  <text x="165" y="52" font-family="sans-serif" font-size="17" fill="#1b7a3d" text-anchor="middle" font-weight="bold">BOLEH DIBAGIKAN</text>
  <rect x="40" y="75" width="250" height="48" rx="6" fill="#ffffff" stroke="#1b7a3d" stroke-width="2"/>
  <text x="165.0" y="96" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">warna kesukaan</text>
  <text x="165.0" y="114" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">Lila</text>
  <rect x="40" y="145" width="250" height="48" rx="6" fill="#ffffff" stroke="#1b7a3d" stroke-width="2"/>
  <text x="165.0" y="166" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">gambar bunga</text>
  <text x="165.0" y="184" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">buatan Lila</text>
  <rect x="330" y="20" width="290" height="250" rx="12" fill="#fdeeee" stroke="#b3261e" stroke-width="3"/>
  <text x="475" y="52" font-family="sans-serif" font-size="17" fill="#b3261e" text-anchor="middle" font-weight="bold">TIDAK DIBAGIKAN</text>
  <rect x="350" y="75" width="250" height="48" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
  <text x="475.0" y="96" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">alamat rumah</text>
  <text x="475.0" y="114" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">Lila</text>
  <rect x="350" y="145" width="250" height="48" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
  <text x="475.0" y="166" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">kata sandi</text>
  <text x="475.0" y="184" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">Lila</text>
  <rect x="120" y="295" width="400" height="48" rx="24" fill="#fff3d6" stroke="#b86a00" stroke-width="2"/>
  <text x="320" y="325" font-family="sans-serif" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">Ragu? Tanya orang tua dulu.</text>
</svg>
