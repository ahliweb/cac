<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-labelledby="t d">
  <title id="t">Tiga langkah: berhenti, bayangkan, tulis ulang</title>
  <desc id="d">Tiga kotak berpanah dari kiri ke kanan. Kotak satu: berhenti, jangan membalas dulu. Kotak dua: bayangkan, Dewi mungkin sedih. Kotak tiga: tulis ulang, warna kucingmu bagus.</desc>
  <rect width="560" height="230" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <text x="280" y="26" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Sebelum membalas pesan</text>
  <rect x="20" y="50" width="130" height="40" fill="#fbe9e9" stroke="#a32020" stroke-width="3"/>
  <text x="85" y="75" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">1 BERHENTI</text>
  <rect x="20" y="90" width="130" height="90" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="85" y="128" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">jangan membalas</text>
  <text x="85" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">dulu</text>
  <rect x="215" y="50" width="130" height="40" fill="#fff6dc" stroke="#9a6b00" stroke-width="3"/>
  <text x="280" y="75" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">2 BAYANGKAN</text>
  <rect x="215" y="90" width="130" height="90" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="280" y="128" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">Dewi mungkin</text>
  <text x="280" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">sedih dan malu</text>
  <rect x="410" y="50" width="130" height="40" fill="#e9f6ea" stroke="#2b7a33" stroke-width="3"/>
  <text x="475" y="75" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222222">3 TULIS ULANG</text>
  <rect x="410" y="90" width="130" height="90" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="475" y="128" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">Warna kucingmu bagus.</text>
  <text x="475" y="146" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222222">Tambah garis di telinga</text>
  <line x1="150" y1="110" x2="213" y2="110" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="110" x2="408" y2="110" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="210" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Kata yang baik membuat teman ingin berkarya lagi.</text>
</svg>
