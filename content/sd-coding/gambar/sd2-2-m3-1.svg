  <title id="t">Mata dan kamera menerima cahaya dari bunga, tetapi hanya manusia yang mengerti</title>
  <desc id="d">Di tengah atas ada gambar bunga. Dari bunga, dua panah menuju mata di kiri dan kamera di kanan. Dari mata, panah menuju awan bertanda otak mengerti itu bunga. Dari kamera, panah menuju bingkai bertanda gambar tersimpan.</desc>
