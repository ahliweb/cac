<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="t d">
  <title id="t">Mencari kartu 17: satu per satu dan bagi dua</title>
  <desc id="d">Dua baris tujuh kartu terurut: 2, 5, 8, 11, 14, 17, 20. Baris atas, satu per satu: kartu dibuka dari kiri sebanyak enam kali sampai 17. Baris bawah, bagi dua: kartu tengah 11 dibuka lebih dulu, tiga kartu di kirinya diabaikan, lalu kartu tengah 17 dibuka; dua kali buka.</desc>
