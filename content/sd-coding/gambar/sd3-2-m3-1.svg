<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">Tabel buah dan jumlahnya</title>
  <desc id="d">Tabel dua kolom bernama Buah dan Jumlah. Baris pertama mangga 5, baris kedua pisang 4, baris ketiga jeruk 3. Di bawah tabel tertulis jumlah semua 12.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <g stroke="#555555" stroke-width="2" fill="none">
    <rect x="150" y="30" width="340" height="220"/>
    <line x1="150" y1="85" x2="490" y2="85"/>
    <line x1="150" y1="140" x2="490" y2="140"/>
    <line x1="150" y1="195" x2="490" y2="195"/>
    <line x1="320" y1="30" x2="320" y2="250"/>
  </g>
  <rect x="152" y="32" width="336" height="51" fill="#e8f1fb"/>
  <g font-family="sans-serif" font-size="22" fill="#222222" text-anchor="middle">
    <text x="235" y="66" font-weight="bold">Buah</text>
    <text x="405" y="66" font-weight="bold">Jumlah</text>
    <text x="235" y="121">mangga</text>
    <text x="405" y="121">5</text>
    <text x="235" y="176">pisang</text>
    <text x="405" y="176">4</text>
    <text x="235" y="231">jeruk</text>
    <text x="405" y="231">3</text>
    <text x="320" y="295">Jumlah semua: 12</text>
  </g>
</svg>
