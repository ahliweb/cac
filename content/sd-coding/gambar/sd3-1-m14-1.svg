<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-labelledby="t d">
  <title id="t">Peta semester 1 kelas 3</title>
  <desc id="d">Tiga kotak berurutan. Kotak satu: algoritma, kata terbatas, dan kotak berlabel (minggu 1 sampai 3). Kotak dua: jika-maka, ulangi, dan mengurutkan serta mencari kartu (minggu 4 sampai 8). Kotak tiga: menguji, membandingkan, robot teman, rute, dan permainan jalur (minggu 9 sampai 13).</desc>
  <rect width="560" height="280" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b7d1f"/>
    </marker>
  </defs>
  <rect x="10" y="50" width="170" height="150" rx="10" fill="#f4f8fd" stroke="#2a5d9f" stroke-width="3"/>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="95" y="82">M1 sampai M3</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="95" y="116">algoritma</text>
    <text x="95" y="135">kata terbatas</text>
    <text x="95" y="154">kotak berlabel</text>
  </g>
  <line x1="182" y1="125" x2="193" y2="125" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="195" y="50" width="170" height="150" rx="10" fill="#f2f9ee" stroke="#3b7d1f" stroke-width="3"/>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="280" y="82">M4 sampai M8</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="280" y="116">jika-maka</text>
    <text x="280" y="135">ulangi</text>
    <text x="280" y="154">urut dan cari kartu</text>
  </g>
  <line x1="367" y1="125" x2="378" y2="125" stroke="#2a5d9f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="380" y="50" width="170" height="150" rx="10" fill="#fdf1e0" stroke="#b86a00" stroke-width="3"/>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="465" y="82">M9 sampai M13</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <text x="465" y="116">uji dan perbaiki</text>
    <text x="465" y="135">bandingkan</text>
    <text x="465" y="154">robot dan permainan jalur</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">
    <text x="280" y="30">Peta semester 1</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="280" y="240">Minggu 14: kita mengingat dan bercerita.</text>
  </g>
</svg>
