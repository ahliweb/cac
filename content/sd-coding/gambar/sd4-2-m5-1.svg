<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="t d">
  <title id="t">Kata kunci dan hasil pencarian rekaan</title>
  <desc id="d">Kotak pencarian berisi merawat cabai pot dengan gambar kaca pembesar. Di bawahnya tiga kartu judul rekaan: Merawat cabai di pot, Cabai dalam pot untuk pemula, Menyiram cabai di pot.</desc>
  <rect width="520" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="440" height="46" rx="23" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <circle cx="75" cy="42" r="9" fill="none" stroke="#444444" stroke-width="2"/>
  <polyline points="82,49 90,57" stroke="#444444" stroke-width="2" fill="none"/>
  <text x="115" y="47" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">merawat cabai pot</text>
  <polyline points="260,66 260,96" stroke="#444444" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="80" y="100" width="360" height="42" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260.0" y="125.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Merawat cabai di pot</text>
  <rect x="80" y="155" width="360" height="42" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260.0" y="180.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Cabai dalam pot untuk pemula</text>
  <rect x="80" y="210" width="360" height="42" fill="#e8f1fb" stroke="#2a5d9f" stroke-width="2"/>
  <text x="260.0" y="235.5" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222222">Menyiram cabai di pot</text>
  <text x="260" y="285" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222222">Judul hasil rekaan untuk kelas, bukan hasil pencarian sungguhan.</text>
</svg>
