<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d">
  <title id="t">Potongan tabel penjualan dengan kolom total dan laba kasar kosong</title>
  <desc id="d">Potongan lembar kerja Penjualan dengan huruf kolom A sampai J. Baris 2: Kue lapis, jumlah 5, harga satuan 40000, biaya satuan 24000. Baris 3: Brownies, jumlah 2, harga satuan 45000, biaya satuan 28000. Kolom I total dan J laba kasar kosong. Di bawahnya kotak kosong untuk rumus.</desc>
