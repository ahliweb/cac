<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Larik berurutan dan tabel penelusuran pencarian biner</title>
  <desc id="d">Empat sel berurutan berisi B02, B05, B07, B09 dengan indeks 0 sampai 3. Di bawahnya tabel penelusuran pencarian biner untuk kode B07 dengan kolom langkah, kiri, kanan, tengah, dan urut[tengah], tiga baris kosong.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">
    <text x="320" y="28" font-size="15">urut (sudah berurutan), cari kode "B07"</text>
    <rect x="100" y="45" width="110" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <rect x="210" y="45" width="110" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <rect x="320" y="45" width="110" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <rect x="430" y="45" width="110" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="155" y="77">B02</text><text x="265" y="77">B05</text><text x="375" y="77">B07</text><text x="485" y="77">B09</text>
    <g font-size="14" fill="#2a5d9f">
      <text x="155" y="116">indeks 0</text><text x="265" y="116">indeks 1</text><text x="375" y="116">indeks 2</text><text x="485" y="116">indeks 3</text>
    </g>
    <g font-weight="bold" font-size="15">
      <rect x="20" y="140" width="90" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <rect x="110" y="140" width="100" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <rect x="210" y="140" width="100" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <rect x="310" y="140" width="110" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <rect x="420" y="140" width="200" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <text x="65" y="163">langkah</text><text x="160" y="163">kiri</text><text x="260" y="163">kanan</text><text x="365" y="163">tengah</text><text x="520" y="163">urut[tengah]</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="20" y="176" width="90" height="46"/><rect x="110" y="176" width="100" height="46" stroke-dasharray="5 3"/><rect x="210" y="176" width="100" height="46" stroke-dasharray="5 3"/><rect x="310" y="176" width="110" height="46" stroke-dasharray="5 3"/><rect x="420" y="176" width="200" height="46" stroke-dasharray="5 3"/>
      <rect x="20" y="222" width="90" height="46"/><rect x="110" y="222" width="100" height="46" stroke-dasharray="5 3"/><rect x="210" y="222" width="100" height="46" stroke-dasharray="5 3"/><rect x="310" y="222" width="110" height="46" stroke-dasharray="5 3"/><rect x="420" y="222" width="200" height="46" stroke-dasharray="5 3"/>
      <rect x="20" y="268" width="90" height="46"/><rect x="110" y="268" width="100" height="46" stroke-dasharray="5 3"/><rect x="210" y="268" width="100" height="46" stroke-dasharray="5 3"/><rect x="310" y="268" width="110" height="46" stroke-dasharray="5 3"/><rect x="420" y="268" width="200" height="46" stroke-dasharray="5 3"/>
    </g>
    <text x="65" y="205">1</text><text x="65" y="251">2</text><text x="65" y="297">3</text>
  </g>
</svg>
