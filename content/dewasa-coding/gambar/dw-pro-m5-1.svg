<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d">
  <title id="t">Larik dua, empat, enam, delapan dan tabel penelusuran jendela</title>
  <desc id="d">Empat sel berisi 2, 4, 6, 8 dengan indeks 0 sampai 3 dan tulisan jendela sama dengan 2. Di bawahnya tabel penelusuran dengan kolom i, potong, dan hasil, tiga baris kosong.</desc>
  <rect width="600" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">
    <text x="300" y="26" font-size="15">nilai, jendela = 2</text>
    <rect x="120" y="40" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <rect x="210" y="40" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <rect x="300" y="40" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <rect x="390" y="40" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="165" y="72">2</text><text x="255" y="72">4</text><text x="345" y="72">6</text><text x="435" y="72">8</text>
    <g font-size="14" fill="#2a5d9f">
      <text x="165" y="110">indeks 0</text><text x="255" y="110">indeks 1</text><text x="345" y="110">indeks 2</text><text x="435" y="110">indeks 3</text>
    </g>
    <g font-weight="bold" font-size="15">
      <rect x="40" y="135" width="100" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <rect x="140" y="135" width="240" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <rect x="380" y="135" width="180" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
      <text x="90" y="158">i</text><text x="260" y="158">potong</text><text x="470" y="158">hasil</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff" stroke-dasharray="5 3">
      <rect x="40" y="171" width="100" height="40"/><rect x="140" y="171" width="240" height="40"/><rect x="380" y="171" width="180" height="40"/>
      <rect x="40" y="211" width="100" height="40"/><rect x="140" y="211" width="240" height="40"/><rect x="380" y="211" width="180" height="40"/>
      <rect x="40" y="251" width="100" height="40"/><rect x="140" y="251" width="240" height="40"/><rect x="380" y="251" width="180" height="40"/>
    </g>
  </g>
</svg>
