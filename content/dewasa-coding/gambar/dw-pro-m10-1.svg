<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="t d">
  <title id="t">Tabel stok sebelum dan sesudah dua pemanggilan dengan sel kosong</title>
  <desc id="d">Tabel stok tiga barang B02, B05, B09 pada awal: 3, 7, 12. Dua baris berikutnya kosong untuk diisi: stok sesudah memindahkan 2 unit dari B02 ke B99 yang tidak ada, dan stok sesudah memindahkan 1 unit dari B02 ke B05 dengan kode asal berisi B02' OR '1'='1.</desc>
  <rect width="640" height="270" fill="#ffffff"/>
  <rect x="20" y="20" width="400" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="42.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Keadaan</text>
  <rect x="420" y="20" width="70" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="455.0" y="42.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">B02</text>
  <rect x="490" y="20" width="70" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="525.0" y="42.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">B05</text>
  <rect x="560" y="20" width="70" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="595.0" y="42.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">B09</text>
  <rect x="20" y="54" width="400" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="76.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">awal</text>
  <rect x="420" y="54" width="70" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="455.0" y="76.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">3</text>
  <rect x="490" y="54" width="70" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="525.0" y="76.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">7</text>
  <rect x="560" y="54" width="70" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="595.0" y="76.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">12</text>
  <rect x="20" y="88" width="400" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="110.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">setelah pindah 2 unit B02 ke B99</text>
  <rect x="420" y="88" width="70" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="490" y="88" width="70" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="560" y="88" width="70" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="122" width="400" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="144" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">setelah pindah 1 unit, kode asal  B02' OR '1'='1</text>
  <text x="28" y="164" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">ke B05 (pada basis baru)</text>
  <rect x="420" y="122" width="70" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="490" y="122" width="70" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="560" y="122" width="70" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="208" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Apa yang dicetak pada pemanggilan pertama? ______</text>
</svg>
