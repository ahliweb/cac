<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Penelusuran fungsi saring pada dua barang</title>
  <desc id="d">Kotak masukan berisi kata dengan spasi dan huruf LAMPU, panah ke kotak trim lalu huruf kecil, panah ke kotak kosong untuk nilai k. Di bawahnya tabel dua baris B02 Baterai contoh dan B05 Lampu contoh dengan kolom kosong nama memuat k, kode sama dengan k, dan dikembalikan.</desc>
  <rect width="720" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <rect x="20" y="25" width="160" height="50" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="100" y="56">kata = "  LAMPU "</text>
    <path d="M182 50 H238 M230 44 L238 50 L230 56" fill="none" stroke="#2a5d9f" stroke-width="2.5"/>
    <rect x="240" y="25" width="200" height="50" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="340" y="56">trim lalu huruf kecil</text>
    <path d="M442 50 H498 M490 44 L498 50 L490 56" fill="none" stroke="#2a5d9f" stroke-width="2.5"/>
    <rect x="500" y="25" width="200" height="50" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="600" y="56">k = ______</text>
    <g font-weight="bold" font-size="14">
      <rect x="20" y="110" width="250" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="145" y="137">barang</text>
      <rect x="270" y="110" width="150" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="345" y="137">nama memuat k?</text>
      <rect x="420" y="110" width="150" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="495" y="137">kode sama k?</text>
      <rect x="570" y="110" width="130" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="635" y="137">dikembalikan?</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="20" y="154" width="250" height="60"/><rect x="270" y="154" width="150" height="60" stroke-dasharray="5 3"/><rect x="420" y="154" width="150" height="60" stroke-dasharray="5 3"/><rect x="570" y="154" width="130" height="60" stroke-dasharray="5 3"/>
      <rect x="20" y="214" width="250" height="60"/><rect x="270" y="214" width="150" height="60" stroke-dasharray="5 3"/><rect x="420" y="214" width="150" height="60" stroke-dasharray="5 3"/><rect x="570" y="214" width="130" height="60" stroke-dasharray="5 3"/>
    </g>
    <text x="145" y="190">B02 Baterai contoh</text>
    <text x="145" y="250">B05 Lampu contoh</text>
  </g>
</svg>
