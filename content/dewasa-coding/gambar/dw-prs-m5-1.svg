<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tabel penamaan ulang berkas foto latihan</title>
  <desc id="d">Tabel tiga baris. Kolom berkas asli terisi IMG_0003.jpg, IMG_0007.jpg, IMG_0012.jpg. Dua kolom kosong: nama baru dengan awalan liburan, dan apa yang tercetak saat perintah terapkan dijalankan kedua kali.</desc>
  <rect width="700" height="260" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <g font-weight="bold">
      <rect x="20" y="20" width="190" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="30" y="45">berkas asli</text>
      <rect x="210" y="20" width="230" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="220" y="45">nama baru (liburan)</text>
      <rect x="440" y="20" width="240" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="450" y="45">terapkan kedua kali</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="20" y="60" width="190" height="60"/><rect x="210" y="60" width="230" height="60" stroke-dasharray="5 3"/><rect x="440" y="60" width="240" height="60" stroke-dasharray="5 3"/>
      <rect x="20" y="120" width="190" height="60"/><rect x="210" y="120" width="230" height="60" stroke-dasharray="5 3"/><rect x="440" y="120" width="240" height="60" stroke-dasharray="5 3"/>
      <rect x="20" y="180" width="190" height="60"/><rect x="210" y="180" width="230" height="60" stroke-dasharray="5 3"/><rect x="440" y="180" width="240" height="60" stroke-dasharray="5 3"/>
    </g>
    <text x="30" y="95">IMG_0003.jpg</text><text x="30" y="155">IMG_0007.jpg</text><text x="30" y="215">IMG_0012.jpg</text>
  </g>
</svg>
