<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">Tabel lima permintaan ke layanan gudang</title>
  <desc id="d">Tabel lima baris berisi permintaan berurutan dan tiga kolom kosong: kode status, isi, dan stok B02 sesudahnya. Stok B02 mula-mula 3.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="20" y="26" font-weight="bold">stok B02 mula-mula: 3</text>
    <g font-weight="bold">
      <rect x="20" y="40" width="40" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="30" y="63">no</text>
      <rect x="60" y="40" width="300" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="70" y="63">permintaan</text>
      <rect x="360" y="40" width="90" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="368" y="63">status</text>
      <rect x="450" y="40" width="160" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="460" y="63">isi</text>
      <rect x="610" y="40" width="90" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="618" y="63">stok B02</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="20" y="74" width="40" height="46"/><rect x="60" y="74" width="300" height="46"/><rect x="360" y="74" width="90" height="46" stroke-dasharray="5 3"/><rect x="450" y="74" width="160" height="46" stroke-dasharray="5 3"/><rect x="610" y="74" width="90" height="46" stroke-dasharray="5 3"/>
      <rect x="20" y="120" width="40" height="46"/><rect x="60" y="120" width="300" height="46"/><rect x="360" y="120" width="90" height="46" stroke-dasharray="5 3"/><rect x="450" y="120" width="160" height="46" stroke-dasharray="5 3"/><rect x="610" y="120" width="90" height="46" stroke-dasharray="5 3"/>
      <rect x="20" y="166" width="40" height="46"/><rect x="60" y="166" width="300" height="46"/><rect x="360" y="166" width="90" height="46" stroke-dasharray="5 3"/><rect x="450" y="166" width="160" height="46" stroke-dasharray="5 3"/><rect x="610" y="166" width="90" height="46" stroke-dasharray="5 3"/>
      <rect x="20" y="212" width="40" height="46"/><rect x="60" y="212" width="300" height="46"/><rect x="360" y="212" width="90" height="46" stroke-dasharray="5 3"/><rect x="450" y="212" width="160" height="46" stroke-dasharray="5 3"/><rect x="610" y="212" width="90" height="46" stroke-dasharray="5 3"/>
      <rect x="20" y="258" width="40" height="46"/><rect x="60" y="258" width="300" height="46"/><rect x="360" y="258" width="90" height="46" stroke-dasharray="5 3"/><rect x="450" y="258" width="160" height="46" stroke-dasharray="5 3"/><rect x="610" y="258" width="90" height="46" stroke-dasharray="5 3"/>
    </g>
    <text x="32" y="103">1</text><text x="70" y="103">GET /barang/B02</text>
    <text x="32" y="149">2</text><text x="70" y="149">POST /barang/B02/keluar  {"jumlah": 2}</text>
    <text x="32" y="195">3</text><text x="70" y="195">POST /barang/B02/keluar  {"jumlah": 2}</text>
    <text x="32" y="241">4</text><text x="70" y="241">POST /barang/B02/keluar  {"jumlah": "2"}</text>
    <text x="32" y="287">5</text><text x="70" y="287">GET /barang/B99</text>
    <text x="20" y="340" font-size="14">Isi status, isi jawaban, dan stok B02 sesudah tiap permintaan.</text>
  </g>
