<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Lima panggilan log dengan kolom tampil dan kotak alarm kosong</title>
  <desc id="d">Tabel lima panggilan log: info layanan mulai, debug detail, error stok tidak cukup, error kode tidak ada, error isian tidak valid. Kolom tampil pada tingkat INFO kosong. Di bawah dua kotak kosong: jumlah baris log tampil dan apakah alarm dikirim bila ambang 3.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <rect x="20" y="20" width="320" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Panggilan</text>
  <rect x="340" y="20" width="100" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="390.0" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Tingkat</text>
  <rect x="440" y="20" width="180" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="530.0" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Tampil di INFO?</text>
  <rect x="20" y="56" width="320" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="80" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">log.info("layanan mulai")</text>
  <rect x="340" y="56" width="100" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="390.0" y="80" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">info</text>
  <rect x="440" y="56" width="180" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="92" width="320" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="116" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">log.debug("detail ...")</text>
  <rect x="340" y="92" width="100" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="390.0" y="116" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">debug</text>
  <rect x="440" y="92" width="180" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="128" width="320" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="152" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">log.error("stok B02 tidak cukup")</text>
  <rect x="340" y="128" width="100" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="390.0" y="152" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">error</text>
  <rect x="440" y="128" width="180" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="164" width="320" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="188" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">log.error("kode tidak ada: B99")</text>
  <rect x="340" y="164" width="100" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="390.0" y="188" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">error</text>
  <rect x="440" y="164" width="180" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="200" width="320" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="224" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">log.error("isian tidak valid")</text>
  <rect x="340" y="200" width="100" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="390.0" y="224" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">error</text>
  <rect x="440" y="200" width="180" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Jumlah baris log yang tampil:</text>
  <rect x="260" y="250" width="90" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="314" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Alarm dikirim bila ambang 3? (ya/tidak)</text>
  <rect x="350" y="294" width="90" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
