<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Status pesanan toko daring tanpa anak panah</title>
  <desc id="d">Delapan kotak status pesanan: baru, menunggu_bayar, dibayar, dikemas, dikirim, selesai, batal, kedaluwarsa. Anak panah perpindahan yang boleh belum digambar; pembaca menggambarnya sendiri.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <rect x="20" y="40" width="100" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="70.0" y="63" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">baru</text>
  <rect x="190" y="40" width="150" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="265.0" y="63" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">menunggu_bayar</text>
  <rect x="380" y="40" width="100" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="430.0" y="63" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">dibayar</text>
  <rect x="510" y="40" width="100" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="560.0" y="63" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">dikemas</text>
  <rect x="510" y="150" width="100" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="560.0" y="173" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">dikirim</text>
  <rect x="380" y="150" width="100" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="430.0" y="173" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">selesai</text>
  <rect x="190" y="230" width="100" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="240.0" y="253" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">batal</text>
  <rect x="20" y="150" width="130" height="36" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="85.0" y="173" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kedaluwarsa</text>
  <text x="20" y="285" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Gambar anak panah untuk setiap perpindahan yang boleh.</text>
</svg>
