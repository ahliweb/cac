<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="t d">
  <title id="t">Tabel proses Warung Kopi Contoh dengan kolom jam kosong</title>
  <desc id="d">Tabel lima proses Warung Kopi Contoh, rekaan. Kolom proses, kali per bulan, menit per kali, dan bisa didigitalkan sudah terisi. Kolom jam per bulan kosong untuk diisi. Di bawahnya dua baris kosong: jumlah seluruh jam dan jam yang bisa didigitalkan.</desc>
