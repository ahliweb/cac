  <rect x="35" y="130" width="330" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="48" y="155.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">C  Cara memesan</text>
  <line x1="395" y1="150.0" x2="415" y2="150.0" stroke="#222222" stroke-width="2"/>
  <polygon points="415,150 407,154 407,146" fill="#222222" stroke="#222222" stroke-width="2"/>
  <rect x="420" y="134.0" width="125" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
