<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="t d">
  <title id="t">Kerangka halaman usaha dengan kotak tag yang kosong</title>
  <desc id="d">Kerangka halaman usaha rekaan dari atas ke bawah: kepala berjudul Toko Kue Contoh, empat bagian bernama Daftar kue, Cara memesan, Jam dan area, Kontak, lalu kaki halaman. Di sisi kanan tiap bagian ada kotak kosong untuk menulis tag HTML-nya.</desc>
