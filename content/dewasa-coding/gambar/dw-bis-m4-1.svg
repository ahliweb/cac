  <polygon points="415,205 407,209 407,201" fill="#222222" stroke="#222222" stroke-width="2"/>
  <rect x="420" y="189.0" width="125" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
