<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Isi berkas daftar_bacaan.txt pada tiga saat</title>
  <desc id="d">Tiga kolom isi berkas. Kolom awal berisi dua baris: Buku Contoh A dibaca dan Buku Contoh B belum. Kolom sesudah putaran 1 dan sesudah putaran 2 kosong, masing-masing lima baris kosong.</desc>
  <rect width="720" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <g font-weight="bold" text-anchor="middle">
      <rect x="20" y="20" width="210" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="125" y="42">awal</text>
      <rect x="255" y="20" width="210" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="360" y="42">sesudah putaran 1</text>
      <rect x="490" y="20" width="210" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="595" y="42">sesudah putaran 2</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="20" y="54" width="210" height="40"/><rect x="20" y="94" width="210" height="40"/>
      <rect x="20" y="134" width="210" height="40" stroke-dasharray="2 4" stroke-width="1"/><rect x="20" y="174" width="210" height="40" stroke-dasharray="2 4" stroke-width="1"/><rect x="20" y="214" width="210" height="40" stroke-dasharray="2 4" stroke-width="1"/>
    </g>
    <text x="28" y="79">Buku Contoh A|dibaca</text>
    <text x="28" y="119">Buku Contoh B|belum</text>
    <g stroke="#222222" stroke-width="2" fill="#f2f2f2" stroke-dasharray="5 3">
      <rect x="255" y="54" width="210" height="40"/><rect x="255" y="94" width="210" height="40"/><rect x="255" y="134" width="210" height="40"/><rect x="255" y="174" width="210" height="40"/><rect x="255" y="214" width="210" height="40"/>
      <rect x="490" y="54" width="210" height="40"/><rect x="490" y="94" width="210" height="40"/><rect x="490" y="134" width="210" height="40"/><rect x="490" y="174" width="210" height="40"/><rect x="490" y="214" width="210" height="40"/>
    </g>
    <path d="M232 154 H252 M246 148 L252 154 L246 160 M467 154 H487 M481 148 L487 154 L481 160" fill="none" stroke="#2a5d9f" stroke-width="2.5"/>
    <text x="20" y="280" font-size="14">Satu baris kosong berarti tidak ada isi; tulis tiap baris berkas pada satu kotak.</text>
  </g>
</svg>
