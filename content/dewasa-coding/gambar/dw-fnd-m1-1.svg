<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-labelledby="t d">
  <title id="t">Potongan skrip sintetis dengan kotak penilaian kosong</title>
  <desc id="d">Potongan skrip empat baris: host, password, api_key, jumlah, semuanya bernilai palsu. Di kanan tiap baris ada kotak kosong untuk menulis boleh atau tidak boleh ada di berkas kode, dan alasannya.</desc>
  <rect width="600" height="260" fill="#ffffff"/>
  <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">No.</text>
  <text x="70" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Baris skrip (nilai palsu)</text>
  <text x="400" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Boleh di kode? Mengapa?</text>
  <rect x="15" y="42" width="360" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="25" y="68" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">1</text>
  <text x="70" y="68" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">host = "db.contoh.invalid"</text>
  <rect x="385" y="42" width="200" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="15" y="94" width="360" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="25" y="120" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">2</text>
  <text x="70" y="120" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">password = "PASSWORD-PALSU-123"</text>
  <rect x="385" y="94" width="200" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="15" y="146" width="360" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="25" y="172" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">3</text>
  <text x="70" y="172" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">api_key = "KUNCI-PALSU-ABC"</text>
  <rect x="385" y="146" width="200" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="15" y="198" width="360" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="25" y="224" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">4</text>
  <text x="70" y="224" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">jumlah = 5</text>
  <rect x="385" y="198" width="200" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="250" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Nilai di atas palsu; tetap perlakukan seperti nyata.</text>
</svg>
