<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-labelledby="t d">
  <title id="t">Tujuh hari benar atau salah dan baris hitungan beruntun</title>
  <desc id="d">Tujuh kotak berurutan untuk hari 1 sampai 7 berisi BENAR, BENAR, SALAH, BENAR, BENAR, BENAR, SALAH. Panah bertuliskan dibaca dari hari 7 ke hari 1. Satu baris kotak kosong untuk hitungan beruntun tiap langkah.</desc>
  <rect width="720" height="230" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <g font-weight="bold" fill="#2a5d9f">
      <text x="75" y="30">hari 1</text><text x="175" y="30">hari 2</text><text x="275" y="30">hari 3</text><text x="375" y="30">hari 4</text><text x="475" y="30">hari 5</text><text x="575" y="30">hari 6</text><text x="675" y="30">hari 7</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="25" y="40" width="100" height="50"/><rect x="125" y="40" width="100" height="50"/><rect x="225" y="40" width="100" height="50"/><rect x="325" y="40" width="100" height="50"/><rect x="425" y="40" width="100" height="50"/><rect x="525" y="40" width="100" height="50"/><rect x="625" y="40" width="90" height="50"/>
    </g>
    <text x="75" y="71">BENAR</text><text x="175" y="71">BENAR</text><text x="275" y="71">SALAH</text><text x="375" y="71">BENAR</text><text x="475" y="71">BENAR</text><text x="575" y="71">BENAR</text><text x="670" y="71">SALAH</text>
    <path d="M690 110 H60 M70 104 L60 110 L70 116" fill="none" stroke="#2a5d9f" stroke-width="2.5"/>
    <text x="375" y="104" fill="#2a5d9f">dibaca dari hari 7 ke hari 1</text>
    <text x="40" y="150" text-anchor="start" font-weight="bold">beruntun setelah membaca tiap hari:</text>
    <g stroke="#222222" stroke-width="2" fill="#f2f2f2" stroke-dasharray="5 3">
      <rect x="25" y="162" width="100" height="50"/><rect x="125" y="162" width="100" height="50"/><rect x="225" y="162" width="100" height="50"/><rect x="325" y="162" width="100" height="50"/><rect x="425" y="162" width="100" height="50"/><rect x="525" y="162" width="100" height="50"/><rect x="625" y="162" width="90" height="50"/>
    </g>
  </g>
</svg>
