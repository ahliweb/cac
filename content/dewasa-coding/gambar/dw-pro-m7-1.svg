<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
  <title id="t">Tabel kategori, tabel barang, dan tabel hasil kosong</title>
  <desc id="d">Tabel kategori berisi Listrik, Alat tulis, dan Kosong. Tabel barang berisi B02 Baterai contoh Listrik stok 3, B05 Lampu contoh Listrik 7, B09 Saklar contoh Listrik 12, dan B11 Pensil contoh Alat tulis 40. Di bawahnya tabel hasil dengan kolom nama, jumlah barang, dan jumlah stok, tiga baris kosong.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="20" y="24" font-weight="bold">kategori</text>
    <rect x="20" y="32" width="170" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="30" y="53" font-weight="bold">nama</text>
    <rect x="20" y="62" width="170" height="30" fill="#fff" stroke="#222222" stroke-width="2"/><text x="30" y="83">Listrik</text>
    <rect x="20" y="92" width="170" height="30" fill="#fff" stroke="#222222" stroke-width="2"/><text x="30" y="113">Alat tulis</text>
    <rect x="20" y="122" width="170" height="30" fill="#fff" stroke="#222222" stroke-width="2"/><text x="30" y="143">Kosong</text>
    <text x="250" y="24" font-weight="bold">barang</text>
    <rect x="250" y="32" width="60" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="258" y="53" font-weight="bold">kode</text>
    <rect x="310" y="32" width="180" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="318" y="53" font-weight="bold">nama</text>
    <rect x="490" y="32" width="120" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="498" y="53" font-weight="bold">kategori</text>
    <rect x="610" y="32" width="90" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="618" y="53" font-weight="bold">stok</text>
    <g stroke="#222222" stroke-width="2" fill="#fff">
      <rect x="250" y="62" width="60" height="30"/><rect x="310" y="62" width="180" height="30"/><rect x="490" y="62" width="120" height="30"/><rect x="610" y="62" width="90" height="30"/>
      <rect x="250" y="92" width="60" height="30"/><rect x="310" y="92" width="180" height="30"/><rect x="490" y="92" width="120" height="30"/><rect x="610" y="92" width="90" height="30"/>
      <rect x="250" y="122" width="60" height="30"/><rect x="310" y="122" width="180" height="30"/><rect x="490" y="122" width="120" height="30"/><rect x="610" y="122" width="90" height="30"/>
      <rect x="250" y="152" width="60" height="30"/><rect x="310" y="152" width="180" height="30"/><rect x="490" y="152" width="120" height="30"/><rect x="610" y="152" width="90" height="30"/>
    </g>
    <text x="258" y="83">B02</text><text x="318" y="83">Baterai contoh</text><text x="498" y="83">Listrik</text><text x="618" y="83">3</text>
    <text x="258" y="113">B05</text><text x="318" y="113">Lampu contoh</text><text x="498" y="113">Listrik</text><text x="618" y="113">7</text>
    <text x="258" y="143">B09</text><text x="318" y="143">Saklar contoh</text><text x="498" y="143">Listrik</text><text x="618" y="143">12</text>
    <text x="258" y="173">B11</text><text x="318" y="173">Pensil contoh</text><text x="498" y="173">Alat tulis</text><text x="618" y="173">40</text>
    <text x="20" y="226" font-weight="bold">hasil (isi sendiri)</text>
    <rect x="20" y="234" width="250" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="30" y="256" font-weight="bold">nama</text>
    <rect x="270" y="234" width="210" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="280" y="256" font-weight="bold">jumlah barang</text>
    <rect x="480" y="234" width="210" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="490" y="256" font-weight="bold">jumlah stok</text>
    <g stroke="#222222" stroke-width="2" fill="#fff" stroke-dasharray="5 3">
      <rect x="20" y="266" width="250" height="44"/><rect x="270" y="266" width="210" height="44"/><rect x="480" y="266" width="210" height="44"/>
      <rect x="20" y="310" width="250" height="44"/><rect x="270" y="310" width="210" height="44"/><rect x="480" y="310" width="210" height="44"/>
      <rect x="20" y="354" width="250" height="44"/><rect x="270" y="354" width="210" height="44"/><rect x="480" y="354" width="210" height="44"/>
    </g>
  </g>
</svg>
