<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel kasus uji untuk draf fungsi persen kenaikan dengan kolom kosong</title>
  <desc id="d">Rumus draf A: (baru - lama) // lama * 100. Tabel empat kasus uji dengan kolom lama dan baru terisi: 100 dan 110, 200 dan 150, 3 dan 4, 0 dan 50. Kolom hasil perkiraan dan kolom lolos kosong. Di bawah kotak kosong untuk dua kasus uji tambahan.</desc>
