  <text x="530.0" y="81.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">lolos? (ya/tidak)</text>
  <rect x="20" y="92" width="100" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
