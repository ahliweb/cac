  <text x="30" y="34" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">draf A:  return (baru - lama) // lama * 100</text>
  <rect x="20" y="60" width="100" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="70.0" y="81.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">lama</text>
