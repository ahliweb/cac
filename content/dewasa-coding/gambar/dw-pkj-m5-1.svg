<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Tiga nama berkas lama dengan kotak nama baru kosong</title>
  <desc id="d">Tabel tiga nama berkas sintetis di folder laporan_masuk: rekap-maret-2026.csv, Rekap_April_2026.csv, REKAP MEI 2026.csv. Kolom nama baru dan kolom hasil bila skrip dijalankan kedua kali kosong. Pola nama baru tertulis di bawah: TTTT-BB.csv.</desc>
