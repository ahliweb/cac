<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tiga baris absensi sintetis dengan kolom menit kerja dan lembur kosong</title>
  <desc id="d">Tabel tiga baris absensi sintetis: K01 masuk 08:00 keluar 17:30, K02 masuk 07:45 keluar 15:45, K03 masuk 08:10 keluar kosong. Kolom menit kerja, menit lembur, dan ikut dihitung kosong. Hari kerja normal 480 menit.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <rect x="20" y="20" width="70" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="55.0" y="46.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">kode</text>
  <rect x="90" y="20" width="90" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="135.0" y="46.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">masuk</text>
  <rect x="180" y="20" width="100" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="230.0" y="46.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">keluar</text>
  <rect x="280" y="20" width="120" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="340.0" y="46.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">menit kerja</text>
  <rect x="400" y="20" width="130" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="465.0" y="46.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">menit lembur</text>
  <rect x="530" y="20" width="90" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="575.0" y="46.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">dihitung?</text>
  <rect x="20" y="62" width="70" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="55.0" y="88.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">K01</text>
  <rect x="90" y="62" width="90" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="135.0" y="88.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">08:00</text>
  <rect x="180" y="62" width="100" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="230.0" y="88.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">17:30</text>
  <rect x="280" y="62" width="120" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="400" y="62" width="130" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="530" y="62" width="90" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="104" width="70" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="55.0" y="130.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">K02</text>
  <rect x="90" y="104" width="90" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="135.0" y="130.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">07:45</text>
  <rect x="180" y="104" width="100" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="230.0" y="130.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">15:45</text>
  <rect x="280" y="104" width="120" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="400" y="104" width="130" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="530" y="104" width="90" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="146" width="70" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="55.0" y="172.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">K03</text>
  <rect x="90" y="146" width="90" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="135.0" y="172.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">08:10</text>
  <rect x="180" y="146" width="100" height="42" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="230.0" y="172.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">(kosong)</text>
  <rect x="280" y="146" width="120" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="400" y="146" width="130" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="530" y="146" width="90" height="42" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="218" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Hari kerja normal 8 jam = 480 menit; kelebihannya adalah lembur.</text>
  <text x="20" y="248" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Lembur = menit kerja - 480, paling sedikit 0.</text>
</svg>
