<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Delapan bagian rencana digital dengan kotak modul asal kosong</title>
  <desc id="d">Delapan bagian rencana digital: peta, pencatatan, ringkasan, situs, pesanan, otomasi, ai, risiko. Di sebelah tiap nama ada kotak kosong untuk menulis modul asal bagian itu.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Bagian rencana</text>
  <text x="180" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Modul asal</text>
  <text x="340" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Bagian rencana</text>
  <text x="500" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Modul asal</text>
  <rect x="20" y="40" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="95" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1. peta</text>
  <rect x="180" y="40" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="100" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="95" y="126" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2. pencatatan</text>
  <rect x="180" y="100" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="160" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="95" y="186" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">3. ringkasan</text>
  <rect x="180" y="160" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="20" y="220" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="95" y="246" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">4. situs</text>
  <rect x="180" y="220" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="340" y="40" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="415" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">5. pesanan</text>
  <rect x="500" y="40" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="340" y="100" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="415" y="126" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">6. otomasi</text>
  <rect x="500" y="100" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="340" y="160" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="415" y="186" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">7. ai</text>
  <rect x="500" y="160" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="340" y="220" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="415" y="246" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">8. risiko</text>
  <rect x="500" y="220" width="120" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="285" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Tulis kode modul asal (mis. DW-...) di kotak putus-putus.</text>
</svg>
