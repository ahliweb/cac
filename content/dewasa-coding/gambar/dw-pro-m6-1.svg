<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tiga nama dan dua objek Barang</title>
  <desc id="d">Di kiri tiga lingkaran bernama a, b, dan c. Di kanan dua kotak objek bernama objek 1 dan objek 2, masing-masing berisi kode B02, nama Baterai contoh, dan stok yang kosong. Tidak ada panah; pelajar menggambarnya.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" fill="#222222">
    <circle cx="70" cy="60" r="28" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <circle cx="70" cy="150" r="28" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <circle cx="70" cy="240" r="28" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <g text-anchor="middle" font-weight="bold"><text x="70" y="66">a</text><text x="70" y="156">b</text><text x="70" y="246">c</text></g>
    <rect x="360" y="20" width="260" height="120" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
    <text x="380" y="46" font-weight="bold" fill="#2a5d9f">objek 1</text>
    <text x="380" y="74">kode: B02</text>
    <text x="380" y="100">nama: Baterai contoh</text>
    <rect x="375" y="108" width="220" height="26" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="385" y="127">stok:</text>
    <rect x="360" y="165" width="260" height="120" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5" stroke-dasharray="10 4"/>
    <text x="380" y="191" font-weight="bold" fill="#2a5d9f">objek 2</text>
    <text x="380" y="219">kode: B02</text>
    <text x="380" y="245">nama: Baterai contoh</text>
    <rect x="375" y="253" width="220" height="26" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="385" y="272">stok:</text>
  </g>
</svg>
