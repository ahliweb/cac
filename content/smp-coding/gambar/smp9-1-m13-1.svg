<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 258" width="620" height="258" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran baca_angka</title>
  <desc id="d">Tabel empat kolom: baris dibaca, sesudah strip, kosong, isi angka sesudahnya. Lima baris: 28, 31, baris kosong, 30, 27. Tiga kolom lain kosong.</desc>
  <rect width="620" height="258" fill="#ffffff"/>
  <text x="10" y="34" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Penelusuran program W (isi sendiri)</text>
  <rect x="10" y="44" width="140" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="66.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">baris dibaca</text>
  <rect x="150" y="44" width="150" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="225.0" y="66.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">sesudah strip()</text>
  <rect x="300" y="44" width="100" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="350.0" y="66.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">kosong?</text>
  <rect x="400" y="44" width="210" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="505.0" y="66.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">isi angka sesudahnya</text>
  <rect x="10" y="78" width="140" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="100.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">28</text>
  <rect x="150" y="78" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="300" y="78" width="100" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="400" y="78" width="210" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="112" width="140" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="134.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">31</text>
  <rect x="150" y="112" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="300" y="112" width="100" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="400" y="112" width="210" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="146" width="140" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">(baris kosong)</text>
  <rect x="150" y="146" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="300" y="146" width="100" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="400" y="146" width="210" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="180" width="140" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">30</text>
  <rect x="150" y="180" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="300" y="180" width="100" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="400" y="180" width="210" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="214" width="140" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
