<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 174" width="550" height="174" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran kuis dua soal</title>
  <desc id="d">Tabel empat kolom: i, jawaban, periksa, skor. Dua baris, i sama dengan 0 dengan jawaban spasi 42 spasi, dan i sama dengan 1 dengan jawaban Anjing. Kolom periksa dan skor kosong.</desc>
  <rect width="550" height="174" fill="#ffffff"/>
  <text x="10" y="34" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Penelusuran program W (isi sendiri)</text>
  <rect x="10" y="44" width="70" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">i</text>
  <rect x="80" y="44" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="155.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">jawaban</text>
  <rect x="230" y="44" width="200" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="330.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">periksa(...)</text>
  <rect x="430" y="44" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="485.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">skor sesudah</text>
  <rect x="10" y="84" width="70" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="109.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
  <rect x="80" y="84" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="155.0" y="109.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">&quot; 42 &quot;</text>
  <rect x="230" y="84" width="200" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="430" y="84" width="110" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="124" width="70" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <rect x="80" y="124" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="155.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">&quot;Anjing&quot;</text>
  <rect x="230" y="124" width="200" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="430" y="124" width="110" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
