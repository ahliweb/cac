  <rect x="550" y="146" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="182" width="430" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="225.0" y="205.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Latar: gambar yang digambar sendiri</text>
  <rect x="440" y="182" width="110" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="550" y="182" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
