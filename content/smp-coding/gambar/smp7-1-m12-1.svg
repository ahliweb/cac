<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 340" width="710" height="340" role="img" aria-labelledby="t d">
  <title id="t">Tabel isi karya Petualangan Kucing</title>
  <desc id="d">Tabel tiga kolom: Isi karya, Tebakan, Keputusan. Tujuh baris isi karya rekaan Murid-01; kolom Tebakan dan Keputusan kosong.</desc>
  <rect width="710" height="340" fill="#ffffff"/>
  <text x="10" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Petualangan Kucing (rekaan): isi karya</text>
  <rect x="10" y="40" width="430" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="225.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Isi karya</text>
  <rect x="440" y="40" width="110" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="495.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Tebakan</text>
  <rect x="550" y="40" width="150" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="625.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Keputusan</text>
  <rect x="10" y="74" width="430" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
