<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" width="640" height="214" role="img" aria-labelledby="t d">
  <title id="t">Tabel banyak kemungkinan sandi acak</title>
  <desc id="d">Tabel dengan tiga jenis sandi: PIN 4 angka, 6 huruf kecil, 4 kata dari daftar 1.000 kata. Kolom pilihan tiap posisi, banyak posisi, dan banyak kemungkinan kosong untuk diisi.</desc>
  <rect width="640" height="214" fill="#ffffff"/>
  <text x="10" y="34" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Banyak kemungkinan sandi acak (isi sendiri)</text>
  <rect x="10" y="44" width="210" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="115.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Jenis sandi</text>
  <rect x="220" y="44" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="295.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Pilihan tiap posisi</text>
  <rect x="370" y="44" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="425.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Banyak posisi</text>
  <rect x="480" y="44" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="555.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Banyak kemungkinan</text>
  <rect x="10" y="84" width="210" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="115.0" y="109.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">PIN 4 angka</text>
  <rect x="220" y="84" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="370" y="84" width="110" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="480" y="84" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="124" width="210" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="115.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">6 huruf kecil</text>
  <rect x="220" y="124" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="370" y="124" width="110" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="480" y="124" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="164" width="210" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="115.0" y="189.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4 kata dari 1.000 kata</text>
  <rect x="220" y="164" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="370" y="164" width="110" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="480" y="164" width="150" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
