<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 262" width="600" height="262" role="img" aria-labelledby="t d">
  <title id="t">Tiga tumpukan kartu informasi</title>
  <desc id="d">Tiga kotak kosong berjudul boleh dibagikan, jangan dibagikan, dan periksa dulu. Pelajar menuliskan huruf kartu A sampai H di kotak yang tepat.</desc>
  <rect width="600" height="262" fill="#ffffff"/>
  <text x="10" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Tulis huruf kartu (A sampai H) di tumpukan yang tepat</text>
  <rect x="10" y="40" width="180" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="100" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">boleh dibagikan</text>
  <rect x="10" y="76" width="180" height="170" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="205" y="40" width="180" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="295" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">jangan dibagikan</text>
  <rect x="205" y="76" width="180" height="170" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="400" y="40" width="180" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="490" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">periksa dulu</text>
  <rect x="400" y="76" width="180" height="170" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
