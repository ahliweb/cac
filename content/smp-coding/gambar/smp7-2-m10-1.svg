<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Diagram komponen komputer dengan kotak kosong</title>
  <desc id="d">Lima kotak kosong. Tiga kotak berderet dari kiri ke kanan dihubungkan panah, dan dua kotak di bawah kotak tengah dihubungkan garis tanpa kepala panah ke kotak tengah. Tulis nama komponen di tiap kotak.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <text x="10" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Tulis nama komponen di tiap kotak</text>
  <rect x="20" y="60" width="160" height="70" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="100" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">kotak 1</text>
  <rect x="240" y="60" width="160" height="70" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="320" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">kotak 2</text>
  <rect x="460" y="60" width="160" height="70" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="540" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">kotak 3</text>
  <line x1="182" y1="95" x2="236" y2="95" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="402" y1="95" x2="456" y2="95" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="130" y="220" width="160" height="70" rx="8" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="210" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">kotak 4</text>
  <rect x="350" y="220" width="160" height="70" rx="8" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="430" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">kotak 5</text>
  <line x1="290" y1="132" x2="210" y2="218" stroke="#222222" stroke-width="2"/>
  <line x1="350" y1="132" x2="430" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="320" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">garis tanpa panah: data bisa bolak-balik</text>
</svg>
