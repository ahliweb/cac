<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 218" width="680" height="218" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran program V per putaran luar</title>
  <desc id="d">Tabel kosong dengan kolom Putaran luar ke-, Arah sebelum, Posisi setelah persegi, Arah setelah persegi, Arah setelah turn right 30. Tiga baris bernomor 1 sampai 3.</desc>
