<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran satu putaran tukar tetangga</title>
  <desc id="d">Daftar angka berisi 4, 2, 3, 1 dengan nomor 1 sampai 4, dan tabel kosong untuk satu putaran luar: i, perbandingan, tukar atau tidak, dan isi angka sesudahnya.</desc>
  <rect width="560" height="330" fill="#ffffff"/>
  <text x="10" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Daftar angka sebelum putaran luar pertama</text>
  <rect x="10" y="36" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="40.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">4</text>
  <text x="40" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">nomor 1</text>
  <rect x="80" y="36" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="110.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">2</text>
  <text x="110" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">nomor 2</text>
  <rect x="150" y="36" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="180.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">3</text>
  <text x="180" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">nomor 3</text>
  <rect x="220" y="36" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="250.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">1</text>
  <text x="250" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">nomor 4</text>
  <text x="10" y="134" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Satu putaran luar (isi sendiri)</text>
  <rect x="10" y="146" width="50" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="35.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">i</text>
  <rect x="60" y="146" width="160" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Perbandingan</text>
  <rect x="220" y="146" width="110" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="275.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Tukar?</text>
  <rect x="330" y="146" width="220" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="440.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">angka sesudah</text>
  <rect x="10" y="180" width="50" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="35.0" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <rect x="60" y="180" width="160" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="220" y="180" width="110" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="330" y="180" width="220" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="214" width="50" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="35.0" y="236.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
  <rect x="60" y="214" width="160" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="220" y="214" width="110" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="330" y="214" width="220" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="248" width="50" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="35.0" y="270.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <rect x="60" y="248" width="160" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="220" y="248" width="110" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="330" y="248" width="220" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="10" y="310" font-family="sans-serif" font-size="14" fill="#222222">Tukar? tulis ya atau tidak</text>
</svg>
