<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d">
  <title id="t">Layar LED 5 x 5 dan tabel penekanan tombol</title>
  <desc id="d">Layar LED lima kali lima dengan kolom x 0 sampai 4 dan baris y 0 sampai 4, semua kotak kosong. Di sampingnya tabel penekanan tombol A, A, A, B, A dengan kolom hitung dan Tampil kosong.</desc>
