<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" width="620" height="214" role="img" aria-labelledby="t d">
  <title id="t">Tabel tiga kasus uji</title>
  <desc id="d">Tabel tiga kolom: Kasus uji, Masukan, Hasil diharapkan. Tiga baris bernama Biasa, Kosong, Batas. Dua kolom lain kosong.</desc>
  <rect width="620" height="214" fill="#ffffff"/>
  <text x="10" y="34" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Kasus uji untuk rencanamu (isi sendiri)</text>
  <rect x="10" y="44" width="140" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Kasus uji</text>
  <rect x="150" y="44" width="230" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="265.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Masukan</text>
  <rect x="380" y="44" width="230" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="495.0" y="69.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Hasil diharapkan</text>
  <rect x="10" y="84" width="140" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="109.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Biasa</text>
  <rect x="150" y="84" width="230" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="380" y="84" width="230" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="124" width="140" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="149.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Kosong</text>
  <rect x="150" y="124" width="230" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="380" y="124" width="230" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="164" width="140" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="189.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Batas</text>
