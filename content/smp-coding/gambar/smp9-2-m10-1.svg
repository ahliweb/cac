<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="700" height="130" role="img" aria-labelledby="t d">
  <title id="t">Empat kotak langkah berurutan</title>
  <desc id="d">Empat kotak kosong berurutan dari kiri ke kanan berlabel Langkah 1, Langkah 2, Langkah 3, dan Langkah 4, dihubungkan panah. Di tiap kotak ada garis untuk menulis huruf kartu.</desc>
  <rect width="700" height="130" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="10" y="20" width="130" height="90" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="75" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Langkah 1</text><text x="30" y="90" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">kartu:</text><line x1="80" y1="92" x2="125" y2="92" stroke="#222222" stroke-width="1.5"/><line x1="144" y1="65" x2="186" y2="65" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="20" width="130" height="90" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="255" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Langkah 2</text><text x="210" y="90" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">kartu:</text><line x1="260" y1="92" x2="305" y2="92" stroke="#222222" stroke-width="1.5"/><line x1="324" y1="65" x2="366" y2="65" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="20" width="130" height="90" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="435" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Langkah 3</text><text x="390" y="90" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">kartu:</text><line x1="440" y1="92" x2="485" y2="92" stroke="#222222" stroke-width="1.5"/><line x1="504" y1="65" x2="546" y2="65" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><rect x="550" y="20" width="130" height="90" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="615" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Langkah 4</text><text x="570" y="90" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">kartu:</text><line x1="620" y1="92" x2="665" y2="92" stroke="#222222" stroke-width="1.5"/>
</svg>
