  <text x="60.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Putaran</text>
  <rect x="110" y="40" width="130" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">b sebelum</text>
