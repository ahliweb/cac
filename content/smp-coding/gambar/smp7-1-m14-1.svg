<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 208" width="540" height="208" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran program Y</title>
  <desc id="d">Tabel kosong dengan kolom Putaran, b sebelum, Kondisi b lebih besar dari 5, b sesudah. Tiga baris; baris 1 b sebelum sudah berisi 10.</desc>
  <rect width="540" height="208" fill="#ffffff"/>
