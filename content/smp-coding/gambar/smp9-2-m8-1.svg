<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 350" width="690" height="350" role="img" aria-labelledby="t d">
  <title id="t">Diagram blok sensor dan aturan A</title>
  <desc id="d">Diagram blok dari kiri ke kanan: dua kotak masukan, sensor cahaya dan sensor suara, masing-masing memberi angka 0 sampai 100. Panah putus-putus dari sensor cahaya diberi keterangan tidak dipakai aturan A. Panah dari sensor suara ke kotak proses Aturan A: suara 30 atau lebih berarti dipakai, selain itu kosong, lalu panah ke kotak keluaran dipakai atau kosong. Di bawah tabel kosong untuk kartu K7, K8, dan K9.</desc>
  <rect width="690" height="350" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="10" y="20" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="85" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">sensor cahaya</text><text x="85" y="76" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">angka 0 sampai 100</text><rect x="10" y="100" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="85" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">sensor suara</text><text x="85" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">angka 0 sampai 100</text><line x1="164" y1="40" x2="250" y2="80" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="165" y="24" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">tidak dipakai aturan A</text><line x1="164" y1="120" x2="250" y2="100" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><rect x="254" y="50" width="220" height="100" rx="6" fill="none" stroke="#2a5d9f" stroke-width="2"/><text x="364" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Aturan A</text><text x="364" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">suara 30 atau lebih</text><text x="364" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">berarti dipakai,</text><text x="364" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">selain itu kosong</text><line x1="478" y1="100" x2="540" y2="100" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><rect x="544" y="70" width="130" height="60" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="609" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">dipakai</text><text x="609" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">atau kosong</text><text x="10" y="208" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Hasil aturan A pada kartu baru</text><rect x="10" y="218" width="120" height="30" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="70.0" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Kartu</text><rect x="130" y="218" width="260" height="30" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="260.0" y="238.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Aturan A</text><rect x="10" y="248" width="120" height="30" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="70.0" y="268.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">K7</text><rect x="130" y="248" width="260" height="30" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="10" y="278" width="120" height="30" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="70.0" y="298.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">K8</text><rect x="130" y="278" width="260" height="30" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="10" y="308" width="120" height="30" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="70.0" y="328.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">K9</text><rect x="130" y="308" width="260" height="30" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
</svg>
