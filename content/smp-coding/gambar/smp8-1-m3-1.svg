<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel garis-ke-kanan dan perbandingan program</title>
  <desc id="d">Tabel pertama untuk program P: dua panggilan garis-ke-kanan dengan kolom move dijalankan dan x sesudahnya kosong. Tabel kedua membandingkan program lama dan program rapi pada jumlah baris dan tempat yang diubah, kosong.</desc>
  <rect width="560" height="330" fill="#ffffff"/>
  <text x="10" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Program P: dua panggilan garis-ke-kanan</text>
  <rect x="10" y="36" width="220" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="120.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Panggilan</text>
  <rect x="230" y="36" width="160" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="310.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">move dijalankan</text>
  <rect x="390" y="36" width="140" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="460.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">x sesudahnya</text>
  <rect x="10" y="68" width="220" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="120.0" y="89.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">garis-ke-kanan (3)</text>
  <rect x="230" y="68" width="160" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="390" y="68" width="140" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="100" width="220" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="120.0" y="121.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">garis-ke-kanan (2)</text>
  <rect x="230" y="100" width="160" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="390" y="100" width="140" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="10" y="166" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Sapa-maju: sebelum dan sesudah dirapikan (isi sendiri)</text>
  <rect x="10" y="178" width="310" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="165.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Ukuran</text>
  <rect x="320" y="178" width="100" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="370.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Sebelum</text>
  <rect x="420" y="178" width="100" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="470.0" y="199.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Sesudah</text>
  <rect x="10" y="210" width="310" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="165.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Jumlah baris</text>
  <rect x="320" y="210" width="100" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="420" y="210" width="100" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="242" width="310" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="165.0" y="263.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Tempat mengubah "Halo" menjadi "Hai"</text>
  <rect x="320" y="242" width="100" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="420" y="242" width="100" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="10" y="300" font-family="sans-serif" font-size="14" fill="#222222">Hitung dari program yang kamu tulis di Latihan 2.</text>
</svg>
