  <rect x="230" y="112" width="170" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="400" y="112" width="170" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="146" width="110" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="65.0" y="168.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <rect x="120" y="146" width="110" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
