<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-labelledby="t d">
  <title id="t">Kerangka grafik batang kosong</title>
  <desc id="d">Kerangka grafik batang mendatar yang kosong. Sumbu mendatar berskala 0 sampai 14 dengan langkah 2 dan dimulai dari 0. Empat baris kegiatan dengan kotak kosong untuk nama, dan jalur untuk menggambar batang. Di atas kotak judul dan satuan, di bawah kotak sumber dan kotak kesimpulan beserta batasnya.</desc>
  <rect width="700" height="340" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
