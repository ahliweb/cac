<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" width="540" height="290" role="img" aria-labelledby="t d">
  <title id="t">Jadwal dua hari dan tabel penelusuran ringkas</title>
  <desc id="d">Kamus jadwal berisi Senin dengan Murid-01 dan Murid-02, dan Selasa dengan Murid-03. Di bawahnya tabel penelusuran ringkas dengan kolom putaran, hari, len(jadwal[hari]), dan jumlah; dua baris putaran kosong.</desc>
  <rect width="540" height="290" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<text x="10" y="24" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">jadwal (kamus)</text><rect x="10" y="36" width="100" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="60" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Senin</text><rect x="110" y="36" width="260" height="34" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="122" y="58" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">[Murid-01, Murid-02]</text><rect x="10" y="80" width="100" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="60" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Selasa</text><rect x="110" y="80" width="260" height="34" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="122" y="102" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">[Murid-03]</text><text x="10" y="152" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Penelusuran ringkas(jadwal)</text><rect x="10" y="162" width="90" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="55.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">putaran</text><rect x="100" y="162" width="110" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="155.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">hari</text><rect x="210" y="162" width="200" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="310.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">len(jadwal[hari])</text><rect x="410" y="162" width="120" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="470.0" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">jumlah</text><rect x="10" y="196" width="90" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="55.0" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text><rect x="100" y="196" width="110" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="210" y="196" width="200" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="410" y="196" width="120" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="10" y="230" width="90" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="55.0" y="252.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text><rect x="100" y="230" width="110" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="210" y="230" width="200" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><rect x="410" y="230" width="120" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
