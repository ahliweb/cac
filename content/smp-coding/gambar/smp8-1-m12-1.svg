<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="t d">
  <title id="t">Peta jaringan rumah rekaan dan tabel kejadian</title>
  <desc id="d">Peta: Ponsel A dan Printer C tersambung Wi-Fi, Laptop B tersambung kabel ke router; router tersambung kabel ke ISP, lalu internet, lalu server situs. Perangkat dan router berada dalam kotak jaringan lokal. Di bawahnya tabel kejadian dengan kolom Mencetak dan Membuka situs kosong.</desc>
