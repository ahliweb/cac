  <rect x="594" y="106" width="96" height="56" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="642.0" y="139.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">server situs</text>
