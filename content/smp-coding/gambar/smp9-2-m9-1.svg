<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" role="img" aria-labelledby="t d">
  <title id="t">Garis bilangan suara dengan delapan kartu latih</title>
  <desc id="d">Garis bilangan suara dari 0 sampai 70. Delapan titik kartu latih di suara 5, 8, 12, 22, 38, 46, 55, dan 62. Di bawah tiap titik satu kotak kosong untuk menulis label. Di atas kotak kosong berlabel Batas.</desc>
