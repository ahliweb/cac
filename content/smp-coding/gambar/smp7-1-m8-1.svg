<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Diagram alir if else untuk program P</title>
  <desc id="d">Diagram alir: kotak go to x 70 y 0, lalu belah ketupat kondisi x position lebih besar dari 50. Cabang BENAR menuju say Terlalu kanan. Cabang SALAH menuju say Aman. Ada kotak isian kosong untuk nilai x dan untuk ucapan yang muncul.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect x="200" y="10" width="240" height="40" rx="8" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="320" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">go to x: (70) y: (0)</text>
  <line x1="320" y1="50" x2="320" y2="78" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="320,80 450,135 320,190 190,135" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="320" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">x position</text>
  <text x="320" y="149" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">&gt; 50 ?</text>
  <text x="130" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">nilai x:</text>
  <rect x="95" y="68" width="70" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="190" y1="135" x2="110" y2="135" stroke="#222222" stroke-width="2"/>
  <line x1="110" y1="135" x2="110" y2="198" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">BENAR (then)</text>
  <line x1="450" y1="135" x2="530" y2="135" stroke="#222222" stroke-width="2"/>
  <line x1="530" y1="135" x2="530" y2="198" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="490" y="126" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">SALAH (else)</text>
  <rect x="20" y="200" width="180" height="40" rx="8" fill="#f2f2f2" stroke="#1b7a3d" stroke-width="2"/>
  <text x="110" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">say [Terlalu kanan]</text>
  <rect x="440" y="200" width="180" height="40" rx="8" fill="#f2f2f2" stroke="#b3261e" stroke-width="2"/>
  <text x="530" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">say [Aman]</text>
  <text x="320" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Pemeriksaan pertama: cabang yang dijalankan ditandai di sini</text>
  <rect x="200" y="288" width="240" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
