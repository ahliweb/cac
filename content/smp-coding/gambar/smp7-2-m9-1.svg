  <line x1="454" y1="214" x2="454" y2="340" stroke="#222222" stroke-width="1"/>
  <text x="454" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <line x1="542" y1="214" x2="542" y2="340" stroke="#222222" stroke-width="1"/>
  <text x="542" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">4</text>
  <text x="366" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">detik</text>
  <text x="10" y="244" font-family="sans-serif" font-size="14" fill="#222222">Pemain: Mulai</text>
  <rect x="190" y="222" width="352" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="10" y="284" font-family="sans-serif" font-size="14" fill="#222222">Pemain: Selesai</text>
  <rect x="190" y="262" width="352" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="10" y="324" font-family="sans-serif" font-size="14" fill="#222222">Penjaga: Aku jalan</text>
  <rect x="190" y="302" width="352" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
