  <text x="540.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Lulus?</text>
  <rect x="10" y="74" width="80" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
