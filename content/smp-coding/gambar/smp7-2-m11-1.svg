<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 208" width="600" height="208" role="img" aria-labelledby="t d">
  <title id="t">Tabel kasus uji untuk program Q</title>
  <desc id="d">Tabel lima kolom: Kasus, skor, Hasil diharapkan, Hasil sebenarnya, Lulus. Tiga baris: skor 5 diharapkan Belum, skor 10 diharapkan Menang, skor 15 diharapkan Menang. Kolom Hasil sebenarnya dan Lulus kosong.</desc>
  <rect width="600" height="208" fill="#ffffff"/>
  <text x="10" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Kasus uji program Q (isi sendiri)</text>
  <rect x="10" y="40" width="80" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="50.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Kasus</text>
  <rect x="90" y="40" width="80" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="130.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">skor</text>
