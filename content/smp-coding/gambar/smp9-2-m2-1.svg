<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="t d">
  <title id="t">Diagram alir pencari petugas piket</title>
  <desc id="d">Diagram alir dari atas ke bawah: kotak BACA hari, belah ketupat hari ada di jadwal. Cabang YA ke kotak TAMPILKAN petugas hari itu; cabang TIDAK ke kotak TAMPILKAN Tidak ada jadwal untuk dan hari. Di bawah dua kotak kosong berlabel Masukan Selasa dan Masukan Kamis.</desc>
  <rect width="640" height="410" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="230" y="10" width="180" height="40" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/><text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">BACA hari</text><line x1="320" y1="50" x2="320" y2="98" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><polygon points="320,99 460,145 320,191 180,145" fill="none" stroke="#222222" stroke-width="1.5"/><text x="320" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">hari ada</text><text x="320" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">di jadwal?</text><polyline points="180,145 120,145 120,236" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><text x="170" y="136" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">YA</text><polyline points="460,145 515,145 515,236" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><text x="470" y="136" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">TIDAK</text><rect x="10" y="240" width="220" height="60" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/><text x="120" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">TAMPILKAN petugas</text><text x="120" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">hari itu</text><rect x="400" y="240" width="230" height="60" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/><text x="515" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">TAMPILKAN &quot;Tidak ada</text><text x="515" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">jadwal untuk&quot; dan hari</text><text x="10" y="340" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Masukan Selasa:</text><rect x="170" y="320" width="220" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="10" y="386" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Masukan Kamis:</text><rect x="170" y="366" width="220" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
