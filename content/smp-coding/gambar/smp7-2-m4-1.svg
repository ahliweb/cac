<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran daftar dan penjumlahan</title>
  <desc id="d">Dua tabel kosong. Tabel pertama: isi daftar nilai setelah tiap blok program Z. Tabel kedua: putaran, i sebelum, item i, dan jumlah untuk daftar buku berisi 5, 6, 5.</desc>
  <rect width="560" height="400" fill="#ffffff"/>
  <text x="10" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Program Z: isi daftar nilai sesudah tiap blok</text>
  <rect x="10" y="36" width="330" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="56.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Blok</text>
  <rect x="340" y="36" width="200" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="440.0" y="56.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Isi nilai</text>
  <rect x="10" y="66" width="330" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="86.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">delete all of [nilai]</text>
  <rect x="340" y="66" width="200" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="96" width="330" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="116.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">add [30] to [nilai]</text>
  <rect x="340" y="96" width="200" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="126" width="330" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="146.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">add [10] to [nilai]</text>
  <rect x="340" y="126" width="200" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="156" width="330" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="176.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">add [20] to [nilai]</text>
  <rect x="340" y="156" width="200" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="186" width="330" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="206.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">replace item (2) of [nilai] with [15]</text>
  <rect x="340" y="186" width="200" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="10" y="262" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Jumlah isi daftar buku (5, 6, 5) dengan penunjuk i</text>
  <rect x="10" y="274" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Putaran</text>
  <rect x="110" y="274" width="120" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="170.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">i sebelum</text>
  <rect x="230" y="274" width="120" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="290.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">item i</text>
  <rect x="350" y="274" width="120" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="410.0" y="294.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">jumlah</text>
  <rect x="10" y="304" width="100" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="324.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">1</text>
  <rect x="110" y="304" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="230" y="304" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="350" y="304" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="334" width="100" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="354.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">2</text>
  <rect x="110" y="334" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="230" y="334" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="350" y="334" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="364" width="100" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="384.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <rect x="110" y="364" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="230" y="364" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="350" y="364" width="120" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
