<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel rencana kerja game</title>
  <desc id="d">Tabel dua kolom: Bagian rencana dan Isimu. Enam baris: Tujuan satu kalimat, Bagian kecil (3 sampai 4), Blok yang dipakai, Tiga kasus uji, Pembagian kerja, Bahan orang lain dan izinnya. Kolom Isimu kosong.</desc>
  <rect width="700" height="400" fill="#ffffff"/>
  <text x="10" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Rencana kerja game-ku (isi sendiri)</text>
  <rect x="10" y="40" width="260" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Bagian rencana</text>
  <rect x="270" y="40" width="420" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="480.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Isimu</text>
  <rect x="10" y="74" width="260" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="105.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Tujuan satu kalimat</text>
  <rect x="270" y="74" width="420" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="126" width="260" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="157.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Bagian kecil (3 sampai 4)</text>
  <rect x="270" y="126" width="420" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="178" width="260" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="209.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Blok yang dipakai</text>
  <rect x="270" y="178" width="420" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="230" width="260" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="261.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Tiga kasus uji</text>
  <rect x="270" y="230" width="420" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="282" width="260" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="313.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Pembagian kerja</text>
  <rect x="270" y="282" width="420" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="334" width="260" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="140.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Bahan orang lain dan izinnya</text>
  <rect x="270" y="334" width="420" height="52" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
