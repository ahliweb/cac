<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" width="560" height="392" role="img" aria-labelledby="t d">
  <title id="t">Tujuh kartu terurut dan tabel pilih yang terkecil</title>
  <desc id="d">Tujuh kartu terurut 1, 3, 5, 7, 9, 11, 13 dengan nomor posisi 1 sampai 7, dan satu tabel pilih yang terkecil untuk kartu 4, 1, 3, 2 dengan baris pertama terisi dan dua baris kosong.</desc>
