<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 330" width="610" height="330" role="img" aria-labelledby="t d">
  <title id="t">Dua kartu data rekaan dengan kotak centang kosong</title>
  <desc id="d">Kartu A: curah hujan bulanan Kota Contoh 2025, penerbit Dinas Contoh, lisensi CC BY, tanggal 2026-01. Kartu B: daftar peserta lomba, penerbit tidak tertulis, lisensi tidak ada, isi nama, alamat rumah, nomor telepon, tanggal tidak tertulis. Di bawah tiap kartu tiga kotak centang kosong: ada penerbit, ada lisensi, ada data pribadi.</desc>
  <rect width="610" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="10" y="10" width="290" height="210" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/><text x="155" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Kartu A</text><text x="24" y="62" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Curah hujan bulanan</text><text x="24" y="82" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Kota Contoh, 2025</text><text x="24" y="102" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Penerbit: Dinas Contoh</text><text x="24" y="122" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">(situs resmi)</text><text x="24" y="142" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Lisensi: CC BY</text><text x="24" y="162" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Isi: 12 baris, bulan dan</text><text x="24" y="182" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">curah hujan</text><text x="24" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Tanggal: 2026-01</text><rect x="24" y="234" width="20" height="20" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="54" y="250" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">ada penerbit</text><rect x="24" y="264" width="20" height="20" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="54" y="280" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">ada lisensi</text><rect x="24" y="294" width="20" height="20" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="54" y="310" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">ada data pribadi</text><rect x="310" y="10" width="290" height="210" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/><text x="455" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Kartu B</text><text x="324" y="62" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Daftar peserta lomba</text><text x="324" y="82" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222"></text><text x="324" y="102" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Penerbit: tidak tertulis</text><text x="324" y="122" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">(ditemukan di forum)</text><text x="324" y="142" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Lisensi: tidak ada</text><text x="324" y="162" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Isi: nama, alamat rumah,</text><text x="324" y="182" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">nomor telepon</text><text x="324" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Tanggal: tidak tertulis</text><rect x="324" y="234" width="20" height="20" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="354" y="250" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">ada penerbit</text><rect x="324" y="264" width="20" height="20" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="354" y="280" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">ada lisensi</text><rect x="324" y="294" width="20" height="20" rx="0" fill="none" stroke="#222222" stroke-width="1.5"/><text x="354" y="310" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">ada data pribadi</text>
</svg>
