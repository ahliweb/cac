<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 436" width="620" height="436" role="img" aria-labelledby="t d">
  <title id="t">Bidang kura-kura dengan kotak 50 satuan</title>
  <desc id="d">Bidang koordinat dengan titik (0, 0) di kiri atas, sumbu x ke kanan sampai 150 dan sumbu y dari 50 ke atas sampai minus 150 ke bawah, garis bantu tiap 50 satuan. Kura-kura mulai di (0, 0) menghadap kanan. Bidang dibiarkan kosong untuk menggambar jalur.</desc>
  <rect width="620" height="436" fill="#ffffff"/>
  <text x="10" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Bidang kura-kura (tiap garis putus-putus = 50 satuan)</text>
  <line x1="70.0" y1="40" x2="70.0" y2="400.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="70.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">0</text>
  <line x1="160.0" y1="40" x2="160.0" y2="400.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="160.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">50</text>
  <line x1="250.0" y1="40" x2="250.0" y2="400.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="250.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">100</text>
  <line x1="340.0" y1="40" x2="340.0" y2="400.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="340.0" y="420.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">150</text>
  <line x1="70" y1="40.0" x2="340.0" y2="40.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="62" y="45.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">50</text>
  <line x1="70" y1="130.0" x2="340.0" y2="130.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="62" y="135.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">0</text>
  <line x1="70" y1="220.0" x2="340.0" y2="220.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="62" y="225.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">-50</text>
  <line x1="70" y1="310.0" x2="340.0" y2="310.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="62" y="315.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">-100</text>
  <line x1="70" y1="400.0" x2="340.0" y2="400.0" stroke="#888888" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="62" y="405.0" text-anchor="end" font-family="sans-serif" font-size="14" fill="#222222">-150</text>
  <line x1="70" y1="130.0" x2="360.0" y2="130.0" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="40" x2="70" y2="400.0" stroke="#222222" stroke-width="2"/>
  <polygon points="82,130.0 68,123.0 68,137.0" fill="#2a5d9f"/>
  <circle cx="70" cy="130.0" r="3" fill="#222222"/>
  <text x="400" y="80" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Mulai di titik (0, 0)</text>
  <text x="400" y="102" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Segitiga biru = kura-kura,</text>
  <text x="400" y="122" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">menghadap kanan (arah 0).</text>
  <text x="400" y="160" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">Gambar jalur program P:</text>
  <text x="400" y="180" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">titik tiap belokan diberi</text>
  <text x="400" y="200" text-anchor="start" font-family="sans-serif" font-size="14" fill="#222222">nomor 1 sampai 4.</text>
</svg>
