<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 248" width="610" height="248" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran program T per putaran</title>
  <desc id="d">Tabel kosong dengan kolom Putaran ke-, x setelah move, y setelah move, Arah setelah turn. Empat baris bernomor 1 sampai 4.</desc>
  <rect width="610" height="248" fill="#ffffff"/>
  <text x="10" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Penelusuran program T (isi sendiri)</text>
  <rect x="10" y="40" width="120" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="70.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Putaran ke-</text>
  <rect x="130" y="40" width="150" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="205.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">x setelah move</text>
  <rect x="280" y="40" width="150" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="355.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">y setelah move</text>
  <rect x="430" y="40" width="170" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="515.0" y="62.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Arah setelah turn</text>
