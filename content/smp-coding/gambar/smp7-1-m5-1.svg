  <rect x="430" y="74" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="114" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
