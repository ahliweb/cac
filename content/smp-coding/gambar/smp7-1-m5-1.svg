  <rect x="430" y="114" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="154" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="70.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">3</text>
