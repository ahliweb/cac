<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">Diagram alir cetak_hasil dengan hasil kosong</title>
  <desc id="d">Diagram alir cetak_hasil: belah ketupat len(petugas) sama dengan 0. Cabang YA ke kotak tampil Tidak ada jadwal untuk dan hari; cabang TIDAK ke kotak tampil Piket, hari, dan daftar petugas. Di bawah tiga kotak kosong untuk masukan Selasa, Kamis, dan senin huruf kecil.</desc>
  <rect width="640" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<polygon points="320,14 470,60 320,106 170,60" fill="none" stroke="#222222" stroke-width="1.5"/><text x="320" y="57" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">len(petugas)</text><text x="320" y="75" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">sama dengan 0?</text><polyline points="170,60 150,60 150,146" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><text x="160" y="52" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">YA</text><polyline points="470,60 490,60 490,146" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/><text x="480" y="52" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">TIDAK</text><rect x="20" y="150" width="260" height="60" rx="6" fill="none" stroke="#2a5d9f" stroke-width="2"/><text x="150" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">tampil: Tidak ada</text><text x="150" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">jadwal untuk dan hari</text><rect x="360" y="150" width="260" height="60" rx="6" fill="none" stroke="#2a5d9f" stroke-width="2"/><text x="490" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">tampil: Piket, hari,</text><text x="490" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">dan daftar petugas</text><text x="10" y="270" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Masukan Selasa:</text><rect x="260" y="250" width="360" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="10" y="316" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Masukan Kamis:</text><rect x="260" y="296" width="360" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="10" y="362" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Masukan senin (huruf kecil):</text><rect x="260" y="342" width="360" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
