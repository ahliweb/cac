<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="540" height="190" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran variabel a dan b</title>
  <desc id="d">Tabel kosong tiga kolom: Sesudah baris, a, b, dengan tiga baris bernomor 1 sampai 3.</desc>
  <rect width="540" height="190" fill="#ffffff"/>
