  <rect x="380" y="44" width="150" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="455.0" y="66.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">b</text>
  <rect x="10" y="78" width="220" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="120.0" y="100.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">baris 1</text>
  <rect x="230" y="78" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="380" y="78" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="112" width="220" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="120.0" y="134.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">baris 2</text>
  <rect x="230" y="112" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="380" y="112" width="150" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="10" y="146" width="220" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
