  <rect x="10" y="44" width="220" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="120.0" y="66.0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Sesudah baris</text>
  <rect x="230" y="44" width="150" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
