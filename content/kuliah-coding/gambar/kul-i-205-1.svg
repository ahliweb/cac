  <rect x="465" y="230" width="115" height="30" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="80" y="270" width="196" height="30" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="88" y="290" font-family="sans-serif" font-size="14" fill="#222222">label for="cari": Cari</text>
  <line x1="65" y1="285" x2="80" y2="285" stroke="#222222" stroke-width="2"/>
