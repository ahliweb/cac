  <rect x="465" y="310" width="115" height="30" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="80" y="350" width="254" height="30" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="88" y="370" font-family="sans-serif" font-size="14" fill="#222222">input id="email" type="email"</text>
  <line x1="65" y1="365" x2="80" y2="365" stroke="#222222" stroke-width="2"/>
  <line x1="65" y1="340" x2="65" y2="365" stroke="#222222" stroke-width="2"/>
  <rect x="465" y="350" width="115" height="30" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
