  <rect x="465" y="150" width="115" height="30" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="80" y="190" width="164" height="30" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="88" y="210" font-family="sans-serif" font-size="14" fill="#222222">img src="logo.png"</text>
  <line x1="65" y1="205" x2="80" y2="205" stroke="#222222" stroke-width="2"/>
  <line x1="65" y1="180" x2="65" y2="205" stroke="#222222" stroke-width="2"/>
  <rect x="465" y="190" width="115" height="30" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="80" y="230" width="377" height="30" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="88" y="250" font-family="sans-serif" font-size="14" fill="#222222">img src="promo.png" alt="Diskon akhir pekan"</text>
  <line x1="65" y1="245" x2="80" y2="245" stroke="#222222" stroke-width="2"/>
