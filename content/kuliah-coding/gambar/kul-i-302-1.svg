<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-labelledby="t d">
  <title id="t">Tiga salinan data dan tabel kuorum W lawan R yang kosong</title>
  <desc id="d">Tiga salinan data bernomor 1, 2, 3 dengan N sama dengan 3. Tulisan baru mulai dari salinan 1 ke arah kanan sebanyak W salinan; pembaca menanyakan mulai dari salinan 3 ke arah kiri sebanyak R salinan. Di bawahnya tabel tiga baris W dari 1 sampai 3 dan tiga kolom R dari 1 sampai 3, semua sel kosong untuk menulis baru atau awal.</desc>
  <rect width="600" height="320" fill="#ffffff"/>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2.5">
    <rect x="130" y="20" width="100" height="46"/>
    <rect x="250" y="20" width="100" height="46"/>
    <rect x="370" y="20" width="100" height="46"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="180" y="49">salinan 1</text>
    <text x="300" y="49">salinan 2</text>
    <text x="420" y="49">salinan 3</text>
  </g>
  <line x1="130" y1="92" x2="330" y2="92" stroke="#1b7a3d" stroke-width="3"/>
  <polygon points="330,85 342,92 330,99" fill="#1b7a3d"/>
  <text x="350" y="97" font-family="sans-serif" font-size="14" fill="#222222">tulisan baru ke W salinan</text>
  <line x1="470" y1="120" x2="270" y2="120" stroke="#b3261e" stroke-width="3"/>
  <polygon points="270,113 258,120 270,127" fill="#b3261e"/>
  <text x="130" y="145" font-family="sans-serif" font-size="14" fill="#222222">pembaca: dari salinan 3, menanyakan R salinan (garis merah, ke kiri)</text>
  <g fill="#f2f2f2" stroke="#222222" stroke-width="2">
    <rect x="100" y="165" width="100" height="30"/>
    <rect x="200" y="165" width="100" height="30"/>
    <rect x="300" y="165" width="100" height="30"/>
    <rect x="400" y="165" width="100" height="30"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="150" y="186">N = 3</text>
    <text x="250" y="186">R = 1</text>
    <text x="350" y="186">R = 2</text>
    <text x="450" y="186">R = 3</text>
  </g>
  <g fill="#f2f2f2" stroke="#222222" stroke-width="2">
    <rect x="100" y="195" width="100" height="34"/>
    <rect x="100" y="229" width="100" height="34"/>
    <rect x="100" y="263" width="100" height="34"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="150" y="217">W = 1</text>
    <text x="150" y="251">W = 2</text>
    <text x="150" y="285">W = 3</text>
  </g>
  <g fill="#ffffff" stroke="#222222" stroke-width="2">
    <rect x="200" y="195" width="100" height="34"/><rect x="300" y="195" width="100" height="34"/><rect x="400" y="195" width="100" height="34"/>
    <rect x="200" y="229" width="100" height="34"/><rect x="300" y="229" width="100" height="34"/><rect x="400" y="229" width="100" height="34"/>
    <rect x="200" y="263" width="100" height="34"/><rect x="300" y="263" width="100" height="34"/><rect x="400" y="263" width="100" height="34"/>
  </g>
</svg>
