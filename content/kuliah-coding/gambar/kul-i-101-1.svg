<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-labelledby="t d">
  <title id="t">Larik a dengan indeks dan tabel penelusuran kosong</title>
  <desc id="d">Larik a berisi lima elemen berindeks 0 sampai 4 dengan nilai 4, 7, 1, 9, 3. Di bawahnya tabel kosong berkolom i, posisi, dan a[i] lebih besar dari a[posisi]? dengan empat baris untuk diisi pelajar.</desc>
  <rect width="600" height="320" fill="#ffffff"/>
  <text x="30" y="75" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">a</text>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="95" y="36">indeks 0</text>
    <text x="175" y="36">1</text>
    <text x="255" y="36">2</text>
    <text x="335" y="36">3</text>
    <text x="415" y="36">4</text>
    <text x="95" y="82" font-size="18">4</text>
    <text x="175" y="82" font-size="18">7</text>
    <text x="255" y="82" font-size="18">1</text>
    <text x="335" y="82" font-size="18">9</text>
    <text x="415" y="82" font-size="18">3</text>
  </g>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2">
    <rect x="55" y="45" width="80" height="48" fill="none"/>
    <rect x="135" y="45" width="80" height="48" fill="none"/>
    <rect x="215" y="45" width="80" height="48" fill="none"/>
    <rect x="295" y="45" width="80" height="48" fill="none"/>
    <rect x="375" y="45" width="80" height="48" fill="none"/>
  </g>
  <text x="60" y="138" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Tabel penelusuran (isi sendiri)</text>
  <g fill="#f2f2f2" stroke="#222222" stroke-width="2">
    <rect x="60" y="150" width="100" height="32"/>
    <rect x="160" y="150" width="120" height="32"/>
    <rect x="280" y="150" width="240" height="32"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="110" y="172">i</text>
    <text x="220" y="172">posisi</text>
    <text x="400" y="172">a[i] &gt; a[posisi]?</text>
  </g>
  <g fill="#ffffff" stroke="#222222" stroke-width="2">
    <rect x="60" y="182" width="100" height="32"/><rect x="160" y="182" width="120" height="32"/><rect x="280" y="182" width="240" height="32"/>
    <rect x="60" y="214" width="100" height="32"/><rect x="160" y="214" width="120" height="32"/><rect x="280" y="214" width="240" height="32"/>
    <rect x="60" y="246" width="100" height="32"/><rect x="160" y="246" width="120" height="32"/><rect x="280" y="246" width="240" height="32"/>
    <rect x="60" y="278" width="100" height="32"/><rect x="160" y="278" width="120" height="32"/><rect x="280" y="278" width="240" height="32"/>
  </g>
</svg>
