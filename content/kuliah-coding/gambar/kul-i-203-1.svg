  <rect x="250" y="112" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="290.0" y="135.0" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">4096</text>
  <rect x="330" y="112" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="410" y="112" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="490" y="112" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="250" y="148" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="290.0" y="171.0" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">8200</text>
  <rect x="330" y="148" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="410" y="148" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="490" y="148" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="250" y="184" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="290.0" y="207.0" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">20000</text>
  <rect x="330" y="184" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="410" y="184" width="80" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="490" y="184" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="2"/>
</svg>
