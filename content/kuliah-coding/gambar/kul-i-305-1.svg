<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel catatan tanpa nama dengan kolom isian ukuran kelompok</title>
  <desc id="d">Tujuh baris catatan fiktif berisi prodi dan angkatan, tanpa nama: Biologi 2023 tiga kali, Biologi 2024, Hukum 2023 dua kali, Fisika 2022. Dua kolom di kanan dikosongkan untuk ukuran kelompok dan penanda tunggal.</desc>
  <rect width="600" height="330" fill="#ffffff"/>
  <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Tabel peminjaman buku (fiktif, tanpa nama)</text>
  <rect x="20" y="40" width="560" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="30" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">No</text>
  <text x="80" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Prodi</text>
  <text x="200" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Angkatan</text>
  <text x="300" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Ukuran kelompok</text>
  <text x="460" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Tunggal? (isi)</text>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="20" y="74" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="96">1</text><text x="80" y="96">Biologi</text><text x="200" y="96">2023</text>
    <rect x="20" y="108" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="130">2</text><text x="80" y="130">Biologi</text><text x="200" y="130">2023</text>
    <rect x="20" y="142" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="164">3</text><text x="80" y="164">Biologi</text><text x="200" y="164">2023</text>
    <rect x="20" y="176" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="198">4</text><text x="80" y="198">Biologi</text><text x="200" y="198">2024</text>
    <rect x="20" y="210" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="232">5</text><text x="80" y="232">Hukum</text><text x="200" y="232">2023</text>
    <rect x="20" y="244" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="266">6</text><text x="80" y="266">Hukum</text><text x="200" y="266">2023</text>
    <rect x="20" y="278" width="560" height="34" fill="#ffffff" stroke="#222222"/>
    <text x="30" y="300">7</text><text x="80" y="300">Fisika</text><text x="200" y="300">2022</text>
  </g>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5" stroke-dasharray="5 3">
    <rect x="300" y="79" width="110" height="24"/><rect x="460" y="79" width="100" height="24"/>
    <rect x="300" y="113" width="110" height="24"/><rect x="460" y="113" width="100" height="24"/>
    <rect x="300" y="147" width="110" height="24"/><rect x="460" y="147" width="100" height="24"/>
    <rect x="300" y="181" width="110" height="24"/><rect x="460" y="181" width="100" height="24"/>
    <rect x="300" y="215" width="110" height="24"/><rect x="460" y="215" width="100" height="24"/>
    <rect x="300" y="249" width="110" height="24"/><rect x="460" y="249" width="100" height="24"/>
    <rect x="300" y="283" width="110" height="24"/><rect x="460" y="283" width="100" height="24"/>
