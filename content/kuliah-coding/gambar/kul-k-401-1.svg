  <text x="491.0" y="216" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">B AC</text>
  <rect x="590" y="176" width="50" height="28" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="650" y="176" width="50" height="28" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="20" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Tim Gama</text>
  <line x1="100" y1="290" x2="560" y2="290" stroke="#222222" stroke-width="2"/>
