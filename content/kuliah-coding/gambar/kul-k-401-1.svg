<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="t d">
  <title id="t">Garis waktu kiriman tiga tim dengan kotak isian jumlah soal dan total waktu</title>
  <desc id="d">Garis waktu 0 sampai 100 menit. Tim Alfa: soal A diterima menit 12; soal B WA menit 35, CE menit 50, diterima menit 58. Tim Beta: soal A WA menit 20, diterima menit 31; soal B TLE menit 70, diterima menit 85. Tim Gama: soal C WA menit 90. Di kanan tiap tim ada kotak kosong untuk jumlah soal dan total waktu.</desc>
