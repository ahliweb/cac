  <rect x="650" y="276" width="50" height="28" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="20" y="364" font-family="sans-serif" font-size="14" fill="#222222">lingkaran = AC, kotak = WA atau TLE, segitiga = CE; kotak putus-putus diisi sendiri</text>
</svg>
