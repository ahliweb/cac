<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Graf enam simpul dengan kotak jarak BFS kosong</title>
  <desc id="d">Graf tak berarah dengan simpul 0 sampai 5. Sisi: 0-1, 0-2, 1-3, 2-3, 3-4. Simpul 5 tidak punya sisi. Di bawah graf ada satu baris kotak kosong untuk jarak tiap simpul dari simpul 0 dan satu kotak kosong untuk urutan kunjungan BFS.</desc>
  <rect width="600" height="340" fill="#ffffff"/>
  <g stroke="#222222" stroke-width="2.5">
    <line x1="100" y1="100" x2="230" y2="45"/>
    <line x1="100" y1="100" x2="230" y2="155"/>
    <line x1="230" y1="45" x2="360" y2="100"/>
    <line x1="230" y1="155" x2="360" y2="100"/>
    <line x1="360" y1="100" x2="490" y2="100"/>
  </g>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2.5">
    <circle cx="100" cy="100" r="24"/>
    <circle cx="230" cy="45" r="24"/>
    <circle cx="230" cy="155" r="24"/>
    <circle cx="360" cy="100" r="24"/>
    <circle cx="490" cy="100" r="24"/>
    <circle cx="490" cy="190" r="24"/>
  </g>
  <g font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="100" y="107">0</text>
    <text x="230" y="52">1</text>
    <text x="230" y="162">2</text>
    <text x="360" y="107">3</text>
    <text x="490" y="107">4</text>
    <text x="490" y="197">5</text>
  </g>
  <text x="30" y="226" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Jarak dari simpul 0 (isi sendiri)</text>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="85" y="250">simpul 0</text>
    <text x="175" y="250">simpul 1</text>
    <text x="265" y="250">simpul 2</text>
    <text x="355" y="250">simpul 3</text>
    <text x="445" y="250">simpul 4</text>
    <text x="535" y="250">simpul 5</text>
  </g>
  <g fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4">
    <rect x="50" y="257" width="70" height="36"/>
    <rect x="140" y="257" width="70" height="36"/>
    <rect x="230" y="257" width="70" height="36"/>
    <rect x="320" y="257" width="70" height="36"/>
    <rect x="410" y="257" width="70" height="36"/>
    <rect x="500" y="257" width="70" height="36"/>
  </g>
  <text x="30" y="318" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Urutan kunjungan BFS:</text>
  <rect x="220" y="298" width="350" height="34" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
