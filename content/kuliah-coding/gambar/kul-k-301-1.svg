<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d">
  <title id="t">Graf berbobot lima simpul dengan kotak isian jarak dari simpul 0</title>
  <desc id="d">Graf tak berarah dengan simpul 0 sampai 4. Sisi dan bobot: 0-1 empat, 0-2 satu, 2-1 dua, 1-3 satu, 2-3 lima, 3-4 tiga. Di dekat tiap simpul ada kotak kosong untuk jarak terpendek dari simpul 0.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <line x1="70" y1="160" x2="230" y2="70" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="160" x2="230" y2="250" stroke="#222222" stroke-width="2"/>
  <line x1="230" y1="250" x2="230" y2="70" stroke="#222222" stroke-width="2"/>
  <line x1="230" y1="70" x2="400" y2="160" stroke="#222222" stroke-width="2"/>
  <line x1="230" y1="250" x2="400" y2="160" stroke="#222222" stroke-width="2"/>
  <line x1="400" y1="160" x2="550" y2="160" stroke="#222222" stroke-width="2"/>
  <text x="133" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">4</text>
  <text x="133" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">1</text>
  <text x="246" y="166" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">2</text>
  <text x="330" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">1</text>
  <text x="330" y="228" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">5</text>
  <text x="475" y="148" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">3</text>
  <circle cx="70" cy="160" r="22" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="70" y="166" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">0</text>
  <circle cx="230" cy="70" r="22" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="230" y="76" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">1</text>
  <circle cx="230" cy="250" r="22" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="230" y="256" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <circle cx="400" cy="160" r="22" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="400" y="166" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <circle cx="550" cy="160" r="22" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="550" y="166" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <rect x="30" y="98" width="80" height="26" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="190" y="12" width="80" height="26" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="190" y="282" width="80" height="26" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="360" y="98" width="80" height="26" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="510" y="100" width="80" height="26" fill="#ffffff" stroke="#1b7a3d" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="20" y="304" font-family="sans-serif" font-size="14" fill="#222222">angka biru = bobot sisi; kotak putus-putus = jarak terpendek dari simpul 0 (isi sendiri)</text>
</svg>
