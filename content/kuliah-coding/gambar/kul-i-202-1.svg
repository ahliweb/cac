  <text x="122" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e">1</text>
  <text x="154" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="end">N</text>
  <line x1="266" y1="90" x2="306" y2="90" stroke="#222222" stroke-width="2.5"/>
  <text x="270" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e">1</text>
  <text x="302" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="end">N</text>
  <line x1="414" y1="90" x2="454" y2="90" stroke="#222222" stroke-width="2.5"/>
  <text x="418" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e">N</text>
  <text x="450" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="end">1</text>
  <line x1="562" y1="90" x2="602" y2="90" stroke="#222222" stroke-width="2.5"/>
  <text x="566" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e">N</text>
  <text x="598" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="end">1</text>
  <text x="10" y="190" font-family="sans-serif" font-size="14" fill="#222222">KU = kunci utama, KA = kunci asing. Tulis nama kolomnya di kotak putus-putus.</text>
  <text x="10" y="214" font-family="sans-serif" font-size="14" fill="#222222">item_pesanan adalah tabel penghubung pesanan dan buku (atribut jumlah).</text>
  <text x="10" y="238" font-family="sans-serif" font-size="14" fill="#222222">1 = satu, N = banyak.</text>
</svg>
