<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-labelledby="t d">
  <title id="t">Garis skor 0 sampai 100 dengan batas huruf dan kotak uji kosong</title>
  <desc id="d">Garis skor dari 0 sampai 100 dengan batas 55, 70, dan 85. Pita D untuk skor di bawah 55, C dari 55, B dari 70, A dari 85. Di bawah tiap batas ada dua kotak kosong: skor uji tepat di batas dan skor uji satu di bawahnya.</desc>
  <rect width="600" height="250" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="183" y="62">D</text>
    <text x="365" y="62">C</text>
    <text x="443" y="62">B</text>
    <text x="521" y="62">A</text>
  </g>
  <g stroke="#2a5d9f" stroke-width="2.5" fill="none">
    <rect x="40" y="38" width="286" height="34"/>
    <rect x="326" y="38" width="78" height="34"/>
    <rect x="404" y="38" width="78" height="34"/>
    <rect x="482" y="38" width="78" height="34"/>
  </g>
  <line x1="40" y1="100" x2="560" y2="100" stroke="#222222" stroke-width="3"/>
  <g stroke="#222222" stroke-width="3">
    <line x1="40" y1="90" x2="40" y2="110"/>
    <line x1="326" y1="90" x2="326" y2="110"/>
    <line x1="404" y1="90" x2="404" y2="110"/>
    <line x1="482" y1="90" x2="482" y2="110"/>
    <line x1="560" y1="90" x2="560" y2="110"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="40" y="132">0</text>
    <text x="326" y="132">55</text>
    <text x="404" y="132">70</text>
    <text x="482" y="132">85</text>
    <text x="560" y="132">100</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="10" y="172">tepat di batas</text>
    <text x="10" y="222">satu di bawahnya</text>
  </g>
  <g fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4">
    <rect x="296" y="150" width="60" height="32"/>
    <rect x="374" y="150" width="60" height="32"/>
    <rect x="452" y="150" width="60" height="32"/>
    <rect x="296" y="200" width="60" height="32"/>
    <rect x="374" y="200" width="60" height="32"/>
    <rect x="452" y="200" width="60" height="32"/>
  </g>
</svg>
