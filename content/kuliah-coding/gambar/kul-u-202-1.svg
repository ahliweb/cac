<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran kosong untuk fungsi f dengan n sama dengan 5</title>
  <desc id="d">Tabel dengan kolom i, apakah i habis dibagi 2, dan total sesudah putaran. Lima baris untuk i dari 1 sampai 5; kolom i sudah terisi, dua kolom lain kosong. Di atas tabel tertulis bahwa total awal 0.</desc>
  <rect width="600" height="330" fill="#ffffff"/>
  <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Telusuri f(5) tanpa AI: total = 0, lalu for i in range(1, n + 1)</text>
  <rect x="40" y="50" width="80" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="76" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">i</text>
  <rect x="120" y="50" width="200" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="220.0" y="76" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">i % 2 == 0 ?</text>
  <rect x="320" y="50" width="220" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="430.0" y="76" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">total sesudah putaran</text>
  <rect x="40" y="90" width="80" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80" y="119" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">1</text>
  <rect x="120" y="90" width="200" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="320" y="90" width="220" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="40" y="134" width="80" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80" y="163" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">2</text>
  <rect x="120" y="134" width="200" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="320" y="134" width="220" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="40" y="178" width="80" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80" y="207" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">3</text>
  <rect x="120" y="178" width="200" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="320" y="178" width="220" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="40" y="222" width="80" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80" y="251" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">4</text>
  <rect x="120" y="222" width="200" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="320" y="222" width="220" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="40" y="266" width="80" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80" y="295" font-family="sans-serif" font-size="18" fill="#222222" text-anchor="middle">5</text>
  <rect x="120" y="266" width="200" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="320" y="266" width="220" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="320" font-family="sans-serif" font-size="14" fill="#222222">sel putus-putus = isi sendiri; tulis ya atau tidak di kolom tengah</text>
</svg>
