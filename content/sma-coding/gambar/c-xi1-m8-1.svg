<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-labelledby="t d">
  <title id="t">Dua cara menyimpan delapan pembacaan terakhir</title>
  <desc id="d">Dua larik berisi delapan sel berindeks 0 sampai 7. Cara geser: tiap elemen disalin ke kirinya dan nilai baru masuk di sel 7. Cara melingkar: kepala di sel 0 ditimpa nilai baru. Kotak kosong untuk jumlah penulisan.</desc>
  <rect width="620" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="42" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">1. Geser: elemen pindah ke kiri</text>
  <rect x="20" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="46" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">0</text>
  <rect x="72" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="98" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">1</text>
  <rect x="124" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">2</text>
  <rect x="176" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="202" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">3</text>
  <rect x="228" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="254" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">4</text>
  <rect x="280" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="306" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">5</text>
  <rect x="332" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="358" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">6</text>
  <rect x="384" y="60" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="410" y="120" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">7</text>
  <line x1="90" y1="80" x2="54" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="142" y1="80" x2="106" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="194" y1="80" x2="158" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="246" y1="80" x2="210" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="298" y1="80" x2="262" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="350" y1="80" x2="314" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <line x1="402" y1="80" x2="366" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="52" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">baru di sel 7</text>
  <text x="450" y="120" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">penulisan:</text>
  <rect x="450" y="128" width="100" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="182" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">2. Melingkar: nilai baru menimpa kepala</text>
  <rect x="20" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="46" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">0</text>
  <rect x="72" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="98" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">1</text>
  <rect x="124" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">2</text>
  <rect x="176" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="202" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">3</text>
  <rect x="228" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="254" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">4</text>
  <rect x="280" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="306" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">5</text>
  <rect x="332" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="358" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">6</text>
  <rect x="384" y="200" width="52" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="410" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">7</text>
  <text x="20" y="296" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#222222">sel 0 = kepala (tertua)</text>
  <text x="450" y="260" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">penulisan:</text>
  <rect x="450" y="268" width="100" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
