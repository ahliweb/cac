<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 262" width="650" height="262" role="img" aria-labelledby="t d">
  <title id="t">Teks CSV dibaca menjadi daftar kamus</title>
  <desc id="d">Kotak teks CSV nama,nilai dengan baris A,10 dan B,20, anak panah csv.DictReader menuju dua kamus dalam daftar baris, dan tiga kotak kosong untuk keluaran print.</desc>
  <rect width="650" height="262" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <rect x="10" y="20" width="150" height="100" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="85" y="44" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">teks CSV</text>
  <text x="20" y="70" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">nama,nilai</text>
  <text x="20" y="94" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">A,10</text>
  <text x="20" y="114" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">B,20</text>
  <line x1="164" y1="70" x2="284" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="224" y="58" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">csv.DictReader</text>
  <text x="460" y="14" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">baris = daftar kamus</text>
  <rect x="290" y="24" width="340" height="44" rx="4" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="296" y="52" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">baris indeks 0: nama = "A",  nilai = "10"</text>
  <rect x="290" y="76" width="340" height="44" rx="4" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="296" y="104" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">baris indeks 1: nama = "B",  nilai = "20"</text>
  <text x="10" y="160" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">Isi keluaran print:</text>
  <text x="110" y="188" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">len(baris)</text>
  <rect x="10" y="198" width="200" height="50" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="325" y="188" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">baris indeks 1, nilai + baris indeks 0, nilai</text>
  <rect x="225" y="198" width="200" height="50" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="188" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">int(...) + int(...)</text>
  <rect x="440" y="198" width="200" height="50" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
