<rect x="20" y="267" width="40" height="34" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="40.0" y="289.25" font-size="15" text-anchor="middle" fill="#222222">3</text>
<rect x="60" y="267" width="200" height="34" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="260" y="267" width="140" height="34" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="400" y="267" width="110" height="34" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="455.0" y="289.25" font-size="15" text-anchor="middle" fill="#222222">sama / BEDA</text>
