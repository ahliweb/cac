<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-labelledby="t d">
<title id="t">Garis waktu naskah demo lima menit</title>
<desc id="d">Batang waktu lima menit terbagi empat bagian: satu menit pertanyaan dan masukan contoh, satu menit rancangan, dua menit demo langsung, satu menit bukti uji dan angka efisiensi. Di bawah tiap bagian ada kotak kosong untuk menulis isi naskah.</desc>
<rect width="540" height="300" fill="#ffffff"/>

<g font-family="sans-serif">
<text x="20" y="24" font-size="14" text-anchor="start" fill="#222222">Naskah demo lima menit. Tulis isi tiap bagian pada kotak.</text>
<rect x="20" y="40" width="90" height="40" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="65.0" y="57" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">pertanyaan</text>
<text x="65.0" y="74" font-size="14" text-anchor="middle" fill="#222222">1 menit</text>
<rect x="20" y="92" width="90" height="150" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="116" y="40" width="90" height="40" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="161.0" y="57" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">rancangan</text>
<text x="161.0" y="74" font-size="14" text-anchor="middle" fill="#222222">1 menit</text>
<rect x="116" y="92" width="90" height="150" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="212" y="40" width="186" height="40" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="305.0" y="57" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">demo langsung</text>
<text x="305.0" y="74" font-size="14" text-anchor="middle" fill="#222222">2 menit</text>
<rect x="212" y="92" width="186" height="150" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="404" y="40" width="90" height="40" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="449.0" y="57" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">uji + angka</text>
<text x="449.0" y="74" font-size="14" text-anchor="middle" fill="#222222">1 menit</text>
<rect x="404" y="92" width="90" height="150" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="20" y="270" font-size="14" text-anchor="start" fill="#222222">Siapkan cadangan keluaran tertulis, dan satu masukan salah.</text>
</g>
</svg>
