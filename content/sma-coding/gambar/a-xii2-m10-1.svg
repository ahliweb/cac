<desc id="d">Tiga kartu barang dengan berat dan nilai: barang 1 berat 6 nilai 30, barang 2 berat 5 nilai 20, barang 3 berat 5 nilai 20, kapasitas 10. Tabel delapan himpunan bagian dengan kolom berat, nilai, dan muat, kosong.</desc>
