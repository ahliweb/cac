<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-labelledby="t d">
  <title id="t">Dua tabel penelusuran untuk perulangan for dan while</title>
  <desc id="d">Tabel kiri untuk for dengan kolom i dan jumlah, i berisi 1 sampai 5. Tabel kanan untuk while dengan kolom putaran dan k, semuanya kosong untuk diisi.</desc>
  <rect width="600" height="320" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="26" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">for: jumlah diawali 0</text>
  <rect x="20" y="36" width="80" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="60.0" y="60.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">i</text>
  <rect x="100" y="36" width="130" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="165.0" y="60.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">jumlah</text>
  <rect x="20" y="74" width="80" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="60.0" y="98.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">1</text>
  <rect x="100" y="74" width="130" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="112" width="80" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="60.0" y="136.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">2</text>
  <rect x="100" y="112" width="130" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="150" width="80" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="60.0" y="174.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">3</text>
  <rect x="100" y="150" width="130" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="188" width="80" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="60.0" y="212.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">4</text>
  <rect x="100" y="188" width="130" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="226" width="80" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="60.0" y="250.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">5</text>
  <rect x="100" y="226" width="130" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="300" y="26" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">while: k diawali 10</text>
  <rect x="300" y="36" width="100" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="60.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">putaran</text>
  <rect x="400" y="36" width="180" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="490.0" y="60.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">k setelah k -= 4</text>
  <rect x="300" y="74" width="100" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="98.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">1</text>
  <rect x="400" y="74" width="180" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="112" width="100" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="136.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">2</text>
  <rect x="400" y="112" width="180" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="150" width="100" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="174.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">3</text>
  <rect x="400" y="150" width="180" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="188" width="100" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="212.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">4</text>
  <rect x="400" y="188" width="180" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="226" width="100" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="250.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">5</text>
  <rect x="400" y="226" width="180" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="20" y="288" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">Isi sel kosong. Baris tak terpakai dibiarkan kosong.</text>
</svg>
