<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" role="img" aria-labelledby="t d">
  <title id="t">Lima titik pada garis bilangan dan tabel putaran k-means</title>
  <desc id="d">Garis bilangan 0 sampai 12 dengan titik pada 1, 2, 6, 7, dan 12. Titik 1 bertanda A dan titik 12 bertanda B sebagai pusat awal. Di bawahnya tabel kosong untuk putaran 1 dan putaran 2: anggota A, anggota B, pusat baru A, pusat baru B.</desc>
  <rect width="600" height="270" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <line x1="30" y1="55" x2="570" y2="55" stroke="#222222" stroke-width="2"/>
    <g stroke="#222222" stroke-width="1.5">
      <line x1="30" y1="49" x2="30" y2="61"/><line x1="75" y1="49" x2="75" y2="61"/><line x1="120" y1="49" x2="120" y2="61"/><line x1="165" y1="49" x2="165" y2="61"/><line x1="210" y1="49" x2="210" y2="61"/><line x1="255" y1="49" x2="255" y2="61"/><line x1="300" y1="49" x2="300" y2="61"/><line x1="345" y1="49" x2="345" y2="61"/><line x1="390" y1="49" x2="390" y2="61"/><line x1="435" y1="49" x2="435" y2="61"/><line x1="480" y1="49" x2="480" y2="61"/><line x1="525" y1="49" x2="525" y2="61"/><line x1="570" y1="49" x2="570" y2="61"/>
    </g>
    <text x="30" y="80">0</text><text x="75" y="80">1</text><text x="120" y="80">2</text><text x="165" y="80">3</text><text x="210" y="80">4</text><text x="255" y="80">5</text><text x="300" y="80">6</text><text x="345" y="80">7</text><text x="390" y="80">8</text><text x="435" y="80">9</text><text x="480" y="80">10</text><text x="525" y="80">11</text><text x="570" y="80">12</text>
    <g fill="#2a5d9f">
      <circle cx="75" cy="55" r="7"/><circle cx="120" cy="55" r="7"/><circle cx="300" cy="55" r="7"/><circle cx="345" cy="55" r="7"/><circle cx="570" cy="55" r="7"/>
    </g>
    <g fill="none" stroke="#b3261e" stroke-width="2.5">
      <rect x="64" y="44" width="22" height="22"/><rect x="559" y="44" width="22" height="22"/>
    </g>
    <text x="75" y="30" font-weight="bold" fill="#b3261e">A (pusat awal)</text>
    <text x="545" y="30" font-weight="bold" fill="#b3261e">B (pusat awal)</text>
    <g stroke="#222222" stroke-width="1.5" fill="#f2f2f2">
      <rect x="30" y="110" width="150" height="28" fill="#ffffff"/>
      <rect x="180" y="110" width="200" height="28" fill="#ffffff"/>
      <rect x="380" y="110" width="190" height="28" fill="#ffffff"/>
      <rect x="30" y="138" width="150" height="30" fill="#ffffff"/><rect x="180" y="138" width="200" height="30"/><rect x="380" y="138" width="190" height="30"/>
      <rect x="30" y="168" width="150" height="30" fill="#ffffff"/><rect x="180" y="168" width="200" height="30"/><rect x="380" y="168" width="190" height="30"/>
      <rect x="30" y="198" width="150" height="30" fill="#ffffff"/><rect x="180" y="198" width="200" height="30"/><rect x="380" y="198" width="190" height="30"/>
      <rect x="30" y="228" width="150" height="30" fill="#ffffff"/><rect x="180" y="228" width="200" height="30"/><rect x="380" y="228" width="190" height="30"/>
    </g>
    <g font-weight="bold">
      <text x="280" y="130">Putaran 1</text><text x="475" y="130">Putaran 2</text>
    </g>
    <g text-anchor="start">
      <text x="38" y="158">anggota A</text><text x="38" y="188">anggota B</text><text x="38" y="218">pusat baru A</text><text x="38" y="248">pusat baru B</text>
    </g>
  </g>
</svg>
