<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" width="560" height="385" role="img" aria-labelledby="t d">
<title id="t">Sketsa tata letak halaman klub dengan nama elemen yang kosong</title>
<desc id="d">Sketsa halaman dengan empat zona berlabel: kepala halaman berisi judul Klub Catur-contoh, isi utama berisi Jadwal, paragraf latihan setiap Kamis sore dan daftar Papan dan Jam, serta kaki halaman. Setiap zona punya isian kosong untuk nama elemen HTML-nya.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="560" height="385" fill="#ffffff"/>
<rect x="20" y="20" width="520" height="340" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<rect x="35" y="35" width="490" height="60" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="50" y="60" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Klub Catur-contoh (judul h1)</text>
<text x="50" y="82" font-family="monospace" font-size="14" fill="#222222">elemen pembungkus: &lt;______&gt;</text>
<rect x="35" y="110" width="490" height="170" fill="#ffffff" stroke="#2a5d9f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="50" y="135" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Jadwal (judul h2)</text>
<text x="50" y="157" font-family="sans-serif" font-size="14" fill="#222222">Latihan setiap Kamis sore. (paragraf)</text>
<text x="50" y="180" font-family="sans-serif" font-size="14" fill="#222222">daftar: Papan, Jam   elemen daftar bertitik: &lt;______&gt;</text>
<text x="50" y="203" font-family="sans-serif" font-size="14" fill="#222222">tautan "Info lengkap"   atribut tujuan: ______=</text>
<text x="50" y="262" font-family="monospace" font-size="14" fill="#222222">elemen pembungkus isi utama: &lt;______&gt;</text>
<rect x="35" y="295" width="490" height="50" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="50" y="325" font-family="monospace" font-size="14" fill="#222222">kaki halaman   elemen: &lt;______&gt;</text>
<text x="40" y="375" font-family="sans-serif" font-size="14" fill="#222222"></text>
