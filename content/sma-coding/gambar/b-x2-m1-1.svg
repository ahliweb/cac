<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-labelledby="t d">
<title id="t">Array buah dengan indeks dan tempat kosong untuk elemen baru</title>
<desc id="d">Array buah berisi apel, jeruk, mangga pada indeks 0, 1, 2. Di sebelah kanan ada satu kotak putus-putus kosong untuk indeks 3. Di bawahnya ada dua isian kosong: panjang array sebelum push dan panjang array sesudah push.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="560" height="270" fill="#ffffff"/>
<text x="20" y="28" font-family="monospace" font-size="15" font-weight="bold" fill="#222222">const buah = ["apel", "jeruk", "mangga"]</text>
<rect x="20" y="50" width="110" height="40" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="75.0" y="74.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">apel</text>
<text x="75" y="112" font-family="sans-serif" font-size="14" fill="#2a5d9f" text-anchor="middle">0</text>
<rect x="130" y="50" width="110" height="40" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="185.0" y="74.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">jeruk</text>
<text x="185" y="112" font-family="sans-serif" font-size="14" fill="#2a5d9f" text-anchor="middle">1</text>
<rect x="240" y="50" width="110" height="40" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="295.0" y="74.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">mangga</text>
<text x="295" y="112" font-family="sans-serif" font-size="14" fill="#2a5d9f" text-anchor="middle">2</text>
<rect x="350" y="50" width="110" height="40" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="405" y="112" font-family="sans-serif" font-size="14" fill="#2a5d9f" text-anchor="middle">3</text>
<text x="20" y="150" font-family="sans-serif" font-size="14" fill="#2a5d9f">indeks</text>
<text x="20" y="185" font-family="sans-serif" font-size="15" fill="#222222">buah.length sebelum push: ______</text>
<text x="20" y="215" font-family="sans-serif" font-size="15" fill="#222222">Isi kotak putus-putus setelah buah.push(...): ______</text>
<text x="20" y="245" font-family="sans-serif" font-size="15" fill="#222222">buah.length sesudah push: ______</text>
</svg>
