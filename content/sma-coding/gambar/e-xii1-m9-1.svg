<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d">
<title id="t">Tabel padanan simulator sendiri dan Qiskit</title>
<desc id="d">Tabel dua kolom: simulatormu dan Qiskit. Kolom simulatormu berisi gerbang_h, cnot, balik_bit, dan baca diulang shot kali; kolom Qiskit kosong. Di bawahnya dua isian tentang urutan bit: X pada qubit 0 dari tiga qubit di simulatormu dan di Qiskit.</desc>

<rect width="640" height="290" fill="#ffffff"/>
<rect x="20" y="20" width="280" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="160" y="46" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">simulatormu</text>
<rect x="300" y="20" width="320" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="460" y="46" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Qiskit</text>
<rect x="20" y="60" width="280" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="160" y="88" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">gerbang_h(v, n, k)</text>
<rect x="300" y="60" width="320" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="104" width="280" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="160" y="132" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">cnot(v, n, kontrol, target)</text>
<rect x="300" y="104" width="320" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="148" width="280" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="160" y="176" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">balik_bit(v, n, k)</text>
<rect x="300" y="148" width="320" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="192" width="280" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="160" y="220" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">baca diulang shot kali</text>
<rect x="300" y="192" width="320" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">X pada qubit 0 dari tiga qubit:</text>
<text x="260" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">simulatormu</text>
<rect x="360" y="244" width="80" height="28" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="460" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Qiskit</text>
<rect x="520" y="244" width="80" height="28" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
