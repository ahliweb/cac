<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran satu lintasan pertukaran untuk data 5 2 4 1</title>
  <desc id="d">Tabel dengan kolom indeks 0 sampai 3 dan pertukaran. Baris awal berisi 5, 2, 4, 1. Tiga baris i sama dengan 0, 1, 2 kosong untuk isi a setelah membandingkan a[i] dan a[i + 1].</desc>
