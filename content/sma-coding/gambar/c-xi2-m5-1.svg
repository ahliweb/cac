<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Pohon topik lab dan empat langganan</title>
  <desc id="d">Pohon topik dengan akar lab, cabang a dan c, daun suhu, lembap, kipas, dan di bawah c suhu lalu atas. Di samping tiap daun ada kotak kosong untuk nama langganan. Di bawah tertulis empat langganan beserta filternya.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <g stroke="#222222" stroke-width="2">
    <line x1="90" y1="50" x2="90" y2="140"/>
    <line x1="90" y1="140" x2="180" y2="60"/>
    <line x1="90" y1="140" x2="180" y2="190"/>
    <line x1="230" y1="60" x2="300" y2="30"/>
    <line x1="230" y1="60" x2="300" y2="75"/>
    <line x1="230" y1="60" x2="300" y2="120"/>
    <line x1="230" y1="190" x2="300" y2="190"/>
    <line x1="350" y1="190" x2="400" y2="190"/>
  </g>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2">
    <rect x="60" y="20" width="60" height="30" rx="6"/>
    <rect x="180" y="45" width="50" height="30" rx="6"/>
    <rect x="180" y="175" width="50" height="30" rx="6"/>
    <rect x="300" y="15" width="80" height="30" rx="6"/>
    <rect x="300" y="60" width="80" height="30" rx="6"/>
    <rect x="300" y="105" width="80" height="30" rx="6"/>
    <rect x="300" y="175" width="80" height="30" rx="6"/>
    <rect x="400" y="175" width="80" height="30" rx="6"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">
    <text x="90" y="41">lab</text>
    <text x="205" y="66">a</text>
    <text x="205" y="196">c</text>
    <text x="340" y="36">suhu</text>
    <text x="340" y="81">lembap</text>
    <text x="340" y="126">kipas</text>
    <text x="340" y="196">suhu</text>
    <text x="440" y="196">atas</text>
  </g>
  <g fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4">
    <rect x="395" y="15" width="170" height="30"/>
    <rect x="395" y="60" width="170" height="30"/>
    <rect x="395" y="105" width="170" height="30"/>
    <rect x="495" y="175" width="130" height="30"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="20" y="250" font-weight="bold">Langganan (nama = filter):</text>
    <text x="20" y="275">pantau = lab/+/suhu</text>
    <text x="250" y="275">arsip = lab/#</text>
    <text x="20" y="300">kipasA = lab/a/kipas</text>
    <text x="250" y="300">papanA = lab/a/suhu</text>
  </g>
</svg>
