<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Sirkuit H, Z, H dengan keadaan tiap langkah kosong</title>
  <desc id="d">Kawat dari keadaan awal |0&gt; yang sama dengan vektor (1 ; 0), lalu gerbang H, gerbang Z, dan gerbang H. Setelah tiap gerbang ada kotak kosong untuk menulis keadaan. Di bawah, kotak kosong untuk peluang membaca 1 dan jenis interferensi pada komponen a0 dan a1.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Sirkuit dibaca dari kiri ke kanan: gerbang paling kiri dipakai lebih dulu</text>
  <text x="20" y="85" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">|0&gt; = (1 ; 0)</text>
  <line x1="130" y1="80" x2="625" y2="80" stroke="#222222" stroke-width="2"/>
  <rect x="150" y="60" width="40" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="170" y="86" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">H</text>
  <rect x="198" y="58" width="92" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="300" y="60" width="40" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="320" y="86" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Z</text>
  <rect x="348" y="58" width="92" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="450" y="60" width="40" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="470" y="86" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">H</text>
  <rect x="498" y="58" width="92" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="244" y="124" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">setelah gerbang 1</text>
  <text x="394" y="124" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">setelah gerbang 2</text>
  <text x="544" y="124" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">setelah gerbang 3</text>
  <text x="20" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">P(1) akhir = </text>
  <rect x="135" y="152" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="270" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">a0:</text>
  <rect x="300" y="152" width="140" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="270" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">a1:</text>
  <rect x="300" y="197" width="140" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="248" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Isi a0 dan a1 dengan: konstruktif atau destruktif.</text>
</svg>
