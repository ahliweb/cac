<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img" aria-labelledby="t d">
  <title id="t">Empat lapis diagnosis berurutan</title>
  <desc id="d">Empat kotak bertumpuk dengan panah turun: daya, kabel, kode, format pesan; di samping tiap kotak ada kotak kosong untuk nomor gejala.</desc>
  <rect width="620" height="420" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <rect x="20" y="20" width="380" height="64" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="34" y="46" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#222222">1 DAYA</text>
  <text x="34" y="70" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">kedua papan menyala?</text>
  <text x="430" y="46" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">gejala no.:</text>
  <rect x="430" y="52" width="120" height="28" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="210" y1="86" x2="210" y2="114" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="116" width="380" height="64" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="34" y="142" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#222222">2 KABEL</text>
  <text x="34" y="166" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">TX-RX silang? GND bersama?</text>
  <text x="430" y="142" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">gejala no.:</text>
  <rect x="430" y="148" width="120" height="28" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="210" y1="182" x2="210" y2="210" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="212" width="380" height="64" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="34" y="238" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#222222">3 KODE</text>
  <text x="34" y="262" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">baud sama? pin benar? begin()?</text>
  <text x="430" y="238" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">gejala no.:</text>
  <rect x="430" y="244" width="120" height="28" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="210" y1="278" x2="210" y2="306" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="308" width="380" height="64" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="34" y="334" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#222222">4 FORMAT PESAN</text>
  <text x="34" y="358" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">penanda, jumlah periksa, ruas, satuan</text>
  <text x="430" y="334" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">gejala no.:</text>
  <rect x="430" y="340" width="120" height="28" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="410" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Periksa dari atas ke bawah; tulis nomor gejala di kotak lapis yang kamu pilih.</text>
