<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Garis waktu penerbitan suhu dan keadaan kipas</title>
  <desc id="d">Empat kejadian berurutan: terbit 26.0, terbit 29.5, terbit 28.0, lalu klien baru ber-ID papan-b menyambung dan terbit 30.1. Di bawah tiap kejadian ada kotak kosong untuk keadaan kipas, dan satu kotak kosong untuk klien yang menerima.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <line x1="15" y1="40" x2="625" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2">
    <rect x="20" y="58" width="130" height="44" rx="6"/>
    <rect x="170" y="58" width="130" height="44" rx="6"/>
    <rect x="320" y="58" width="130" height="44" rx="6"/>
    <rect x="470" y="58" width="150" height="44" rx="6"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="85" y="86">1. terbit 26.0</text>
    <text x="235" y="86">2. terbit 29.5</text>
    <text x="385" y="86">3. terbit 28.0</text>
    <text x="545" y="78">4. klien baru papan-b</text>
    <text x="545" y="96">menyambung; terbit 30.1</text>
  </g>
  <g stroke="#222222" stroke-width="1.5">
    <line x1="85" y1="40" x2="85" y2="58"/>
    <line x1="235" y1="40" x2="235" y2="58"/>
    <line x1="385" y1="40" x2="385" y2="58"/>
    <line x1="545" y1="40" x2="545" y2="58"/>
  </g>
  <g fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4">
    <rect x="20" y="130" width="130" height="40"/>
    <rect x="170" y="130" width="130" height="40"/>
    <rect x="320" y="130" width="130" height="40"/>
    <rect x="470" y="130" width="150" height="40"/>
    <rect x="470" y="200" width="150" height="40"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="28" y="124">kipas:</text>
    <text x="178" y="124">kipas:</text>
    <text x="328" y="124">kipas:</text>
    <text x="478" y="124">kipas:</text>
    <text x="478" y="194">klien yang menerima:</text>
  </g>
</svg>
