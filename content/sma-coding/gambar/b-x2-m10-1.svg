<text x="465.0" y="63.0" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">0</text>
<text x="465.0" y="93" font-family="sans-serif" font-size="14" fill="#2a5d9f" text-anchor="middle">5</text>
<text x="20" y="63" font-family="sans-serif" font-size="14" fill="#222222">nilai</text>
