<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-labelledby="t d">
<title id="t">Larik nilai dengan indeks dan baris sah atau tidak yang kosong</title>
<desc id="d">Larik enam nilai 85, 105, 70, -3, 100, 0 dengan indeks 0 sampai 5. Di bawah tiap nilai ada kotak kosong untuk menulis sah atau tidak. Rentang sah yang dipakai adalah 0 sampai 100.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
