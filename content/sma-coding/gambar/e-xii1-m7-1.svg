<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="t d">
<title id="t">Tabel penilaian tiga klaim dengan tiga pertanyaan penguji</title>
<desc id="d">Tabel dengan tiga baris klaim a, b, c dan tiga kolom pertanyaan penguji: masalah apa, dibanding apa, diukur dengan apa, ditambah kolom penilaian. Semua kotak jawaban kosong.</desc>

<rect width="660" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="70" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="55.0" y="47" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">klaim</text>
<rect x="90" y="20" width="150" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="165.0" y="47" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Masalah apa?</text>
<rect x="240" y="20" width="150" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="315.0" y="47" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Dibanding apa?</text>
<rect x="390" y="20" width="150" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="465.0" y="47" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Diukur dengan apa?</text>
<rect x="540" y="20" width="100" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="590.0" y="47" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">benar / keliru</text>
<rect x="20" y="64" width="70" height="72" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="55.0" y="106" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">(a)</text>
<rect x="90" y="64" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="240" y="64" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="390" y="64" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="64" width="100" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="136" width="70" height="72" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="55.0" y="178" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">(b)</text>
<rect x="90" y="136" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="240" y="136" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="390" y="136" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="136" width="100" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="208" width="70" height="72" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="55.0" y="250" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">(c)</text>
<rect x="90" y="208" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="240" y="208" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="390" y="208" width="150" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="208" width="100" height="72" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="330" y="292" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Isi tiap kotak dengan kata-katamu sendiri.</text>
</svg>
