<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Pesan JSON dan penyangga 20 byte</title>
  <desc id="d">Bentuk pesan dengan bidang sensor, suhu, dan detik, tiga baris isian untuk pesan, dan dua baris penyangga masing-masing sepuluh kotak bernomor 1 sampai 20.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">{"sensor":"...","suhu":...,"detik":...}</text>
  <g font-family="sans-serif" font-size="14" fill="#2a5d9f"><text x="20" y="50">bidang 1: sensor (teks)</text><text x="230" y="50">bidang 2: suhu</text><text x="400" y="50">bidang 3: detik</text></g>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="20" y="90">1.  ______________________________________________</text>
    <text x="20" y="124">2.  ______________________________________________</text>
    <text x="20" y="158">3.  ______________________________________________</text>
  </g>
  <text x="20" y="206" font-family="sans-serif" font-size="14" fill="#222222">Penyangga 20 byte, satu karakter per kotak (pesan 1):</text>
