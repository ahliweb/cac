<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tumpukan pemanggilan jumlah(4) dengan nilai kembalian kosong</title>
  <desc id="d">Lima kotak bertingkat untuk pemanggilan jumlah(4), jumlah(3), jumlah(2), jumlah(1), dan jumlah(0). Panah turun menunjukkan urutan pemanggilan. Tiap kotak punya isian kosong untuk nilai yang dikembalikan.</desc>
  <rect width="600" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#222222">Panah turun = urutan memanggil. Isi nilai yang dikembalikan tiap pemanggilan.</text>
  <rect x="30" y="40" width="220" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="42" y="65" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">jumlah(4)</text>
  <text x="140" y="65" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">mengembalikan</text>
  <rect x="256" y="44" width="70" height="30" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="50" y1="78" x2="50" y2="90" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="70" y="90" width="220" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="82" y="115" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">jumlah(3)</text>
  <text x="180" y="115" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">mengembalikan</text>
  <rect x="296" y="94" width="70" height="30" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="90" y1="128" x2="90" y2="140" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="110" y="140" width="220" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="122" y="165" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">jumlah(2)</text>
  <text x="220" y="165" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">mengembalikan</text>
  <rect x="336" y="144" width="70" height="30" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="130" y1="178" x2="130" y2="190" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="150" y="190" width="220" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="162" y="215" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">jumlah(1)</text>
  <text x="260" y="215" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">mengembalikan</text>
  <rect x="376" y="194" width="70" height="30" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="170" y1="228" x2="170" y2="240" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="190" y="240" width="220" height="38" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="202" y="265" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">jumlah(0)</text>
  <text x="300" y="265" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">mengembalikan</text>
  <rect x="416" y="244" width="70" height="30" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
