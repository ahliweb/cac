<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel m berukuran 2 kali 3 sebelum dan sesudah m[1][1] diubah</title>
  <desc id="d">Dua tabel dengan dua baris dan tiga kolom, berindeks baris 0 sampai 1 dan kolom 0 sampai 2. Tabel atas berisi 1 2 3 dan 4 5 6. Tabel bawah kosong untuk isi setelah m[1][1] diisi m[0][1] dikali 10, dengan kolom jumlah baris yang juga kosong.</desc>
  <rect width="600" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">awal</text>
  <text x="120" y="50" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">kol 0</text>
  <text x="180" y="50" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">kol 1</text>
  <text x="240" y="50" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">kol 2</text>
  <text x="82" y="89" font-family="sans-serif" font-size="14" text-anchor="end" fill="#2a5d9f">baris 0</text>
  <rect x="90" y="58" width="60" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120" y="89" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#222222">1</text>
  <rect x="150" y="58" width="60" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="180" y="89" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#222222">2</text>
  <rect x="210" y="58" width="60" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="240" y="89" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#222222">3</text>
  <text x="82" y="139" font-family="sans-serif" font-size="14" text-anchor="end" fill="#2a5d9f">baris 1</text>
  <rect x="90" y="108" width="60" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120" y="139" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#222222">4</text>
  <rect x="150" y="108" width="60" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="180" y="139" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#222222">5</text>
  <rect x="210" y="108" width="60" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="240" y="139" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#222222">6</text>
  <text x="20" y="186" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">setelah m[1][1] = m[0][1] * 10;</text>
  <text x="120" y="214" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">kol 0</text>
  <text x="180" y="214" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">kol 1</text>
  <text x="240" y="214" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">kol 2</text>
  <text x="315" y="214" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">jumlah baris</text>
  <text x="82" y="253" font-family="sans-serif" font-size="14" text-anchor="end" fill="#2a5d9f">baris 0</text>
  <rect x="90" y="222" width="60" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <rect x="150" y="222" width="60" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <rect x="210" y="222" width="60" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <rect x="280" y="222" width="70" height="50" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="82" y="303" font-family="sans-serif" font-size="14" text-anchor="end" fill="#2a5d9f">baris 1</text>
  <rect x="90" y="272" width="60" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <rect x="150" y="272" width="60" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <rect x="210" y="272" width="60" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <rect x="280" y="272" width="70" height="50" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
