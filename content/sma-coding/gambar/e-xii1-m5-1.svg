<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-labelledby="t d">
<title id="t">Tabel perbandingan query Grover dan klasik</title>
<desc id="d">Tabel dengan kolom N, banyak pengulangan t Grover, dan query klasik terburuk N dikurangi 1. Baris N sama dengan 4, 16, 64, 1024 sudah terisi N; dua kolom lain kosong untuk diisi.</desc>

<rect width="600" height="260" fill="#ffffff"/>
<rect x="40" y="20" width="130" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="105.0" y="45" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">N</text>
<rect x="170" y="20" width="170" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="255.0" y="45" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">t Grover</text>
<rect x="340" y="20" width="220" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="450.0" y="45" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">query klasik (N - 1)</text>
<rect x="40" y="60" width="130" height="45" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="105.0" y="88" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">4</text>
<rect x="170" y="60" width="170" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="340" y="60" width="220" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="40" y="105" width="130" height="45" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="105.0" y="133" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">16</text>
<rect x="170" y="105" width="170" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="340" y="105" width="220" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="40" y="150" width="130" height="45" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="105.0" y="178" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">64</text>
<rect x="170" y="150" width="170" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="340" y="150" width="220" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="40" y="195" width="130" height="45" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="105.0" y="223" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1024</text>
<rect x="170" y="195" width="170" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="340" y="195" width="220" height="45" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="300" y="250" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Isi kolom kosong dari rumus pada lembar.</text>
</svg>
