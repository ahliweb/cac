  <line x1="394" y1="105" x2="430" y2="105" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="436" y="85" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">2 bit klasik dikirim ke Bob</text>
  <rect x="545" y="135" width="110" height="40" fill="#ffffff" stroke="#1b7a3d" stroke-width="2.5"/>
