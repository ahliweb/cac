<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-labelledby="t d">
  <title id="t">Sirkuit teleportasi dan tabel koreksi Bob</title>
  <desc id="d">Tiga kawat Q, A, dan B. A dan B berada pada keadaan Bell. CNOT dengan Q sebagai kontrol dan A sebagai target, lalu H pada Q, lalu Q dan A dibaca. Dua bit klasik dikirim ke Bob, yang mengoreksi B. Di bawah tabel empat hasil q a dengan kolom gerbang koreksi Bob yang kosong.</desc>
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="20" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Q = keadaan yang dikirim, A dan B = pasangan Bell</text>
  <text x="20" y="60" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Q</text>
  <line x1="45" y1="55" x2="660" y2="55" stroke="#222222" stroke-width="2"/>
  <text x="20" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">A</text>
  <line x1="45" y1="105" x2="660" y2="105" stroke="#222222" stroke-width="2"/>
  <text x="20" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">B</text>
  <line x1="45" y1="155" x2="660" y2="155" stroke="#222222" stroke-width="2"/>
