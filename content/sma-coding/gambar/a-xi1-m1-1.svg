<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" role="img" aria-labelledby="t d">
  <title id="t">Empat tahap proses rekayasa program</title>
  <desc id="d">Empat kotak berurutan dari kiri ke kanan dihubungkan panah. Tiap kotak punya satu pertanyaan utama, kotak kosong untuk nama tahap, dan kotak kosong untuk keluaran tahap.</desc>
  <rect width="700" height="230" fill="#ffffff"/>
