<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" role="img" aria-labelledby="t d">
  <title id="t">Grafik batang bersumbu 90 dan sumbu kosong untuk memperbaikinya</title>
  <desc id="d">Kiri: grafik batang berjudul Penjualan melonjak dengan sumbu tegak mulai dari 90 dan batang bernilai 92 dan 95. Kanan: sumbu kosong dengan kotak judul untuk menggambar ulang grafik.</desc>
  <rect width="660" height="310" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <line x1="60" y1="230" x2="290" y2="230" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="60" y1="230" x2="60" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="286" y="266" font-family="sans-serif" font-size="14" text-anchor="end" fill="#222222"></text>
  <text x="68" y="36" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">nilai</text>
  <text x="175" y="22" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Penjualan melonjak!</text>
  <line x1="54" y1="230" x2="60" y2="230" stroke="#222222" stroke-width="2"/>
  <text x="50" y="235" font-family="sans-serif" font-size="14" text-anchor="end" fill="#222222">90</text>
  <rect x="100" y="186" width="56" height="44" rx="4" fill="#2a5d9f" stroke="#222222" stroke-width="2"/>
  <text x="128" y="180" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">92</text>
  <rect x="190" y="120" width="56" height="110" rx="4" fill="#2a5d9f" stroke="#222222" stroke-width="2"/>
  <text x="218" y="114" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">95</text>
  <text x="128" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">bulan 1</text>
  <text x="218" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">bulan 2</text>
  <text x="175" y="282" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">sumbu mulai dari 90</text>
  <line x1="400" y1="230" x2="630" y2="230" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="230" x2="400" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="626" y="266" font-family="sans-serif" font-size="14" text-anchor="end" fill="#222222"></text>
  <text x="408" y="36" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">nilai</text>
  <rect x="400" y="8" width="230" height="28" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="515" y="27" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">judul: ______</text>
  <text x="460" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">bulan 1</text>
  <text x="560" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">bulan 2</text>
  <text x="515" y="282" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">sumbu mulai dari ____</text>
