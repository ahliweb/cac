<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
<title id="t">Garis bilangan proporsi dan isian simpangan baku untuk membaca histogram</title>
<desc id="d">Garis bilangan dari 0,48 sampai 0,52 dengan tanda tegak merah pada 0,50 yang berlabel harapan. Di atasnya kotak kosong bertanda p untuk menaruh proporsi hasil. Di bawah ada isian p, simpangan baku, z, dan wajar atau tidak.</desc>

<rect width="640" height="300" fill="#ffffff"/>
<line x1="60" y1="110" x2="580" y2="110" stroke="#222222" stroke-width="2"/>
<line x1="80" y1="102" x2="80" y2="118" stroke="#222222" stroke-width="2"/>
<text x="80" y="138" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,48</text>
<line x1="200" y1="102" x2="200" y2="118" stroke="#222222" stroke-width="2"/>
<text x="200" y="138" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,49</text>
<line x1="320" y1="102" x2="320" y2="118" stroke="#222222" stroke-width="2"/>
<text x="320" y="138" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,50</text>
<line x1="440" y1="102" x2="440" y2="118" stroke="#222222" stroke-width="2"/>
<text x="440" y="138" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,51</text>
<line x1="560" y1="102" x2="560" y2="118" stroke="#222222" stroke-width="2"/>
<text x="560" y="138" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,52</text>
<line x1="320" y1="70" x2="320" y2="150" stroke="#b3261e" stroke-width="3"/>
<text x="320" y="62" font-family="sans-serif" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">harapan 0,50</text>
<text x="20" y="34" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">4935 dari 10000 shot. Tandai p pada garis, lalu gambar simpangan baku.</text>
<rect x="100" y="70" width="60" height="28" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="130" y="88" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">p</text>
<text x="20" y="200" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">p =</text>
<text x="170" y="200" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">simpangan baku =</text>
<text x="400" y="200" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">z =</text>
<rect x="60" y="180" width="90" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="300" y="180" width="90" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="440" y="180" width="90" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="284" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Wajar atau tidak?  ______</text>
</svg>
