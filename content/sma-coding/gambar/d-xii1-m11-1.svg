<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 242" width="520" height="242" role="img" aria-labelledby="t d">
  <title id="t">Matriks risiko tiga kali tiga dengan sel kosong</title>
  <desc id="d">Matriks kemungkinan 1 sampai 3 pada baris dan dampak 1 sampai 3 pada kolom. Sembilan sel dibiarkan kosong untuk menulis nomor risiko.</desc>
  <rect width="520" height="242" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Tulis nomor risiko di sel yang cocok</text>
    <rect x="20" y="46" width="150" height="44" fill="#f2f2f2"/>
    <rect x="170" y="46" width="110" height="44" fill="#f2f2f2"/>
    <text x="225" y="73" text-anchor="middle" stroke="none" font-weight="bold">dampak 1</text>
    <rect x="280" y="46" width="110" height="44" fill="#f2f2f2"/>
    <text x="335" y="73" text-anchor="middle" stroke="none" font-weight="bold">dampak 2</text>
    <rect x="390" y="46" width="110" height="44" fill="#f2f2f2"/>
    <text x="445" y="73" text-anchor="middle" stroke="none" font-weight="bold">dampak 3</text>
    <rect x="20" y="90" width="150" height="44" fill="#ffffff"/>
    <text x="95" y="117" text-anchor="middle" stroke="none">kemungkinan 3</text>
    <rect x="170" y="90" width="110" height="44" fill="#ffffff"/>
    <rect x="280" y="90" width="110" height="44" fill="#ffffff"/>
    <rect x="390" y="90" width="110" height="44" fill="#ffffff"/>
    <rect x="20" y="134" width="150" height="44" fill="#ffffff"/>
    <text x="95" y="161" text-anchor="middle" stroke="none">kemungkinan 2</text>
    <rect x="170" y="134" width="110" height="44" fill="#ffffff"/>
    <rect x="280" y="134" width="110" height="44" fill="#ffffff"/>
    <rect x="390" y="134" width="110" height="44" fill="#ffffff"/>
    <rect x="20" y="178" width="150" height="44" fill="#ffffff"/>
    <text x="95" y="205" text-anchor="middle" stroke="none">kemungkinan 1</text>
    <rect x="170" y="178" width="110" height="44" fill="#ffffff"/>
    <rect x="280" y="178" width="110" height="44" fill="#ffffff"/>
    <rect x="390" y="178" width="110" height="44" fill="#ffffff"/>
  </g>
</svg>
