<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" role="img" aria-labelledby="t d">
<title id="t">Tiga lampu, dua saklar, dan tabel empat pilihan</title>
<desc id="d">Tiga lampu bernomor 1 sampai 3. Saklar 1 (garis penuh) terhubung ke lampu 2 dan 3, saklar 2 (garis putus) terhubung ke lampu 1 dan 2. Tabel empat baris pilih 0 sampai 3 dengan kolom saklar 1 ditekan, saklar 2 ditekan, dan keadaan lampu 3 2 1, kosong.</desc>
<rect width="540" height="370" fill="#ffffff"/>

<g font-family="sans-serif">
<circle cx="100" cy="60" r="22" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
<text x="100" y="65.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">1</text>
<circle cx="230" cy="60" r="22" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
<text x="230" y="65.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">2</text>
<circle cx="360" cy="60" r="22" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
<text x="360" y="65.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">3</text>
<text x="100" y="20" font-size="14" text-anchor="middle" fill="#222222">lampu 1</text>
<text x="230" y="20" font-size="14" text-anchor="middle" fill="#222222">lampu 2</text>
<text x="360" y="20" font-size="14" text-anchor="middle" fill="#222222">lampu 3</text>
<rect x="330" y="135" width="100" height="32" rx="3" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<text x="380.0" y="156.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">saklar 1</text>
<rect x="60" y="135" width="100" height="32" rx="3" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<text x="110.0" y="156.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">saklar 2</text>
<line x1="370.0" y1="135.0" x2="240.0" y2="80.0" stroke="#222222" stroke-width="2"/>
<line x1="380.0" y1="135.0" x2="360.0" y2="82.0" stroke="#222222" stroke-width="2"/>
<line x1="100.0" y1="135.0" x2="100.0" y2="82.0" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="130.0" y1="135.0" x2="222.0" y2="78.0" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="20" y="200" font-size="14" text-anchor="start" fill="#222222">Saklar membalik lampu yang terhubung. Coba empat pilihan.</text>
<rect x="20" y="215" width="80" height="30" rx="3" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="235.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">pilih</text>
<rect x="100" y="215" width="110" height="30" rx="3" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<text x="155.0" y="235.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">saklar 1</text>
<rect x="210" y="215" width="110" height="30" rx="3" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<text x="265.0" y="235.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">saklar 2</text>
