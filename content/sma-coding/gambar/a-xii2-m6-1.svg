<text x="60.0" y="325.25" font-size="15" text-anchor="middle" fill="#222222">2</text>
<rect x="100" y="305" width="110" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="210" y="305" width="110" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="320" y="305" width="150" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="20" y="335" width="80" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="355.25" font-size="15" text-anchor="middle" fill="#222222">3</text>
<rect x="100" y="335" width="110" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="210" y="335" width="110" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
