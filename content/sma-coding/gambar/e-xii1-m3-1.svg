<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-labelledby="t d">
<title id="t">Tabel amplitudo empat item pada satu pengulangan Grover</title>
<desc id="d">Tabel dengan empat kolom item 00, 01, 10, 11 dan tiga baris: awal, sesudah oracle, sesudah difusi. Kolom item 10 ditandai bintang sebagai item bertanda. Baris awal berisi nilai 0,5 pada tiap item; dua baris lain kosong untuk diisi.</desc>

<rect width="600" height="250" fill="#ffffff"/>
<text x="300" y="28" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Item 10 ditandai (bintang). Isi amplitudo tiap kotak kosong.</text>
<text x="230" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">item 00</text>
<text x="330" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">item 01</text>
<text x="430" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">item 10 (*)</text>
<text x="530" y="66" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">item 11</text>
<text x="20" y="122" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">awal</text>
<rect x="190" y="92" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="230" y="120" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,5</text>
<rect x="290" y="92" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="330" y="120" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,5</text>
<rect x="390" y="92" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="430" y="120" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,5</text>
<rect x="490" y="92" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="530" y="120" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0,5</text>
<text x="20" y="172" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">sesudah oracle</text>
<rect x="190" y="142" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="290" y="142" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="390" y="142" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="490" y="142" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="222" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">sesudah difusi</text>
<rect x="190" y="192" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="290" y="192" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="390" y="192" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="490" y="192" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="380" y="84" width="100" height="162" rx="0" fill="none" stroke="#b3261e" stroke-width="2.5"/>
</svg>
