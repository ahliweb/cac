<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
  <title id="t">Kerangka rencana proyek satu halaman</title>
  <desc id="d">Tujuh baris berlabel dengan kotak kosong: pertanyaan, prediksi angka, cara, pemeriksaan, kriteria selesai, peran, dan batas klaim. Panah di kiri menunjukkan urutan lima baris pertama dari pertanyaan sampai kriteria selesai.</desc>
  <rect width="640" height="380" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
  <text x="30" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">1 Pertanyaan</text>
  <rect x="210" y="24" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="15" y1="54" x2="15" y2="82" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">2 Prediksi (angka)</text>
  <rect x="210" y="74" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="15" y1="104" x2="15" y2="132" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">3 Cara</text>
  <rect x="210" y="124" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="15" y1="154" x2="15" y2="182" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">4 Pemeriksaan</text>
  <rect x="210" y="174" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="15" y1="204" x2="15" y2="232" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">5 Kriteria selesai</text>
  <rect x="210" y="224" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="295" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">6 Peran</text>
  <rect x="210" y="274" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="345" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">7 Batas klaim</text>
  <rect x="210" y="324" width="410" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
