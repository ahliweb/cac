<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 294" width="660" height="294" role="img" aria-labelledby="t d">
  <title id="t">Tabel CNOT pada keadaan dasar dan pada sebuah vektor</title>
  <desc id="d">Dua tabel kosong. Kiri: CNOT dengan qubit pertama sebagai kontrol memetakan |00&gt;, |01&gt;, |10&gt;, |11&gt; ke keluaran yang harus diisi. Kanan: vektor empat komponen masukan (0,6 ; 0 ; 0,8 ; 0) dengan kotak kosong untuk vektor hasil.</desc>
  <rect width="660" height="294" fill="#ffffff"/>
  <text x="160" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">CNOT (kontrol = qubit pertama)</text>
  <rect x="10" y="38" width="100" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">masukan</text>
  <rect x="110" y="38" width="140" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="180.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">keluaran</text>
  <rect x="10" y="82" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="109.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">|00&gt;</text>
  <rect x="114" y="86" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="82" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="126" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="153.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">|01&gt;</text>
  <rect x="114" y="130" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="126" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="170" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="197.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">|10&gt;</text>
  <rect x="114" y="174" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="170" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="214" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="241.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">|11&gt;</text>
  <rect x="114" y="218" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="214" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="490" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">CNOT pada sebuah vektor</text>
  <rect x="350" y="38" width="130" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">komponen</text>
  <rect x="480" y="38" width="170" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="565.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">masukan  -&gt;  hasil</text>
  <rect x="350" y="82" width="130" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="109.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">00</text>
  <rect x="484" y="86" width="162" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="480" y="82" width="170" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="350" y="126" width="130" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="153.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">01</text>
  <rect x="484" y="130" width="162" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="480" y="126" width="170" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="350" y="170" width="130" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="197.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text>
  <rect x="484" y="174" width="162" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="480" y="170" width="170" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="350" y="214" width="130" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="241.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">11</text>
  <rect x="484" y="218" width="162" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="480" y="214" width="170" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="10" y="284" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Masukan vektor: (0,6 ; 0 ; 0,8 ; 0). Tulis di tiap kotak: nilai masukan -&gt; nilai hasil.</text>
</svg>
