<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-labelledby="t d">
<title id="t">Dua tabel penelusuran untuk soal telusuri</title>
<desc id="d">Tabel kiri: i dari 1 sampai 6 dengan kolom f kosong untuk f dikali i sisa bagi 13. Tabel kanan: lima baris kosong untuk nilai i pada perulangan i dimulai 12 dan dikurangi i &amp; -i selama i lebih dari 0.</desc>
<rect width="540" height="300" fill="#ffffff"/>

<g font-family="sans-serif">
<text x="20" y="26" font-size="14" text-anchor="start" fill="#222222">Kiri: f = f * i % 13, mulai f = 1. Kanan: i mulai 12, i -= i &amp; -i.</text>
