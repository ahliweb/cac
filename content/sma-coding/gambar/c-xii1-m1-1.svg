<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-labelledby="t d">
  <title id="t">Hasil uji kebutuhan K1 dan K2</title>
  <desc id="d">Dua tabel masing-masing lima hasil uji. K1 waktu antar maksimum 40 detik: 32, 35, 38, 40, 36. K2 jarak berhenti minimum 10 cm: 14, 12, 9, 13, 12. Di bawah tiap tabel ada kotak kosong nilai terburuk dan lulus atau gagal.</desc>
  <rect width="640" height="190" fill="#ffffff"/>
  <text x="10" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">K1 waktu antar (maksimum 40 detik)</text>
  <rect x="10" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="40" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">32</text>
  <rect x="70" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="100" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">35</text>
  <rect x="130" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="160" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">38</text>
  <rect x="190" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="220" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">40</text>
  <rect x="250" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="280" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">36</text>
  <text x="10" y="110" font-family="sans-serif" font-size="14" fill="#222222">nilai terburuk:</text>
  <rect x="130" y="90" width="80" height="30" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="10" y="156" font-family="sans-serif" font-size="14" fill="#222222">lulus / gagal:</text>
  <rect x="130" y="136" width="80" height="30" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">K2 jarak berhenti (minimum 10 cm)</text>
  <rect x="330" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="360" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">14</text>
  <rect x="390" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="420" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">12</text>
  <rect x="450" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="480" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">9</text>
  <rect x="510" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="540" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">13</text>
  <rect x="570" y="40" width="60" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="600" y="62" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">12</text>
  <text x="330" y="110" font-family="sans-serif" font-size="14" fill="#222222">nilai terburuk:</text>
  <rect x="450" y="90" width="80" height="30" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="156" font-family="sans-serif" font-size="14" fill="#222222">lulus / gagal:</text>
  <rect x="450" y="136" width="80" height="30" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
