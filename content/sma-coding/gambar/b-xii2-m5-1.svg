<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tabel tiga pertanyaan FAQ dengan kolom kebutuhan dan lingkup kosong</title>
  <desc id="d">Tabel tiga pertanyaan FAQ: berapa buku yang boleh dipinjam, apakah perlu kartu anggota, dan apakah meminjam dipungut biaya. Kolom kebutuhan yang dilayani dan kolom melanggar lingkup atau tidak kosong untuk diisi.</desc>
  <rect width="700" height="300" fill="#ffffff"/>
  <rect x="15" y="30" width="290" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="160.0" y="63.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">pertanyaan FAQ</text>
  <rect x="305" y="30" width="230" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="420.0" y="63.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">kebutuhan yang dilayani</text>
  <rect x="535" y="30" width="155" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="612.5" y="63.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">melanggar lingkup?</text>
  <rect x="15" y="86" width="290" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="160.0" y="119.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Berapa buku yang boleh dipinjam?</text>
  <rect x="305" y="86" width="230" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="535" y="86" width="155" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="15" y="142" width="290" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="160.0" y="175.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Apakah perlu kartu anggota?</text>
  <rect x="305" y="142" width="230" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="535" y="142" width="155" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="15" y="198" width="290" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="160.0" y="231.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Apakah meminjam dipungut biaya?</text>
  <rect x="305" y="198" width="230" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="535" y="198" width="155" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="285" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Isi sebelum membangun situs dan membaca halaman kontak.</text>
</svg>
