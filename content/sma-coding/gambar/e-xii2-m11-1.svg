<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-labelledby="t d">
<title id="t">Kerangka presentasi lima menit dan slide hasil dengan keterangan</title>
<desc id="d">Bagian atas: lima kotak berurutan untuk bagian presentasi, kira-kira satu menit masing-masing: pertanyaan, cara, hasil, batas klaim, langkah berikutnya, dengan ruang isian kosong. Bagian bawah: bingkai slide hasil dengan kotak keterangan wajib yang kosong dan dua batang histogram 000 dan 111 tanpa angka.</desc>

<rect width="660" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="116" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="78" y="42" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1 pertanyaan</text>
<rect x="20" y="54" width="116" height="110" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="78" y="182" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">+- 1 menit</text>
<rect x="144" y="20" width="116" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="202" y="42" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">2 cara</text>
<rect x="144" y="54" width="116" height="110" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="202" y="182" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">+- 1 menit</text>
<rect x="268" y="20" width="116" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="326" y="42" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">3 hasil</text>
<rect x="268" y="54" width="116" height="110" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="326" y="182" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">+- 1 menit</text>
<rect x="392" y="20" width="116" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="450" y="42" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">4 batas klaim</text>
<rect x="392" y="54" width="116" height="110" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450" y="182" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">+- 1 menit</text>
<rect x="516" y="20" width="116" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="574" y="42" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">5 berikutnya</text>
<rect x="516" y="54" width="116" height="110" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="574" y="182" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">+- 1 menit</text>
<text x="20" y="215" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Slide hasil:</text>
<rect x="20" y="225" width="620" height="140" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="30" y="246" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Keterangan wajib:</text>
<rect x="30" y="252" width="300" height="100" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="350" y="246" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">histogram</text>
<text x="350" y="278" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">000</text>
<rect x="390" y="262" width="120" height="24" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="350" y="318" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">111</text>
<rect x="390" y="302" width="120" height="24" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="520" y="278" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">____</text>
<text x="520" y="318" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">____</text>
</svg>
