<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 263" width="536" height="263" role="img" aria-labelledby="t d">
  <title id="t">Tabel hak akses tiga berkas untuk tiga peran yang kosong</title>
  <desc id="d">Tabel tiga baris berkas (daftar-acara, anggaran, foto-kegiatan) dan tiga kolom peran (ketua, bendahara, anggota biasa). Semua sel kosong untuk diisi baca, ubah, atau dikosongkan.</desc>
