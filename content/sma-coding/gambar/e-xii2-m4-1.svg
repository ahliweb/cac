<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
<title id="t">Tabel eksponen langkah klasik dan Grover untuk beberapa ukuran kunci</title>
<desc id="d">Tabel dengan baris n sama dengan 64, 96, dan 128 bit. Kolom log dua langkah klasik rata-rata, log dua iterasi Grover satu perangkat, dan selisih. Semua sel kecuali n kosong.</desc>

<rect width="640" height="260" fill="#ffffff"/>
<text x="20" y="26" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Ruang kunci N = 2^n. Isi kolom kosong.</text>
<rect x="20" y="40" width="100" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="70.0" y="67.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">n</text>
<rect x="120" y="40" width="170" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="205.0" y="67.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">log2 klasik</text>
<rect x="290" y="40" width="190" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="385.0" y="67.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">log2 Grover</text>
<rect x="480" y="40" width="160" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="560.0" y="67.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">selisih</text>
<rect x="20" y="84" width="100" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="70.0" y="111.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">64</text>
<rect x="120" y="84" width="170" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="290" y="84" width="190" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="480" y="84" width="160" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="128" width="100" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="70.0" y="155.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">96</text>
<rect x="120" y="128" width="170" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="290" y="128" width="190" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="480" y="128" width="160" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="172" width="100" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="70.0" y="199.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">128</text>
<rect x="120" y="172" width="170" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="290" y="172" width="190" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="480" y="172" width="160" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
