<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tabel kebenaran kosong untuk (p atau q) dan bukan (p dan q)</title>
  <desc id="d">Tabel dengan empat baris dan enam kolom: p, q, p atau q, p dan q, bukan (p dan q), dan hasil akhir. Kolom p dan q sudah berisi B dan S untuk empat kombinasi. Empat kolom lainnya kosong untuk diisi B atau S.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <rect x="10" y="20" width="60" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="40.0" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">p</text>
  <rect x="70" y="20" width="60" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="100.0" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">q</text>
  <rect x="130" y="20" width="90" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="175.0" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">p ∨ q</text>
  <rect x="220" y="20" width="90" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="265.0" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">p ∧ q</text>
  <rect x="310" y="20" width="110" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="365.0" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">¬(p ∧ q)</text>
  <rect x="420" y="20" width="200" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="520.0" y="47" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">(p ∨ q) ∧ ¬(p ∧ q)</text>
  <rect x="10" y="64" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="70" y="64" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="130" y="64" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="220" y="64" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="310" y="64" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="420" y="64" width="200" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="40" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">B</text>
  <text x="100" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">B</text>
  <rect x="10" y="104" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="70" y="104" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="130" y="104" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="220" y="104" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="310" y="104" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="420" y="104" width="200" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="40" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">B</text>
  <text x="100" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">S</text>
  <rect x="10" y="144" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="70" y="144" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="130" y="144" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="220" y="144" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="310" y="144" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="420" y="144" width="200" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="40" y="170" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">S</text>
  <text x="100" y="170" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">B</text>
  <rect x="10" y="184" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="70" y="184" width="60" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <rect x="130" y="184" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="220" y="184" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="310" y="184" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="420" y="184" width="200" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="40" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">S</text>
  <text x="100" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">S</text>
  <text x="10" y="244" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">B = benar, S = salah. Isi kotak abu-abu dengan B atau S.</text>
</svg>
