<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370" width="660" height="370" role="img" aria-labelledby="t d">
  <title id="t">Indeks komponen tiga qubit dan tabel memori vektor</title>
  <desc id="d">Atas: delapan kotak berindeks 0 sampai 7 untuk vektor tiga qubit, tiap kotak punya ruang kosong untuk bit string biner tiga digit. Bawah: tabel n sama dengan 5, 15, 25 dengan kolom jumlah komponen, memori dengan 8 byte per amplitudo, dan memori dengan 16 byte per amplitudo yang kosong.</desc>
