<text x="28" y="57" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Tanda</text>
<rect x="220" y="36" width="56" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="248" y="57" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">(a)</text>
<rect x="276" y="36" width="56" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="304" y="57" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">(b)</text>
