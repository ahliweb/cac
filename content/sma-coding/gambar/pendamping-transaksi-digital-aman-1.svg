<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" width="560" height="384" role="img" aria-labelledby="t d">
<title id="t">Matriks tanda tipuan untuk lima pesan fiktif</title>
<desc id="d">Tabel dengan enam baris tanda tipuan: Mendesak, Meminta rahasia, Tautan aneh, Harga mustahil, Pindah ke luar platform, dan Hadiah tak terduga. Lima kolom berlabel (a) sampai (e) untuk lima pesan, semua sel kosong. Baris terakhir Kesimpulan juga kosong untuk diisi S, T, atau B.</desc>
<rect width="560" height="384" fill="#ffffff"/>
