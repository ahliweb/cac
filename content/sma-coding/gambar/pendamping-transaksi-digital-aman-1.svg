<text x="20" y="350" font-family="sans-serif" font-size="14" fill="#222222">Beri tanda centang bila tanda itu ada.</text>
<text x="20" y="370" font-family="sans-serif" font-size="14" fill="#222222">S = sah, T = tipuan, B = belum bisa dipastikan.</text>
