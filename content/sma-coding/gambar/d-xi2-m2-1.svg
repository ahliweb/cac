<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Dua pemisah untuk simpul awal pohon keputusan</title>
  <desc id="d">Kotak simpul awal dengan isian jumlah N, jumlah T, dan gini. Dari situ dua pemisah: jarak lebih dari 8 dan muatan lebih dari 6. Tiap pemisah punya dua kotak anak, ya dan tidak, dengan isian N, T, gini, lalu kotak rata-rata berbobot. Di bawah ada isian pemisah yang dipilih.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g stroke="#222222" stroke-width="1.5" fill="none">
    <line x1="290" y1="66" x2="165" y2="90"/><line x1="350" y1="66" x2="475" y2="90"/>
    <line x1="165" y1="108" x2="90" y2="130"/><line x1="165" y1="108" x2="240" y2="130"/>
    <line x1="475" y1="108" x2="400" y2="130"/><line x1="475" y1="108" x2="550" y2="130"/>
  </g>
  <g stroke="#2a5d9f" stroke-width="2" fill="#f2f2f2">
    <rect x="220" y="10" width="200" height="56" rx="6"/>
    <rect x="20" y="130" width="140" height="62" rx="6"/><rect x="170" y="130" width="140" height="62" rx="6"/>
    <rect x="330" y="130" width="140" height="62" rx="6"/><rect x="480" y="130" width="140" height="62" rx="6"/>
    <rect x="20" y="212" width="290" height="34" rx="6"/><rect x="330" y="212" width="290" height="34" rx="6"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <text x="320" y="28" font-weight="bold">simpul awal</text>
    <text x="320" y="45">N = ___  T = ___</text>
    <text x="320" y="61">gini = ______</text>
    <text x="165" y="102" font-weight="bold">pemisah 1: jarak &gt; 8</text>
    <text x="475" y="102" font-weight="bold">pemisah 2: muatan &gt; 6</text>
    <g font-weight="bold"><text x="90" y="148">ya</text><text x="240" y="148">tidak</text><text x="400" y="148">ya</text><text x="550" y="148">tidak</text></g>
    <g><text x="90" y="166">N = __  T = __</text><text x="240" y="166">N = __  T = __</text><text x="400" y="166">N = __  T = __</text><text x="550" y="166">N = __  T = __</text></g>
    <g><text x="90" y="184">gini = ____</text><text x="240" y="184">gini = ____</text><text x="400" y="184">gini = ____</text><text x="550" y="184">gini = ____</text></g>
    <text x="165" y="234">rata-rata berbobot = ______</text>
    <text x="475" y="234">rata-rata berbobot = ______</text>
    <text x="320" y="282" font-weight="bold">pemisah yang dipilih: ______</text>
  </g>
</svg>
