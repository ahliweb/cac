<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Enam tahap alur produk digital</title>
  <desc id="d">Enam kotak bernomor berurutan dengan panah: Kebutuhan, Rancangan, Implementasi, Uji, Rilis, Pemeliharaan. Di bawah tiap kotak ada kotak putus-putus kosong untuk menulis keluaran tahap itu.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <g stroke="#2a5d9f" stroke-width="2" fill="#f2f2f2">
      <rect x="8" y="30" width="96" height="50" rx="6"/><rect x="112" y="30" width="96" height="50" rx="6"/><rect x="216" y="30" width="96" height="50" rx="6"/>
      <rect x="320" y="30" width="96" height="50" rx="6"/><rect x="424" y="30" width="96" height="50" rx="6"/><rect x="528" y="30" width="104" height="50" rx="6"/>
    </g>
    <g stroke="#222222" stroke-width="2" marker-end="url(#a)">
      <line x1="104" y1="55" x2="112" y2="55"/><line x1="208" y1="55" x2="216" y2="55"/><line x1="312" y1="55" x2="320" y2="55"/>
      <line x1="416" y1="55" x2="424" y2="55"/><line x1="520" y1="55" x2="528" y2="55"/>
    </g>
    <text x="56" y="60" font-weight="bold">1 Kebutuhan</text><text x="160" y="60" font-weight="bold">2 Rancangan</text><text x="264" y="52" font-weight="bold">3 Imple-</text><text x="264" y="68" font-weight="bold">mentasi</text>
    <text x="368" y="60" font-weight="bold">4 Uji</text><text x="472" y="60" font-weight="bold">5 Rilis</text><text x="580" y="52" font-weight="bold">6 Pemeli-</text><text x="580" y="68" font-weight="bold">haraan</text>
    <text x="320" y="125" font-size="14">Keluaran tiap tahap (tulis sendiri):</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff" stroke-dasharray="5 4">
      <rect x="8" y="140" width="96" height="100"/><rect x="112" y="140" width="96" height="100"/><rect x="216" y="140" width="96" height="100"/>
      <rect x="320" y="140" width="96" height="100"/><rect x="424" y="140" width="96" height="100"/><rect x="528" y="140" width="104" height="100"/>
    </g>
    <text x="56" y="260">1</text><text x="160" y="260">2</text><text x="264" y="260">3</text><text x="368" y="260">4</text><text x="472" y="260">5</text><text x="580" y="260">6</text>
  </g>
</svg>
