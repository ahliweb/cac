<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-labelledby="t d">
<title id="t">Matriks kebingungan sistem peringatan banjir</title>
<desc id="d">Kotak dua kali dua dengan baris sebenarnya banjir dan tidak banjir, dan kolom ditebak banjir dan tidak banjir. Empat kotak kosong berlabel TP, FN, FP, TN untuk diisi banyak hari.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="520" height="320" fill="#ffffff"/>
<text x="330" y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Ditebak</text><rect x="180" y="44" width="150" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="255" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">banjir</text><rect x="330" y="44" width="150" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="405" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">tidak banjir</text><rect x="30" y="78" width="150" height="80" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="105" y="123" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Sebenarnya banjir</text><rect x="30" y="158" width="150" height="80" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/><text x="105" y="203" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Sebenarnya tidak</text><rect x="180" y="78" width="150" height="80" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><text x="190" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">TP</text><rect x="330" y="78" width="150" height="80" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><text x="340" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">FN</text><rect x="180" y="158" width="150" height="80" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><text x="190" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">FP</text><rect x="330" y="158" width="150" height="80" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><text x="340" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">TN</text><text x="30" y="275" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Positif = banjir. Isi banyak hari pada tiap kotak.</text><text x="30" y="299" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Ketepatan = ______   Ketepatan tebakan mayoritas = ______</text>
</svg>
