<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440" role="img" aria-labelledby="t d">
  <title id="t">Urutan keluar priority_queue dan tabel penelusuran enam operasi</title>
  <desc id="d">Bagian atas: push 5, 1, 8, 3 ke priority_queue, dengan isian top dan ukuran serta empat kotak kosong berpanah untuk urutan keluar saat pop satu per satu. Bagian bawah: tabel enam operasi push 4, push 9, push 4, push 1, pop, push 7 dengan kolom top dan ukuran kosong.</desc>
  <rect width="620" height="440" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">push(5), push(1), push(8), push(3) pada priority_queue&lt;int&gt;</text>
  <text x="20" y="56" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">top = </text>
  <rect x="66" y="38" width="70" height="26" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="56" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">ukuran = </text>
  <rect x="236" y="38" width="70" height="26" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="98" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">urutan keluar saat top() dicetak lalu pop() berulang:</text>
  <rect x="20" y="110" width="70" height="38" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="94" y1="129" x2="124" y2="129" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="130" y="110" width="70" height="38" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="204" y1="129" x2="234" y2="129" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="240" y="110" width="70" height="38" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="314" y1="129" x2="344" y2="129" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="350" y="110" width="70" height="38" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="190" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">Satu operasi pada satu baris; tulis top dan ukuran SETELAH operasi:</text>
  <rect x="20" y="200" width="200" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="221.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">operasi</text>
  <rect x="220" y="200" width="150" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="295.0" y="221.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">top()</text>
  <rect x="370" y="200" width="150" height="32" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="445.0" y="221.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">size()</text>
  <rect x="20" y="232" width="200" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="253.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push(4)</text>
  <rect x="220" y="232" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="370" y="232" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="264" width="200" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="285.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push(9)</text>
  <rect x="220" y="264" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="370" y="264" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="296" width="200" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="317.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push(4)</text>
  <rect x="220" y="296" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="370" y="296" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="328" width="200" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="349.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push(1)</text>
  <rect x="220" y="328" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="370" y="328" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="360" width="200" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="381.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">pop()</text>
  <rect x="220" y="360" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="370" y="360" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="392" width="200" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="413.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push(7)</text>
  <rect x="220" y="392" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="370" y="392" width="150" height="32" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
</svg>
