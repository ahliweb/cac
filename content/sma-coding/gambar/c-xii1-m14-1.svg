<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Hasil uji empat strategi</title>
  <desc id="d">Tabel strategi A sampai D dengan tick tempuh, simpangan terbesar, tick hilang, dan selesai. A: 52, 14, 0, ya. B: 47, 22, 0, ya. C: 44, 31, 0, ya. D: 50, 18, 1, ya. Dua kotak kosong untuk pemenang pada batas 20 mm dan 25 mm.</desc>
