<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-labelledby="t d">
  <title id="t">Pernyataan masalah empat bagian dengan kotak kosong</title>
  <desc id="d">Formulir pernyataan masalah dengan empat kotak kosong berlabel: pengguna, keputusan yang dibantu, masukan, dan keluaran.</desc>
  <rect width="640" height="170" fill="#ffffff"/>
  <rect x="20" y="16" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">pengguna</text>
  <rect x="340" y="16" width="280" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">keputusan yang dibantu</text>
  <rect x="20" y="92" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">masukan</text>
  <rect x="340" y="92" width="280" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">keluaran</text>
</svg>
