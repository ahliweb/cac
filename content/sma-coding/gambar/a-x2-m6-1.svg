<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran isi vector setelah tujuh operasi</title>
  <desc id="d">Tabel dengan kolom operasi, isi v, dan ukuran. Tujuh baris operasi: push_back(4), push_back(7), push_back(1), pop_back(), v[0] = v[0] + v.back(), push_back(9), v.erase(v.begin() + 1). Kolom isi v dan ukuran kosong.</desc>
  <rect width="640" height="370" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">vector&lt;int&gt; v;  (awalnya kosong)</text>
  <rect x="20" y="36" width="260" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="61.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">operasi</text>
  <rect x="280" y="36" width="250" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="405.0" y="61.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">isi v</text>
  <rect x="530" y="36" width="100" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="580.0" y="61.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">ukuran</text>
  <rect x="20" y="76" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="101.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push_back(4)</text>
  <rect x="280" y="76" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="76" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="116" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="141.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push_back(7)</text>
  <rect x="280" y="116" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="116" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="156" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="181.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push_back(1)</text>
  <rect x="280" y="156" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="156" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="196" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="221.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">pop_back()</text>
  <rect x="280" y="196" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="196" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="236" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="261.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">v[0] = v[0] + v.back()</text>
  <rect x="280" y="236" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="236" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="276" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="301.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">push_back(9)</text>
  <rect x="280" y="276" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="276" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="316" width="260" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="341.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">v.erase(v.begin() + 1)</text>
  <rect x="280" y="316" width="250" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="316" width="100" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
</svg>
