  <text x="10" y="272" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Baris 4: tuliskan nilai bertanda dan nilai tak bertanda.</text>
  <text x="10" y="294" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">bertanda = ______   tak bertanda = ______</text>
