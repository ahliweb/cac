<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 305" width="520" height="305" role="img" aria-labelledby="t d">
<title id="t">Empat tahap uji bertahap</title>
<desc id="d">Tabel empat tahap uji sprint satu dengan apa yang diperiksa, dan kolom daya yang kosong untuk diisi. Di bawahnya rumus tegangan pin pembagi tegangan.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="520" height="305" fill="#ffffff"/>
<rect x="20" y="20" width="60" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="50.0" y="45.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Tahap</text>
<rect x="80" y="20" width="260" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="210.0" y="45.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Yang diperiksa</text>
<rect x="340" y="20" width="150" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="415.0" y="45.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Daya</text>
<rect x="20" y="60" width="60" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="50.0" y="85.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
<rect x="80" y="60" width="260" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="210.0" y="85.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">rangkaian terhadap tabel pin; polaritas</text>
<rect x="340" y="60" width="150" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="20" y="100" width="60" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="50.0" y="125.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
<rect x="80" y="100" width="260" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="210.0" y="125.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tegangan di pin; masukan sensor</text>
<rect x="340" y="100" width="150" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="20" y="140" width="60" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="50.0" y="165.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">3</text>
<rect x="80" y="140" width="260" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="210.0" y="165.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tombol berhenti</text>
<rect x="340" y="140" width="150" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="20" y="180" width="60" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="50.0" y="205.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">4</text>
<rect x="80" y="180" width="260" height="40" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="210.0" y="205.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">denyut singkat, lalu berhenti</text>
<rect x="340" y="180" width="150" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><text x="20" y="240" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Isi kolom Daya: tidak ada, tanpa motor,</text><text x="20" y="260" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">atau motor dengan roda terangkat.</text><text x="20" y="284" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Rumus tegangan pin: mV pin = mV baterai x R2 / (R1 + R2)</text>
