<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 266" width="730" height="266" role="img" aria-labelledby="t d">
  <title id="t">Tabel eksperimen E1 sampai E4 dengan kolom hasil dan keputusan kosong</title>
