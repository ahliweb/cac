<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 230" width="670" height="230" role="img" aria-labelledby="t d">
  <title id="t">Lima kartu tahap penerbitan dalam urutan acak</title>
  <desc id="d">Lima kartu berlabel A sampai E: rilis, kode, pantau, konfigurasi, dan build, dalam urutan acak. Di bawah tiap kartu ada kotak kosong bertuliskan urutan ke untuk diisi pelajar.</desc>
