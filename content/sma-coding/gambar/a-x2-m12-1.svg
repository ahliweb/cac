<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d">
  <title id="t">Tabel banyak langkah tiga cara menghitung 1 + 2 + ... + n</title>
  <desc id="d">Tabel dengan kolom n, satu perulangan, rumus n kali n tambah 1 dibagi 2, dan perulangan bersarang. Baris n berisi 10, 100, dan 1000. Sel lainnya kosong.</desc>
  <rect width="640" height="276" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">Banyak langkah menghitung 1 + 2 + ... + n:</text>
  <rect x="20" y="36" width="90" height="48" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="65.0" y="65.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">n</text>
  <rect x="110" y="36" width="190" height="48" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="205.0" y="65.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">satu perulangan</text>
  <rect x="300" y="36" width="150" height="48" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="375.0" y="65.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">rumus</text>
  <rect x="450" y="36" width="170" height="48" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="535.0" y="65.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">bersarang</text>
  <rect x="20" y="84" width="90" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="65.0" y="113.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">10</text>
  <rect x="110" y="84" width="190" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="84" width="150" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="450" y="84" width="170" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="132" width="90" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="65.0" y="161.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">100</text>
  <rect x="110" y="132" width="190" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="132" width="150" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="450" y="132" width="170" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="180" width="90" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="65.0" y="209.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">1000</text>
  <rect x="110" y="180" width="190" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="180" width="150" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="450" y="180" width="170" height="48" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="20" y="268" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Tiap sel: banyak langkah (perulangan atau operasi) yang kamu hitung.</text>
</svg>
