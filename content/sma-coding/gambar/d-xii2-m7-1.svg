<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel ambang keputusan dan anggaran pengingat</title>
  <desc id="d">Kotak anggaran pengingat paling banyak 35 persen. Tabel lima ambang 0,45 sampai 0,65 dengan kolom pengingat, recall, presisi yang kosong. Garis kosong untuk ambang terpilih.</desc>
  <rect width="660" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="15" y="15" width="630" height="38" rx="6" fill="#f2f2f2" stroke="#b3261e" stroke-width="2"/>
    <text x="330" y="39" font-weight="bold" text-anchor="middle">anggaran: pengingat paling banyak 35 persen peminjaman</text>
    <rect x="15" y="70" width="630" height="34" fill="#2a5d9f"/>
    <text x="95" y="92" fill="#ffffff" text-anchor="middle">ambang</text>
    <text x="270" y="92" fill="#ffffff" text-anchor="middle">pengingat</text>
    <text x="440" y="92" fill="#ffffff" text-anchor="middle">recall</text>
    <text x="570" y="92" fill="#ffffff" text-anchor="middle">presisi</text>
    <rect x="15" y="104" width="630" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="138" width="630" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="172" width="630" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="206" width="630" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="240" width="630" height="34" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="95" y="127" text-anchor="middle">0,45</text>
    <text x="95" y="161" text-anchor="middle">0,50</text>
    <text x="95" y="195" text-anchor="middle">0,55</text>
    <text x="95" y="229" text-anchor="middle">0,60</text>
    <text x="95" y="263" text-anchor="middle">0,65</text>
    <line x1="175" y1="70" x2="175" y2="274" stroke="#222222" stroke-width="1.5"/>
    <line x1="365" y1="70" x2="365" y2="274" stroke="#222222" stroke-width="1.5"/>
    <line x1="515" y1="70" x2="515" y2="274" stroke="#222222" stroke-width="1.5"/>
    <text x="15" y="310">Ambang terpilih:</text>
    <line x1="140" y1="310" x2="300" y2="310" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
</svg>
