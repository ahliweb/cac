<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 198" width="710" height="198" role="img" aria-labelledby="t d">
  <title id="t">Tabel eksperimen dengan baris E1 dan E2 dan kolom isian</title>
  <desc id="d">Tabel eksperimen berkolom kode, dari, perubahan, hipotesis, hasil, dan keputusan. Baris E1: perubahan class_weight sama dengan balanced. Baris E2: dari E1, perubahan C sama dengan 0,1. Kolom hipotesis, hasil, dan keputusan dibiarkan kosong.</desc>
  <rect width="710" height="198" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Tepat satu perubahan per baris; hipotesis ditulis sebelum menjalankan</text>
    <rect x="20" y="46" width="60" height="44" fill="#f2f2f2"/>
    <text x="50" y="73" text-anchor="middle" stroke="none" font-weight="bold">kode</text>
    <rect x="80" y="46" width="60" height="44" fill="#f2f2f2"/>
    <text x="110" y="73" text-anchor="middle" stroke="none" font-weight="bold">dari</text>
    <rect x="140" y="46" width="200" height="44" fill="#f2f2f2"/>
    <text x="240" y="73" text-anchor="middle" stroke="none" font-weight="bold">perubahan</text>
    <rect x="340" y="46" width="150" height="44" fill="#f2f2f2"/>
    <text x="415" y="73" text-anchor="middle" stroke="none" font-weight="bold">hipotesis</text>
    <rect x="490" y="46" width="100" height="44" fill="#f2f2f2"/>
    <text x="540" y="73" text-anchor="middle" stroke="none" font-weight="bold">hasil</text>
    <rect x="590" y="46" width="100" height="44" fill="#f2f2f2"/>
    <text x="640" y="73" text-anchor="middle" stroke="none" font-weight="bold">keputusan</text>
    <rect x="20" y="90" width="60" height="44" fill="#ffffff"/>
    <text x="50" y="117" text-anchor="middle" stroke="none">E1</text>
    <rect x="80" y="90" width="60" height="44" fill="#ffffff"/>
    <text x="110" y="117" text-anchor="middle" stroke="none">-</text>
    <rect x="140" y="90" width="200" height="44" fill="#ffffff"/>
    <text x="240" y="117" text-anchor="middle" stroke="none">class_weight = balanced</text>
    <rect x="340" y="90" width="150" height="44" fill="#ffffff"/>
    <rect x="490" y="90" width="100" height="44" fill="#ffffff"/>
    <rect x="590" y="90" width="100" height="44" fill="#ffffff"/>
    <rect x="20" y="134" width="60" height="44" fill="#ffffff"/>
    <text x="50" y="161" text-anchor="middle" stroke="none">E2</text>
    <rect x="80" y="134" width="60" height="44" fill="#ffffff"/>
    <text x="110" y="161" text-anchor="middle" stroke="none">E1</text>
    <rect x="140" y="134" width="200" height="44" fill="#ffffff"/>
    <text x="240" y="161" text-anchor="middle" stroke="none">C = 0,1</text>
    <rect x="340" y="134" width="150" height="44" fill="#ffffff"/>
    <rect x="490" y="134" width="100" height="44" fill="#ffffff"/>
    <rect x="590" y="134" width="100" height="44" fill="#ffffff"/>
  </g>
</svg>
