<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-labelledby="t d">
  <title id="t">Tabel f(x) sama dengan s titik x untuk dua rahasia</title>
  <desc id="d">Kiri: untuk n sama dengan 2 dan s sama dengan 10, empat masukan 00, 01, 10, 11 dengan kolom f(x) dan amplitudo setelah oracle yang kosong. Kanan: untuk s sama dengan 101, masukan 110 dan 111 dengan kolom f(x) kosong.</desc>
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="190" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">n = 2, s = 10</text>
  <rect x="10" y="34" width="70" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">x</text>
  <rect x="80" y="34" width="100" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="130.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">f(x)</text>
  <rect x="180" y="34" width="140" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="250.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">amplitudo</text>
  <rect x="10" y="78" width="70" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="105.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">00</text>
  <rect x="84" y="82" width="92" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="80" y="78" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="184" y="82" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="180" y="78" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="122" width="70" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="149.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">01</text>
  <rect x="84" y="126" width="92" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="80" y="122" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="184" y="126" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="180" y="122" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="166" width="70" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="193.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text>
  <rect x="84" y="170" width="92" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="80" y="166" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="184" y="170" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="180" y="166" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="210" width="70" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="45.0" y="237.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">11</text>
  <rect x="84" y="214" width="92" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="80" y="210" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="184" y="214" width="132" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="180" y="210" width="140" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="520" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">n = 3, s = 101</text>
  <rect x="360" y="34" width="100" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="410.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">x</text>
  <rect x="460" y="34" width="150" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="535.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">f(x)</text>
  <rect x="360" y="78" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="410.0" y="105.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">110</text>
  <rect x="464" y="82" width="142" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="460" y="78" width="150" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="360" y="122" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="410.0" y="149.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">111</text>
  <rect x="464" y="126" width="142" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="460" y="122" width="150" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="360" y="200" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">f(x) = s . x: XOR bit-bit x yang berada</text>
  <text x="360" y="220" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">di posisi bit 1 pada s.</text>
  <text x="10" y="270" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Amplitudo = amplitudo qubit query setelah oracle (empat komponen).</text>
</svg>
