<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-labelledby="t d">
  <title id="t">Dua vector paralel kode dan skor dengan isian kosong</title>
  <desc id="d">Dua baris lima kotak kosong berindeks 0 sampai 4. Baris atas vector kode, baris bawah vector skor. Garis putus-putus pendek menghubungkan kotak berindeks sama untuk menunjukkan baris tabel yang sama.</desc>
  <rect width="600" height="250" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">kode[i]</text>
  <text x="20" y="128" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">skor[i]</text>
  <rect x="110" y="12" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="110" y="110" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="150" y1="56" x2="150" y2="110" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="176" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">0</text>
  <rect x="200" y="12" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="200" y="110" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="240" y1="56" x2="240" y2="110" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="240" y="176" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">1</text>
  <rect x="290" y="12" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="290" y="110" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="330" y1="56" x2="330" y2="110" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="176" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">2</text>
  <rect x="380" y="12" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="380" y="110" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="420" y1="56" x2="420" y2="110" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="176" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">3</text>
  <rect x="470" y="12" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="470" y="110" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="510" y1="56" x2="510" y2="110" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="510" y="176" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">4</text>
  <text x="20" y="210" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Satu baris tabel = kode[i] dan skor[i] dengan indeks i yang sama.</text>
  <text x="20" y="234" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Angka di bawah kotak = indeks i.</text>
</svg>
