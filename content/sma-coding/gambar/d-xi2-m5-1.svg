<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 198" width="550" height="198" role="img" aria-labelledby="t d">
  <title id="t">Tabel kebingungan kosong untuk dua puluh kalimat uji</title>
  <desc id="d">Tabel dua kali dua. Baris: aktual positif dan aktual negatif. Kolom: tebakan positif dan tebakan negatif. Keempat sel dibiarkan kosong untuk diisi empat angka dari soal.</desc>
  <rect width="550" height="198" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Tempatkan empat angka dari soal 1, lalu hitung ketepatan, presisi, dan recall</text>
    <rect x="20" y="46" width="170" height="44" fill="#f2f2f2"/>
    <rect x="190" y="46" width="170" height="44" fill="#f2f2f2"/>
    <text x="275" y="73" text-anchor="middle" stroke="none" font-weight="bold">tebakan positif</text>
    <rect x="360" y="46" width="170" height="44" fill="#f2f2f2"/>
    <text x="445" y="73" text-anchor="middle" stroke="none" font-weight="bold">tebakan negatif</text>
    <rect x="20" y="90" width="170" height="44" fill="#ffffff"/>
    <text x="105" y="117" text-anchor="middle" stroke="none">aktual positif</text>
    <rect x="190" y="90" width="170" height="44" fill="#ffffff"/>
    <rect x="360" y="90" width="170" height="44" fill="#ffffff"/>
    <rect x="20" y="134" width="170" height="44" fill="#ffffff"/>
    <text x="105" y="161" text-anchor="middle" stroke="none">aktual negatif</text>
    <rect x="190" y="134" width="170" height="44" fill="#ffffff"/>
    <rect x="360" y="134" width="170" height="44" fill="#ffffff"/>
  </g>
</svg>
