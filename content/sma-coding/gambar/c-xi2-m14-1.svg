<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Batas nyala dan batas mati kipas</title>
  <desc id="d">Dua garis mendatar: batas nyala 29,5 dan batas mati 28,5. Empat kolom dengan tebakan 28,9; 29,6; 29,0; dan 28,4, dan kotak kosong keadaan kipas di bawah tiap kolom.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <line x1="20" y1="50" x2="620" y2="50" stroke="#b3261e" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="20" y1="120" x2="620" y2="120" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="616" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="end">batas nyala 29,5 (putus panjang)</text>
  <text x="24" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f">batas mati 28,5 (garis titik)</text>
  <circle cx="110" cy="92" r="6" fill="#222222"/>
  <text x="120" y="84" font-family="sans-serif" font-size="14" fill="#222222">1: 28,9</text>
  <rect x="60" y="180" width="100" height="40" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="110" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kipas 1</text>
  <circle cx="250" cy="43" r="6" fill="#222222"/>
  <text x="260" y="35" font-family="sans-serif" font-size="14" fill="#222222">2: 29,6</text>
  <rect x="200" y="180" width="100" height="40" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="250" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kipas 2</text>
  <circle cx="390" cy="85" r="6" fill="#222222"/>
  <text x="400" y="77" font-family="sans-serif" font-size="14" fill="#222222">3: 29,0</text>
  <rect x="340" y="180" width="100" height="40" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kipas 3</text>
  <circle cx="530" cy="127" r="6" fill="#222222"/>
  <text x="540" y="119" font-family="sans-serif" font-size="14" fill="#222222">4: 28,4</text>
  <rect x="480" y="180" width="100" height="40" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="530" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kipas 4</text>
  <text x="20" y="246" font-family="sans-serif" font-size="14" fill="#222222">Kipas awalnya mati. Tulis nyala atau mati di tiap kotak.</text>
</svg>
