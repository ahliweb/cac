<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Kerangka README dengan delapan kotak kosong</title>
  <desc id="d">Kerangka README berisi delapan kotak kosong berlabel: judul proyek, tujuan, data dan asumsi, cara menjalankan, hasil, lingkungan (versi dan benih), pemakaian AI, dan batas.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <rect x="20" y="16" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">judul proyek</text>
  <rect x="340" y="16" width="280" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">tujuan</text>
  <rect x="20" y="90" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">data dan asumsi</text>
  <rect x="340" y="90" width="280" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">cara menjalankan</text>
  <rect x="20" y="164" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="184" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">hasil</text>
  <rect x="340" y="164" width="280" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="184" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">lingkungan (versi dan benih)</text>
  <rect x="20" y="238" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">pemakaian AI</text>
  <rect x="340" y="238" width="280" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">batas</text>
</svg>
