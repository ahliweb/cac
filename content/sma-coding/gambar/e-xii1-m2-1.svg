<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Diagram amplitudo dua qubit: satu terisi, dua kosong</title>
  <desc id="d">Tiga diagram batang untuk empat hasil 00, 01, 10, 11 dengan garis tengah nol dan garis batas plus 0,5 dan minus 0,5. Diagram kiri berisi keadaan seragam dengan empat batang ke atas setinggi 0,5. Dua diagram lain kosong: satu untuk tanda minus pada 10 dan satu untuk tanda minus pada 01 dan 10, tempat kamu menggambar batang ke atas atau ke bawah.</desc>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="120" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">keadaan seragam</text>
  <rect x="10" y="44" width="220" height="192" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <line x1="10" y1="140" x2="230" y2="140" stroke="#222222" stroke-width="2"/>
  <line x1="10" y1="50" x2="230" y2="50" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="10" y1="230" x2="230" y2="230" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="14" y="40" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">+0,5</text>
  <text x="14" y="252" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">-0,5</text>
  <text x="14" y="134" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">0</text>
  <rect x="26" y="50" width="28" height="90" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="40" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">00</text>
  <rect x="76" y="50" width="28" height="90" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="90" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">01</text>
  <rect x="126" y="50" width="28" height="90" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text>
  <rect x="176" y="50" width="28" height="90" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">11</text>
  <text x="360" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">tanda minus pada 10</text>
  <rect x="250" y="44" width="220" height="192" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <line x1="250" y1="140" x2="470" y2="140" stroke="#222222" stroke-width="2"/>
  <line x1="250" y1="50" x2="470" y2="50" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="250" y1="230" x2="470" y2="230" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="254" y="40" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">+0,5</text>
  <text x="254" y="252" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">-0,5</text>
  <text x="254" y="134" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">0</text>
  <rect x="266" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="280" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">00</text>
  <rect x="316" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="330" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">01</text>
  <rect x="366" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="380" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text>
  <rect x="416" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="430" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">11</text>
  <text x="600" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">tanda minus pada 01 dan 10</text>
  <rect x="490" y="44" width="220" height="192" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <line x1="490" y1="140" x2="710" y2="140" stroke="#222222" stroke-width="2"/>
  <line x1="490" y1="50" x2="710" y2="50" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="490" y1="230" x2="710" y2="230" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="494" y="40" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">+0,5</text>
  <text x="494" y="252" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">-0,5</text>
  <text x="494" y="134" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">0</text>
  <rect x="506" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="520" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">00</text>
  <rect x="556" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="570" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">01</text>
  <rect x="606" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="620" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text>
  <rect x="656" y="50" width="28" height="180" fill="#f2f2f2" stroke="#222222" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="670" y="274" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">11</text>
  <text x="360" y="294" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Gambar tiap amplitudo sebagai batang ke atas (positif) atau ke bawah (negatif).</text>
</svg>
