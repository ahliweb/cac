<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-labelledby="t d">
  <title id="t">Dua jalur: bun run dan tsc</title>
  <desc id="d">Satu kotak berkas luas.ts di kiri dengan dua panah. Panah atas ke kotak bun run, panah bawah ke kotak tsc --noEmit. Di kanan masing-masing ada kotak putus-putus kosong untuk menulis hasilnya.</desc>
  <rect width="600" height="240" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <rect x="10" y="85" width="110" height="70" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="65" y="115" font-weight="bold">luas.ts</text><text x="65" y="135">luasPersegi("5")</text>
    <g stroke="#222222" stroke-width="2" marker-end="url(#a)" fill="none">
      <path d="M120 105 L170 50 L190 50"/><path d="M120 135 L170 190 L190 190"/>
    </g>
    <g stroke="#2a5d9f" stroke-width="2" fill="#f2f2f2">
      <rect x="190" y="25" width="140" height="50" rx="6"/><rect x="190" y="165" width="140" height="50" rx="6"/>
    </g>
    <text x="260" y="56" font-weight="bold">bun run luas.ts</text>
    <text x="260" y="196" font-weight="bold">bunx tsc --noEmit</text>
    <g stroke="#222222" stroke-width="2" marker-end="url(#a)"><line x1="330" y1="50" x2="360" y2="50"/><line x1="330" y1="190" x2="360" y2="190"/></g>
    <g stroke="#222222" stroke-width="2" fill="#ffffff" stroke-dasharray="5 4">
      <rect x="365" y="20" width="225" height="60"/><rect x="365" y="160" width="225" height="60"/>
    </g>
    <text x="477" y="100" font-size="14">hasil (tulis)</text>
    <text x="477" y="240" font-size="14">hasil (tulis)</text>
  </g>
</svg>
