<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="t d">
  <title id="t">Tiga berkas dan mana yang dibagikan</title>
  <desc id="d">Tiga kotak berkas: sketsa.ino, rahasia.contoh.h, dan rahasia.h. Tiap kotak punya garis isian untuk menulis isinya dan dua kotak centang, dibagikan dan hanya di komputermu.</desc>
  <rect width="640" height="270" fill="#ffffff"/>
  <g fill="#f2f2f2" stroke="#222222" stroke-width="2">
    <rect x="15" y="30" width="190" height="210" rx="6"/>
    <rect x="225" y="30" width="190" height="210" rx="6"/>
    <rect x="435" y="30" width="190" height="210" rx="6"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="110" y="56">sketsa.ino</text>
    <text x="320" y="56">rahasia.contoh.h</text>
    <text x="530" y="56">rahasia.h</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="27" y="96">isi:</text>
    <text x="237" y="96">isi:</text>
    <text x="447" y="96">isi:</text>
    <text x="27" y="196">[  ] dibagikan</text>
    <text x="27" y="222">[  ] hanya di komputermu</text>
    <text x="237" y="196">[  ] dibagikan</text>
    <text x="237" y="222">[  ] hanya di komputermu</text>
    <text x="447" y="196">[  ] dibagikan</text>
    <text x="447" y="222">[  ] hanya di komputermu</text>
  </g>
  <g stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="27" y1="120" x2="193" y2="120"/>
    <line x1="27" y1="146" x2="193" y2="146"/>
    <line x1="237" y1="120" x2="403" y2="120"/>
    <line x1="237" y1="146" x2="403" y2="146"/>
    <line x1="447" y1="120" x2="613" y2="120"/>
    <line x1="447" y1="146" x2="613" y2="146"/>
