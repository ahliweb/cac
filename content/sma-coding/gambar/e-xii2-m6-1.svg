<rect x="250" y="14" width="390" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="77.12" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Pertanyaan (satu kalimat)</text>
<rect x="250" y="54" width="390" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="114.4" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Kriteria selesai 1</text>
<rect x="250" y="94" width="390" height="30" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="150.4" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Kriteria selesai 2</text>
<rect x="250" y="130" width="390" height="30" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="186.4" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Kriteria selesai 3</text>
<rect x="250" y="166" width="390" height="30" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="225.12" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Uji tangan (dihitung dulu)</text>
<rect x="250" y="202" width="390" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="265.12" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Prediksi</text>
