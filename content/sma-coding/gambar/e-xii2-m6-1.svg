<text x="20" y="338.4" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Risiko 2 -&gt; langkah kecil</text>
<rect x="250" y="318" width="390" height="30" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="374.4" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Risiko 3 -&gt; langkah kecil</text>
