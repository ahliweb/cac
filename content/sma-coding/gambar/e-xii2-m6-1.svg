<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-labelledby="t d">
<title id="t">Formulir rencana proyek akhir dengan kotak isian kosong</title>
<desc id="d">Formulir dengan kotak isian kosong berlabel: proyek dan jenis, pertanyaan, tiga kriteria selesai, uji tangan yang dihitung dulu, prediksi, dan tiga risiko dengan satu langkah kecil masing-masing.</desc>

<rect width="660" height="420" fill="#ffffff"/>
