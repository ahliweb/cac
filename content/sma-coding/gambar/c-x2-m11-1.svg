  <rect x="428" y="46" width="130" height="64" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="493" y="68" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">50 sampai 400 cm</text>
  <text x="493" y="98" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">zona: ______</text>
  <rect x="564" y="46" width="130" height="64" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
