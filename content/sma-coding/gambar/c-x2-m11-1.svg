<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 330" width="714" height="330" role="img" aria-labelledby="t d">
  <title id="t">Lima rentang jarak dan tabel zona yang masih kosong</title>
  <desc id="d">Atas: lima rentang jarak kurang dari 2, 2 sampai 20, 20 sampai 50, 50 sampai 400, dan lebih dari 400 sentimeter, masing-masing dengan isian zona. Bawah: tabel jarak 12, 20, 49, dan 500 sentimeter dengan kolom zona kosong.</desc>
  <rect width="714" height="330" fill="#ffffff"/>
