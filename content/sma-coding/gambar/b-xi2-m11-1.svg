<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Alamat permintaan dan tabel kelompok status</title>
  <desc id="d">Atas: alamat http://localhost:3000/tugas?id=7 dengan metode POST, dengan dua kotak kosong berlabel jalur dan parameter. Bawah: tabel kelompok status 2xx, 3xx, 4xx, 5xx dengan kolom arti dan satu contoh dikosongkan.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="10" y="24" font-weight="bold">POST</text>
    <rect x="60" y="6" width="430" height="26" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="70" y="24">http://localhost:3000/tugas?id=7</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff" stroke-dasharray="5 4">
      <rect x="10" y="48" width="300" height="30"/><rect x="330" y="48" width="300" height="30"/>
    </g>
    <text x="14" y="44">jalur:</text><text x="334" y="44">parameter:</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="10" y="100" width="120" height="30" fill="#f2f2f2"/><rect x="130" y="100" width="300" height="30" fill="#f2f2f2"/><rect x="430" y="100" width="200" height="30" fill="#f2f2f2"/>
      <rect x="10" y="130" width="120" height="36"/><rect x="130" y="130" width="300" height="36"/><rect x="430" y="130" width="200" height="36"/>
      <rect x="10" y="166" width="120" height="36"/><rect x="130" y="166" width="300" height="36"/><rect x="430" y="166" width="200" height="36"/>
      <rect x="10" y="202" width="120" height="36"/><rect x="130" y="202" width="300" height="36"/><rect x="430" y="202" width="200" height="36"/>
      <rect x="10" y="238" width="120" height="36"/><rect x="130" y="238" width="300" height="36"/><rect x="430" y="238" width="200" height="36"/>
    </g>
    <g font-weight="bold"><text x="16" y="120">Kelompok</text><text x="136" y="120">Artinya</text><text x="436" y="120">Satu contoh</text></g>
    <text x="16" y="153">2xx</text><text x="16" y="189">3xx</text><text x="16" y="225">4xx</text><text x="16" y="261">5xx</text>
  </g>
</svg>
