<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" role="img" aria-labelledby="t d">
  <title id="t">Lima nama kolom dengan isian ditandai atau tidak dan jenisnya</title>
  <desc id="d">Tabel lima nama kolom: kode_pinjam, nama_peminjam, tanggal_lahir, kelas, terlambat. Dua kolom kosong untuk ditandai (ya atau tidak) dan jenis (langsung, spesifik, atau kombinasi).</desc>
  <rect width="600" height="270" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Tebak hasil periksa untuk daftar kedua pada soal Prediksi</text>
    <rect x="20" y="46" width="200" height="34" fill="#f2f2f2"/>
    <text x="120" y="68" text-anchor="middle" stroke="none" font-weight="bold">nama kolom</text>
    <rect x="220" y="46" width="160" height="34" fill="#f2f2f2"/>
    <text x="300" y="68" text-anchor="middle" stroke="none" font-weight="bold">ditandai? (ya/tidak)</text>
    <rect x="380" y="46" width="200" height="34" fill="#f2f2f2"/>
    <text x="480" y="68" text-anchor="middle" stroke="none" font-weight="bold">jenis</text>
    <rect x="20" y="80" width="200" height="34" fill="#ffffff"/>
    <text x="120" y="102" text-anchor="middle" stroke="none">kode_pinjam</text>
    <rect x="220" y="80" width="160" height="34" fill="#ffffff"/>
    <rect x="380" y="80" width="200" height="34" fill="#ffffff"/>
    <rect x="20" y="114" width="200" height="34" fill="#ffffff"/>
    <text x="120" y="136" text-anchor="middle" stroke="none">nama_peminjam</text>
    <rect x="220" y="114" width="160" height="34" fill="#ffffff"/>
    <rect x="380" y="114" width="200" height="34" fill="#ffffff"/>
    <rect x="20" y="148" width="200" height="34" fill="#ffffff"/>
    <text x="120" y="170" text-anchor="middle" stroke="none">tanggal_lahir</text>
    <rect x="220" y="148" width="160" height="34" fill="#ffffff"/>
    <rect x="380" y="148" width="200" height="34" fill="#ffffff"/>
    <rect x="20" y="182" width="200" height="34" fill="#ffffff"/>
    <text x="120" y="204" text-anchor="middle" stroke="none">kelas</text>
    <rect x="220" y="182" width="160" height="34" fill="#ffffff"/>
    <rect x="380" y="182" width="200" height="34" fill="#ffffff"/>
    <rect x="20" y="216" width="200" height="34" fill="#ffffff"/>
    <text x="120" y="238" text-anchor="middle" stroke="none">terlambat</text>
    <rect x="220" y="216" width="160" height="34" fill="#ffffff"/>
    <rect x="380" y="216" width="200" height="34" fill="#ffffff"/>
  </g>
</svg>
