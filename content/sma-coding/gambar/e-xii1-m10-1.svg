  <rect x="74" y="176" width="142" height="38" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="70" y="172" width="150" height="46" fill="none" stroke="#222222" stroke-width="1.5"/>
