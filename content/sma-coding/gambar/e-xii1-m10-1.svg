  <text x="40.0" y="62.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">t</text>
  <rect x="70" y="34" width="150" height="46" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="145.0" y="62.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">peluang item</text>
  <rect x="220" y="34" width="150" height="46" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="295.0" y="62.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">dari 1000 shot</text>
  <rect x="10" y="80" width="60" height="46" fill="none" stroke="#222222" stroke-width="1.5"/>
