  <rect x="70" y="80" width="150" height="46" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="224" y="84" width="142" height="38" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="220" y="80" width="150" height="46" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="126" width="60" height="46" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="40.0" y="154.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
  <rect x="74" y="130" width="142" height="38" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
