  <text x="10" y="236" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Rumus: sin^2((2t + 1) theta), sin(theta) = 1/akar 8.</text>
  <text x="530" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Pemetaan label (tandai 011)</text>
  <rect x="400" y="34" width="130" height="46" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
