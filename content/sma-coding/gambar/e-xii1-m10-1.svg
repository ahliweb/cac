<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tabel peluang Grover tiga qubit dan pemetaan label</title>
  <desc id="d">Kiri: tabel pengulangan t sama dengan 1, 2, 3 dengan kolom peluang item bertanda dan perkiraan jumlah dari 1000 shot, sel kosong. Kanan: pemetaan label Qiskit 011 ke label di simulator dan indeksnya, sel kosong.</desc>
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="190" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Grover N = 8, item bertanda 110 (label Qiskit)</text>
