  <text x="465.0" y="154.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">simulatorku</text>
  <rect x="534" y="130" width="132" height="38" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
