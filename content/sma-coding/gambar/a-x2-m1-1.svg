<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" width="560" height="268" role="img" aria-labelledby="t d">
  <title id="t">Array a dengan lima elemen sebelum dan sesudah a[2] = a[1] + a[3]</title>
  <desc id="d">Dua baris kotak berindeks 0 sampai 4. Baris pertama berisi 4, 8, 15, 16, 23. Baris kedua kosong untuk isi array setelah pernyataan a[2] diisi a[1] ditambah a[3].</desc>
  <rect width="560" height="268" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="26" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">awal: int a[5] = {4, 8, 15, 16, 23};</text>
  <rect x="40" y="38" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="65.0" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">4</text>
  <text x="80.0" y="102" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">0</text>
  <rect x="120" y="38" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="160.0" y="65.0" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">8</text>
  <text x="160.0" y="102" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">1</text>
  <rect x="200" y="38" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="240.0" y="65.0" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">15</text>
  <text x="240.0" y="102" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">2</text>
  <rect x="280" y="38" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="320.0" y="65.0" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">16</text>
  <text x="320.0" y="102" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">3</text>
  <rect x="360" y="38" width="80" height="44" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="400.0" y="65.0" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">23</text>
  <text x="400.0" y="102" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">4</text>
  <text x="20" y="148" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">setelah a[2] = a[1] + a[3];</text>
  <rect x="40" y="160" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="224" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">0</text>
  <rect x="120" y="160" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="160.0" y="224" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">1</text>
  <rect x="200" y="160" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="240.0" y="224" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">2</text>
  <rect x="280" y="160" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="320.0" y="224" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">3</text>
  <rect x="360" y="160" width="80" height="44" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="400.0" y="224" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">4</text>
  <text x="20" y="256" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Tulis isi tiap kotak. Angka di bawah kotak = indeks.</text>
</svg>
