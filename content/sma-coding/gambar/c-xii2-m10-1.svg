<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Formulir catatan ulasan</title>
  <desc id="d">Tabel kosong empat kolom: tingkat, butir, bukti, saran, dengan tiga baris isian. Di bawahnya arti tiga tingkat: WAJIB, SARAN, dan Nit.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="90" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="55.0" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">tingkat</text>
  <rect x="10" y="46" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="10" y="96" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="10" y="146" width="90" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="100" y="10" width="160" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="180.0" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">butir</text>
  <rect x="100" y="46" width="160" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="100" y="96" width="160" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="100" y="146" width="160" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="10" width="190" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="355.0" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">bukti</text>
  <rect x="260" y="46" width="190" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="96" width="190" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="146" width="190" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="450" y="10" width="180" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="540.0" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">saran</text>
  <rect x="450" y="46" width="180" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="450" y="96" width="180" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="450" y="146" width="180" height="50" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="10" y="220" font-weight="bold">WAJIB: melanggar kebutuhan, keselamatan, atau privasi.</text>
    <text x="10" y="246" font-weight="bold">SARAN: membuat lebih mudah dirawat.</text>
    <text x="10" y="272" font-weight="bold">Nit: hal kecil yang boleh diabaikan penulis.</text>
  </g></svg>
