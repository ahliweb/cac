<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d">
  <title id="t">Bidang kompleks dengan titik 3 plus 4i</title>
  <desc id="d">Sumbu mendatar bagian real, sumbu tegak bagian imajiner. Anak panah dari titik asal ke titik 3 plus 4i. Di kanan tiga kotak kosong: modulus, konjugat, i kali z, dan satu kotak kosong untuk z kali konjugatnya.</desc>
  <rect width="660" height="330" fill="#ffffff"/>
  <defs><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b3261e"/></marker><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222222"/></marker></defs>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <line x1="30" y1="270" x2="350" y2="270" stroke="#222222" stroke-width="2" marker-end="url(#s)"/>
    <line x1="150" y1="310" x2="150" y2="20" stroke="#222222" stroke-width="2" marker-end="url(#s)"/>
    <text x="352" y="288">real</text>
    <text x="158" y="22">imajiner</text>
    <line x1="150" y1="270" x2="270" y2="70" stroke="#b3261e" stroke-width="3" marker-end="url(#p)"/>
    <line x1="270" y1="270" x2="270" y2="70" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="270" cy="70" r="4" fill="#222222"/>
    <text x="280" y="68">z = 3 + 4i</text>
    <text x="210" y="290" text-anchor="middle">3</text>
    <text x="280" y="175">4</text>
    <text x="400" y="40" font-weight="bold">Isi dengan pensil</text>
    <text x="400" y="78">modulus z</text>
    <rect x="530" y="60" width="110" height="26" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="400" y="118">konjugat z</text>
    <rect x="530" y="100" width="110" height="26" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="400" y="158">i kali z</text>
    <rect x="530" y="140" width="110" height="26" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="400" y="198">z kali konjugatnya</text>
    <rect x="530" y="180" width="110" height="26" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  </g>
</svg>
