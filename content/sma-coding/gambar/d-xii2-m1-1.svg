  <title id="t">Jadwal draf proyek akhir minggu 3 sampai 14</title>
  <desc id="d">Papan jadwal dengan sembilan tugas pada baris dan minggu 3 sampai 14 pada kolom. Sel berwarna menunjukkan minggu kerja tiap tugas dan huruf A, B, atau C adalah penanggung jawabnya. Garis putus-putus memisahkan minggu 13 dari minggu 14. Satu tugas tidak memuat huruf penanggung jawab. Kotak kosong di bawah untuk empat masalah yang kamu temukan.</desc>
