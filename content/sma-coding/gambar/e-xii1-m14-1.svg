<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d">
  <title id="t">Garis waktu pekerjaan di cloud quantum dengan kotak isian</title>
  <desc id="d">Garis waktu satu pekerjaan. Dari kiri: pekerjaan dikirim pada detik 0, lalu bagian menunggu antrean selama 1500 detik, lalu bagian pemakaian perangkat selama 20 detik, lalu hasil tiba. Tiga kotak kosong untuk waktu hasil tiba, waktu pemakaian yang ditagih, dan biaya pada tarif 96 USD per menit.</desc>
  <rect width="700" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="350" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Satu pekerjaan: menunggu lalu dipakai</text>
  <line x1="20" y1="110" x2="680" y2="110" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="30" y="80" width="420" height="60" fill="#f2f2f2" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="240" y="106" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">menunggu antrean</text>
  <text x="240" y="128" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1500 detik</text>
  <rect x="450" y="80" width="100" height="60" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/>
  <text x="500" y="106" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">dipakai</text>
  <text x="500" y="128" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">20 detik</text>
  <text x="30" y="70" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">kirim (detik 0)</text>
  <text x="550" y="70" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">hasil tiba</text>
  <line x1="550" y1="74" x2="550" y2="80" stroke="#222222" stroke-width="1.5"/>
  <text x="20" y="185" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Hasil tiba pada detik:</text>
  <rect x="220" y="162" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="235" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Waktu yang ditagih (detik):</text>
  <rect x="260" y="212" width="110" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="390" y="185" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Tarif: 96 USD per menit</text>
  <text x="390" y="235" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Biaya (USD):</text>
  <rect x="510" y="212" width="120" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="282" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Garis putus-putus = waktu menunggu, kotak bergaris tebal = waktu dipakai.</text>
</svg>
