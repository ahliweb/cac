<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-labelledby="t d">
<title id="t">Tiga unggahan yang menyalin satu sumber</title>
<desc id="d">Diagram: tiga kotak Unggahan 1, Unggahan 2, dan Unggahan 3 di kiri, masing-masing dengan panah berlabel menyalin ke satu kotak Satu sumber yang disalin di kanan. Di bawahnya ada kotak kosong untuk menulis banyaknya sumber independen.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="520" height="330" fill="#ffffff"/>
<text x="20" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Hasil pencarian Siswa A: tiga unggahan teratas yang dibuka</text>
<rect x="20" y="50" width="170" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
<text x="105" y="77" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Unggahan 1</text>
<line x1="190" y1="72" x2="318" y2="130" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<text x="200" y="64" font-family="sans-serif" font-size="14" fill="#222222">menyalin</text>
<rect x="20" y="120" width="170" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
<text x="105" y="147" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Unggahan 2</text>
<line x1="190" y1="142" x2="318" y2="150" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<text x="200" y="134" font-family="sans-serif" font-size="14" fill="#222222">menyalin</text>
<rect x="20" y="190" width="170" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
<text x="105" y="217" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Unggahan 3</text>
<line x1="190" y1="212" x2="318" y2="170" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<text x="200" y="240" font-family="sans-serif" font-size="14" fill="#222222">menyalin</text>
<rect x="320" y="115" width="170" height="70" fill="#ffffff" stroke="#1b7a3d" stroke-width="2"/>
<text x="405" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Satu sumber</text>
<text x="405" y="166" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">yang disalin</text>
<rect x="20" y="262" width="170" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="105" y="289" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Sumber independen</text>
<rect x="200" y="262" width="70" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="285" y="289" font-family="sans-serif" font-size="14" fill="#222222">buah</text>
</svg>
