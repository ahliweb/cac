<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d">
  <title id="t">Enam baris diff dengan kolom ditandai atau tidak kosong</title>
  <desc id="d">Enam baris diff bernomor 1 sampai 6: dua baris kepala berkas, satu baris hapus KEY_LAMA, satu baris tambah KEY_BARU, satu baris tambah komentar token, dan satu baris tambah nama. Kolom ditandai atau tidak kosong untuk diisi.</desc>
  <rect width="640" height="420" fill="#ffffff"/>
  <rect x="20" y="40" width="50" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="70.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">no</text>
  <rect x="70" y="40" width="420" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="70.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">baris diff</text>
  <rect x="490" y="40" width="130" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="555.0" y="70.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">ditandai?</text>
  <rect x="20" y="90" width="50" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="120.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">1</text>
  <rect x="70" y="90" width="420" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="120.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">--- a/config.ts</text>
  <rect x="490" y="90" width="130" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="140" width="50" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="170.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">2</text>
  <rect x="70" y="140" width="420" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="170.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">+++ b/config.ts</text>
  <rect x="490" y="140" width="130" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="190" width="50" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="220.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">3</text>
  <rect x="70" y="190" width="420" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="220.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">-const KEY_LAMA = "KUNCI_PALSU_CONTOH_111";</text>
  <rect x="490" y="190" width="130" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="240" width="50" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="270.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">4</text>
  <rect x="70" y="240" width="420" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="270.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">+const KEY_BARU = "KUNCI_PALSU_CONTOH_222";</text>
  <rect x="490" y="240" width="130" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="290" width="50" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="320.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">5</text>
  <rect x="70" y="290" width="420" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="320.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">+// token dibaca dari lingkungan</text>
  <rect x="490" y="290" width="130" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="340" width="50" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="370.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">6</text>
  <rect x="70" y="340" width="420" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="370.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">+const nama = "Warung Kopi Contoh";</text>
  <rect x="490" y="340" width="130" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Isi ya atau tidak untuk tiap baris.</text>
</svg>
