<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
  <title id="t">Pola UTF-8 dua byte dengan kotak bit kosong</title>
  <desc id="d">Tiga bagian. Atas: 11 kotak kosong untuk titik kode dalam biner. Tengah: byte pertama dengan tiga bit awal 1, 1, 0 dan lima kotak kosong, byte kedua dengan dua bit awal 1, 0 dan enam kotak kosong. Bawah: dua kotak kosong untuk byte dalam heksadesimal.</desc>
  <rect width="600" height="330" fill="#ffffff"/>
  <text x="10" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">1. Titik kode dalam biner (11 tempat bit, nol di kiri bila perlu)</text>
