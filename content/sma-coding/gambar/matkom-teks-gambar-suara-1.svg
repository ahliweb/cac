  <rect x="334" y="36" width="36" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="370" y="36" width="36" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="10" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">2. Isi bit titik kode ke tempat kosong, dari kanan</text>
  <text x="10" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">byte 1</text>
