<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 322" width="520" height="322" role="img" aria-labelledby="t d">
  <title id="t">Rencana proyek alarm tombol dengan isi kosong</title>
  <desc id="d">Tabel dua kolom: Bagian dan Isi untuk alarm tombol. Enam bagian: Tujuan, Masukan, Proses, Keluaran, Kriteria selesai, dan Prediksi. Semua isi kosong untuk diisi pelajar.</desc>
  <rect width="520" height="322" fill="#ffffff"/>
  <text x="250" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Rencana satu halaman: alarm tombol</text>
  <rect x="20" y="50" width="150" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="95.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Bagian</text>
  <rect x="170" y="50" width="330" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="335.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Isi untuk alarm tombol</text>
  <rect x="20" y="86" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
