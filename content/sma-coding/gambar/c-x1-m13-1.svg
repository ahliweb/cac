  <rect x="20" y="230" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95.0" y="253.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Kriteria selesai</text>
  <rect x="170" y="230" width="330" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="266" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95.0" y="289.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Prediksi</text>
