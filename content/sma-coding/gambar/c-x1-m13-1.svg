  <rect x="170" y="86" width="330" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="122" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95.0" y="145.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Masukan</text>
  <rect x="170" y="122" width="330" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="158" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95.0" y="181.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Proses</text>
  <rect x="170" y="158" width="330" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="194" width="150" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95.0" y="217.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Keluaran</text>
