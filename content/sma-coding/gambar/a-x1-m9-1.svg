<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel tebakan hasil ekspresi dengan int a = 17 dan int b = 5</title>
  <desc id="d">Empat baris ekspresi C++ yaitu a dibagi b, a sisa bagi b, a dibagi 5.0, dan double x diisi a dibagi b. Setiap baris punya kotak kosong untuk menulis hasil yang kamu tebak.</desc>
  <rect width="560" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#222222">Diketahui: int a = 17;  int b = 5;</text>
  <rect x="20" y="48" width="300" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="170" y="70" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">ekspresi</text>
  <rect x="320" y="48" width="220" height="34" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="430" y="70" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">hasil tebakanmu</text>
  <rect x="20" y="82" width="300" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="32" y="113" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">a / b</text>
  <rect x="320" y="82" width="220" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="340" y="91" width="180" height="32" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="132" width="300" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="32" y="163" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">a % b</text>
  <rect x="320" y="132" width="220" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="340" y="141" width="180" height="32" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="182" width="300" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="32" y="213" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">a / 5.0</text>
  <rect x="320" y="182" width="220" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="340" y="191" width="180" height="32" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="232" width="300" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="32" y="263" font-family="sans-serif" font-size="16" text-anchor="start" fill="#222222">double x = a / b;  lalu x</text>
  <rect x="320" y="232" width="220" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="340" y="241" width="180" height="32" rx="0" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="312" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">Tulis tebakan lebih dulu, baru jalankan programnya.</text>
</svg>
