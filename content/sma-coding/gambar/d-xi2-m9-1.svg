<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 270" width="590" height="270" role="img" aria-labelledby="t d">
  <title id="t">Tabel enam pengiriman untuk menghitung geser satu pada kolom hujan</title>
  <desc id="d">Enam pengiriman bernomor 1 sampai 6. Baris hujan berisi 1 1 0 0 1 0 dan baris terlambat berisi 1 1 0 1 1 0. Tiga baris kosong untuk hujan setelah digeser satu, tebakan, dan benar atau salah.</desc>
