<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
<title id="t">Diagram urutan membuka halaman web dengan kotak huruf kosong</title>
<desc id="d">Empat kolom: Peramban (klien), DNS, Router, dan Server, dengan garis putus-putus ke bawah. Lima langkah dari atas ke bawah, masing-masing satu panah dengan kotak kosong untuk huruf. Panah 1 dari Peramban ke DNS. Panah 2 dari DNS kembali ke Peramban. Panah 3 dari Peramban melewati Router sampai ke Server. Panah 4 dari Server kembali ke Peramban. Langkah 5 adalah kotak kosong di samping Peramban tanpa panah ke kolom lain.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="640" height="360" fill="#ffffff"/>
<rect x="20" y="10" width="120" height="40" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
<text x="80" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Peramban</text>
<rect x="180" y="10" width="120" height="40" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="240" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">DNS</text>
<rect x="340" y="10" width="120" height="40" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="400" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Router</text>
<rect x="500" y="10" width="120" height="40" rx="6" fill="#ffffff" stroke="#1b7a3d" stroke-width="2"/>
<text x="560" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Server</text>
<line x1="80" y1="50" x2="80" y2="340" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="240" y1="50" x2="240" y2="340" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="400" y1="50" x2="400" y2="340" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="560" y1="50" x2="560" y2="340" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="92" font-family="sans-serif" font-size="14" fill="#222222">1</text>
<line x1="80" y1="90" x2="238" y2="90" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<rect x="140" y="62" width="40" height="28" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="152" font-family="sans-serif" font-size="14" fill="#222222">2</text>
<line x1="240" y1="150" x2="82" y2="150" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<rect x="140" y="122" width="40" height="28" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="212" font-family="sans-serif" font-size="14" fill="#222222">3</text>
<line x1="80" y1="210" x2="558" y2="210" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="182" width="40" height="28" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="272" font-family="sans-serif" font-size="14" fill="#222222">4</text>
<line x1="560" y1="270" x2="82" y2="270" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="242" width="40" height="28" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="322" font-family="sans-serif" font-size="14" fill="#222222">5</text>
<rect x="100" y="304" width="40" height="28" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="156" y="323" font-family="sans-serif" font-size="14" fill="#222222">di Peramban</text>
<text x="620" y="352" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="end">Tulis huruf langkah di tiap kotak.</text>
</svg>
