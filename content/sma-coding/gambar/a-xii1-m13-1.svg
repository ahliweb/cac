<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-labelledby="t d">
<title id="t">Tabel rencana proyek satu halaman dengan tujuh bagian</title>
<desc id="d">Tabel dua kolom: tujuh bagian rencana proyek, yaitu tujuan, masukan, aturan, keluaran, kriteria selesai, daftar uji, dan prediksi, dengan kolom isi yang kosong untuk kamu tulis.</desc>
<rect width="540" height="330" fill="#ffffff"/>

<g font-family="sans-serif">
