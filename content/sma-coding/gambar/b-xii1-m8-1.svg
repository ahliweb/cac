<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="t d">
  <title id="t">Tabel lima pemanggilan fungsi judul dan alamat dengan kolom tercetak kosong</title>
  <desc id="d">Tabel lima baris pemanggilan: judulLengkap Kontak, judulLengkap nama situs, ringkas dengan deskripsi undefined, dan dua pemanggilan new URL. Kolom tercetak kosong untuk diisi.</desc>
  <rect width="720" height="370" fill="#ffffff"/>
  <rect x="15" y="30" width="460" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="245.0" y="60.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">baris kode</text>
  <rect x="475" y="30" width="235" height="50" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="592.5" y="60.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">tercetak</text>
  <rect x="15" y="80" width="460" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="245.0" y="110.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">judulLengkap("Kontak", "Warung Kopi Contoh")</text>
  <rect x="475" y="80" width="235" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="15" y="130" width="460" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="245.0" y="160.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">judulLengkap("Warung Kopi Contoh", "Warung Kopi Contoh")</text>
  <rect x="475" y="130" width="235" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="15" y="180" width="460" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="245.0" y="210.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">ringkas(undefined, "Kopi dan roti buatan sendiri.")</text>
  <rect x="475" y="180" width="235" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="15" y="230" width="460" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="245.0" y="260.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">new URL("/tentang", "https://situs.example").href</text>
  <rect x="475" y="230" width="235" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="15" y="280" width="460" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="245.0" y="310.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">new URL("tentang", "https://situs.example/info/").href</text>
  <rect x="475" y="280" width="235" height="50" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Isi kotak putus-putus dengan teks yang tercetak.</text>
</svg>
