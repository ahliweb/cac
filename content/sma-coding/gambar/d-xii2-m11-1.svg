<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="t d">
  <title id="t">Formulir ulasan tiga bagian dan hitung ulang recall</title>
  <desc id="d">Kiri: tiga kotak Sudah baik, Perlu diperbaiki, Langkah berikutnya dengan garis isian dan garis bukti. Kanan: kotak hitung ulang recall Edelweis dengan laporan 0,65, terdeteksi 21, terlewat 15, dan kotak kosong untuk jumlah terlambat, recall hitungan sendiri, cocok atau tidak.</desc>
  <rect width="700" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="15" y="15" width="360" height="100" rx="6" fill="#f2f2f2" stroke="#1b7a3d" stroke-width="2"/>
    <text x="27" y="38" font-weight="bold">1. Sudah baik</text>
    <line x1="27" y1="62" x2="363" y2="62" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="27" y="100">bukti:</text>
    <line x1="80" y1="100" x2="363" y2="100" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="15" y="125" width="360" height="100" rx="6" fill="#f2f2f2" stroke="#b3261e" stroke-width="2"/>
    <text x="27" y="148" font-weight="bold">2. Perlu diperbaiki</text>
    <line x1="27" y1="172" x2="363" y2="172" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="27" y="210">bukti:</text>
    <line x1="80" y1="210" x2="363" y2="210" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="15" y="235" width="360" height="100" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="27" y="258" font-weight="bold">3. Langkah berikutnya</text>
    <line x1="27" y1="282" x2="363" y2="282" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="27" y="320">bukti:</text>
    <line x1="80" y1="320" x2="363" y2="320" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="395" y="15" width="290" height="320" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="410" y="40" font-weight="bold">Hitung ulang recall</text>
    <text x="410" y="70">laporan Edelweis: recall 0,65</text>
    <text x="410" y="100">terdeteksi: 21</text>
    <text x="410" y="130">terlewat: 15</text>
    <text x="410" y="170">jumlah seluruh terlambat:</text>
    <rect x="410" y="180" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="410" y="240">recall hitunganmu:</text>
    <rect x="410" y="250" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="410" y="308">cocok dengan laporan?</text>
    <rect x="410" y="318" width="20" height="14" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="436" y="331">ya</text>
    <rect x="480" y="318" width="20" height="14" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="506" y="331">tidak</text>
  </g>
</svg>
