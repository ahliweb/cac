<title id="t">Keterlacakan kebutuhan ke uji</title>
<desc id="d">Tabel lima kebutuhan K1 sampai K5 dengan batas dan cara ukur, dan kolom kosong uji yang menunjuknya. Di bawahnya daftar empat uji U1 sampai U4.</desc>
