<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-labelledby="t d">
<title id="t">Tiga berkas dikompilasi lalu ditautkan</title>
<desc id="d">Diagram: alat.h disertakan oleh a.cpp dan b.cpp; a.cpp dikompilasi menjadi a.o dan b.cpp menjadi b.o; a.o dan b.o ditautkan menjadi program salah. Di dekat tiap langkah ada kotak kosong untuk menulis berhasil atau gagal.</desc>
<rect width="540" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<g font-family="sans-serif">
<rect x="215" y="10" width="110" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="270.0" y="32.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">alat.h</text>
<rect x="30" y="90" width="120" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="90.0" y="112.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">a.cpp</text>
<rect x="370" y="90" width="120" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="430.0" y="112.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">b.cpp</text>
<line x1="240.0" y1="44.0" x2="120.0" y2="88.0" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="300.0" y1="44.0" x2="400.0" y2="88.0" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<text x="150" y="62" font-size="14" text-anchor="end" fill="#222222">#include</text>
<text x="370" y="62" font-size="14" text-anchor="start" fill="#222222">#include</text>
<rect x="30" y="190" width="120" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="90.0" y="212.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">a.o</text>
<rect x="370" y="190" width="120" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="430.0" y="212.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">b.o</text>
<line x1="90.0" y1="124.0" x2="90.0" y2="188.0" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="430.0" y1="124.0" x2="430.0" y2="188.0" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<text x="100" y="146" font-size="14" text-anchor="start" fill="#222222">g++ -c a.cpp</text>
<text x="100" y="170" font-size="14" text-anchor="start" fill="#222222">hasil:</text>
<rect x="150" y="152" width="85" height="24" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="420" y="146" font-size="14" text-anchor="end" fill="#222222">g++ -c b.cpp</text>
<text x="325" y="170" font-size="14" text-anchor="end" fill="#222222">hasil:</text>
<rect x="332" y="152" width="85" height="24" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="100.0" y1="224.0" x2="230.0" y2="280.0" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<line x1="420.0" y1="224.0" x2="310.0" y2="280.0" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
<rect x="215" y="282" width="110" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="270.0" y="304.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">salah</text>
<text x="20" y="262" font-size="14" text-anchor="start" fill="#222222">g++ a.o b.o -o salah</text>
<text x="345" y="306" font-size="14" text-anchor="start" fill="#222222">hasil:</text>
<rect x="395" y="288" width="85" height="24" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</g>
</svg>
