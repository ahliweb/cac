<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 510" width="620" height="510" role="img" aria-labelledby="t d">
<title id="t">Tumpukan dan antrian berisi 1, 2, 3 serta tabel penelusuran Latihan 1</title>
<desc id="d">Bagian atas kiri: tumpukan vertikal dengan 3 di puncak, lalu 2, lalu 1 di dasar, dan kotak kosong untuk elemen yang keluar. Bagian atas kanan: antrian horizontal berisi 1, 2, 3 dengan depan di kiri dan belakang di kanan, dan kotak kosong untuk elemen yang keluar. Bagian bawah: tabel tujuh operasi masuk(1), masuk(2), keluar(), masuk(3), keluar(), keluar(), keluar() dengan kolom nilai yang dikembalikan untuk Tumpukan dan Antrian yang kosong.</desc>
