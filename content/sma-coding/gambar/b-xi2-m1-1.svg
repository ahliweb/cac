<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="t d">
  <title id="t">Dua terminal: server dan curl</title>
  <desc id="d">Dua kotak berdampingan. Kotak kiri bertuliskan Terminal 1: bun run server.ts, dengan lima baris kosong untuk mencatat apa yang tercetak. Kotak kanan Terminal 2: curl ke alamat localhost jalur / dan jalur /tentang, dengan kotak kosong untuk kode status dan badan balasan.</desc>
  <rect width="640" height="270" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="10" y="10" width="290" height="250" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="22" y="34" font-weight="bold">Terminal 1: bun run server.ts</text>
    <text x="22" y="54">Tercetak (urut dari atas):</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff" stroke-dasharray="5 4">
      <rect x="22" y="64" width="266" height="28"/><rect x="22" y="98" width="266" height="28"/><rect x="22" y="132" width="266" height="28"/><rect x="22" y="166" width="266" height="28"/><rect x="22" y="200" width="266" height="28"/>
    </g>
    <rect x="340" y="10" width="290" height="250" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
    <text x="352" y="34" font-weight="bold">Terminal 2: curl -si</text>
    <text x="352" y="58">curl http://localhost:3000/tentang</text>
    <text x="352" y="82">Kode status:</text>
    <rect x="352" y="90" width="266" height="28" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="352" y="146">Badan balasan:</text>
    <rect x="352" y="154" width="266" height="28" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="352" y="208">Setelah curl .../ dan curl .../tentang,</text><text x="352" y="228">isi Terminal 1 di kiri.</text>
    <line x1="340" y1="135" x2="300" y2="135" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
