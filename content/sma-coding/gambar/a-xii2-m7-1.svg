<rect x="170" y="50" width="60" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="70.25" font-size="15" text-anchor="middle" fill="#222222">2</text>
<rect x="230" y="50" width="60" height="30" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="260.0" y="70.25" font-size="15" text-anchor="middle" fill="#222222">4</text>
<text x="300" y="48" font-size="16" text-anchor="start" font-weight="bold" fill="#222222">S = 5</text>
<text x="20" y="105" font-size="14" text-anchor="start" fill="#222222">Telusuri fungsi salah. Tulis nilai tiap kolom pada akhir tiap putaran kanan.</text>
