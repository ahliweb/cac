<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="540" height="270" role="img" aria-labelledby="t d">
<title id="t">Larik tiga bilangan dan tabel dua penunjuk</title>
<desc id="d">Larik a berindeks 0 sampai 2 berisi 3, 2, 4 dengan S sama dengan 5, dan tabel penelusuran dua penunjuk dengan kolom kanan, jumlah, kiri, dan terbaik; tiga baris kosong.</desc>
