<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 236" width="650" height="236" role="img" aria-labelledby="t d">
  <title id="t">Tabel empat kolam dengan kolom isian luas, rasio, dan perlu pompa</title>
  <desc id="d">Tabel kolam dengan panjang dan lebar (5 dan 4, 12 dan 9, 8 dan 14, 3 dan 3). Kolom luas, rasio panjang per lebar, dan perlu pompa dibiarkan kosong untuk diisi.</desc>
  <rect width="650" height="236" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Penanda perlu pompa: luas lebih dari 100 (tulis 1 atau 0)</text>
    <rect x="20" y="46" width="90" height="34" fill="#f2f2f2"/>
    <text x="65" y="68" text-anchor="middle" stroke="none" font-weight="bold">kolam</text>
