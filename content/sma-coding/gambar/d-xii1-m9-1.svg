<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-labelledby="t d">
  <title id="t">Lembar ulasan tiga bagian: data, model, dan klaim</title>
  <desc id="d">Tiga kolom berlabel Data, Model, dan Klaim. Tiap kolom punya satu pertanyaan, kotak ya dan tidak yang kosong, dan satu garis kosong untuk bukti.</desc>
  <rect width="660" height="270" fill="#ffffff"/>
  <text x="330" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Ulasan paket Tim Lontar</text>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="15" y="40" width="200" height="215" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="115" y="64" font-weight="bold" text-anchor="middle">1. Data</text>
    <text x="25" y="95">Ada baris yang sama</text>
    <text x="25" y="113">di data latih dan uji?</text>
    <rect x="40" y="135" width="22" height="22" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="68" y="152">ya</text>
    <rect x="120" y="135" width="22" height="22" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="148" y="152">tidak</text>
    <text x="25" y="190">bukti:</text>
    <line x1="25" y1="225" x2="205" y2="225" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="230" y="40" width="200" height="215" rx="6" fill="#f2f2f2" stroke="#1b7a3d" stroke-width="2"/>
    <text x="330" y="64" font-weight="bold" text-anchor="middle">2. Model</text>
    <text x="240" y="95">Semua fitur diketahui</text>
    <text x="240" y="113">saat keputusan dibuat?</text>
    <rect x="255" y="135" width="22" height="22" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="283" y="152">ya</text>
    <rect x="335" y="135" width="22" height="22" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="363" y="152">tidak</text>
    <text x="240" y="190">bukti:</text>
    <line x1="240" y1="225" x2="420" y2="225" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="445" y="40" width="200" height="215" rx="6" fill="#f2f2f2" stroke="#b3261e" stroke-width="2"/>
    <text x="545" y="64" font-weight="bold" text-anchor="middle">3. Klaim</text>
    <text x="455" y="95">Angka klaim cocok</text>
    <text x="455" y="113">dengan hitung ulang?</text>
    <rect x="470" y="135" width="22" height="22" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="498" y="152">ya</text>
    <rect x="550" y="135" width="22" height="22" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="578" y="152">tidak</text>
    <text x="455" y="190">bukti:</text>
    <line x1="455" y1="225" x2="635" y2="225" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
</svg>
