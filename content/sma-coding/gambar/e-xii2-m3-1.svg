<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-labelledby="t d">
<title id="t">Diagram pola hibrida dengan dua lajur kosong</title>
<desc id="d">Dua lajur berdampingan: komputer klasik di kiri dan perangkat kuantum atau simulator di kanan. Tiap lajur punya tiga kotak isian kosong. Panah dari kiri ke kanan dan dari kanan ke kiri menghubungkan kotak sejajar, dengan satu panah berlabel hitungan hasil.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="660" height="320" fill="#ffffff"/>
<rect x="20" y="20" width="270" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="155" y="46" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">komputer klasik</text>
<rect x="370" y="20" width="270" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="505" y="46" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">perangkat kuantum / simulator</text>
<rect x="20" y="80" width="270" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="370" y="80" width="270" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="160" width="270" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="370" y="160" width="270" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="240" width="270" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="370" y="240" width="270" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="292" y1="100" x2="368" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<text x="330" y="92" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kirim</text>
<line x1="368" y1="150" x2="292" y2="150" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<text x="330" y="142" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kembali</text>
<line x1="292" y1="180" x2="368" y2="180" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<line x1="368" y1="230" x2="292" y2="230" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
<text x="330" y="305" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Ulangi sampai energi berhenti turun.</text>
</svg>
