<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran lima sirkuit pada keadaan nol</title>
  <desc id="d">Lima baris sirkuit: awal nol, H, H lalu H, H Z H, X lalu H. Baris awal terisi amplitudo 1, 0 dan sah ya. Kolom amplitudo, P(0), dan sah kosong untuk baris lainnya.</desc>
  <rect width="680" height="290" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="15" y="10" width="650" height="34" fill="#2a5d9f"/>
    <text x="25" y="32" fill="#ffffff">sirkuit</text>
    <text x="285" y="32" fill="#ffffff" text-anchor="middle">(a0, a1)</text>
    <text x="410" y="32" fill="#ffffff" text-anchor="middle">P(0)</text>
    <text x="545" y="32" fill="#ffffff" text-anchor="middle">sah?</text>
    <rect x="15" y="44" width="650" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="70">awal |0&gt;</text>
    <text x="285" y="70" text-anchor="middle">(1, 0)</text>
    <text x="505" y="70" text-anchor="middle">ya</text>
    <rect x="15" y="84" width="650" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="110">H</text>
    <rect x="15" y="124" width="650" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="150">H lalu H</text>
    <rect x="15" y="164" width="650" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="190">H, Z, H</text>
    <rect x="15" y="204" width="650" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="230">X lalu H</text>
    <line x1="170" y1="10" x2="170" y2="244" stroke="#222222" stroke-width="1.5"/>
    <line x1="365" y1="10" x2="365" y2="244" stroke="#222222" stroke-width="1.5"/>
    <line x1="460" y1="10" x2="460" y2="244" stroke="#222222" stroke-width="1.5"/>
    <text x="15" y="272">jumlah kuadrat harus 1 dengan toleransi kecil, bukan sama persis</text>
  </g>
</svg>
