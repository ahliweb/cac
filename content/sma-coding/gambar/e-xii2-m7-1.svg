<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="t d">
<title id="t">Empat langkah sprint implementasi dengan kolom uji tangan kosong</title>
<desc id="d">Tabel empat baris langkah: representasi keadaan dan fungsi baca, satu gerbang, gerbang dua qubit, histogram. Kolom uji tangan yang dihitung dulu dan kolom hijau ya atau belum kosong untuk diisi.</desc>

<rect width="660" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="250" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="145.0" y="44" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">langkah</text>
<rect x="270" y="20" width="270" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="405.0" y="44" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">uji tangan (dihitung dulu)</text>
<rect x="540" y="20" width="100" height="38" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="590.0" y="44" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">hijau?</text>
<rect x="20" y="58" width="250" height="60" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="30" y="84" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">1 representasi keadaan</text>
<text x="30" y="104" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">dan fungsi baca</text>
<rect x="270" y="58" width="270" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="58" width="100" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="118" width="250" height="60" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="30" y="144" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">2 satu gerbang</text>
<text x="30" y="164" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">dan ujinya</text>
<rect x="270" y="118" width="270" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="118" width="100" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="178" width="250" height="60" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="30" y="204" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">3 gerbang dua qubit</text>
<text x="30" y="224" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">dan ujinya</text>
<rect x="270" y="178" width="270" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="178" width="100" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="20" y="238" width="250" height="60" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="30" y="264" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">4 histogram</text>
<text x="30" y="284" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">dan ujinya</text>
<rect x="270" y="238" width="270" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="540" y="238" width="100" height="60" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="330" y="318" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Setiap langkah berakhir dengan uji hijau sebelum langkah berikutnya.</text>
</svg>
