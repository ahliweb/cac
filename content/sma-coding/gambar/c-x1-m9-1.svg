<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 260" width="530" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tabel kebenaran dengan kolom hasil kosong</title>
  <desc id="d">Tabel kebenaran empat baris untuk kombinasi A dan B (0 0, 0 1, 1 0, 1 1). Kolom A dan B terisi. Kolom A dan B, A atau B, serta A atau B dan bukan A dan B kosong untuk diisi 0 atau 1.</desc>
