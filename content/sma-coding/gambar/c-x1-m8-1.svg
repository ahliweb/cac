<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 295" width="556" height="295" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran loop dengan waktu dan keadaan pin kosong</title>
  <desc id="d">Tabel empat baris: putaran 1 dan 2 dari loop, masing-masing digitalWrite HIGH lalu digitalWrite LOW pada pin LED, dengan JEDA_MS 500. Kolom waktu dalam milidetik dan kolom keadaan pin 2 kosong untuk diisi.</desc>
  <rect width="556" height="295" fill="#ffffff"/>
  <text x="255" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Tabel penelusuran loop() dengan JEDA_MS = 500</text>
  <rect x="20" y="50" width="90" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="65.0" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Putaran</text>
  <rect x="110" y="50" width="225" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="222.5" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Baris yang berjalan</text>
  <rect x="335" y="50" width="101" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="385.5" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Waktu (ms)</text>
  <rect x="436" y="50" width="100" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="486.0" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Pin 2</text>
  <rect x="20" y="90" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="65.0" y="115.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
  <rect x="110" y="90" width="225" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="222.5" y="115.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">digitalWrite(PIN_LED, HIGH)</text>
  <rect x="335" y="90" width="101" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="436" y="90" width="100" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="130" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="65.0" y="155.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
  <rect x="110" y="130" width="225" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="222.5" y="155.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">digitalWrite(PIN_LED, LOW)</text>
  <rect x="335" y="130" width="101" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="436" y="130" width="100" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="170" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="65.0" y="195.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
  <rect x="110" y="170" width="225" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="222.5" y="195.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">digitalWrite(PIN_LED, HIGH)</text>
  <rect x="335" y="170" width="101" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="436" y="170" width="100" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="210" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="65.0" y="235.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
  <rect x="110" y="210" width="225" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="222.5" y="235.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">digitalWrite(PIN_LED, LOW)</text>
  <rect x="335" y="210" width="101" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="436" y="210" width="100" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="255" y="278" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Waktu = nilai waktu_ms saat baris itu berjalan.</text>
</svg>
