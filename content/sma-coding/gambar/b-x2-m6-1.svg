<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="t d">
<title id="t">Pohon DOM halaman prediksi dan tabel isi paragraf tiap klik</title>
<desc id="d">Bagian atas: pohon DOM dengan simpul body di atas dan tiga anaknya p id hasil, button id b, dan script. Bagian bawah: tabel dengan kolom klik ke, n, dan isi paragraf hasil. Baris awal berisi n 0 dan isi Belum ada klik; tiga baris klik ke 1, 2, 3 kosong untuk diisi pelajar.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="560" height="420" fill="#ffffff"/>
<text x="20" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Pohon DOM halaman Prediksi</text>
<rect x="220" y="38" width="120" height="34" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="59.9" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">body</text>
<rect x="60" y="110" width="120" height="34" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="120.0" y="131.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">p #hasil</text>
<line x1="280" y1="72" x2="120" y2="110" stroke="#222222" stroke-width="1.5"/>
<rect x="240" y="110" width="120" height="34" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="131.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">button #b</text>
<line x1="280" y1="72" x2="300" y2="110" stroke="#222222" stroke-width="1.5"/>
<rect x="420" y="110" width="120" height="34" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="480.0" y="131.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">script</text>
<line x1="280" y1="72" x2="480" y2="110" stroke="#222222" stroke-width="1.5"/>
<text x="20" y="190" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Isi paragraf #hasil tiap klik (n mulai 0, tiap klik n = n + 2)</text>
<rect x="20" y="204" width="90" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="229.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">klik ke</text>
<rect x="110" y="204" width="90" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="155.0" y="229.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">n</text>
<rect x="200" y="204" width="340" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="370.0" y="229.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">isi #hasil</text>
<rect x="20" y="244" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="269.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">awal</text>
<rect x="110" y="244" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="155.0" y="269.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0</text>
