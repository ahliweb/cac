<text x="370.0" y="269.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Belum ada klik</text>
<rect x="20" y="284" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="309.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
<rect x="110" y="284" width="90" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="200" y="284" width="340" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="20" y="324" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="349.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
