<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel lima elemen formulir dengan kolom masalah aksesibilitas kosong</title>
  <desc id="d">Tabel lima baris elemen: h1 Pendaftaran klub, img favicon svg, p catatan, input teks nama, dan h4 Syarat. Kolom ada masalah atau tidak dan kolom masalahnya kosong untuk diisi.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <rect x="10" y="30" width="370" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="63.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">elemen</text>
  <rect x="380" y="30" width="80" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="420.0" y="63.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">masalah?</text>
  <rect x="460" y="30" width="250" height="56" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="585.0" y="63.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">apa masalahnya</text>
  <rect x="10" y="86" width="370" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="119.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;h1&gt;Pendaftaran klub&lt;/h1&gt;</text>
  <rect x="380" y="86" width="80" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="460" y="86" width="250" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="10" y="142" width="370" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="175.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;img src="/favicon.svg" width="40" height="40" /&gt;</text>
  <rect x="380" y="142" width="80" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="460" y="142" width="250" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="10" y="198" width="370" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="231.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;p class="catatan"&gt; teks #9ca3af, latar putih</text>
  <rect x="380" y="198" width="80" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="460" y="198" width="250" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="10" y="254" width="370" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="287.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;input type="text" name="nama" /&gt;</text>
  <rect x="380" y="254" width="80" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="460" y="254" width="250" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="10" y="310" width="370" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="343.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;h4&gt;Syarat&lt;/h4&gt;</text>
  <rect x="380" y="310" width="80" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="460" y="310" width="250" height="56" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="390" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Isi ya atau tidak, lalu tulis masalahnya.</text>
</svg>
