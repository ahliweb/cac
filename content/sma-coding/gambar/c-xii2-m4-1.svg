" stroke="#222222" stroke-width="2"/><text x="30" y="162" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">4</text><text x="70" y="162" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">const char *ALAMAT_SERVER = "http://penengah.lab.example/data";</text><rect x="560" y="144" width="130" height="26" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="173" width="680" height="32" rx="0" fill="none" stroke="#222222" stroke-width="2"/><text x="30" y="194" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">5</text><text x="70" y="194" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Serial.println(namaPengguna);</text><rect x="560" y="176" width="130" height="26" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="205" width="680" height="32" rx="0" fill="none" stroke="#222222" stroke-width="2"/><text x="30" y="226" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">6</text><text x="70" y="226" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">const int PIN_SENSOR = 34;</text><rect x="560" y="208" width="130" height="26" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="237" width="680" height="32" rx="0" fill="none" stroke="#222222" stroke-width="2"/><text x="30" y="258" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">7</text><text x="70" y="258" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">const char *ALAMAT_AMAN = "https://penengah.lab.example/data";</text><rect x="560" y="240" width="130" height="26" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="269" width="680" height="32" rx="0" fill="none" stroke="#222222" stroke-width="2"/><text x="30" y="290" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">8</text><text x="70" y="290" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">const char *PW_WIFI = "contoh-bukan-asli";</text><rect x="560" y="272" width="130" height="26" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="301" width="680" height="32" rx="0" fill="none" stroke="#222222" stroke-width="2"/><text x="30" y="322" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">9</text><text x="70" y="322" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">#include "rahasia.h"</text><rect x="560" y="304" width="130" height="26" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/><text x="20" y="368" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">R1: nama SANDI/TOKEN/KUNCI/PASS diberi nilai langsung.</text><text x="20" y="390" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">R2: alamat http://.   R3: cetak NAMA/ALAMATRUMAH/TELEPON.</text>
