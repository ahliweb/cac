<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 226" width="660" height="226" role="img" aria-labelledby="t d">
  <title id="t">Tiga pengamatan hari hujan dengan baris selisih kosong</title>
  <desc id="d">Tabel tiga pengamatan. Nyata: 9,0 11,5 8,0. Tebakan: 4,0 6,5 3,5. Baris selisih mutlak dan sel galat rata-rata dibiarkan kosong.</desc>
  <rect width="660" height="226" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Galat rata-rata = rata-rata selisih mutlak</text>
    <rect x="20" y="46" width="190" height="40" fill="#f2f2f2"/>
    <rect x="210" y="46" width="100" height="40" fill="#f2f2f2"/>
    <text x="260" y="71" text-anchor="middle" stroke="none" font-weight="bold">pengamatan 1</text>
    <rect x="310" y="46" width="100" height="40" fill="#f2f2f2"/>
    <text x="360" y="71" text-anchor="middle" stroke="none" font-weight="bold">pengamatan 2</text>
    <rect x="410" y="46" width="100" height="40" fill="#f2f2f2"/>
    <text x="460" y="71" text-anchor="middle" stroke="none" font-weight="bold">pengamatan 3</text>
    <rect x="510" y="46" width="130" height="40" fill="#f2f2f2"/>
    <text x="575" y="71" text-anchor="middle" stroke="none" font-weight="bold">galat rata-rata</text>
    <rect x="20" y="86" width="190" height="40" fill="#ffffff"/>
    <text x="115" y="111" text-anchor="middle" stroke="none">nyata (menit)</text>
    <rect x="210" y="86" width="100" height="40" fill="#ffffff"/>
    <text x="260" y="111" text-anchor="middle" stroke="none">9,0</text>
    <rect x="310" y="86" width="100" height="40" fill="#ffffff"/>
    <text x="360" y="111" text-anchor="middle" stroke="none">11,5</text>
    <rect x="410" y="86" width="100" height="40" fill="#ffffff"/>
    <text x="460" y="111" text-anchor="middle" stroke="none">8,0</text>
    <rect x="510" y="86" width="130" height="40" fill="#ffffff"/>
    <rect x="20" y="126" width="190" height="40" fill="#ffffff"/>
    <text x="115" y="151" text-anchor="middle" stroke="none">tebakan (menit)</text>
    <rect x="210" y="126" width="100" height="40" fill="#ffffff"/>
    <text x="260" y="151" text-anchor="middle" stroke="none">4,0</text>
    <rect x="310" y="126" width="100" height="40" fill="#ffffff"/>
    <text x="360" y="151" text-anchor="middle" stroke="none">6,5</text>
    <rect x="410" y="126" width="100" height="40" fill="#ffffff"/>
    <text x="460" y="151" text-anchor="middle" stroke="none">3,5</text>
    <rect x="510" y="126" width="130" height="40" fill="#ffffff"/>
    <rect x="20" y="166" width="190" height="40" fill="#ffffff"/>
    <text x="115" y="191" text-anchor="middle" stroke="none">selisih mutlak</text>
    <rect x="210" y="166" width="100" height="40" fill="#ffffff"/>
    <rect x="310" y="166" width="100" height="40" fill="#ffffff"/>
    <rect x="410" y="166" width="100" height="40" fill="#ffffff"/>
    <rect x="510" y="166" width="130" height="40" fill="#ffffff"/>
  </g>
</svg>
