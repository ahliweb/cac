  <text x="20" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Basis 0: |0&gt; dan |1&gt;.  Basis 1: |+&gt; dan |-&gt;.  Tanpa penyadap.</text>
