<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 311" width="520" height="311" role="img" aria-labelledby="t d">
  <title id="t">Tabel hasil gerbang rilis kandidat yang masih kosong</title>
  <desc id="d">Tabel lima langkah gerbang: konten, seed kering, uji seed, hasil build, dan tema. Kolom lolos atau gagal dan kolom kode keluar kosong untuk diisi pelajar.</desc>
  <rect width="520" height="311" fill="#ffffff"/>
  <text x="250" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Hasil gerbang rilis kandidat</text>
  <rect x="20" y="50" width="170" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="105.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Langkah gerbang</text>
  <rect x="190" y="50" width="150" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="265.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Lolos / gagal</text>
  <rect x="340" y="50" width="160" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="420.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Kode keluar</text>
  <rect x="20" y="86" width="170" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="109.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">konten</text>
  <rect x="190" y="86" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="86" width="160" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="122" width="170" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="145.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">seed (kering)</text>
  <rect x="190" y="122" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="122" width="160" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="158" width="170" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="181.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">uji seed</text>
  <rect x="190" y="158" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="158" width="160" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="194" width="170" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="217.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">hasil build</text>
  <rect x="190" y="194" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="194" width="160" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="230" width="170" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="253.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">tema</text>
  <rect x="190" y="230" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="230" width="160" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="250" y="294" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Isi dari prediksimu untuk ikon lama dan untuk ikon baru.</text>
