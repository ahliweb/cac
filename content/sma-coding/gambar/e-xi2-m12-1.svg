  <title id="t">Tabel P(000) untuk tiga fungsi tiga bit</title>
  <desc id="d">Tabel dengan kolom f untuk x dari 000 sampai 111, jumlah (-1) pangkat f(x), P(000), dan golongan. Tiga baris: 11110000, 11111111, dan 10000000. Kolom jumlah, P(000), dan golongan kosong untuk diisi.</desc>
