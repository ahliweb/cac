<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 230" width="714" height="230" role="img" aria-labelledby="t d">
  <title id="t">Lima kartu langkah membaca sensor dalam urutan acak</title>
  <desc id="d">Lima kartu berlabel A sampai E dalam urutan acak: memakai nilai, membuat objek, memeriksa kegagalan, memulai dengan mulai, dan membaca dengan bacaSuhu. Di bawah tiap kartu ada kotak kosong urutan ke untuk diisi nomor 1 sampai 5.</desc>
  <rect width="714" height="230" fill="#ffffff"/>
  <text x="340" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Langkah membaca sensor lewat pustaka (urutan acak)</text>
  <rect x="20" y="50" width="122" height="70" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="81.0" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">A</text>
  <text x="81.0" y="92.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">memakai</text>
  <text x="81.0" y="110.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">nilai</text>
  <rect x="51.0" y="132" width="60" height="32" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="81.0" y="180" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">urutan ke</text>
  <rect x="158" y="50" width="122" height="70" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="219.0" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">B</text>
  <text x="219.0" y="92.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">membuat</text>
  <text x="219.0" y="110.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">objek</text>
  <rect x="189.0" y="132" width="60" height="32" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="219.0" y="180" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">urutan ke</text>
  <rect x="296" y="50" width="122" height="70" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="357.0" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">C</text>
  <text x="357.0" y="92.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">memeriksa</text>
  <text x="357.0" y="110.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kegagalan</text>
  <rect x="327.0" y="132" width="60" height="32" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="357.0" y="180" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">urutan ke</text>
  <rect x="434" y="50" width="122" height="70" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="495.0" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">D</text>
  <text x="495.0" y="92.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">memulai</text>
  <text x="495.0" y="110.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">mulai()</text>
  <rect x="465.0" y="132" width="60" height="32" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="495.0" y="180" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">urutan ke</text>
  <rect x="572" y="50" width="122" height="70" rx="6" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="633.0" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">E</text>
  <text x="633.0" y="92.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">membaca</text>
  <text x="633.0" y="110.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">bacaSuhu()</text>
  <rect x="603.0" y="132" width="60" height="32" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
