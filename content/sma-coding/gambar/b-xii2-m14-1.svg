<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-labelledby="t d">
  <title id="t">Dua tabel isian: empat baris pemindai rahasia dan tiga kasus hukum</title>
  <desc id="d">Tabel pertama berjudul Telusuri: empat baris kode dengan kolom hasil adaRahasia kosong. Tabel kedua berjudul Hukum dan privasi: tiga kasus a sampai c dengan kolom pokok kosong.</desc>
