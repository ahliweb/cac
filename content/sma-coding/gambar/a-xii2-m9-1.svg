<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d">
<title id="t">Tabel pemilihan struktur data dengan kolom struktur dan langkah yang kosong</title>
<desc id="d">Tabel dengan kolom kebutuhan utama, struktur, dan langkah per operasi. Enam kebutuhan sudah tertulis: akses menurut indeks dan tambah di ujung, cek ada atau tidak terurut tanpa kembar, hitung kemunculan menurut kunci, ambil terbesar berulang, jumlah rentang dengan pembaruan, gabung kelompok dan tanya satu kelompok. Kolom struktur dan langkah kosong untuk diisi.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
