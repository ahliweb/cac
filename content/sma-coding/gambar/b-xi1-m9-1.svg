<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="t d">
  <title id="t">Pohon panggilan fib(5) belum lengkap</title>
  <desc id="d">Pohon dengan akar fib(5) dan dua anak fib(4) dan fib(3). Di bawahnya ada kotak putus-putus kosong untuk melanjutkan pohon sampai semua panggilan tergambar. Kotak jumlah panggilan kosong di bawah.</desc>
  <rect width="640" height="280" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <g stroke="#222222" stroke-width="2"><line x1="320" y1="42" x2="190" y2="82"/><line x1="320" y1="42" x2="450" y2="82"/>
      <line x1="190" y1="108" x2="110" y2="148"/><line x1="190" y1="108" x2="270" y2="148"/><line x1="450" y1="108" x2="390" y2="148"/><line x1="450" y1="108" x2="510" y2="148"/></g>
    <g stroke="#2a5d9f" stroke-width="2" fill="#f2f2f2">
      <rect x="280" y="14" width="80" height="30" rx="6"/><rect x="150" y="82" width="80" height="30" rx="6"/><rect x="410" y="82" width="80" height="30" rx="6"/>
    </g>
    <text x="320" y="34" font-weight="bold">fib(5)</text><text x="190" y="102" font-weight="bold">fib(4)</text><text x="450" y="102" font-weight="bold">fib(3)</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff" stroke-dasharray="5 4">
      <rect x="70" y="148" width="80" height="30"/><rect x="230" y="148" width="80" height="30"/><rect x="350" y="148" width="80" height="30"/><rect x="470" y="148" width="80" height="30"/>
    </g>
    <text x="320" y="205">lanjutkan sendiri: gambar semua panggilan di bawah kotak putus-putus</text>
    <rect x="10" y="215" width="620" height="40" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="320" y="272">Jumlah panggilan fib: ______</text>
  </g>
</svg>
