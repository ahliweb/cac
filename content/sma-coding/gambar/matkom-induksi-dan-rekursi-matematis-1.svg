<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran hubungan rekurens T(n) dan C(n)</title>
  <desc id="d">Dua tabel. Tabel pertama untuk T(n) dengan n dari 1 sampai 6: T(1) bernilai 1, sisanya kosong. Tabel kedua untuk C(n) dengan n dari 0 sampai 6: C(0) dan C(1) bernilai 1, sisanya kosong. Aturan tertulis di atas tiap tabel.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="10" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">T(1) = 1;  T(n) = 2 · T(n−1) + 1</text>
  <text x="40" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">n</text>
  <text x="40" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">T(n)</text>
  <rect x="70" y="36" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="102.0" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">1</text>
  <rect x="70" y="72" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="102.0" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2a5d9f" text-anchor="middle">1</text>
