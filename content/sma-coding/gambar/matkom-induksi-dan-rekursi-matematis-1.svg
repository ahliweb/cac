  <text x="172.0" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <rect x="140" y="72" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="210" y="36" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="242.0" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <rect x="210" y="72" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="280" y="36" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="312.0" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <rect x="280" y="72" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="350" y="36" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="382.0" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">5</text>
  <rect x="350" y="72" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="420" y="36" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="452.0" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">6</text>
  <rect x="420" y="72" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <text x="10" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">C(0) = C(1) = 1;  C(n) = C(n−1) + C(n−2) + 1</text>
