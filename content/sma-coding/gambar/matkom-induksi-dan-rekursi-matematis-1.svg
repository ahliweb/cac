  <rect x="280" y="202" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="350" y="166" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="382.0" y="186" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <rect x="350" y="202" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
  <rect x="420" y="166" width="64" height="30" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="452.0" y="186" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">5</text>
  <rect x="420" y="202" width="64" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
