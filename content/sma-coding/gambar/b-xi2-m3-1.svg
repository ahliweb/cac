<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tabel empat masukan untuk skema TugasBaru</title>
  <desc id="d">Tabel dengan kolom Masukan, Lolos atau tidak, dan Datanya. Empat masukan: judul dengan spasi di tepi; judul kosong; judul dengan warna tambahan; judul angka 42 dan selesai teks ya. Kolom hasil kosong.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="10" y="8" width="320" height="32" fill="#f2f2f2"/><rect x="330" y="8" width="100" height="32" fill="#f2f2f2"/><rect x="430" y="8" width="200" height="32" fill="#f2f2f2"/>
      <rect x="10" y="40" width="320" height="50"/><rect x="330" y="40" width="100" height="50" stroke-dasharray="5 4"/><rect x="430" y="40" width="200" height="50" stroke-dasharray="5 4"/>
      <rect x="10" y="90" width="320" height="50"/><rect x="330" y="90" width="100" height="50" stroke-dasharray="5 4"/><rect x="430" y="90" width="200" height="50" stroke-dasharray="5 4"/>
      <rect x="10" y="140" width="320" height="50"/><rect x="330" y="140" width="100" height="50" stroke-dasharray="5 4"/><rect x="430" y="140" width="200" height="50" stroke-dasharray="5 4"/>
      <rect x="10" y="190" width="320" height="50"/><rect x="330" y="190" width="100" height="50" stroke-dasharray="5 4"/><rect x="430" y="190" width="200" height="50" stroke-dasharray="5 4"/>
    </g>
    <g font-weight="bold"><text x="16" y="29">Masukan safeParse</text><text x="336" y="29">Lolos?</text><text x="436" y="29">Datanya</text></g>
    <text x="16" y="70">1. { judul: "  Latihan Zod  " }</text>
    <text x="16" y="120">2. { judul: "" }</text>
    <text x="16" y="170">3. { judul: "Ada tambahan", warna: "merah" }</text>
    <text x="16" y="220">4. { judul: 42, selesai: "ya" }</text>
    <text x="10" y="256">Tulis ya atau tidak, dan datanya bila lolos.</text>
  </g>
</svg>
