<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 347" width="575" height="347" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran perulangan for dengan sel kosong</title>
  <desc id="d">Tabel enam baris pemeriksaan untuk perulangan for dengan i mulai 2, syarat i kurang dari 12, dan langkah tambah 3. Kolom nilai i, hasil syarat, dan apakah badan berjalan kosong. Isi sampai syarat salah.</desc>
  <rect width="575" height="347" fill="#ffffff"/>
  <text x="270" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Penelusuran for (int i = 2; i &lt; 12; i += 3)</text>
  <rect x="20" y="50" width="135" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="87.5" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Pemeriksaan ke</text>
  <rect x="155" y="50" width="120" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="215.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Nilai i</text>
  <rect x="275" y="50" width="150" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">i &lt; 12 ?</text>
  <rect x="425" y="50" width="130" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="490.0" y="73.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Badan jalan?</text>
  <rect x="20" y="86" width="135" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="87.5" y="109.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
  <rect x="155" y="86" width="120" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="275" y="86" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="425" y="86" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="122" width="135" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="87.5" y="145.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
  <rect x="155" y="122" width="120" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="275" y="122" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="425" y="122" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="158" width="135" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="87.5" y="181.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">3</text>
  <rect x="155" y="158" width="120" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="275" y="158" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="425" y="158" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
