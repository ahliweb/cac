  <text x="87.5" y="217.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">4</text>
  <rect x="155" y="194" width="120" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="275" y="194" width="150" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="425" y="194" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="230" width="135" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="87.5" y="253.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">5</text>
