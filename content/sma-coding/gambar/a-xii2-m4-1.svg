<title id="t">Pohon ambil atau lewati untuk tiga nilai</title>
<desc id="d">Pohon biner lengkap empat tingkat: akar tingkat 0, tingkat 1 dua simpul, tingkat 2 empat simpul, tingkat 3 delapan simpul. Cabang kiri berarti ambil dan kanan berarti lewati. Tiap simpul bulatan kosong untuk menulis jumlah. Nilai tiga tingkat: 5, 4, 3.</desc>
