<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel audit per jenis dan laporan etika</title>
  <desc id="d">Atas: tabel jenis anak, referensi, umum dengan kolom baris, terlambat, dapat pengingat, recall, cukup bukti, semuanya kosong. Bawah: laporan etika empat kolom Risiko, Bukti, Tindakan, Risiko tersisa dengan dua baris; risiko baris pertama sudah tertulis recall rendah pada kelompok TIPIS.</desc>
  <rect width="700" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="15" y="22" font-weight="bold">Audit per jenis (tebakan di luar lipatan)</text>
    <rect x="15" y="32" width="670" height="32" fill="#2a5d9f"/>
    <text x="70" y="53" fill="#ffffff" text-anchor="middle">jenis</text>
    <text x="195" y="53" fill="#ffffff" text-anchor="middle">baris</text>
    <text x="300" y="53" fill="#ffffff" text-anchor="middle">terlambat</text>
    <text x="410" y="53" fill="#ffffff" text-anchor="middle">pengingat</text>
    <text x="510" y="53" fill="#ffffff" text-anchor="middle">recall</text>
    <text x="620" y="53" fill="#ffffff" text-anchor="middle">cukup bukti</text>
    <rect x="15" y="64" width="670" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="96" width="670" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="128" width="670" height="32" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="86">anak</text>
    <text x="25" y="118">referensi</text>
    <text x="25" y="150">umum</text>
    <line x1="130" y1="32" x2="130" y2="160" stroke="#222222" stroke-width="1.5"/>
    <line x1="250" y1="32" x2="250" y2="160" stroke="#222222" stroke-width="1.5"/>
    <line x1="355" y1="32" x2="355" y2="160" stroke="#222222" stroke-width="1.5"/>
    <line x1="465" y1="32" x2="465" y2="160" stroke="#222222" stroke-width="1.5"/>
    <line x1="560" y1="32" x2="560" y2="160" stroke="#222222" stroke-width="1.5"/>
    <text x="15" y="204" font-weight="bold">Laporan etika</text>
    <rect x="15" y="214" width="670" height="32" fill="#2a5d9f"/>
    <text x="95" y="235" fill="#ffffff" text-anchor="middle">Risiko</text>
    <text x="260" y="235" fill="#ffffff" text-anchor="middle">Bukti</text>
    <text x="425" y="235" fill="#ffffff" text-anchor="middle">Tindakan</text>
    <text x="595" y="235" fill="#ffffff" text-anchor="middle">Risiko tersisa</text>
    <rect x="15" y="246" width="670" height="64" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="310" width="670" height="64" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <text x="22" y="268">recall rendah</text>
    <text x="22" y="286">pada kelompok</text>
    <text x="22" y="304">TIPIS</text>
    <line x1="175" y1="214" x2="175" y2="374" stroke="#222222" stroke-width="1.5"/>
    <line x1="345" y1="214" x2="345" y2="374" stroke="#222222" stroke-width="1.5"/>
    <line x1="510" y1="214" x2="510" y2="374" stroke="#222222" stroke-width="1.5"/>
  </g>
</svg>
