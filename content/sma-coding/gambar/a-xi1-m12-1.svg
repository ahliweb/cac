<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel greedy untuk T = 6 dan larik dp untuk voucher 1, 3, 4</title>
  <desc id="d">Bagian atas: tabel greedy dengan voucher 4, 3, 1 dan kolom T sebelum, T dibagi v, dan sisa yang kosong, T awal 6. Bagian bawah: larik dp berindeks 0 sampai 6 dengan kotak kosong untuk voucher paling sedikit pada tiap T.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">Greedy, T = 6, voucher {4, 3, 1} diambil dari yang terbesar:</text>
  <rect x="20" y="34" width="120" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="57.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">voucher v</text>
  <rect x="140" y="34" width="120" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="200.0" y="57.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">T sebelum</text>
  <rect x="260" y="34" width="120" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="320.0" y="57.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">T / v</text>
  <rect x="380" y="34" width="140" height="36" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="450.0" y="57.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">T % v (sisa)</text>
  <rect x="20" y="70" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="93.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">4</text>
  <rect x="140" y="70" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="200.0" y="93.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">6</text>
  <rect x="260" y="70" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="380" y="70" width="140" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="106" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="129.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">3</text>
  <rect x="140" y="106" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="106" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="380" y="106" width="140" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="20" y="142" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="165.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">1</text>
  <rect x="140" y="142" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="142" width="120" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="380" y="142" width="140" height="36" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="20" y="214" font-family="sans-serif" font-size="15" text-anchor="start" fill="#222222">Jumlah voucher greedy = jumlah kolom T / v = ______</text>
  <text x="20" y="262" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">DP, voucher {1, 3, 4}: isi dp[t] = voucher paling sedikit untuk jumlah t</text>
  <rect x="40" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="77.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">0</text>
  <rect x="114" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="151.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">1</text>
  <rect x="188" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="225.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">2</text>
  <rect x="262" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="299.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">3</text>
  <rect x="336" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="373.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">4</text>
  <rect x="410" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="447.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">5</text>
  <rect x="484" y="276" width="74" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="521.0" y="336" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2a5d9f">6</text>
  <text x="20" y="372" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Angka di bawah kotak = t. Kotak untuk t = 0 juga kamu isi.</text>
</svg>
