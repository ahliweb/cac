  <text x="530" y="37" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">lulus ditolak keliru</text>
  <rect x="10" y="54" width="100" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
