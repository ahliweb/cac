<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-labelledby="t d">
  <title id="t">Tabel penggolongan fungsi dan tabel oracle</title>
  <desc id="d">Dua tabel dengan sel kosong. Kiri: fungsi dua bit 0110, 1111, dan 1000 dengan kolom banyak nilai 1 dan golongan. Kanan: oracle untuk f(0)=1 dan f(1)=0, memetakan masukan 00, 01, 10, 11 ke keluaran yang harus diisi.</desc>
