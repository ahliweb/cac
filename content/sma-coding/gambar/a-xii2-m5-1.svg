<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-labelledby="t d">
<title id="t">Empat tugas dan batang waktu enam menit</title>
<desc id="d">Empat kartu tugas berdurasi 4, 1, 3, dan 2 menit, dan batang waktu enam kotak bernomor menit 1 sampai 6 yang masih kosong untuk menempatkan tugas.</desc>
<rect width="540" height="250" fill="#ffffff"/>

<g font-family="sans-serif">
<text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="#222222">Tugas (durasi, menit):</text>
<rect x="20" y="34" width="114" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="77.0" y="56.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">4</text>
<rect x="146" y="34" width="24" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="158.0" y="56.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">1</text>
<rect x="182" y="34" width="84" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="224.0" y="56.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">3</text>
<rect x="278" y="34" width="54" height="34" rx="3" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="305.0" y="56.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">2</text>
<text x="20" y="105" font-size="14" text-anchor="start" fill="#222222">Waktu tersedia 6 menit. Ambil tugas terpendek lebih dulu dan tulis</text>
<text x="20" y="125" font-size="14" text-anchor="start" fill="#222222">durasinya berurutan pada batang (satu kotak = satu menit):</text>
<text x="54" y="152" font-size="14" text-anchor="middle" fill="#222222">1</text>
<rect x="20" y="158" width="66" height="36" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="124" y="152" font-size="14" text-anchor="middle" fill="#222222">2</text>
<rect x="90" y="158" width="66" height="36" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="194" y="152" font-size="14" text-anchor="middle" fill="#222222">3</text>
<rect x="160" y="158" width="66" height="36" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="264" y="152" font-size="14" text-anchor="middle" fill="#222222">4</text>
<rect x="230" y="158" width="66" height="36" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="334" y="152" font-size="14" text-anchor="middle" fill="#222222">5</text>
<rect x="300" y="158" width="66" height="36" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="404" y="152" font-size="14" text-anchor="middle" fill="#222222">6</text>
<rect x="370" y="158" width="66" height="36" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="20" y="225" font-size="14" text-anchor="start" fill="#222222">Banyak tugas terambil: ______   Sisa menit: ______</text>
</g>
</svg>
