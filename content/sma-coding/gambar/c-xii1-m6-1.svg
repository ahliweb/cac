<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran pengikut garis</title>
  <desc id="d">Lima sensor di -30, -15, 0, 15, dan 30 mm dengan garis lebar 20 mm. Di bawahnya tabel tick 0 sampai 3 dengan kolom x, galat, koreksi, roda kiri, dan roda kanan. Hanya x pada tick 0 terisi 12.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <circle cx="180" cy="30" r="9" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="180" y="62" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">-30</text>
  <circle cx="240" cy="30" r="9" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="240" y="62" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">-15</text>
  <circle cx="300" cy="30" r="9" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="300" y="62" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0</text>
  <circle cx="360" cy="30" r="9" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="360" y="62" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">15</text>
  <circle cx="420" cy="30" r="9" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="420" y="62" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">30</text>
  <rect x="270" y="8" width="40" height="44" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="320" y="42" font-family="sans-serif" font-size="14" fill="#222222">garis (lebar 20 mm, posisi tengah 0)</text>
  <rect x="10" y="80" width="70" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="103" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">tick</text>
  <rect x="80" y="80" width="90" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="125.0" y="103" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">x</text>
  <rect x="170" y="80" width="90" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="215.0" y="103" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">galat</text>
  <rect x="260" y="80" width="100" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="310.0" y="103" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">koreksi</text>
  <rect x="360" y="80" width="120" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="420.0" y="103" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">roda kiri</text>
  <rect x="480" y="80" width="120" height="34" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="540.0" y="103" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">roda kanan</text>
  <rect x="10" y="114" width="70" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="140" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">0</text>
  <rect x="80" y="114" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="125.0" y="140" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">12</text>
  <rect x="170" y="114" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="114" width="100" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="360" y="114" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="480" y="114" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="10" y="154" width="70" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="180" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">1</text>
  <rect x="80" y="154" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="170" y="154" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="154" width="100" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="360" y="154" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="480" y="154" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="10" y="194" width="70" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="220" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">2</text>
  <rect x="80" y="194" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="170" y="194" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="194" width="100" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="360" y="194" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="480" y="194" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="10" y="234" width="70" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="45.0" y="260" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">3</text>
  <rect x="80" y="234" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="170" y="234" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="234" width="100" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="360" y="234" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="480" y="234" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="10" y="294" font-family="sans-serif" font-size="14" fill="#222222">T = 8, kecepatan dasar 150, 5 unit per mm</text>
</svg>
