<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d">
  <title id="t">Alur pengujian akhir dan tabel hasil</title>
  <desc id="d">Empat kotak berurutan: 1 cocokkan sidik, 2 buka data uji sekali, 3 hitung metrik, 4 laporkan. Di bawahnya tabel tiga baris model, tebakan mayoritas, aturan tebal+ujian dengan kolom recall, presisi, pengingat yang kosong, dan garis kosong untuk jumlah pembukaan data uji.</desc>
  <rect width="680" height="330" fill="#ffffff"/>
  <defs><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222222"/></marker></defs>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="15" y="15" width="135" height="64" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="82" y="42" text-anchor="middle" font-weight="bold">1</text>
    <text x="82" y="62" text-anchor="middle">cocokkan sidik</text>
    <rect x="190" y="15" width="135" height="64" rx="6" fill="#f2f2f2" stroke="#b3261e" stroke-width="2"/>
    <text x="257" y="42" text-anchor="middle" font-weight="bold">2</text>
    <text x="257" y="62" text-anchor="middle">buka data uji</text>
    <rect x="365" y="15" width="135" height="64" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="432" y="42" text-anchor="middle" font-weight="bold">3</text>
    <text x="432" y="62" text-anchor="middle">hitung metrik</text>
    <rect x="540" y="15" width="125" height="64" rx="6" fill="#f2f2f2" stroke="#1b7a3d" stroke-width="2"/>
    <text x="602" y="42" text-anchor="middle" font-weight="bold">4</text>
    <text x="602" y="62" text-anchor="middle">laporkan</text>
    <line x1="150" y1="47" x2="188" y2="47" stroke="#222222" stroke-width="2" marker-end="url(#p)"/>
    <line x1="325" y1="47" x2="363" y2="47" stroke="#222222" stroke-width="2" marker-end="url(#p)"/>
    <line x1="500" y1="47" x2="538" y2="47" stroke="#222222" stroke-width="2" marker-end="url(#p)"/>
    <text x="257" y="98" text-anchor="middle">hanya sekali</text>
    <rect x="15" y="115" width="650" height="34" fill="#2a5d9f"/>
    <text x="130" y="137" fill="#ffffff" text-anchor="middle">pada data uji</text>
    <text x="360" y="137" fill="#ffffff" text-anchor="middle">recall</text>
    <text x="490" y="137" fill="#ffffff" text-anchor="middle">presisi</text>
    <text x="600" y="137" fill="#ffffff" text-anchor="middle">pengingat</text>
    <rect x="15" y="149" width="650" height="38" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="187" width="650" height="38" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="225" width="650" height="38" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="173">model</text>
    <text x="25" y="211">tebakan mayoritas</text>
    <text x="25" y="249">aturan tebal+ujian</text>
    <line x1="250" y1="115" x2="250" y2="263" stroke="#222222" stroke-width="1.5"/>
    <line x1="425" y1="115" x2="425" y2="263" stroke="#222222" stroke-width="1.5"/>
    <line x1="545" y1="115" x2="545" y2="263" stroke="#222222" stroke-width="1.5"/>
    <text x="15" y="305">Pembukaan data uji:</text>
    <line x1="170" y1="305" x2="260" y2="305" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
</svg>
