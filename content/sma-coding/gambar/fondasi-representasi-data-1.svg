<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="t d">
  <title id="t">Kisi 8x8 untuk menggambar dari deret heksadesimal</title>
  <desc id="d">Tabel kosong 8 baris dan 8 kolom. Kolom diberi nilai tempat 128, 64, 32, 16, 8, 4, 2, 1. Tiap baris punya satu byte heksadesimal di kiri: 18, 3C, 7E, 18, 18, 18, 18, 18. Kotak bit dibiarkan kosong untuk diisi 0 atau 1.</desc>
