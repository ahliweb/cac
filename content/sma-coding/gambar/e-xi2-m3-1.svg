  <rect x="10" y="126" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="153.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">01</text>
  <rect x="114" y="130" width="122" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="126" width="130" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="10" y="170" width="100" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="197.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10</text>
