  <text x="60.0" y="241.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">11</text>
  <rect x="114" y="218" width="122" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="214" width="130" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="490" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">(0,5 ; 0,5 ; 0,5 ; -0,5)</text>
  <rect x="265" y="38" width="120" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="325.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">qubit 1 terbaca</text>
  <rect x="385" y="38" width="110" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="440.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">peluang</text>
  <rect x="495" y="38" width="150" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="570.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">qubit 2 jadi</text>
  <rect x="265" y="82" width="120" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
