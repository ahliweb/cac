  <text x="325.0" y="153.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
  <rect x="389" y="130" width="102" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="385" y="126" width="110" height="44" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="499" y="130" width="142" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
