<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="t d">
  <title id="t">Dua tabel peluang untuk keadaan dua qubit</title>
  <desc id="d">Kiri: peluang hasil dua bit 00, 01, 10, 11 untuk keadaan Psi minus dengan kotak kosong. Kanan: untuk keadaan (0,5 ; 0,5 ; 0,5 ; -0,5), baris hasil qubit pertama 0 dan 1 dengan kolom peluang dan keadaan qubit kedua yang kosong.</desc>
  <rect width="660" height="300" fill="#ffffff"/>
  <text x="150" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">(0 ; h ; -h ; 0), h = 0,7071</text>
  <rect x="10" y="38" width="100" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">hasil dua bit</text>
