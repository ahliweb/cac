<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 230" width="510" height="230" role="img" aria-labelledby="t d">
  <title id="t">Tabel kemudahan dan kendali untuk IaaS PaaS SaaS yang kosong</title>
  <desc id="d">Tabel tiga baris IaaS, PaaS, dan SaaS dengan kolom Kemudahan dan Kendali yang kosong. Isi dengan lebih tinggi atau lebih rendah.</desc>
  <rect width="510" height="230" fill="#ffffff"/>
  <text x="250" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Tabel pertukaran: lebih tinggi atau lebih rendah</text>
  <rect x="20" y="50" width="170" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="105.0" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Model</text>
  <rect x="190" y="50" width="150" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="265.0" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Kemudahan</text>
  <rect x="340" y="50" width="150" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="415.0" y="75.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Kendali</text>
  <rect x="20" y="90" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="115.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">IaaS</text>
  <rect x="190" y="90" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="90" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="130" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="155.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">PaaS</text>
  <rect x="190" y="130" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="130" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="170" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="105.0" y="195.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">SaaS</text>
  <rect x="190" y="170" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="340" y="170" width="150" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
</svg>
