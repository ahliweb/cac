<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" role="img" aria-labelledby="t d">
  <title id="t">Dua nama menunjuk ke satu daftar</title>
  <desc id="d">Dua label a dan b dengan garis putus-putus menuju daftar 4, 8, 15 beserta indeksnya, dan daftar kedua dengan sel keempat kosong untuk keadaan sesudah append 16.</desc>
  <rect width="740" height="330" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <text x="10" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">Sesudah b = a:</text>
  <text x="40" y="78" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">a</text>
  <text x="40" y="128" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">b</text>
  <line x1="56" y1="74" x2="150" y2="74" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="56" y1="124" x2="150" y2="124" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="228" y="62" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">0</text>
  <text x="284" y="62" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">1</text>
  <text x="340" y="62" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">2</text>
  <rect x="200" y="70" width="56" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="228" y="99" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">4</text>
  <rect x="256" y="70" width="56" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="284" y="99" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">8</text>
  <rect x="312" y="70" width="56" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="340" y="99" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">15</text>
  <text x="470" y="98" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Gambar anak panah a dan b.</text>
  <text x="10" y="196" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">Sesudah b.append(16):</text>
  <text x="40" y="250" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">a</text>
  <text x="40" y="300" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">b</text>
  <line x1="56" y1="246" x2="150" y2="246" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="56" y1="296" x2="150" y2="296" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="228" y="234" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">0</text>
  <text x="284" y="234" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">1</text>
  <text x="340" y="234" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">2</text>
  <text x="396" y="234" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">3</text>
  <rect x="200" y="242" width="56" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="228" y="271" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">4</text>
  <rect x="256" y="242" width="56" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="284" y="271" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">8</text>
  <rect x="312" y="242" width="56" height="44" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="340" y="271" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">15</text>
  <rect x="368" y="242" width="56" height="44" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="270" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Isi sel keempat dan gambar anak panah.</text>
