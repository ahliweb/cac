<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 257" width="579" height="257" role="img" aria-labelledby="t d">
  <title id="t">Tabel waktu tunggu dua region dengan total kosong</title>
  <desc id="d">Tabel dua baris: region Dekat berlatensi 20 milidetik dan region Jauh berlatensi 200 milidetik, masing-masing 10 permintaan berurutan. Kolom total waktu tunggu kosong. Di bawahnya ada isian berapa kali lebih lama.</desc>
  <rect width="579" height="257" fill="#ffffff"/>
  <text x="260" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Satu halaman, dua region (angka ilustrasi)</text>
  <rect x="20" y="50" width="120" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="80.0" y="77.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Region</text>
  <rect x="140" y="50" width="120" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="200.0" y="77.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Latensi</text>
  <rect x="260" y="50" width="130" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="325.0" y="77.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Permintaan</text>
  <rect x="390" y="50" width="169" height="44" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="474.5" y="77.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">Total waktu tunggu</text>
  <rect x="20" y="94" width="120" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="121.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Dekat</text>
  <rect x="140" y="94" width="120" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="200.0" y="121.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">20 milidetik</text>
  <rect x="260" y="94" width="130" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="325.0" y="121.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10 berurutan</text>
  <rect x="390" y="94" width="169" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="20" y="138" width="120" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="165.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Jauh</text>
  <rect x="140" y="138" width="120" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="200.0" y="165.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">200 milidetik</text>
  <rect x="260" y="138" width="130" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="325.0" y="165.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">10 berurutan</text>
  <rect x="390" y="138" width="169" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="260" y="212" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Total = latensi x jumlah permintaan berurutan.</text>
  <text x="260" y="238" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Jauh ______ kali lebih lama dari Dekat.</text>
</svg>
