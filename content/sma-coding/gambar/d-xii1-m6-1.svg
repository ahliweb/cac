<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 198" width="570" height="198" role="img" aria-labelledby="t d">
  <title id="t">Tabel dua kali dua kosong untuk lima puluh baris uji dan tebakan selalu tepat waktu</title>
  <desc id="d">Tabel dua kali dua. Baris: terlambat (9 baris) dan tepat waktu. Kolom: tebakan terlambat dan tebakan tepat waktu. Keempat sel dibiarkan kosong.</desc>
  <rect width="570" height="198" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Model yang selalu menjawab tepat waktu</text>
    <rect x="20" y="46" width="190" height="44" fill="#f2f2f2"/>
    <text x="115" y="73" text-anchor="middle" stroke="none" font-weight="bold">data uji: 50 baris</text>
    <rect x="210" y="46" width="170" height="44" fill="#f2f2f2"/>
    <text x="295" y="73" text-anchor="middle" stroke="none" font-weight="bold">tebakan terlambat</text>
    <rect x="380" y="46" width="170" height="44" fill="#f2f2f2"/>
    <text x="465" y="73" text-anchor="middle" stroke="none" font-weight="bold">tebakan tepat waktu</text>
    <rect x="20" y="90" width="190" height="44" fill="#ffffff"/>
    <text x="115" y="117" text-anchor="middle" stroke="none">terlambat (9 baris)</text>
    <rect x="210" y="90" width="170" height="44" fill="#ffffff"/>
    <rect x="380" y="90" width="170" height="44" fill="#ffffff"/>
    <rect x="20" y="134" width="190" height="44" fill="#ffffff"/>
    <text x="115" y="161" text-anchor="middle" stroke="none">tepat waktu</text>
    <rect x="210" y="134" width="170" height="44" fill="#ffffff"/>
    <rect x="380" y="134" width="170" height="44" fill="#ffffff"/>
  </g>
</svg>
