<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" role="img" aria-labelledby="t d">
  <title id="t">Tabel hasil tiga pembanding pada lima lipatan</title>
  <desc id="d">Tabel tiga baris pembanding: tebakan mayoritas, aturan tebal+ujian, regresi logistik bawaan. Empat kolom metrik kosong: ketepatan, recall, presisi, F1. Di bawahnya kotak kosong untuk angka yang harus dikalahkan model.</desc>
  <rect width="660" height="270" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="15" y="15" width="630" height="36" fill="#2a5d9f"/>
    <text x="115" y="38" fill="#ffffff" text-anchor="middle">pembanding</text>
    <text x="300" y="38" fill="#ffffff" text-anchor="middle">ketepatan</text>
    <text x="400" y="38" fill="#ffffff" text-anchor="middle">recall</text>
    <text x="500" y="38" fill="#ffffff" text-anchor="middle">presisi</text>
    <text x="595" y="38" fill="#ffffff" text-anchor="middle">F1</text>
    <rect x="15" y="51" width="630" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="93" width="630" height="42" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
    <rect x="15" y="135" width="630" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="25" y="77">tebakan mayoritas</text>
    <text x="25" y="119">aturan tebal+ujian</text>
    <text x="25" y="161">regresi logistik bawaan</text>
    <line x1="235" y1="15" x2="235" y2="177" stroke="#222222" stroke-width="1.5"/>
    <line x1="350" y1="15" x2="350" y2="177" stroke="#222222" stroke-width="1.5"/>
    <line x1="450" y1="15" x2="450" y2="177" stroke="#222222" stroke-width="1.5"/>
    <line x1="548" y1="15" x2="548" y2="177" stroke="#222222" stroke-width="1.5"/>
    <text x="15" y="212">Angka yang harus dikalahkan model:</text>
    <text x="15" y="242">recall di atas</text>
    <rect x="125" y="224" width="80" height="26" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="235" y="242">dan F1 di atas</text>
    <rect x="345" y="224" width="80" height="26" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  </g>
</svg>
