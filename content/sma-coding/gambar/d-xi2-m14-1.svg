<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" role="img" aria-labelledby="t d">
  <title id="t">Ketepatan lima lipatan tiga model beserta sebarannya</title>
  <desc id="d">Sumbu ketepatan dari 0,6 sampai 1,0. Pembanding: 0,69 dengan sebaran 0,67 sampai 0,70. Pohon: 0,88 dengan sebaran 0,82 sampai 0,93. Jaringan: 0,90 dengan sebaran 0,84 sampai 0,95. Di bawah ada kotak kosong untuk kesimpulan yang sah.</desc>
  <rect width="620" height="260" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <g stroke="#222222" stroke-width="1" stroke-dasharray="3 4">
      <line x1="160" y1="28" x2="160" y2="150"/><line x1="260" y1="28" x2="260" y2="150"/><line x1="360" y1="28" x2="360" y2="150"/><line x1="460" y1="28" x2="460" y2="150"/><line x1="560" y1="28" x2="560" y2="150"/>
    </g>
    <line x1="160" y1="150" x2="560" y2="150" stroke="#222222" stroke-width="2"/>
    <g text-anchor="middle"><text x="160" y="172">0,6</text><text x="260" y="172">0,7</text><text x="360" y="172">0,8</text><text x="460" y="172">0,9</text><text x="560" y="172">1,0</text></g>
    <text x="20" y="62">pembanding</text><text x="20" y="102">pohon</text><text x="20" y="142">jaringan</text>
    <g stroke="#2a5d9f" stroke-width="3">
      <line x1="230" y1="58" x2="260" y2="58"/><line x1="230" y1="50" x2="230" y2="66"/><line x1="260" y1="50" x2="260" y2="66"/>
      <line x1="380" y1="98" x2="490" y2="98"/><line x1="380" y1="90" x2="380" y2="106"/><line x1="490" y1="90" x2="490" y2="106"/>
      <line x1="400" y1="138" x2="510" y2="138"/><line x1="400" y1="130" x2="400" y2="146"/><line x1="510" y1="130" x2="510" y2="146"/>
    </g>
    <g fill="#222222">
      <circle cx="250" cy="58" r="6"/><circle cx="440" cy="98" r="6"/><circle cx="460" cy="138" r="6"/>
    </g>
    <g text-anchor="middle" font-size="14"><text x="250" y="42">0,69</text><text x="440" y="82">0,88</text><text x="460" y="122">0,90</text></g>
    <rect x="20" y="192" width="580" height="52" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
    <text x="30" y="212" font-weight="bold">kesimpulan yang sah:</text>
  </g>
</svg>
