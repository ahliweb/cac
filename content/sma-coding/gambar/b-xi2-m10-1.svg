<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t d">
  <title id="t">Tabel tiga kasus karangan dan pokok peraturan</title>
  <desc id="d">Tabel dengan kolom Kasus dan Pokok yang tersentuh. Tiga baris: a seseorang mencoba masuk ke server sekolah tanpa izin; b seorang murid mengumpulkan nama dan nomor telepon teman untuk aplikasi tanpa memberi tahu; c menguji aplikasi sendiri di localhost. Kolom pokok kosong.</desc>
  <rect width="640" height="250" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="10" y="10" width="360" height="36" fill="#f2f2f2"/><rect x="370" y="10" width="260" height="36" fill="#f2f2f2"/>
      <rect x="10" y="46" width="360" height="62"/><rect x="370" y="46" width="260" height="62"/>
      <rect x="10" y="108" width="360" height="62"/><rect x="370" y="108" width="260" height="62"/>
      <rect x="10" y="170" width="360" height="62"/><rect x="370" y="170" width="260" height="62"/>
    </g>
    <text x="18" y="33" font-weight="bold">Kasus karangan</text><text x="378" y="33" font-weight="bold">Pokok yang tersentuh</text>
    <text x="18" y="70">(a) seseorang mencoba masuk ke</text><text x="18" y="90">server sekolah tanpa izin</text>
    <text x="18" y="132">(b) murid mengumpulkan nama dan</text><text x="18" y="152">nomor telepon teman tanpa memberi tahu</text>
    <text x="18" y="194">(c) kamu menguji aplikasi latihanmu</text><text x="18" y="214">sendiri di localhost</text>
    <text x="10" y="248">Tulis pokoknya, atau "tidak ada".</text>
  </g>
</svg>
