<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Kartu model dengan delapan bagian kosong</title>
  <desc id="d">Kartu model berisi delapan kotak kosong berlabel: nama, tujuan, di luar cakupan, data, evaluasi, batasan, risiko, dan energi dengan rentang dan asumsi.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <rect x="20" y="16" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">nama</text>
  <rect x="340" y="16" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">tujuan</text>
  <rect x="20" y="90" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">di luar cakupan</text>
  <rect x="340" y="90" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">data</text>
  <rect x="20" y="164" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="184" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">evaluasi</text>
  <rect x="340" y="164" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="184" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">batasan</text>
  <rect x="20" y="238" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="30" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">risiko</text>
  <rect x="340" y="238" width="300" height="62" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="350" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">energi (rentang dan asumsi)</text>
</svg>
