<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" role="img" aria-labelledby="t d">
<title id="t">Alur kerja Orange dari File ke dua widget</title>
<desc id="d">Kotak File di kiri dengan dua panah ke dua kotak kosong untuk nama widget. Di bawahnya tempat menulis jumlah baris, jumlah kolom, target, dan fitur.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="640" height="285" fill="#ffffff"/>
<rect x="30" y="40" width="130" height="50" rx="6" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
<text x="95.0" y="70.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">File</text><rect x="260" y="20" width="170" height="50" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="345.0" y="50.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle"></text><rect x="260" y="110" width="170" height="50" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="345.0" y="140.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle"></text><line x1="160" y1="65" x2="260" y2="45" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/><line x1="160" y1="65" x2="260" y2="135" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/><text x="445" y="50" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">widget 1: ______</text><text x="445" y="140" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">widget 2: ______</text><text x="30" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Setelah File dipilih (tanaman.csv), baca ringkasannya:</text><text x="30" y="235" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">baris: ______   kolom: ______</text><text x="30" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">target: ______   fitur: ______ , ______ , ______</text>
</svg>
