<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Diagram blok robot dengan daya</title>
  <desc id="d">Tiga kotak berurutan dengan panah: sensor, pengendali, aktuator. Di bawahnya kotak daya dengan panah ke ketiganya. Tiap kotak punya garis isian untuk komponen dan arus, dan di bawah ada garis isian total arus dan kapasitas baterai.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <rect x="20" y="14" width="180" height="96" rx="8" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="110" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">SENSOR</text>
  <text x="30" y="62" font-family="sans-serif" font-size="14" fill="#222222">komponen:</text>
  <line x1="30" y1="72" x2="190" y2="72" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="30" y="98" font-family="sans-serif" font-size="14" fill="#222222">arus: ______ mA</text>
  <line x1="202" y1="62" x2="233" y2="62" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="235" y="14" width="180" height="96" rx="8" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="325" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">PENGENDALI</text>
  <text x="245" y="62" font-family="sans-serif" font-size="14" fill="#222222">komponen:</text>
  <line x1="245" y1="72" x2="405" y2="72" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="245" y="98" font-family="sans-serif" font-size="14" fill="#222222">arus: ______ mA</text>
  <line x1="417" y1="62" x2="448" y2="62" stroke="#222222" stroke-width="2" marker-end="url(#a)"/>
  <rect x="450" y="14" width="180" height="96" rx="8" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2"/>
  <text x="540" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">AKTUATOR</text>
  <text x="460" y="62" font-family="sans-serif" font-size="14" fill="#222222">komponen:</text>
  <line x1="460" y1="72" x2="620" y2="72" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="460" y="98" font-family="sans-serif" font-size="14" fill="#222222">arus: ______ mA</text>
  <rect x="20" y="160" width="600" height="56" rx="8" fill="#f2f2f2" stroke="#b3261e" stroke-width="2"/>
  <text x="320" y="182" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">DAYA (baterai)</text>
  <text x="34" y="206" font-family="sans-serif" font-size="14" fill="#222222">kapasitas: ______ mAh</text>
  <text x="334" y="206" font-family="sans-serif" font-size="14" fill="#222222">total arus: ______ mA</text>
  <line x1="110" y1="158" x2="110" y2="112" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="325" y1="158" x2="325" y2="112" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="158" x2="540" y2="112" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
  <text x="20" y="260" font-family="sans-serif" font-size="14" fill="#222222">Panah ke atas dari daya: daya mengalir ke sensor, pengendali, dan aktuator.</text>
</svg>
