<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-labelledby="t d">
  <title id="t">Tabel hasil kali tensor dua qubit dengan kolom isian</title>
  <desc id="d">Qubit pertama (a, b) sama dengan (0,8 ; 0,6) dan qubit kedua (c, d) sama dengan (0,6 ; 0,8). Tabel empat baris untuk hasil 00, 01, 10, 11 dengan rumus komponen a*c, a*d, b*c, b*d. Kolom nilai komponen dan kolom peluang kosong untuk diisi, dan satu kotak kosong untuk jumlah kuadrat.</desc>
  <rect width="620" height="330" fill="#ffffff"/>
  <text x="310" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">qubit pertama (a, b) = (0,8 ; 0,6)    qubit kedua (c, d) = (0,6 ; 0,8)</text>
  <rect x="10" y="44" width="100" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="71.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">hasil</text>
  <rect x="110" y="44" width="150" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="185.0" y="71.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">komponen</text>
  <rect x="260" y="44" width="170" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="345.0" y="71.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">nilai</text>
  <rect x="430" y="44" width="170" height="44" fill="#2a5d9f" stroke="#222222" stroke-width="1.5"/>
  <text x="515.0" y="71.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">peluang</text>
  <rect x="10" y="88" width="100" height="48" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="60.0" y="117.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">00</text>
  <rect x="110" y="88" width="150" height="48" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="185.0" y="117.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">a * c</text>
  <rect x="260" y="88" width="170" height="48" fill="none" stroke="#222222" stroke-width="1.5"/>
