  <text x="185.0" y="261.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">b * d</text>
  <rect x="260" y="232" width="170" height="48" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="264" y="236" width="162" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
