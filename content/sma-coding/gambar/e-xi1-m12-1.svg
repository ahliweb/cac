  <rect x="434" y="236" width="162" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="10" y="310" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">jumlah kuadrat semua komponen =</text>
  <rect x="300" y="288" width="150" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
