  <text x="185.0" y="213.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">b * c</text>
  <rect x="260" y="184" width="170" height="48" fill="none" stroke="#222222" stroke-width="1.5"/>
