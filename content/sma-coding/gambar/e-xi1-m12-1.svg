  <text x="185.0" y="165.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">a * d</text>
  <rect x="260" y="136" width="170" height="48" fill="none" stroke="#222222" stroke-width="1.5"/>
