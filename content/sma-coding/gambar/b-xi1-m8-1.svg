<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Graf pertemanan dan tabel BFS dari P</title>
  <desc id="d">Graf dengan simpul P, Q, R, S, T, U, V dan sisi P-Q, P-R, Q-S, R-S, S-T, U-V. Di bawahnya tabel kosong berkolom Langkah, Isi antrian, dan Jarak untuk menelusuri BFS dari P.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">
    <g stroke="#222222" stroke-width="2">
      <line x1="50" y1="60" x2="140" y2="30"/><line x1="50" y1="60" x2="140" y2="95"/>
      <line x1="140" y1="30" x2="240" y2="60"/><line x1="140" y1="95" x2="240" y2="60"/>
      <line x1="240" y1="60" x2="330" y2="60"/><line x1="470" y1="60" x2="560" y2="60"/>
    </g>
    <g stroke="#2a5d9f" stroke-width="2" fill="#f2f2f2">
      <circle cx="50" cy="60" r="18"/><circle cx="140" cy="30" r="18"/><circle cx="140" cy="95" r="18"/><circle cx="240" cy="60" r="18"/><circle cx="330" cy="60" r="18"/><circle cx="470" cy="60" r="18"/><circle cx="560" cy="60" r="18"/>
    </g>
    <text x="50" y="66">P</text><text x="140" y="36">Q</text><text x="140" y="101">R</text><text x="240" y="66">S</text><text x="330" y="66">T</text><text x="470" y="66">U</text><text x="560" y="66">V</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="10" y="130" width="100" height="32" fill="#f2f2f2"/><rect x="110" y="130" width="360" height="32" fill="#f2f2f2"/><rect x="470" y="130" width="160" height="32" fill="#f2f2f2"/>
      <rect x="10" y="162" width="100" height="32"/><rect x="110" y="162" width="360" height="32"/><rect x="470" y="162" width="160" height="32"/>
      <rect x="10" y="194" width="100" height="32"/><rect x="110" y="194" width="360" height="32"/><rect x="470" y="194" width="160" height="32"/>
      <rect x="10" y="226" width="100" height="32"/><rect x="110" y="226" width="360" height="32"/><rect x="470" y="226" width="160" height="32"/>
      <rect x="10" y="258" width="100" height="32"/><rect x="110" y="258" width="360" height="32"/><rect x="470" y="258" width="160" height="32"/>
    </g>
    <text x="60" y="152" font-weight="bold">Langkah</text><text x="290" y="152" font-weight="bold">Isi antrian</text><text x="550" y="152" font-weight="bold">Jarak (simpul: nilai)</text>
  </g>
</svg>
