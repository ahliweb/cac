<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Pemetaan kecepatan ke pin dan urutan kecepatan roda</title>
  <desc id="d">Tabel kecepatan, IN1, IN2, dan duty dengan kecepatan -300, 0, 80, -255, dan 400 dan kolom lain kosong. Di bawahnya lima kotak berurutan untuk kecepatan roda, kotak pertama berisi +100.</desc>
