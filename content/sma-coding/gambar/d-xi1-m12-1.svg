<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" role="img" aria-labelledby="t d">
  <title id="t">Pembagian data dan asal belajar penskala</title>
  <desc id="d">Kotak data berisi titik 1 sampai 8 dengan anak panah bagi menuju kotak latih dan uji yang kosong, serta dua kotak isian untuk asal belajar dan penerapan penskala.</desc>
  <rect width="460" height="330" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <rect x="10" y="20" width="150" height="120" rx="8" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="85" y="46" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">data</text>
  <text x="85" y="78" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">1  2  3  4</text>
  <text x="85" y="104" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">5  6  7  8</text>
  <line x1="164" y1="80" x2="244" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#ar)"/>
  <text x="204" y="68" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">bagi</text>
  <text x="340" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">latih</text>
  <rect x="250" y="32" width="180" height="50" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="108" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">uji</text>
  <rect x="250" y="116" width="180" height="50" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="10" y="214" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">penskala belajar (fit) dari:</text>
  <rect x="290" y="194" width="160" height="34" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="10" y="264" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">penskala diterapkan (transform) ke:</text>
  <rect x="290" y="244" width="160" height="34" rx="4" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="10" y="304" font-family="sans-serif" font-size="14" text-anchor="start" fill="#222222">Tulis titik yang masuk ke kotak latih dan uji.</text>
</svg>
