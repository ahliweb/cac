<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran insertion sort untuk data 7 3 5 2</title>
  <desc id="d">Tabel dengan kolom indeks 0 sampai 3 dan baris awal berisi 7, 3, 5, 2, lalu tiga baris i sama dengan 1, 2, 3 yang kosong untuk diisi isi data setelah tiap penyisipan.</desc>
