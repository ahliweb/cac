<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" width="640" height="275" role="img" aria-labelledby="t d">
  <title id="t">Tabel tiga baris templat Astro dengan kolom isi HTML kosong</title>
  <desc id="d">Tabel dengan tiga baris templat: p dengan nama, p dengan jam ditambah satu, dan p dengan set:html nama. Kolom isi HTML yang dihasilkan kosong untuk diisi.</desc>
  <rect width="640" height="275" fill="#ffffff"/>
  <rect x="20" y="30" width="260" height="52" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">baris templat</text>
  <rect x="280" y="30" width="340" height="52" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="450.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">isi HTML hasil build</text>
  <rect x="20" y="82" width="260" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="113.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;p&gt;{nama}&lt;/p&gt;</text>
  <rect x="280" y="82" width="340" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="134" width="260" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="165.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;p&gt;{jam + 1} jam&lt;/p&gt;</text>
  <rect x="280" y="134" width="340" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="186" width="260" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="217.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">&lt;p set:html={nama}&gt;&lt;/p&gt;</text>
  <rect x="280" y="186" width="340" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="262" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">nama = "Klub &lt;b&gt;Robot&lt;/b&gt; &amp; Coding" dan jam = 2</text>
</svg>
