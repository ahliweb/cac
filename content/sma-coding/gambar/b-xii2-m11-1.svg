<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel enam bidang ulasan dengan kolom bukti dan temuan kosong</title>
  <desc id="d">Tabel enam bidang ulasan: kebutuhan, konten dan merek, tampilan, fitur dan uji, keamanan dan privasi, dan dokumen. Kolom bukti dan kolom temuan kosong untuk diisi peninjau.</desc>
