<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
  <title id="t">Empat segmen jaringan tiruan dengan kotak aturan akses kosong</title>
  <desc id="d">Perute dan tembok api di tengah, terhubung ke empat segmen: Administrasi, Siswa, Tamu, dan Perangkat pintar, dengan alamat contoh 192.0.2.0/26, 192.0.2.64/26, 192.0.2.128/26, dan 192.0.2.192/26. Di bawah tiap segmen ada kotak kosong bergaris putus-putus untuk menulis aturan akses.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="235" y="20" width="170" height="50" rx="6" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="320" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Perute + tembok api</text>
  <text x="320" y="60" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">(jaringan tiruan)</text>
  <line x1="320" y1="70" x2="84" y2="130" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="10" y="130" width="148" height="56" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="84" y="154" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">1. Administrasi</text>
  <text x="84" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">192.0.2.0/26</text>
  <rect x="10" y="204" width="148" height="110" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="320" y1="70" x2="242" y2="130" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="168" y="130" width="148" height="56" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="242" y="154" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">2. Siswa</text>
  <text x="242" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">192.0.2.64/26</text>
  <rect x="168" y="204" width="148" height="110" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="320" y1="70" x2="400" y2="130" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="326" y="130" width="148" height="56" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="400" y="154" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">3. Tamu</text>
  <text x="400" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">192.0.2.128/26</text>
  <rect x="326" y="204" width="148" height="110" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="320" y1="70" x2="558" y2="130" stroke="#2a5d9f" stroke-width="2"/>
  <rect x="484" y="130" width="148" height="56" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="558" y="154" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">4. Perangkat pintar</text>
  <text x="558" y="174" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">192.0.2.192/26</text>
  <rect x="484" y="204" width="148" height="110" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="10" y="336" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Tulis di tiap kotak putus-putus: siapa atau apa yang boleh dijangkau segmen itu.</text>
  <text x="10" y="354" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">(Kosong = belum diisi.)</text>
</svg>
