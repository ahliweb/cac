<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="t d">
  <title id="t">Kartu profil peran informatika dengan kotak isian kosong</title>
  <desc id="d">Kartu dengan tiga baris isian kosong: peran, kegiatan harian, keterampilan. Di bawahnya dua kolom, sudah kumiliki dan belum kumiliki, masing-masing tiga kotak kosong untuk keterampilan peran analis data.</desc>
  <rect width="640" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="620" height="330" rx="10" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="24" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Kartu profil (fiktif)</text>
  <text x="24" y="92" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Peran:</text>
  <rect x="180" y="70" width="436" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="24" y="136" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Kegiatan harian:</text>
  <rect x="180" y="114" width="436" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="24" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Keterampilan:</text>
  <rect x="180" y="158" width="436" height="32" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="24" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Untuk peran analis data:</text>
  <text x="200" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">sudah kumiliki</text>
  <text x="450" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">belum kumiliki</text>
  <rect x="24" y="232" width="290" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="24" y="266" width="290" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="24" y="300" width="290" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="326" y="232" width="290" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="326" y="266" width="290" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="326" y="300" width="290" height="28" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="24" y="360" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Isi tiga keterampilan di tiap kolom, lalu isi kartu untuk satu peran lain pilihanmu di kertas.</text>
</svg>
