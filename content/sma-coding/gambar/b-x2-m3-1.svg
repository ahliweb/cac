<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t d">
<title id="t">Objek murid sebelum dan sesudah diubah, sisi sesudah kosong</title>
<desc id="d">Dua tabel properti dan nilai. Tabel kiri berjudul awal berisi nama Dewi-contoh, kelas X, nilai 80 dan 90. Tabel kanan berjudul sesudah umur diberi nilai 16 dan kelas dihapus, dengan tiga baris kosong untuk diisi pelajar.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
<rect width="640" height="250" fill="#ffffff"/>
<text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">awal</text>
<rect x="20" y="40" width="90" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">properti</text>
<rect x="110" y="40" width="140" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="180.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">nilai</text>
<rect x="20" y="80" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="105.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">nama</text>
<rect x="110" y="80" width="140" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="180.0" y="105.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">"Dewi-contoh"</text>
<rect x="20" y="120" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="145.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">kelas</text>
<rect x="110" y="120" width="140" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="180.0" y="145.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">"X"</text>
<rect x="20" y="160" width="90" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="65.0" y="185.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">nilai</text>
<rect x="110" y="160" width="140" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="180.0" y="185.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">[80, 90]</text>
<text x="350" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">sesudah: umur = 16, lalu delete kelas</text>
<rect x="350" y="40" width="110" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="405.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">properti</text>
<rect x="460" y="40" width="170" height="40" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="545.0" y="65.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">nilai</text>
<rect x="350" y="80" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="460" y="80" width="170" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="350" y="120" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="460" y="120" width="170" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="350" y="160" width="110" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
<rect x="460" y="160" width="170" height="40" fill="#f2f2f2" stroke="#222222" stroke-width="1.5"/>
