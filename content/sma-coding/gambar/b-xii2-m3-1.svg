  <rect x="435" y="306" width="260" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="334.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">wajib terisi</text>
  <text x="350" y="385" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Isi kolom nilai dengan konten karanganmu, lalu cek tiap aturan.</text>
</svg>
