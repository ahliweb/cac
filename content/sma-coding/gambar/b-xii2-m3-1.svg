<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="t d">
  <title id="t">Tabel isian konten situs dengan kolom nilai dan pemeriksaan kosong</title>
  <desc id="d">Tabel enam isian konten: slug, title, excerpt, tagline, surel, dan telepon. Kolom nilai karanganmu kosong. Kolom aturan memuat aturan untuk sebagian isian.</desc>
  <rect width="700" height="400" fill="#ffffff"/>
  <rect x="15" y="30" width="130" height="46" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="58.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">isian</text>
  <rect x="145" y="30" width="290" height="46" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="290.0" y="58.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">nilai karanganmu</text>
  <rect x="435" y="30" width="260" height="46" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="58.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">aturan</text>
  <rect x="15" y="76" width="130" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="104.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">slug</text>
  <rect x="145" y="76" width="290" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="435" y="76" width="260" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="104.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">huruf kecil, tanda hubung</text>
  <rect x="15" y="122" width="130" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="150.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">title</text>
  <rect x="145" y="122" width="290" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="435" y="122" width="260" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="150.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">-</text>
  <rect x="15" y="168" width="130" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="196.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">excerpt</text>
  <rect x="145" y="168" width="290" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="435" y="168" width="260" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="196.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">paling banyak 160 karakter</text>
  <rect x="15" y="214" width="130" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="242.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">tagline</text>
  <rect x="145" y="214" width="290" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="435" y="214" width="260" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="242.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">memuat jam buka</text>
  <rect x="15" y="260" width="130" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="288.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">surel</text>
  <rect x="145" y="260" width="290" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="435" y="260" width="260" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="565.0" y="288.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">domain yang diizinkan</text>
  <rect x="15" y="306" width="130" height="46" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
