<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-labelledby="t d">
  <title id="t">Riwayat dua cabang dan tabel perintah</title>
  <desc id="d">Cabang main berisi commit Tambah a.js lalu Tambah d.js. Cabang fitur bercabang dari Tambah a.js dan berisi Tambah b.js lalu Tambah c.js. Di bawahnya ada kotak kosong untuk jawaban tiap perintah.</desc>
  <rect width="600" height="240" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="10" y="42" font-weight="bold">main</text>
    <text x="10" y="112" font-weight="bold">fitur</text>
    <g stroke="#222222" stroke-width="2" fill="#f2f2f2">
      <rect x="70" y="20" width="130" height="34" rx="6"/>
      <rect x="400" y="20" width="130" height="34" rx="6"/>
      <rect x="160" y="90" width="130" height="34" rx="6"/>
      <rect x="400" y="90" width="130" height="34" rx="6" stroke="#2a5d9f"/>
    </g>
    <text x="135" y="42" text-anchor="middle">Tambah a.js</text>
    <text x="465" y="42" text-anchor="middle">Tambah d.js</text>
    <text x="225" y="112" text-anchor="middle">Tambah b.js</text>
    <text x="465" y="112" text-anchor="middle">Tambah c.js</text>
    <g stroke="#222222" stroke-width="2" fill="none">
      <line x1="200" y1="37" x2="400" y2="37"/>
      <path d="M135 54 L135 107 L160 107"/>
      <line x1="290" y1="107" x2="400" y2="107"/>
    </g>
    <text x="300" y="29" text-anchor="middle" font-size="14">urutan: lama ke baru</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="10" y="150" width="280" height="30" stroke-dasharray="5 4"/>
      <rect x="310" y="150" width="280" height="30" stroke-dasharray="5 4"/>
      <rect x="10" y="200" width="280" height="30" stroke-dasharray="5 4"/>
      <rect x="310" y="200" width="280" height="30" stroke-dasharray="5 4"/>
    </g>
    <text x="14" y="146" font-size="14">git log main..fitur (jumlah baris)</text>
    <text x="314" y="146" font-size="14">main..fitur: commit apa saja</text>
    <text x="14" y="196" font-size="14">diff main...fitur: berkas</text>
    <text x="314" y="196" font-size="14">diff main..fitur: berkas</text>
  </g>
</svg>
