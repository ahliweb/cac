<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" width="640" height="275" role="img" aria-labelledby="t d">
  <title id="t">Tabel tiga teks lisensi dengan kolom hasil pemeriksa kosong</title>
  <desc id="d">Tabel dengan tiga baris: lengkap, tanpaBaris, dan hanyaNama. Kolom yang tercetak oleh periksaLisensi kosong untuk diisi.</desc>
  <rect width="640" height="275" fill="#ffffff"/>
  <rect x="20" y="30" width="170" height="52" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="105.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">teks yang diperiksa</text>
  <rect x="190" y="30" width="430" height="52" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="405.0" y="61.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">tercetak oleh periksaLisensi</text>
  <rect x="20" y="82" width="170" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="105.0" y="113.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">lengkap</text>
  <rect x="190" y="82" width="430" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="134" width="170" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="105.0" y="165.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">tanpaBaris</text>
  <rect x="190" y="134" width="430" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="186" width="170" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="105.0" y="217.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">hanyaNama</text>
  <rect x="190" y="186" width="430" height="52" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="262" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222222">Tulis daftar temuan, atau tanda kurung siku kosong bila tidak ada.</text>
</svg>
