<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="t d">
  <title id="t">Tabel linimasa satu siklus palang</title>
  <desc id="d">Tabel dua kolom Kejadian dan Waktu (ms): tujuh kejadian berurutan dengan kolom waktu kosong.</desc>
  <rect width="560" height="380" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <rect x="20" y="20" width="350" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="45.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Kejadian</text>
  <rect x="370" y="20" width="170" height="40" rx="0" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="455.0" y="45.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Waktu (ms)</text>
