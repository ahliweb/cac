  <text x="195.0" y="245.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">5. bunyi 500 Hz</text>
  <rect x="370" y="220" width="170" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="260" width="350" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="195.0" y="285.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">6. diam</text>
