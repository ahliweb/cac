  <text x="195.0" y="165.0" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222222">3. diam</text>
  <rect x="370" y="140" width="170" height="40" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
