<rect x="20" y="166" width="170" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="105.0" y="192.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">Sumber dipakai</text>
