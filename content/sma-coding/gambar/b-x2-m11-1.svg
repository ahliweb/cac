<text x="105.0" y="66.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Bagian</text>
<rect x="190" y="40" width="400" height="42" fill="#dde7f3" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="66.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Isi</text>
