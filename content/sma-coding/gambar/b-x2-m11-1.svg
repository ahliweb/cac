<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="t d">
<title id="t">Formulir catatan sumber dengan kolom isi yang kosong</title>
<desc id="d">Tabel dua kolom bernama bagian dan isi. Enam bagian tertulis: masalah, kueri, sumber dipakai, yang diambil, cara uji, dan versi. Kolom isi kosong untuk diisi pelajar.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs>
