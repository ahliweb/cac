<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t d">
  <title id="t">Sirkuit X lalu H dengan keadaan tiap langkah kosong</title>
  <desc id="d">Kawat dari keadaan awal |0&gt; yang sama dengan vektor (1 ; 0), lalu gerbang X, lalu gerbang H. Setelah tiap gerbang ada kotak kosong untuk menulis keadaan. Di bawah, kotak kosong untuk peluang membaca 0 dan 1 serta pertanyaan apakah vektor akhirnya sama dengan H saja.</desc>
  <rect width="640" height="250" fill="#ffffff"/>
  <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Sirkuit dibaca dari kiri ke kanan: gerbang paling kiri dipakai lebih dulu</text>
  <text x="20" y="85" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">|0&gt; = (1 ; 0)</text>
  <line x1="130" y1="80" x2="620" y2="80" stroke="#222222" stroke-width="2"/>
  <rect x="160" y="60" width="50" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="185" y="86" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">X</text>
  <rect x="220" y="58" width="140" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="380" y="60" width="50" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="405" y="86" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">H</text>
  <rect x="440" y="58" width="180" height="44" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="290" y="124" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">keadaan setelah X</text>
  <text x="530" y="124" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">keadaan setelah H</text>
  <text x="20" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">P(0) = </text>
  <rect x="75" y="152" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">P(1) = </text>
  <rect x="255" y="152" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="215" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start">Apakah vektor akhir sama dengan vektor H saja pada |0&gt;?</text>
  <rect x="450" y="196" width="100" height="30" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
