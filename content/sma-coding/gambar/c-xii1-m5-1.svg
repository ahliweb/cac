<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Diagram keadaan robot penghindar halangan</title>
  <desc id="d">Lima keadaan: MAJU, MUNDUR, BELOK, AMAN, dan DIAM. MAJU ke MUNDUR bila jarak di bawah 15 cm, MUNDUR ke BELOK setelah 500 ms, BELOK ke MAJU setelah 600 ms, MAJU ke AMAN bila tiga pembacaan gagal beruntun. DIAM tanpa panah. Dua garis isian waktu di bawah.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <g fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2">
    <rect x="40" y="110" width="140" height="50" rx="8"/>
    <rect x="250" y="20" width="140" height="50" rx="8"/>
    <rect x="460" y="110" width="140" height="50" rx="8"/>
    <rect x="40" y="235" width="140" height="50" rx="8"/>
    <rect x="460" y="235" width="140" height="50" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="110" y="141">MAJU</text>
    <text x="320" y="51">MUNDUR</text>
    <text x="530" y="141">BELOK</text>
    <text x="110" y="266">AMAN</text>
    <text x="530" y="266">DIAM</text>
  </g>
  <g stroke="#222222" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="150" y1="108" x2="252" y2="68"/>
    <line x1="388" y1="68" x2="490" y2="108"/>
    <path d="M530,162 L530,200 L125,200 L125,162"/>
    <line x1="70" y1="162" x2="70" y2="233"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <text x="20" y="78">jarak di bawah 15 cm</text>
    <text x="420" y="72">500 ms</text>
    <text x="300" y="192">600 ms</text>
    <text x="78" y="222">3 gagal beruntun</text>
    <text x="200" y="266">(tanpa panah)</text>
    <text x="20" y="306">masuk MUNDUR pada t = ______ ms</text>
    <text x="340" y="306">kembali ke MAJU pada t = ______ ms</text>
  </g>
</svg>
