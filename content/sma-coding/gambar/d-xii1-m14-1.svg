<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 198" width="630" height="198" role="img" aria-labelledby="t d">
  <title id="t">Tabel hitungan dua model pada seratus baris uji dengan sel kosong</title>
  <desc id="d">Tabel dengan baris model A dan model B dan kolom TP, FP, FN, TN, ketepatan, recall, dan presisi. Semua sel dibiarkan kosong. Data uji: 100 baris, 85 tepat waktu dan 15 terlambat.</desc>
  <rect width="630" height="198" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222" stroke="#222222" stroke-width="1.5">
    <text x="20" y="30" stroke="none" font-weight="bold">Data uji 100 baris: 85 tepat waktu, 15 terlambat. Terlambat = kelas positif</text>
    <rect x="20" y="46" width="80" height="44" fill="#f2f2f2"/>
    <text x="60" y="73" text-anchor="middle" stroke="none" font-weight="bold">model</text>
    <rect x="100" y="46" width="60" height="44" fill="#f2f2f2"/>
    <text x="130" y="73" text-anchor="middle" stroke="none" font-weight="bold">TP</text>
    <rect x="160" y="46" width="60" height="44" fill="#f2f2f2"/>
    <text x="190" y="73" text-anchor="middle" stroke="none" font-weight="bold">FP</text>
    <rect x="220" y="46" width="60" height="44" fill="#f2f2f2"/>
    <text x="250" y="73" text-anchor="middle" stroke="none" font-weight="bold">FN</text>
    <rect x="280" y="46" width="60" height="44" fill="#f2f2f2"/>
    <text x="310" y="73" text-anchor="middle" stroke="none" font-weight="bold">TN</text>
    <rect x="340" y="46" width="100" height="44" fill="#f2f2f2"/>
    <text x="390" y="73" text-anchor="middle" stroke="none" font-weight="bold">ketepatan</text>
    <rect x="440" y="46" width="80" height="44" fill="#f2f2f2"/>
    <text x="480" y="73" text-anchor="middle" stroke="none" font-weight="bold">recall</text>
    <rect x="520" y="46" width="90" height="44" fill="#f2f2f2"/>
    <text x="565" y="73" text-anchor="middle" stroke="none" font-weight="bold">presisi</text>
    <rect x="20" y="90" width="80" height="44" fill="#ffffff"/>
    <text x="60" y="117" text-anchor="middle" stroke="none">A</text>
    <rect x="100" y="90" width="60" height="44" fill="#ffffff"/>
    <rect x="160" y="90" width="60" height="44" fill="#ffffff"/>
    <rect x="220" y="90" width="60" height="44" fill="#ffffff"/>
    <rect x="280" y="90" width="60" height="44" fill="#ffffff"/>
    <rect x="340" y="90" width="100" height="44" fill="#ffffff"/>
    <rect x="440" y="90" width="80" height="44" fill="#ffffff"/>
    <rect x="520" y="90" width="90" height="44" fill="#ffffff"/>
    <rect x="20" y="134" width="80" height="44" fill="#ffffff"/>
    <text x="60" y="161" text-anchor="middle" stroke="none">B</text>
    <rect x="100" y="134" width="60" height="44" fill="#ffffff"/>
    <rect x="160" y="134" width="60" height="44" fill="#ffffff"/>
    <rect x="220" y="134" width="60" height="44" fill="#ffffff"/>
    <rect x="280" y="134" width="60" height="44" fill="#ffffff"/>
    <rect x="340" y="134" width="100" height="44" fill="#ffffff"/>
    <rect x="440" y="134" width="80" height="44" fill="#ffffff"/>
    <rect x="520" y="134" width="90" height="44" fill="#ffffff"/>
  </g>
</svg>
