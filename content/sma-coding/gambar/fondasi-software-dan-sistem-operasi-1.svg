<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
  <title id="t">Peta peran sistem operasi dengan kotak contoh kosong</title>
  <desc id="d">Sistem operasi di tengah dengan lima cabang: mengelola proses, mengelola memori, mengelola berkas, mengelola perangkat, dan menyediakan antarmuka. Di ujung tiap cabang ada kotak kosong bergaris putus-putus untuk menulis satu contoh nyata di komputer lab.</desc>
  <rect width="640" height="380" fill="#ffffff"/>
  <ellipse cx="320" cy="190" rx="75" ry="34" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2.5"/>
  <text x="320" y="195" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Sistem operasi</text>
  <line x1="110" y1="88" x2="270" y2="165" stroke="#2a5d9f" stroke-width="1.5"/>
  <rect x="20" y="48" width="180" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">1. mengelola proses</text>
  <line x1="530" y1="88" x2="370" y2="165" stroke="#2a5d9f" stroke-width="1.5"/>
  <rect x="440" y="48" width="180" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">2. mengelola memori</text>
  <line x1="200" y1="198" x2="246" y2="192" stroke="#2a5d9f" stroke-width="1.5"/>
  <rect x="20" y="178" width="180" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="20" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">3. mengelola berkas</text>
  <line x1="440" y1="198" x2="394" y2="192" stroke="#2a5d9f" stroke-width="1.5"/>
  <rect x="440" y="178" width="180" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">4. mengelola perangkat</text>
  <line x1="320" y1="328" x2="320" y2="224" stroke="#2a5d9f" stroke-width="1.5"/>
  <rect x="230" y="328" width="180" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="320" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">5. menyediakan antarmuka</text>
</svg>
