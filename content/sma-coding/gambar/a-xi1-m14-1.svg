<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
  <title id="t">Pohon pemanggilan hitung</title>
  <desc id="d">Pangkal i = 0, sisa = 6 dengan dua anak: pilih ke i = 1, sisa = 4 dan lewati ke i = 1, sisa = 6. Area kosong bergaris putus-putus di bawah tiap anak untuk dilanjutkan.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
  <rect x="240" y="15" width="160" height="38" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="320.0" y="38.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">i = 0, sisa = 6</text>
  <line x1="290" y1="54" x2="150" y2="118" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="350" y1="54" x2="490" y2="118" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
  <text x="185" y="80" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="end" font-weight="bold">pilih</text>
  <text x="455" y="80" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">lewati</text>
  <rect x="70" y="120" width="160" height="38" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="150.0" y="143.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">i = 1, sisa = 4</text>
  <rect x="410" y="120" width="160" height="38" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="490.0" y="143.9" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">i = 1, sisa = 6</text>
  <line x1="150" y1="160" x2="150" y2="200" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="490" y1="160" x2="490" y2="200" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="30" y="200" width="240" height="115" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="370" y="200" width="240" height="115" rx="4" fill="#f2f2f2" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">lanjutkan di sini</text>
  <text x="490" y="262" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">lanjutkan di sini</text>
</svg>
