<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">Rentang pembacaan dua sensor</title>
  <desc id="d">Skala 0 sampai 4095. Sensor A terbaca antara 380 dan 3120, sensor B antara 1500 dan 1800, digambar sebagai batang. Di bawah tiap batang ada kotak kosong untuk ambang dan kontras.</desc>
  <rect width="640" height="260" fill="#ffffff"/>
  <line x1="40" y1="30" x2="600" y2="30" stroke="#222222" stroke-width="2"/>
  <text x="40" y="20" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">0</text>
  <text x="600" y="20" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">4095</text>
  <rect x="92" y="56" width="375" height="26" fill="#2a5d9f" opacity="0.35" stroke="#2a5d9f" stroke-width="2"/>
  <text x="92" y="50" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">380</text>
  <text x="467" y="50" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">3120</text>
  <text x="14" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">sensor A</text>
  <text x="24" y="108" font-family="sans-serif" font-size="14" fill="#222222">ambang: ________</text>
  <text x="250" y="108" font-family="sans-serif" font-size="14" fill="#222222">kontras (terbesar - terkecil): ________</text>
  <rect x="245" y="150" width="41" height="26" fill="#1b7a3d" opacity="0.35" stroke="#1b7a3d" stroke-width="2"/>
  <text x="245" y="144" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1500</text>
  <text x="286" y="144" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1800</text>
  <text x="14" y="169" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">sensor B</text>
  <text x="24" y="202" font-family="sans-serif" font-size="14" fill="#222222">ambang: ________</text>
  <text x="250" y="202" font-family="sans-serif" font-size="14" fill="#222222">kontras (terbesar - terkecil): ________</text>
</svg>
