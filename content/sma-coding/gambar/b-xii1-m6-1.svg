<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-labelledby="t d">
  <title id="t">Tabel tiga kasus pemilihan nama situs dengan kolom nama kosong</title>
  <desc id="d">Tabel dengan tiga kasus. Kasus 1: SITE_NAME tidak diisi dan CMS mengirim X. Kasus 2: SITE_NAME diisi Y dan CMS mengirim X. Kasus 3: SITE_NAME tidak diisi dan CMS tidak mengirim nama. Kolom nama yang dipakai kosong.</desc>
