<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 329" width="501" height="329" role="img" aria-labelledby="t d">
  <title id="t">Larik POLA dengan indeks dan tabel penelusuran jumlah yang kosong</title>
  <desc id="d">Larik POLA berisi empat elemen 2, 4, 6, dan 8 dengan indeks 0 sampai 3 di atasnya. Di bawahnya tabel tiga putaran perulangan for dari i sama dengan 1: kolom i dan jumlah sesudahnya kosong untuk diisi.</desc>
  <rect width="501" height="329" fill="#ffffff"/>
  <text x="250" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">const int POLA[] = {2, 4, 6, 8};</text>
  <text x="115" y="58" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">indeks 0</text>
  <rect x="80" y="66" width="70" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="115" y="92" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <text x="205" y="58" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">indeks 1</text>
  <rect x="170" y="66" width="70" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="205" y="92" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">4</text>
  <text x="295" y="58" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">indeks 2</text>
  <rect x="260" y="66" width="70" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="295" y="92" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">6</text>
  <text x="385" y="58" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">indeks 3</text>
  <rect x="350" y="66" width="70" height="40" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="385" y="92" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">8</text>
  <rect x="60" y="140" width="130" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="125.0" y="163.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">putaran</text>
  <rect x="190" y="140" width="130" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="255.0" y="163.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">i</text>
  <rect x="320" y="140" width="161" height="36" fill="#ffffff" stroke="#2a5d9f" stroke-width="2"/>
  <text x="400.5" y="163.0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2a5d9f" text-anchor="middle">jumlah sesudahnya</text>
  <rect x="60" y="176" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="125.0" y="199.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">1</text>
  <rect x="190" y="176" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="320" y="176" width="161" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="60" y="212" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="125.0" y="235.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">2</text>
  <rect x="190" y="212" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="320" y="212" width="161" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="60" y="248" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="125.0" y="271.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">3</text>
  <rect x="190" y="248" width="130" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="320" y="248" width="161" height="36" fill="#f2f2f2" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="250" y="312" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">for (int i = 1; i &lt; 4; i++) { jumlah += POLA[i]; }  dengan jumlah = 0 di awal</text>
</svg>
