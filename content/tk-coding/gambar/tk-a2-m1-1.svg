  <title id="t">Empat langkah menanam biji</title>
  <desc id="d">Empat kotak kosong putus-putus berjajar dari kiri ke kanan dengan tanda panah di antaranya. Di bawahnya empat kartu bergambar untuk digunting dan ditempel, dengan urutan acak: tetesan air di atas tanah, lubang di tanah, tunas tumbuh dari tanah, dan biji di atas lubang.</desc>
