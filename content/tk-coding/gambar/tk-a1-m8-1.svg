  <title id="t">Tebak aturan</title>
  <desc id="d">Dua kotak berdampingan. Kotak kiri berisi empat lingkaran berwarna berbeda. Kotak kanan berisi persegi, segitiga, dan persegi panjang berwarna berbeda. Di bawah kotak kiri ada kotak kosong putus-putus untuk menempel kartu aturan. Di paling bawah ada dua kartu aturan: bulat dan merah.</desc>
