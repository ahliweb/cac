<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
  <title id="t">Memakai gunting dengan aman</title>
  <desc id="d">Dua gunting berdampingan. Gunting kiri berujung menghadap ke bawah dan di bawahnya ada lingkaran putus-putus untuk stiker. Gunting kanan berujung menghadap ke atas. Di bawah ada selembar kertas dengan satu garis lurus dan satu garis melengkung berwarna tebal. Di pojok bawah ada satu stiker bulat kuning.</desc>
  <rect width="600" height="420" fill="#ffffff"/>
  <g stroke="#333333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- gunting kiri: ujung ke bawah, lubang jari di atas -->
    <circle cx="130" cy="45" r="18"/>
    <circle cx="190" cy="45" r="18"/>
    <path d="M138 60 L180 135 L170 140 L125 70 Z M182 60 L140 135 L150 140 L195 70 Z" fill="#cfd8dc"/>
    <!-- gunting kanan: ujung ke atas, lubang jari di bawah -->
    <circle cx="410" cy="130" r="18"/>
    <circle cx="470" cy="130" r="18"/>
    <path d="M418 115 L460 40 L450 35 L405 105 Z M462 115 L420 40 L430 35 L475 105 Z" fill="#cfd8dc"/>
  </g>
  <circle cx="160" cy="185" r="26" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="8 7"/>
  <path d="M30 225 H570" stroke="#999999" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="110" y="240" width="380" height="140" rx="6" fill="#fffde7" stroke="#333333" stroke-width="3"/>
  <path d="M140 275 H300" stroke="#1e88e5" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 345 Q190 305 240 345 T340 345 T460 330" fill="none" stroke="#1e88e5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="545" cy="395" r="18" fill="#ffd54f" stroke="#333333" stroke-width="3"/>
</svg>
