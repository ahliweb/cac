<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
  <title id="t">Maju dan belok kiri</title>
  <desc id="d">Satu jalur dilihat dari atas: robot di bagian bawah jalur di sisi kanan menghadap ke atas, jalur lurus ke atas lalu berbelok ke kiri sampai bendera merah. Di bawahnya dua kotak kosong putus-putus dengan tanda panah, dan dua kartu untuk ditempel: maju dengan panah lurus ke atas, dan belok kiri dengan panah melengkung ke kiri.</desc>
