<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
  <title id="t">Kumpulan benda</title>
  <desc id="d">Enam benda bercampur di atas: dua lingkaran merah, dua lingkaran biru bertitik putih, satu persegi merah, dan satu persegi biru bertitik putih. Di bawahnya dua kotak putus-putus kosong untuk menempel kartu, dan di paling bawah enam kartu kecil, tiga merah dan tiga biru bertitik.</desc>
