<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-labelledby="t d">
  <title id="t">Dua aturan</title>
  <desc id="d">Dua lingkaran besar saling berpotongan. Lingkaran kiri berlabel merah, lingkaran kanan berlabel bulat, dan daerah tengah tempat keduanya bertemu dibiarkan kosong. Di bawahnya ada empat kartu benda untuk ditempel: bulatan merah, bulatan biru, persegi merah, dan persegi biru.</desc>
  <rect width="600" height="440" fill="#ffffff"/>
  <circle cx="230" cy="140" r="100" fill="#ffcdd2" fill-opacity="0.45" stroke="#e53935" stroke-width="5"/>
  <circle cx="370" cy="140" r="100" fill="#b3e5fc" fill-opacity="0.45" stroke="#0277bd" stroke-width="5"/>
  <text x="180" y="36" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#333333">merah</text>
  <text x="420" y="36" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#333333">bulat</text>
  <line x1="20" y1="268" x2="580" y2="268" stroke="#999999" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="300" y="296" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">kartu benda untuk ditempel</text>
  <rect x="40" y="312" width="100" height="100" rx="10" fill="#fffde7" stroke="#333333" stroke-width="3"/>
  <circle cx="90" cy="362" r="30" fill="#e53935" stroke="#333333" stroke-width="3"/>
  <rect x="170" y="312" width="100" height="100" rx="10" fill="#fffde7" stroke="#333333" stroke-width="3"/>
  <circle cx="220" cy="362" r="30" fill="#0277bd" stroke="#333333" stroke-width="3"/>
  <rect x="330" y="312" width="100" height="100" rx="10" fill="#fffde7" stroke="#333333" stroke-width="3"/>
  <rect x="360" y="342" width="40" height="40" fill="#e53935" stroke="#333333" stroke-width="3"/>
  <rect x="460" y="312" width="100" height="100" rx="10" fill="#fffde7" stroke="#333333" stroke-width="3"/>
  <rect x="490" y="342" width="40" height="40" fill="#0277bd" stroke="#333333" stroke-width="3"/>
</svg>
