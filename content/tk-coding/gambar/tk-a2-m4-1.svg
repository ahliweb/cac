  <title id="t">Peta kisi 3x3</title>
  <desc id="d">Peta kisi tiga kali tiga petak dilihat dari atas. Boneka berdiri di petak pojok kanan bawah menghadap ke atas, ditandai mulai. Bendera tujuan ada di petak tengah baris paling atas. Di bawah peta ada empat kotak kosong putus-putus berpanah dan empat kartu untuk ditempel: tiga kartu maju dan satu kartu belok kiri.</desc>
