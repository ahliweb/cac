<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" role="img" aria-labelledby="t d">
  <title id="t">Hambatan di jalan</title>
  <desc id="d">Kisi lima kali lima petak dilihat dari atas. Robot di petak pojok kanan bawah menghadap ke atas, ditandai mulai. Bendera tujuan ada di petak ketiga dari kiri pada baris paling bawah. Satu balok cokelat berdiri di petak keempat dari kiri pada baris paling bawah, tepat di antara robot dan bendera. Di bawah kisi ada enam kotak kosong untuk urutan kartu dan dua jenis kartu untuk ditempel: maju dan belok kiri.</desc>
