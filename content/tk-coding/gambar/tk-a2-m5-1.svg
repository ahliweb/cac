  <title id="t">Pola tiga unsur</title>
  <desc id="d">Dua baris lingkaran. Baris pertama: merah, merah, biru, merah, merah, lalu tiga lingkaran kosong putus-putus. Baris kedua: merah, biru, kuning, merah, biru, lalu tiga lingkaran kosong putus-putus. Lingkaran biru bertitik putih di tengah, lingkaran kuning bercincin, dan merah polos, agar dapat dibedakan tanpa warna. Di bawahnya tiga kartu untuk ditempel: merah, biru bertitik, kuning bercincin.</desc>
