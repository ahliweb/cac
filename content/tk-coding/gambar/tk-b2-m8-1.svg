<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-labelledby="t d">
  <title id="t">Cerita berurutan</title>
  <desc id="d">Empat kotak besar kosong putus-putus dalam dua baris, berlabel awal, lalu, lalu, dan akhir. Satu tanda panah menghubungkan kotak awal ke kotak lalu di baris atas, satu panah melengkung turun dari kotak kedua ke kotak ketiga, dan satu panah menghubungkan kotak ketiga ke kotak akhir di baris bawah. Anak menggambar satu halaman cerita di tiap kotak.</desc>
  <rect width="600" height="440" fill="#ffffff"/>
  <rect x="20" y="20" width="260" height="160" rx="12" fill="#ffffff" stroke="#333333" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="34" y="48" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">awal</text>
  <rect x="320" y="20" width="260" height="160" rx="12" fill="#ffffff" stroke="#333333" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="334" y="48" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">lalu</text>
  <rect x="20" y="240" width="260" height="160" rx="12" fill="#ffffff" stroke="#333333" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="34" y="268" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">lalu</text>
  <rect x="320" y="240" width="260" height="160" rx="12" fill="#ffffff" stroke="#333333" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="334" y="268" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">akhir</text>
  <path d="M284 100 H300 M292 91 L300 100 L292 109" fill="none" stroke="#333333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M284 320 H300 M292 311 L300 320 L292 329" fill="none" stroke="#333333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M450 184 V212 H150 V228 M142 220 L150 230 L158 220" fill="none" stroke="#333333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
