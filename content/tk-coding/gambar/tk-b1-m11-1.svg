  <title id="t">Peta harta</title>
  <desc id="d">Kisi lima kali lima petak dilihat dari atas. Robot berdiri di petak pojok kanan bawah menghadap ke atas, ditandai mulai. Satu balok abu-abu menghalangi petak di tengah pada kolom paling kanan. Peti harta ada di petak ketiga dari kiri pada baris kedua dari bawah. Di bawah kisi ada empat kotak kosong putus-putus berpanah dan lima kartu untuk ditempel: tiga maju, satu belok kiri, dan satu ulang x2.</desc>
