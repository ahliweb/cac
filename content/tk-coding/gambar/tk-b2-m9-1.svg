<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d">
  <title id="t">Alat digital dengan aman</title>
  <desc id="d">Dua gambar berdampingan. Kiri berjudul minta izin: orang dewasa berdiri di dekat sebuah tablet abu-abu di meja, dan boneka kelinci mengangkat satu tangan untuk bertanya. Kanan berjudul ada batas waktu: sebuah jam pasir dan sebuah bola untuk bermain. Di bawahnya ada satu kotak kosong putus-putus untuk menggambar kegiatan yang disukai tanpa perangkat.</desc>
