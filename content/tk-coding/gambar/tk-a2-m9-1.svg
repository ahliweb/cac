<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
  <title>Bagi-bagi tugas</title>
  <desc id="d">Di kiri ada tiga balok persegi dan tiga kain bergelombang yang berserakan, tiap benda dengan satu titik kecil untuk menarik garis. Di kanan ada dua kotak: kotak biru bernomor satu untuk balok dan kotak merah bernomor dua untuk kain, masing-masing dengan satu titik kecil.</desc>
  <rect width="600" height="420" fill="#ffffff"/>
  <!-- balok -->
  <g fill="#ffcc80" stroke="#333333" stroke-width="3" stroke-linejoin="round">
    <rect x="50" y="40" width="56" height="56"/>
    <rect x="150" y="210" width="56" height="56" transform="rotate(12 178 238)"/>
    <rect x="70" y="300" width="56" height="56" transform="rotate(-10 98 328)"/>
  </g>
  <!-- kain bergelombang -->
  <g fill="#f8bbd0" stroke="#333333" stroke-width="3" stroke-linejoin="round">
    <path d="M160 60 Q180 44 200 60 T240 60 V104 Q220 120 200 104 T160 104 Z"/>
    <path d="M40 180 Q60 164 80 180 T120 180 V224 Q100 240 80 224 T40 224 Z"/>
    <path d="M220 330 Q240 314 260 330 T300 330 V374 Q280 390 260 374 T220 374 Z"/>
  </g>
  <!-- titik tarik garis -->
  <g fill="#333333">
    <circle cx="112" cy="68" r="6"/>
    <circle cx="212" cy="238" r="6"/>
    <circle cx="132" cy="328" r="6"/>
    <circle cx="246" cy="82" r="6"/>
    <circle cx="126" cy="202" r="6"/>
    <circle cx="306" cy="352" r="6"/>
  </g>
  <!-- kotak biru -->
  <rect x="400" y="40" width="170" height="130" rx="12" fill="#bbdefb" stroke="#333333" stroke-width="4"/>
  <text x="485" y="118" font-family="sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#333333">1</text>
  <text x="485" y="156" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">kotak biru</text>
  <circle cx="392" cy="105" r="6" fill="#333333"/>
  <!-- kotak merah -->
  <rect x="400" y="230" width="170" height="130" rx="12" fill="#ffcdd2" stroke="#333333" stroke-width="4"/>
  <text x="485" y="308" font-family="sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#333333">2</text>
  <text x="485" y="346" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">kotak merah</text>
  <circle cx="392" cy="295" r="6" fill="#333333"/>
</svg>
