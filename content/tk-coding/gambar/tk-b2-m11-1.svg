<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d">
  <title id="t">Pameran untuk keluarga</title>
  <desc id="d">Di atas ada satu kotak besar kosong putus-putus berjudul permainan yang kutunjukkan, untuk menggambar permainan pilihan anak. Di bawahnya ada dua tokoh polos tanpa wajah: tokoh kecil dengan balon bicara dan tokoh besar sebagai tamu yang mendengarkan.</desc>
  <rect width="600" height="470" fill="#ffffff"/>
  <text x="300" y="32" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#333333">permainan yang kutunjukkan</text>
