<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-labelledby="t d">
  <title id="t">Pola kotak</title>
  <desc id="d">Kotak tiga kali tiga. Baris pertama berisi merah, biru, merah. Baris kedua berisi biru, merah, lalu satu kotak kosong. Baris ketiga kosong semua. Warna berganti-ganti ke samping dan ke bawah. Di bawah kotak ada empat potongan warna untuk ditempel: dua merah dan dua biru.</desc>
