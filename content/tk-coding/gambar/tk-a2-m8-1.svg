  <text x="485" y="370" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#333333">belok kiri</text>
  <rect x="522" y="296" width="52" height="82" rx="8" fill="#fffde7" stroke="#333333" stroke-width="3"/>
