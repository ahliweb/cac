<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d">
  <title>Kenapa aku memilih ini?</title>
  <desc id="d">Peta kisi tiga kali tiga petak dilihat dari atas. Boneka berdiri di petak pojok kanan bawah menghadap ke atas, ditandai mulai. Rumah ada di petak tengah dan bendera di petak tengah baris paling atas. Di bawah peta ada dua kotak pilihan: jalan ke rumah dengan tiga kartu maju, belok kiri, maju, dan jalan ke bendera dengan empat kartu maju, maju, belok kiri, maju. Tiap kotak punya lingkaran putus-putus kecil untuk menandai pilihan.</desc>
  <rect width="600" height="420" fill="#ffffff"/>
  <rect x="190" y="8" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="254" y="8" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="318" y="8" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="190" y="72" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="254" y="72" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="318" y="72" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="190" y="136" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="254" y="136" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="318" y="136" width="64" height="64" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <!-- boneka di pojok kanan bawah -->
  <g transform="translate(350,168)">
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#b3e5fc" stroke="#333333" stroke-width="4"/>
    <path d="M-12 -2 L0 -18 L12 -2 Z" fill="#333333"/>
    <circle cx="-8" cy="10" r="4" fill="#333333"/><circle cx="8" cy="10" r="4" fill="#333333"/>
  </g>
  <!-- bendera di tengah atas -->
  <path d="M286 68 V12" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
  <path d="M286 12 L316 23 L286 34 Z" fill="#e53935" stroke="#333333" stroke-width="3" stroke-linejoin="round"/>
  <!-- rumah di tengah -->
  <path d="M268 112 V94 L286 80 L304 94 V112 Z" fill="#fff59d" stroke="#333333" stroke-width="3" stroke-linejoin="round"/>
  <rect x="280" y="100" width="12" height="12" fill="#a1887f" stroke="#333333" stroke-width="2"/>
  <text x="440" y="172" font-family="sans-serif" font-size="20" fill="#333333">mulai</text>
  <text x="400" y="44" font-family="sans-serif" font-size="20" fill="#333333">bendera</text>
  <text x="400" y="110" font-family="sans-serif" font-size="20" fill="#333333">rumah</text>
  <line x1="20" y1="212" x2="580" y2="212" stroke="#999999" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- pilihan 1: rumah, tiga kartu -->
