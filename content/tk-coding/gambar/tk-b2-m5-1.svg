<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-labelledby="t d">
  <title id="t">Memecah pekerjaan besar</title>
  <desc id="d">Gambar menara balok tiga tingkat dilihat dari depan, tiap tingkat satu bagian: bagian atas dua balok, bagian tengah tiga balok, bagian bawah empat balok. Balok masih putih untuk diberi warna. Di sebelah kanan ada tiga lingkaran kosong berlabel atas, tengah, dan bawah untuk diberi warna yang sama dengan bagiannya.</desc>
  <rect width="600" height="280" fill="#ffffff"/>
  <rect x="130" y="30" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="190" y="30" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="100" y="90" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="160" y="90" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="220" y="90" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="70" y="150" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="130" y="150" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="190" y="150" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="250" y="150" width="60" height="56" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <line x1="40" y1="206" x2="340" y2="206" stroke="#333333" stroke-width="5"/>
  <text x="400" y="64" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">atas</text>
  <circle cx="520" cy="58" r="24" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="400" y="124" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">tengah</text>
  <circle cx="520" cy="118" r="24" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="400" y="184" font-family="sans-serif" font-size="20" text-anchor="start" fill="#333333">bawah</text>
  <circle cx="520" cy="178" r="24" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="300" y="256" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">satu bagian, satu warna</text>
</svg>
