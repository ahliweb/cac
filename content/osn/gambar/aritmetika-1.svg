<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" width="520" height="310" role="img" aria-labelledby="t d">
  <title id="t">Tabel penelusuran algoritma Euclid untuk FPB(48, 18)</title>
  <desc id="d">Tabel dengan kolom langkah, a, b, dan sisa. Baris pertama berisi a 48 dan b 18. Sel lain kosong untuk diisi pelajar. Di bawah ada kotak kosong untuk hasil FPB.</desc>
  <rect width="520" height="310" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="20" y="26" font-weight="bold">Penelusuran fpb(48, 18)</text>
    <g stroke="#222222" stroke-width="2" fill="#ffffff">
      <rect x="20" y="40" width="80" height="36"/>
      <rect x="100" y="40" width="110" height="36"/>
      <rect x="210" y="40" width="110" height="36"/>
      <rect x="320" y="40" width="180" height="36"/>
    </g>
    <g font-weight="bold" text-anchor="middle">
      <text x="60" y="64">langkah</text>
      <text x="155" y="64">a</text>
      <text x="265" y="64">b</text>
      <text x="410" y="64">sisa = a % b</text>
    </g>
    <g stroke="#222222" stroke-width="2" fill="#f2f2f2">
      <rect x="20" y="76" width="80" height="44"/><rect x="100" y="76" width="110" height="44" fill="#ffffff"/><rect x="210" y="76" width="110" height="44" fill="#ffffff"/><rect x="320" y="76" width="180" height="44" stroke-dasharray="6 4"/>
      <rect x="20" y="120" width="80" height="44"/><rect x="100" y="120" width="110" height="44" stroke-dasharray="6 4"/><rect x="210" y="120" width="110" height="44" stroke-dasharray="6 4"/><rect x="320" y="120" width="180" height="44" stroke-dasharray="6 4"/>
      <rect x="20" y="164" width="80" height="44"/><rect x="100" y="164" width="110" height="44" stroke-dasharray="6 4"/><rect x="210" y="164" width="110" height="44" stroke-dasharray="6 4"/><rect x="320" y="164" width="180" height="44" stroke-dasharray="6 4"/>
      <rect x="20" y="208" width="80" height="44"/><rect x="100" y="208" width="110" height="44" stroke-dasharray="6 4"/><rect x="210" y="208" width="110" height="44" stroke-dasharray="6 4"/><rect x="320" y="208" width="180" height="44" stroke-dasharray="6 4"/>
    </g>
    <g text-anchor="middle">
      <text x="60" y="104">1</text><text x="60" y="148">2</text><text x="60" y="192">3</text><text x="60" y="236">4</text>
      <text x="155" y="104">48</text><text x="265" y="104">18</text>
    </g>
    <text x="20" y="284">Berhenti bila b = 0. Isi kotak kosong:</text>
    <text x="300" y="284" font-weight="bold">FPB =</text>
    <rect x="360" y="264" width="90" height="30" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>
