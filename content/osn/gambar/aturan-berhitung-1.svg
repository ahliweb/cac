<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-labelledby="t d">
  <title id="t">Segitiga Pascal baris 0 sampai 6 dengan baris 4 sampai 6 kosong</title>
  <desc id="d">Tujuh baris kotak membentuk segitiga. Baris 0 sampai 3 berisi 1; 1 1; 1 2 1; 1 3 3 1. Baris 4, 5, dan 6 kosong untuk diisi dengan hubungan C(n, k) = C(n-1, k-1) + C(n-1, k).</desc>
  <rect width="520" height="330" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="10" y="24" font-weight="bold">Segitiga Pascal: baris ke-n berisi C(n, 0) sampai C(n, n)</text>
    <text x="10" y="62">baris 0</text>
    <rect x="260" y="40" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="280" y="62" text-anchor="middle">1</text>
    <text x="10" y="102">baris 1</text>
    <rect x="237" y="80" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="257" y="102" text-anchor="middle">1</text>
    <rect x="283" y="80" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="303" y="102" text-anchor="middle">1</text>
    <text x="10" y="142">baris 2</text>
    <rect x="214" y="120" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="234" y="142" text-anchor="middle">1</text>
    <rect x="260" y="120" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="280" y="142" text-anchor="middle">2</text>
    <rect x="306" y="120" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="326" y="142" text-anchor="middle">1</text>
    <text x="10" y="182">baris 3</text>
    <rect x="191" y="160" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="211" y="182" text-anchor="middle">1</text>
    <rect x="237" y="160" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="257" y="182" text-anchor="middle">3</text>
    <rect x="283" y="160" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="303" y="182" text-anchor="middle">3</text>
    <rect x="329" y="160" width="40" height="32" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="349" y="182" text-anchor="middle">1</text>
    <text x="10" y="222">baris 4</text>
    <rect x="168" y="200" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="214" y="200" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="260" y="200" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="306" y="200" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="352" y="200" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="10" y="262">baris 5</text>
    <rect x="145" y="240" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="191" y="240" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="237" y="240" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="283" y="240" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="329" y="240" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="375" y="240" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="10" y="302">baris 6</text>
    <rect x="122" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="168" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="214" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="260" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="306" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="352" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="398" y="280" width="40" height="32" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>
