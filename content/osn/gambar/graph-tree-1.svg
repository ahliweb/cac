<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">Graph tak berarah enam simpul untuk BFS dari simpul 1</title>
  <desc id="d">Graph tak berbobot dengan simpul 1 sampai 6 dan sisi 1-2, 1-3, 2-4, 3-4, dan 4-5. Simpul 6 tidak punya sisi. Setiap simpul punya kotak kosong untuk jarak dari simpul 1.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="10" y="22" font-weight="bold">Isi kotak "jarak" tiap simpul dengan BFS dari simpul 1</text>
    <line x1="70" y1="150" x2="190" y2="90" stroke="#222222" stroke-width="2"/>
    <line x1="70" y1="150" x2="190" y2="230" stroke="#222222" stroke-width="2"/>
    <line x1="190" y1="90" x2="320" y2="150" stroke="#222222" stroke-width="2"/>
    <line x1="190" y1="230" x2="320" y2="150" stroke="#222222" stroke-width="2"/>
    <line x1="320" y1="150" x2="450" y2="150" stroke="#222222" stroke-width="2"/>
    <circle cx="70" cy="150" r="22" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/><text x="70" y="155" text-anchor="middle" font-weight="bold">1</text>
    <rect x="40" y="176" width="60" height="28" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="190" cy="90" r="22" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/><text x="190" y="95" text-anchor="middle" font-weight="bold">2</text>
    <rect x="160" y="36" width="60" height="28" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="190" cy="230" r="22" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/><text x="190" y="235" text-anchor="middle" font-weight="bold">3</text>
    <rect x="160" y="256" width="60" height="28" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="320" cy="150" r="22" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/><text x="320" y="155" text-anchor="middle" font-weight="bold">4</text>
    <rect x="290" y="96" width="60" height="28" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="450" cy="150" r="22" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/><text x="450" y="155" text-anchor="middle" font-weight="bold">5</text>
    <rect x="420" y="176" width="60" height="28" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="570" cy="230" r="22" fill="#ffffff" stroke="#2a5d9f" stroke-width="3"/><text x="570" y="235" text-anchor="middle" font-weight="bold">6</text>
    <rect x="540" y="256" width="60" height="28" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>
