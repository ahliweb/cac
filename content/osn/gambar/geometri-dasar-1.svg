<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-labelledby="t d">
  <title id="t">Persegi panjang ABCD pada bidang koordinat</title>
  <desc id="d">Bidang koordinat dengan titik A (0,0), B (4,0), C (4,3), dan D (0,3) membentuk persegi panjang. Di kanan ada dua kotak kosong untuk nilai silang(A,B,C) dan arah belokan.</desc>
  <rect width="480" height="290" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <line x1="60" y1="240" x2="60" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="110" y1="240" x2="110" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="160" y1="240" x2="160" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="210" y1="240" x2="210" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="260" y1="240" x2="260" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="310" y1="240" x2="310" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="60" y1="240" x2="310" y2="240" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="60" y1="190" x2="310" y2="190" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="60" y1="140" x2="310" y2="140" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="60" y1="90" x2="310" y2="90" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="60" y1="40" x2="310" y2="40" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="60" y1="240" x2="320" y2="240" stroke="#222222" stroke-width="2"/>
    <line x1="60" y1="240" x2="60" y2="30" stroke="#222222" stroke-width="2"/>
    <text x="110" y="258" text-anchor="middle">1</text>
    <text x="160" y="258" text-anchor="middle">2</text>
    <text x="210" y="258" text-anchor="middle">3</text>
    <text x="260" y="258" text-anchor="middle">4</text>
    <text x="310" y="258" text-anchor="middle">5</text>
    <text x="52" y="195" text-anchor="end">1</text>
    <text x="52" y="145" text-anchor="end">2</text>
    <text x="52" y="95" text-anchor="end">3</text>
    <text x="52" y="45" text-anchor="end">4</text>
    <text x="324" y="245">x</text><text x="55" y="26">y</text>
    <polygon points="60,240 260,240 260,90 60,90" fill="none" stroke="#2a5d9f" stroke-width="3"/>
    <circle cx="60" cy="240" r="5" fill="#222222"/>
    <text x="68" y="226" text-anchor="start" font-weight="bold">A (0,0)</text>
    <circle cx="260" cy="240" r="5" fill="#222222"/>
    <text x="260" y="272" text-anchor="middle" font-weight="bold">B (4,0)</text>
    <circle cx="260" cy="90" r="5" fill="#222222"/>
    <text x="270" y="82" text-anchor="start" font-weight="bold">C (4,3)</text>
    <circle cx="60" cy="90" r="5" fill="#222222"/>
    <text x="56" y="80" text-anchor="end" font-weight="bold">D (0,3)</text>
    <text x="350" y="60" font-weight="bold">silang(A, B, C) =</text>
    <rect x="350" y="70" width="110" height="34" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="350" y="140" font-weight="bold">Belok di B ke:</text>
    <rect x="350" y="150" width="110" height="34" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="350" y="220" font-weight="bold">2 x luas ABC =</text>
    <rect x="350" y="230" width="110" height="34" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>
