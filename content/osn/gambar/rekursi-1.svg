<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" width="540" height="290" role="img" aria-labelledby="t d">
  <title id="t">Tumpukan pemanggilan f(3) dengan kolom kosong</title>
  <desc id="d">Tabel empat baris untuk pemanggilan f(0), f(1), f(2), dan f(3). Puncak tumpukan di baris paling atas. Tiga kolom kosong: yang dicetak saat masuk, yang dicetak saat kembali, dan nilai kembali. Di bawahnya ada isian keluaran seluruhnya.</desc>
  <rect width="540" height="290" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="15" fill="#222222">
    <text x="20" y="22" font-weight="bold">Call stack f(3): puncak tumpukan di baris paling atas</text>
    <rect x="20" y="32" width="110" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="75.0" y="59" text-anchor="middle" font-weight="bold">pemanggilan</text>
    <rect x="130" y="32" width="130" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="195.0" y="51" text-anchor="middle" font-weight="bold">dicetak</text><text x="195.0" y="68" text-anchor="middle" font-weight="bold">saat masuk</text>
    <rect x="260" y="32" width="130" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="325.0" y="51" text-anchor="middle" font-weight="bold">dicetak</text><text x="325.0" y="68" text-anchor="middle" font-weight="bold">saat kembali</text>
    <rect x="390" y="32" width="130" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="455.0" y="51" text-anchor="middle" font-weight="bold">nilai</text><text x="455.0" y="68" text-anchor="middle" font-weight="bold">kembali</text>
    <rect x="20" y="76" width="110" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="75" y="104" text-anchor="middle" font-weight="bold">f(0)</text>
    <rect x="130" y="76" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="260" y="76" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="390" y="76" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="20" y="120" width="110" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="75" y="148" text-anchor="middle" font-weight="bold">f(1)</text>
    <rect x="130" y="120" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="260" y="120" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="390" y="120" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="20" y="164" width="110" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="75" y="192" text-anchor="middle" font-weight="bold">f(2)</text>
    <rect x="130" y="164" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="260" y="164" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="390" y="164" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="20" y="208" width="110" height="44" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="75" y="236" text-anchor="middle" font-weight="bold">f(3)</text>
    <rect x="130" y="208" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="260" y="208" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="390" y="208" width="130" height="44" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="20" y="274">Keluaran seluruhnya:</text>
    <rect x="180" y="253" width="340" height="30" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>
