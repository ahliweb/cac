<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" role="img" aria-labelledby="t d">
  <title id="t">Tabel DP coin change untuk koin 1, 3, 4 dan nilai 10</title>
  <desc id="d">Tabel dengan kolom v dari 0 sampai 10 dan dua baris: dp[v] dan pilih[v]. Hanya dp[0] bernilai 0; semua sel lain kosong untuk diisi pelajar.</desc>
  <rect width="700" height="230" fill="#ffffff"/>
