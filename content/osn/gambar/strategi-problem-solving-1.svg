    <rect x="640" y="132" width="54" height="48" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="14" y="212">dp[v]: banyak koin paling sedikit untuk nilai v. pilih[v]: koin yang dipilih pada state v.</text>
