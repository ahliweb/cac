    <rect x="154" y="84" width="54" height="48" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="154" y="132" width="54" height="48" fill="#f2f2f2" stroke="#2a5d9f" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="208" y="44" width="54" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="235.0" y="70" text-anchor="middle" font-weight="bold">2</text>
