    <rect x="14" y="132" width="86" height="48" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="57" y="162" text-anchor="middle" font-weight="bold">pilih[v]</text>
    <rect x="100" y="44" width="54" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/><text x="127.0" y="70" text-anchor="middle" font-weight="bold">0</text>
